<!DOCTYPE html>
<!-- Eigene 404-Seite (Firebase liefert /404.html automatisch bei unbekannten Pfaden).
     Absichtlich statisch und ohne App-Code: ein Rewrite aller Pfade auf wgapp.html würde unter
     /foo/bar relative Pfade (manifest.json, sw.js) auf /foo/… umbiegen. -->
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#060a08">
<title>WG · Seite nicht gefunden</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  html,body { margin:0; height:100%; background:#060a08; color:#f2f6f3; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; box-sizing:border-box; text-align:center; }
  .ico { font-size:44px; line-height:1; }
  h1 { margin:0; font-size:20px; font-weight:800; letter-spacing:-.01em; }
  p { margin:0; color:rgba(242,246,243,.72); line-height:1.55; max-width:320px; }
  a { margin-top:8px; display:inline-block; padding:14px 22px; border-radius:15px; background:#5eead4; color:#0a120c; font-weight:800; text-decoration:none; }
  a:focus-visible { outline:3px solid #a3e635; outline-offset:3px; }
</style>
</head>
<body>
<main>
  <div class="ico">🧭</div>
  <h1>Hier gibt es nichts</h1>
  <p>Diese Adresse gehört nicht zur WG-App.</p>
  <a href="/">Zur WG-App</a>
</main>
</body>
</html>
