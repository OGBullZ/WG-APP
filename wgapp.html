/* Grow-Bilanz aus D: offene gi-Posten, Split nach Pflanzen-Anteilen (gp) — genutzt vom Grow-Tab und der Growbox-Hinweiskarte im Haushalt */
function growCalc(D){
  const users=D.users||[], plants=D.gp||{}, items=D.gi||[];
  const total=Object.values(plants).reduce((s,v)=>s+(parseInt(v)||0),0);
  const share=id=>total>0?(parseInt(plants[id]||0)/total):(users.length?1/users.length:0);
  const open=items.filter(i=>!i.settled);
  const tCost=open.reduce((s,i)=>s+i.price,0);
  const net=id=>open.filter(i=>i.paidBy===id).reduce((s,i)=>s+i.price,0)-tCost*share(id);
  return { total, share, open, tCost, net };
}
/* Offener Grow-Zyklus = der ohne `end`; bei mehreren (Sync-Kollision) gewinnt der zuletzt gestartete. */
const openCycle = D => (D.gz||[]).filter(c => c && !c.end)
  .slice().sort((a,b) => String(b.start||'').localeCompare(String(a.start||'')))[0] || null;

/* Abgeleitete Zyklus-Werte. Tag 1 = Starttag (nicht 0 — „Tag 0" liest sich niemand als heute).
   waterIn: Tage bis zum nächsten Gießen, ≤0 = fällig/überfällig; null in Phasen ohne Gießen.
   over: Tage über der typischen Phasendauer (>0 = Phase ist rechnerisch durch). */
function cycleInfo(cy) {
  if (!cy) return null;
  const ph = PHASE_OF(cy.phase);
  const iv = Math.max(1, parseInt(cy.wiv) || WATER_IV_DEF);
  const sinceW = daysSince(cy.lastW || cy.start);
  return {
    ph, iv, sinceW,
    dayTot: daysSince(cy.start) + 1,
    dayPh:  daysSince(cy.pAt || cy.start) + 1,
    watered: !!cy.lastW,
    waterIn: ph[4] ? iv - sinceW : null,
    over:    daysSince(cy.pAt || cy.start) + 1 - ph[3],
  };
}

function Grow() {
  const { D, set, setFn, status, undo, me, notifyOthers } = useD();
  const users=D.users, plants=D.gp||{}, items=D.gi||[];
  const meName = users.find(u=>u.id===me)?.name || 'Jemand';
  const [wiz,setWiz] = useState(false);
  const [editItem,setEditItem] = useState(null);
  const [showSettled,setShowSettled] = useState(false);
  const heroRef = useRef(null);
  const [stamp,setStamp] = useState(false);

  const { total, share, open, tCost, net } = growCalc(D);
  // Ganze Prozente (konsistent mit dem Haushalt-Hero); zweiter Wert als 100-Komplement → Summe exakt 100 %
  const p0 = users[0] ? Math.round(share(users[0].id)*100) : 0;
  const pctStr = id => (id===users[0]?.id ? p0 : 100-p0) + '%';
  const setP   = (uid2,v) => set('gp',{...plants,[uid2]:Math.max(0,parseInt(v)||0)});

  const add    = d => { const amt=parseNum(d.price)||0; set('gi',[{id:uid(),name:d.name||'Grow',price:amt,paidBy:d.paidBy||users[0].id,date:d.date||todayISO(),cat:d.cat||null,settled:false},...items]); flyExpense(amt,'#a3e635',heroRef.current); notifyOthers(`🌱 ${meName} hat ${fmt(amt)} € eingetragen`, d.name||'Grow', 'wg-exp', 'exp'); };
  const save   = d => set('gi',items.map(i=>i.id===editItem.id?{...i,name:d.name||i.name,price:parseNum(d.price)||i.price,paidBy:d.paidBy||i.paidBy,date:d.date||i.date,cat:d.cat||null}:i));
  const toggle = id => set('gi',items.map(i=>i.id===id?{...i,settled:!i.settled,settledAt:!i.settled?todayISO():null}:i));
  const del    = id => { const it=items.find(i=>i.id===id); set('gi',items.filter(i=>i.id!==id)); undo(`„${it?.name||'Ausgabe'}" gelöscht`, ()=>setFn('gi', cur => cur.some(i=>i.id===id)?cur:[it,...cur])); };

  const settled=items.filter(i=>i.settled);
  const bals=users.map(u=>({ ...u, paid:open.filter(i=>i.paidBy===u.id).reduce((s,i)=>s+i.price,0), net:net(u.id) }));

  /* Zyklus-Tracker: eine offene Runde mit Phase + Gieß-Rhythmus. Die Gieß-Erinnerung
     schickt der Cron (api/cron.js) aus denselben Feldern — Format nicht einseitig ändern. */
  const gzList=D.gz||[];
  const cy=openCycle(D), ci=cycleInfo(cy);
  const [cycWiz,setCycWiz]=useState(false);
  const patchCy=patch=>set('gz',gzList.map(c=>c.id===cy.id?{...c,...patch}:c));
  const startCycle=d=>{
    const rec={id:uid(),start:d.start||todayISO(),phase:d.phase||'keim',pAt:d.start||todayISO(),wiv:parseInt(d.wiv)||WATER_IV_DEF,lastW:null,wn:0};
    set('gz',[rec,...gzList]);
    notifyOthers(`🌱 ${meName} hat einen neuen Zyklus gestartet`, `${PHASE_OF(rec.phase)[2]} · ab ${fmtDate(rec.start)}`, 'wg-grow', 'exp');
  };
  const setPhase=k=>{
    if(!cy||cy.phase===k) return;
    const prev={phase:cy.phase,pAt:cy.pAt};
    patchCy({phase:k,pAt:todayISO()});
    undo(`Phase: ${PHASE_OF(k)[2]}`, ()=>setFn('gz', cur=>cur.map(c=>c.id===cy.id?{...c,...prev}:c)));
    notifyOthers(`${PHASE_OF(k)[1]} Neue Phase: ${PHASE_OF(k)[2]}`, `Tag ${ci.dayTot} des Zyklus`, 'wg-grow', 'exp');
  };
  const water=()=>{
    if(!cy) return;
    const prev={lastW:cy.lastW||null,lastWBy:cy.lastWBy||null,wn:cy.wn||0};
    patchCy({lastW:todayISO(),lastWBy:me,wn:(parseInt(cy.wn)||0)+1});
    undo('Gießen eingetragen', ()=>setFn('gz', cur=>cur.map(c=>c.id===cy.id?{...c,...prev}:c)));
  };
  const endCycle=()=>{
    if(!cy) return;
    patchCy({end:todayISO()});
    undo('Zyklus beendet', ()=>setFn('gz', cur=>cur.map(c=>c.id===cy.id?{...c,end:null}:c)));
  };
  const cycSteps=[
    {label:'Wann gestartet?',ok:()=>true,render:({data:d,setData:sd})=><DateField value={d.start} onChange={v=>sd({...d,start:v})}/>},
    {label:'In welcher Phase?',ok:d=>!!d.phase,render:({data:d,setData:sd})=>(
      <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
        {GROW_PHASES.map(([k,em,label,len])=>(
          <button key={k} type="button" onClick={()=>sd({...d,phase:k})}
            style={{flex:'1 1 44%',textAlign:'left',fontSize:13,borderRadius:14,padding:'11px 12px',border:'none',fontWeight:d.phase===k?800:600,
              background:d.phase===k?'var(--lime)':'var(--bg3)',color:d.phase===k?'#0a120c':'var(--label2)'}}>
            {em} {label}<br/><span style={{fontSize:11,fontWeight:600,opacity:.7}}>meist ~{len} Tage</span>
          </button>
        ))}
      </div>
    )},
    {label:'Gießen alle wie viel Tage?',ok:d=>(parseInt(d.wiv)||0)>0,render:({data:d,setData:sd})=>(
      <div style={{display:'flex',flexDirection:'column',gap:10,alignItems:'center'}}>
        <div className="stepper" style={{alignSelf:'stretch',justifyContent:'space-between'}}>
          <button type="button" onClick={()=>sd({...d,wiv:Math.max(1,(parseInt(d.wiv)||WATER_IV_DEF)-1)})}>−</button>
          <span className="st-val" style={{color:'var(--lime)'}}>{parseInt(d.wiv)||WATER_IV_DEF}</span>
          <button type="button" onClick={()=>sd({...d,wiv:Math.min(14,(parseInt(d.wiv)||WATER_IV_DEF)+1)})}>+</button>
        </div>
        <span style={{fontSize:12.5,color:'var(--label3)'}}>Erinnerung kommt, sobald so viele Tage seit dem letzten Gießen um sind.</span>
      </div>
    )},
  ];

  /* Ernte-Log: Zyklus-Kosten = alle gi-Ausgaben (inkl. abgerechnet + Archiv) zwischen Vor-Ernte und Ernte */
  const ghList=D.gh||[];
  const [harvWiz,setHarvWiz]=useState(false);
  const allGiCost=[...items, ...(D.arc||[]).filter(a=>a.src==='gi')];
  const harvAsc=[...ghList].sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  const cycles=harvAsc.map((h,ix)=>{
    const from=ix>0?String(harvAsc[ix-1].date):'';
    const cost=allGiCost.filter(i=>String(i.date||'')>from&&String(i.date||'')<=String(h.date)).reduce((s,i)=>s+(Number(i.price)||0),0);
    const g=Number(h.grams)||0;
    return {...h,cost,gpg:g>0?cost/g:null};
  });
  const harv=[...cycles].reverse();
  const totG=cycles.reduce((s,h)=>s+(Number(h.grams)||0),0);
  const avgGpg=totG>0?cycles.reduce((s,h)=>s+h.cost,0)/totG:null;
  const addHarv=d=>{
    const g=parseNum(d.grams)||0; const note=(d.note||'').trim(); const date=d.date||todayISO();
    const rec={id:uid(),date,grams:g,...(note?{note}:{})};
    set('gh',[rec,...ghList]);
    // Geerntet heißt: die Runde ist durch. Sonst mahnt der Cron weiter zum Gießen.
    if(cy) set('gz',gzList.map(c=>c.id===cy.id?{...c,end:date,ghId:rec.id}:c));
    notifyOthers(`🌾 ${meName} hat eine Ernte eingetragen`, `${fmt(g)} g`, 'wg-exp', 'exp');
  };
  /* Die Ernte hat den Zyklus beendet — wird sie gelöscht (Fehleingabe), muss er wieder
     aufgehen. Sonst wäre die laufende Runde mit Phase und Gieß-Verlauf unerreichbar weg. */
  const delHarv=id=>{
    const it=ghList.find(x=>x.id===id);
    const linked=gzList.find(c=>c.ghId===id);
    set('gh',ghList.filter(x=>x.id!==id));
    if(linked) set('gz',gzList.map(c=>c.id===linked.id?{...c,end:null,ghId:null}:c));
    undo('Ernte gelöscht', ()=>{
      setFn('gh', cur => cur.some(x=>x.id===id)?cur:[it,...cur]);
      if(linked) setFn('gz', cur => cur.map(c=>c.id===linked.id?{...c,end:linked.end,ghId:linked.ghId}:c));
    });
  };
  const harvSteps=[
    {label:'Wann geerntet?',ok:()=>true,render:({data:d,setData:sd})=><DateField value={d.date} onChange={v=>sd({...d,date:v})}/>},
    {label:'Wie viel? (Gramm)',ok:d=>parseNum(d.grams)>0,render:({data:d,setData:sd})=><input autoFocus type="text" inputMode="decimal" className="field" placeholder="z. B. 42,5" value={d.grams||''} onChange={e=>sd({...d,grams:e.target.value})}/>},
    {label:'Notiz (optional)',ok:()=>true,render:({data:d,setData:sd})=><input autoFocus maxLength={200} className="field" placeholder="Sorte, Qualität …" value={d.note||''} onChange={e=>sd({...d,note:e.target.value})}/>},
  ];
  const settlements=(D.stl||[]).filter(s=>s.mod==='gi');

  const settleAll = () => {
    const debtor=bals.find(b=>b.net<-0.01), creditor=bals.find(b=>b.net>0.01);
    const oldStl=D.stl||[];
    const rec={ id:uid(), mod:'gi', date:todayISO(), total:tCost, n:open.length, fromId:debtor?.id||null, toId:creditor?.id||null, amount:debtor?Math.abs(debtor.net):0 };
    set('stl',[rec,...oldStl]);
    set('gi',items.map(i=>i.settled?i:{...i,settled:true,settledAt:todayISO(),settlementId:rec.id}));
    undo('Alles abgerechnet', ()=>{ setFn('stl', cur=>cur.filter(s=>s.id!==rec.id)); setFn('gi', cur=>cur.map(i=>i.settlementId===rec.id?{...i,settled:false,settledAt:null,settlementId:null}:i)); });
    if(!REDUCE()){ setStamp(true); setTimeout(()=>setStamp(false),1100); }
    notifyOthers(`🤝 ${meName} hat abgerechnet`, `€${fmt(tCost)}`, 'wg-settle', 'settle');
  };

  /* Pflanzen-Slots: jede Pflanze als Icon in Besitzer-Farbe */
  const slots=[];
  users.forEach(u=>{ for(let i=0;i<(parseInt(plants[u.id])||0);i++) slots.push(u.color); });

  const addInit = useMemo(()=>({ paidBy: me||undefined }), [me]);
  const steps=[
    {label:'Was wurde gekauft?',ok:d=>d.name?.trim(),render:({data:d,setData:sd})=>(
      <>
        <input autoFocus maxLength={200} className="field" placeholder="Dünger, Erde, Lampe …" value={d.name||''} onChange={e=>sd({...d,name:e.target.value})}/>
        <div style={{display:'flex',flexWrap:'wrap',gap:6,marginTop:10}}>
          {GROW_CATS.map(([k,em,label])=>(
            <button key={k} type="button" onClick={()=>sd({...d,cat:d.cat===k?null:k})}
              style={{fontSize:12,borderRadius:12,padding:'6px 10px',border:'none',fontWeight:d.cat===k?800:600,
                background:d.cat===k?GROW_CAT_COLORS[k]:'var(--bg3)',color:d.cat===k?'#0a120c':'var(--label2)'}}>
              {em} {label}
            </button>
          ))}
        </div>
      </>
    )},
    {label:'Wie viel?',ok:d=>parseNum(d.price)>0,render:({data:d,setData:sd})=>(
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        <div className="f-euro"><input autoFocus type="text" inputMode="decimal" className="field" placeholder="0,00" value={d.price||''} onChange={e=>sd({...d,price:e.target.value})}/></div>
        <DateField value={d.date} onChange={v=>sd({...d,date:v})}/>
      </div>
    )},
    {label:'Prüfen & bezahlt von',ok:d=>!!d.paidBy,render:({data:d,setData:sd})=>(
      <div style={{display:'flex',flexDirection:'column',gap:18}}>
        <WizSum name={d.name} price={d.price}/>
        <div>
          <div className="sheet-sublbl">Wer hat bezahlt?</div>
          <div className="pick">
            {users.map(u=>(
              <button key={u.id} className={`pick-btn${d.paidBy===u.id?' on':''}`} style={{background:u.color}} onClick={()=>sd({...d,paidBy:u.id})}>
                {u.name}<br/><span style={{fontSize:11,fontWeight:600,opacity:.75}}>zahlt {pctStr(u.id)}</span>
              </button>
            ))}
          </div>
        </div>
      </div>
    )},
  ];

  return (
    <div className="screen">
      <NBar title="Growbox" color="var(--lime)" status={status}/>
      <div className="scroll"><div className="content">

        {/* Split-Hero: Donut + Pflanzen */}
        <div className="hero rise" ref={heroRef} style={{'--glow':'rgba(163,230,53,.17)'}}>
          {stamp&&<div className="settle-stamp">✓</div>}
          <div className="hero-lbl" style={{marginBottom:16}}>Kosten-Split nach Pflanzen</div>
          <div style={{display:'flex',alignItems:'center',gap:20}}>
            <Donut segs={users.map(u=>({frac:share(u.id),color:u.color}))}>
              <span className="num" style={{fontSize:30,fontWeight:700,color:'var(--lime)'}}>{total}</span>
              <span style={{fontSize:10,color:'var(--label3)',letterSpacing:'.14em',textTransform:'uppercase',fontFamily:'var(--mono)'}}>Pflanzen</span>
            </Donut>
            <div style={{flex:1,display:'flex',flexDirection:'column',gap:14}}>
              {users.map(u=>(
                <div key={u.id} style={{display:'flex',flexDirection:'column',gap:5}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
                    <span style={{fontSize:14,fontWeight:800,color:u.color}}>{u.name}</span>
                    <span className="num" style={{fontSize:13,fontWeight:700,color:'var(--label2)'}}>{pctStr(u.id)}</span>
                  </div>
                  <div className="stepper" style={{alignSelf:'stretch',justifyContent:'space-between'}}>
                    <button onClick={()=>setP(u.id,(parseInt(plants[u.id])||0)-1)}>−</button>
                    <span className="st-val" style={{color:u.color}}>{parseInt(plants[u.id])||0}</span>
                    <button onClick={()=>setP(u.id,(parseInt(plants[u.id])||0)+1)}>+</button>
                  </div>
                </div>
              ))}
            </div>
          </div>
          {slots.length>0&&(
            <div className="plant-row" style={{marginTop:20}}>
              {slots.map((c,i)=>(
                <div key={i} className="plant-slot" style={{animationDelay:`${i*45}ms`}}>
                  <Ic d={ICONS.leaf} color={c} size={24} sw={1.9}/>
                </div>
              ))}
            </div>
          )}
        </div>

        {/* Zyklus + Gießen: die tägliche Interaktion, deshalb direkt unter dem Hero */}
        {cy ? (
          <div className="rise" style={{animationDelay:'40ms'}}>
            <div className="section-hdr" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <span>{ci.ph[1]} Zyklus · Tag {ci.dayTot}</span>
              {/* Padding + gegenläufiger Margin: 44px Tap-Ziel, optisch bleibt es eine Kopfzeilen-Aktion */}
              <button style={{background:'none',border:'none',padding:'13px 6px',margin:'-13px -6px -7px',minHeight:44,font:'inherit',fontSize:11,letterSpacing:'.2em',color:'var(--lime)',fontFamily:'var(--mono)',textTransform:'uppercase'}}
                onClick={endCycle}>Beenden</button>
            </div>
            <div className="group">
              <div className="cell" style={{flexDirection:'column',alignItems:'stretch',gap:12}}>
                <div style={{display:'flex',gap:6}}>
                  {GROW_PHASES.map(([k,em,label])=>(
                    <button key={k} className={`phase-chip${cy.phase===k?' on':''}`} aria-pressed={cy.phase===k}
                      title={`Phase auf ${label} setzen`} onClick={()=>setPhase(k)}>
                      <span className="em">{em}</span>{label}
                    </button>
                  ))}
                </div>
                <div>
                  <div className="bar-track">
                    <div className="bar-fill" style={{width:`${Math.min(ci.dayPh/ci.ph[3]*100,100)}%`,
                      background:ci.over>0?'var(--amber)':'var(--lime)',color:ci.over>0?'var(--amber)':'var(--lime)'}}/>
                  </div>
                  <div style={{fontSize:12,color:'var(--label3)',fontWeight:500,marginTop:7}}>
                    Tag <span className="num">{ci.dayPh}</span> in der {ci.ph[2]} · typisch ~{ci.ph[3]} Tage
                    {ci.over>0&&<span style={{color:'var(--amber)',fontWeight:700}}> · {ci.over} drüber{PHASE_NEXT(cy.phase)?` — ${PHASE_NEXT(cy.phase)[2]}?`:' — ernten?'}</span>}
                  </div>
                </div>
              </div>
              {ci.waterIn!==null ? (
                <div className="cell">
                  <div className="cell-icon" style={{background:'rgba(56,189,248,.12)',fontSize:15}}>💧</div>
                  <div className="cell-content">
                    {/* Ohne eingetragenes Gießen wäre „116 Tage überfällig" zwar korrekt gerechnet,
                        aber unsinnig zu lesen — dann lieber sagen, dass schlicht nichts erfasst ist. */}
                    <span className="cell-title" style={{color:ci.waterIn<0?'var(--red)':ci.waterIn===0?'var(--amber)':'var(--label)'}}>
                      {!ci.watered&&ci.waterIn<=0?'Noch nichts eingetragen'
                        :ci.waterIn<0?`${-ci.waterIn} Tag${-ci.waterIn===1?'':'e'} überfällig`
                        :ci.waterIn===0?'Heute gießen'
                        :`Gießen in ${ci.waterIn} Tag${ci.waterIn===1?'':'en'}`}
                    </span>
                    <span className="cell-sub">
                      {!ci.watered?`Noch nicht gegossen seit dem Start · alle ${ci.iv} Tage`
                        :`${ci.sinceW===0?'Zuletzt heute':ci.sinceW===1?'Zuletzt gestern':`Zuletzt vor ${ci.sinceW} Tagen`}${cy.lastWBy?` · ${users.find(u=>u.id===cy.lastWBy)?.name||'?'}`:''} · alle ${ci.iv} Tage${cy.wn>0?` · ${cy.wn}× im Zyklus`:''}`}
                    </span>
                  </div>
                  <button className="mini-btn" onClick={water}>Gegossen</button>
                </div>
              ) : (
                <div className="cell">
                  <div className="cell-icon" style={{background:'rgba(163,230,53,.12)',fontSize:15}}>🍂</div>
                  <div className="cell-content">
                    <span className="cell-title">Trocknung läuft</span>
                    <span className="cell-sub">In dieser Phase wird nicht gegossen — keine Erinnerungen</span>
                  </div>
                </div>
              )}
            </div>
          </div>
        ) : (
          <button className="btn btn-sec rise" style={{animationDelay:'40ms'}} onClick={()=>setCycWiz(true)}>🌱 Zyklus starten</button>
        )}

        {/* Offene Bilanz */}
        {open.length>0&&(
          <div className="rise" style={{animationDelay:'60ms'}}>
            <div className="section-hdr">Offene Bilanz · €{fmt(tCost)} gesamt</div>
            <div className="group">
              {bals.map(b=>(
                <div key={b.id} className="cell">
                  <div style={{width:10,height:10,borderRadius:'50%',background:b.color,boxShadow:`0 0 8px ${b.color}`,flexShrink:0}}/>
                  <div className="cell-content">
                    <span className="cell-title">{b.name}</span>
                    <span className="cell-sub">bezahlt €{fmt(b.paid)} · Anteil €{fmt(tCost*share(b.id))}</span>
                  </div>
                  <span className="num" style={{fontWeight:700,fontSize:15,color:b.net>.01?'var(--green)':b.net<-.01?'var(--red)':'var(--label3)'}}>{b.net>.01?'+':''}<CountUp value={b.net}/></span>
                </div>
              ))}
            </div>
            <div style={{height:8}}/>
            <Bal bals={bals} noShare/>
          </div>
        )}

        <button className="btn rise" style={{background:'var(--lime)',animationDelay:'100ms'}} onClick={()=>setWiz(true)}>+ Grow-Ausgabe</button>
        {open.length>0&&(
          <button className="btn btn-sec rise" style={{animationDelay:'120ms'}} onClick={settleAll}>✓ Alles abrechnen ({open.length})</button>
        )}

        {items.length===0
          ?<div className="empty"><div className="empty-ico">🌱</div><span style={{fontSize:14,color:'var(--label2)'}}>Noch keine Ausgaben</span></div>
          :(
            <>
            {open.length>0&&(
            <div className="rise" style={{animationDelay:'140ms'}}>
              <div className="section-hdr">Offene Ausgaben</div>
              <div className="group">
                {open.map(item=>{
                  const payer=users.find(u=>u.id===item.paidBy);
                  return(
                    <div key={item.id} className="cell">
                      <button className="chk-btn" style={{border:'1.5px solid var(--sep)',background:'none'}} title="Als abgerechnet markieren" onClick={()=>toggle(item.id)}/>
                      <div className="cell-content" style={{cursor:'pointer'}} onClick={()=>setEditItem(item)}>
                        <span className="cell-title">{item.name}</span>
                        <span className="cell-sub">{fmtDate(item.date)} · <span style={{color:payer?.color}}>{payer?.name}</span></span>
                      </div>
                      <div style={{textAlign:'right',flexShrink:0,cursor:'pointer'}} onClick={()=>setEditItem(item)}>
                        <div className="num" style={{fontSize:15,fontWeight:700}}>€{fmt(item.price)}</div>
                        <div className="num" style={{fontSize:10.5}}>
                          {users.map(u=><span key={u.id} style={{color:u.color,marginLeft:5}}>{u.name} €{fmt(item.price*share(u.id))}</span>)}
                        </div>
                      </div>
                      <button className="del-btn" aria-label="Eintrag löschen" title="Eintrag löschen" onClick={()=>del(item.id)}>×</button>
                    </div>
                  );
                })}
              </div>
            </div>
            )}
            <SettlementHistory settlements={settlements} users={users} accent="var(--lime)"/>
            {settled.length>0&&(
              <div className="rise">
                <div className="section-hdr" style={{display:'flex',justifyContent:'space-between',alignItems:'center',cursor:'pointer'}} onClick={()=>setShowSettled(s=>!s)}>
                  <span>Posten-Details · {settled.length}</span>
                  <span style={{color:'var(--lime)'}}>{showSettled?'Verbergen':'Anzeigen'}</span>
                </div>
                {showSettled&&(
                  <div className="group">
                    {settled.map(item=>{
                      const payer=users.find(u=>u.id===item.paidBy);
                      return(
                        <div key={item.id} className="cell dim">
                          <button className="chk-btn" style={{border:'1.5px solid var(--lime)',background:'var(--lime)'}} title="Wieder öffnen" onClick={()=>toggle(item.id)}><ChkIco/></button>
                          <div className="cell-content">
                            <span className="cell-title" style={{textDecoration:'line-through'}}>{item.name}</span>
                            <span className="cell-sub">abgerechnet {fmtDate(item.settledAt||item.date)} · <span style={{color:payer?.color}}>{payer?.name}</span></span>
                          </div>
                          <div className="num" style={{fontSize:15,fontWeight:700,color:'var(--label3)'}}>€{fmt(item.price)}</div>
                          <button className="del-btn" aria-label="Eintrag löschen" title="Eintrag löschen" onClick={()=>del(item.id)}>×</button>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}
            </>
          )
        }

        {/* Ernte-Log: Gramm je Ernte + Zyklus-Kosten (gi zwischen den Ernten) + €/g */}
        <div className="rise" style={{animationDelay:'160ms'}}>
          <div className="section-hdr" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <span>🌾 Ernten{harv.length>0?` · ${harv.length}`:''}</span>
            {avgGpg!=null&&<span className="num" style={{color:'var(--lime)',textTransform:'none',letterSpacing:0}}>Ø €{fmt(avgGpg)}/g</span>}
          </div>
          {harv.length>0&&(
            <div className="group" style={{marginBottom:10}}>
              {harv.map(h=>(
                <div key={h.id} className="cell">
                  <div className="cell-icon" style={{background:'rgba(163,230,53,.12)',fontSize:15}}>🌾</div>
                  <div className="cell-content">
                    <span className="cell-title"><span className="num">{fmt(Number(h.grams)||0)} g</span>{h.note?` · ${h.note}`:''}</span>
                    <span className="cell-sub">{fmtDate(h.date)} · Zyklus €{fmt(h.cost)}</span>
                  </div>
                  {h.gpg!=null&&<span className="num" style={{fontWeight:700,fontSize:14,color:'var(--lime)'}}>€{fmt(h.gpg)}/g</span>}
                  <button className="del-btn" aria-label="Ernte löschen" title="Ernte löschen" onClick={()=>delHarv(h.id)}>×</button>
                </div>
              ))}
            </div>
          )}
          <button className="btn btn-sec" style={{fontSize:14}} onClick={()=>setHarvWiz(true)}>+ Ernte erfassen</button>
        </div>
      </div></div>
      <Wiz open={cycWiz} onClose={()=>setCycWiz(false)} title="Neuer Zyklus" color="var(--lime)" steps={cycSteps} onFinish={startCycle} initial={{start:todayISO(),phase:'keim',wiv:WATER_IV_DEF}}/>
      <Wiz open={harvWiz} onClose={()=>setHarvWiz(false)} title="Ernte" color="var(--lime)" steps={harvSteps} onFinish={addHarv} initial={{date:todayISO()}}/>
      <Wiz open={wiz} onClose={()=>setWiz(false)} title="Grow-Ausgabe" color="var(--lime)" steps={steps} onFinish={add} initial={addInit} quickOk={d=>d.name?.trim()&&parseNum(d.price)>0&&d.paidBy}/>
      <Wiz open={!!editItem} onClose={()=>setEditItem(null)} title="Bearbeiten" color="var(--lime)" steps={steps} onFinish={save} initial={editItem?{name:editItem.name,price:String(editItem.price).replace(".",","),paidBy:editItem.paidBy,cat:editItem.cat||null,date:/^\d{4}-\d{2}-\d{2}$/.test(editItem.date||'')?editItem.date:todayISO()}:null}/>
    </div>
  );
}

/* ══════════════════════════
   PUTZPLAN
══════════════════════════ */
function Putzplan() {
  const { D, set, setFn, status, undo, me, notifyOthers } = useD();
  const users=D.users, tasks=D.pt||[], log=D.pl||[];
  const meName = users.find(u=>u.id===me)?.name || 'Jemand';
  const [wiz,setWiz] = useState(false);
  const [editTask,setEditTask] = useState(null);

  const todayMid = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
  const parseIso = s => { const [y,m,dd]=s.split('-').map(Number); return new Date(y,m-1,dd); };
  const dueIn = t => {
    if(!t.lastDone) return 0; // noch nie gemacht → sofort fällig
    const due=parseIso(t.lastDone); due.setDate(due.getDate()+(t.interval||7));
    return Math.round((due-todayMid())/86400000);
  };
  const other = id => users.find(u=>u.id!==id)?.id || id;

  const done = (t, btnEl) => {
    celebrateTask(btnEl, t.em, users.find(u=>u.id===t.assignee)?.color || '#fbbf24');
    const iso=todayISO(); // lokal, nicht UTC — sonst zählt „erledigt" nachts vor 1/2 Uhr zum Vortag
    set('pt', tasks.map(x=>x.id===t.id?{...x,lastDone:iso,assignee:other(x.assignee)}:x));
    set('pl', [{id:uid(),taskId:t.id,name:t.name,em:t.em,userId:t.assignee,date:iso},...log].slice(0,200));
    const nextName = users.find(u=>u.id===other(t.assignee))?.name || 'Der andere';
    notifyOthers(`✅ ${meName} hat „${t.name}" erledigt`, `${nextName}, du bist dran!`, 'wg-putz', 'putz');
  };
  const del = id => { const t=tasks.find(x=>x.id===id); set('pt',tasks.filter(x=>x.id!==id)); undo(`„${t?.name||'Aufgabe'}" gelöscht`, ()=>setFn('pt', cur => cur.some(x=>x.id===id)?cur:[t,...cur])); };
  const add = d => set('pt',[...tasks,{id:uid(),name:d.name||'Aufgabe',em:d.em||'🧽',interval:parseInt(d.interval)||7,assignee:d.assignee||users[0].id,lastDone:null}]);
  const save = d => set('pt',tasks.map(x=>x.id===editTask.id?{...x,name:d.name||x.name,em:d.em||x.em,interval:parseInt(d.interval)||x.interval,assignee:d.assignee||x.assignee}:x));

  const loadDefaults = () => set('pt',[
    {name:'Küche putzen',em:'🍳',interval:7},
    {name:'Bad putzen',em:'🚿',interval:7},
    {name:'Staubsaugen',em:'🧹',interval:7},
    {name:'Müll rausbringen',em:'🗑️',interval:3},
  ].map((t,i)=>({id:uid(),...t,assignee:users[i%users.length]?.id||users[0].id,lastDone:null})));

  /* Fairness: erledigte Aufgaben der letzten 30 Tage */
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-30); cutoff.setHours(0,0,0,0);
  const counts=users.map(u=>({...u, n:log.filter(l=>l.userId===u.id&&parseIso(l.date)>=cutoff).length}));
  const totN=counts.reduce((s,c)=>s+c.n,0);

  const sorted=[...tasks].sort((a,b)=>dueIn(a)-dueIn(b));
  const dueNow=sorted.filter(t=>dueIn(t)<=0);

  const chip = t => {
    const d=dueIn(t);
    if(d<0)  return <span className="due-chip overdue" style={{background:'rgba(251,113,133,.15)',color:'var(--red)'}}>{-d}d ÜBERFÄLLIG</span>;
    if(d===0)return <span className="due-chip" style={{background:'rgba(251,191,36,.16)',color:'var(--amber)'}}>HEUTE</span>;
    return <span className="due-chip" style={{background:'rgba(255,255,255,.06)',color:'var(--label3)'}}>IN {d}d</span>;
  };

  const EMS=['🧽','🍳','🚿','🧹','🗑️','🧺','🪟','🌿','🛒','🧴'];
  const IVS=[['3','Alle 3 Tage'],['7','Wöchentlich'],['14','Alle 2 Wochen'],['30','Monatlich']];
  const steps=[
    {label:'Was ist zu tun?',ok:d=>d.name?.trim(),render:({data:d,setData:sd})=><input autoFocus maxLength={200} className="field" placeholder="Küche putzen, Müll rausbringen …" value={d.name||''} onChange={e=>sd({...d,name:e.target.value})}/>},
    {label:'Symbol',render:({data:d,setData:sd})=><div className="emoji-grid">{EMS.map(e=><button key={e} className={`emoji-btn${d.em===e?' on':''}`} onClick={()=>sd({...d,em:e})}>{e}</button>)}</div>},
    {label:'Wie oft?',ok:d=>!!d.interval,render:({data:d,setData:sd})=>(
      <div className="cat-grid">
        {IVS.map(([v,l])=><button key={v} className={`cat-btn${d.interval===v?' on':''}`} onClick={()=>sd({...d,interval:v})}>{l}</button>)}
      </div>
    )},
    {label:'Wer startet?',ok:d=>!!d.assignee,render:({data:d,setData:sd})=>(
      <div className="pick">
        {users.map(u=><button key={u.id} className={`pick-btn${d.assignee===u.id?' on':''}`} style={{background:u.color}} onClick={()=>sd({...d,assignee:u.id})}>{u.name}</button>)}
      </div>
    )},
  ];

  return (
    <div className="screen">
      <NBar title="Putzplan" color="var(--amber)" status={status}/>
      <div className="scroll"><div className="content">

        <div className="hero rise" style={{'--glow':'rgba(251,191,36,.15)'}}>
          <div className="hero-lbl">Heute dran</div>
          {tasks.length===0

                      <span className="cell-sub"><span key={u?.id} className="assignee-swap" style={{color:u?.color,fontWeight:700}}>{u?.name}</span> ist dran · alle {t.interval} Tage</span>

          </div>

        {log.length>0&&(
          <div className="rise" style={{animationDelay:'140ms'}}>
            <div className="section-hdr">Zuletzt erledigt</div>
            <div className="group">
              {log.slice(0,6).map(l=>{
                const u=users.find(x=>x.id===l.userId);

                  <div key={l.id} className="cell" style={{minHeight:46,padding:'10px 16px'}}>

                    <span style={{fontSize:12.5,fontWeight:700,color:u?.color}}>{u?.name}</span>

          </div>
        )}

      </div></div>
      <Wiz open={wiz} onClose={()=>setWiz(false)} title="Putz-Aufgabe" color="var(--amber)" steps={steps} onFinish={add}/>
      <Wiz open={!!editTask} onClose={()=>setEditTask(null)} title="Aufgabe bearbeiten" color="var(--amber)" steps={steps} onFinish={save} initial={editTask?{name:editTask.name,em:editTask.em,interval:String(editTask.interval),assignee:editTask.assignee}:null}/>
    </div>
  );
}

/* ══════════════════════════
   PRIVATER FINANZBEREICH
   Bewusst NICHT gesynct: Buchungen (tx) + Fixkosten (fix) liegen ausschliesslich
   in localStorage `wg_priv` auf DIESEM Geraet — nie in der RTDB, nie im WG-Export.
   Zusaetzlich per 4-stelliger PIN gesperrt (Hash+Salt in `wg_priv_pin`; die PIN
   selbst wird nirgends gespeichert). Entsperrung gilt nur fuer die laufende
   Sitzung — App neu laden = wieder gesperrt.
══════════════════════════ */
const PRIV_KEY='wg_priv', PRIV_PIN='wg_priv_pin';
const privLoad = () => { const p=ls(PRIV_KEY,null)||{}; return { tx:Array.isArray(p.tx)?p.tx:[], fix:Array.isArray(p.fix)?p.fix:[] }; };
const privSave = p => ss(PRIV_KEY,{tx:p.tx||[],fix:p.fix||[]}); // false = nicht geschrieben (voller Speicher)

/* PIN-Hash: SHA-256(salt+pin), hex. Fallback (kein crypto.subtle, z.B. http-Kontext)
   ist ein simpler Rolling-Hash — schwaecher, aber die Sperre bleibt funktionsfaehig. */
const pinHash = async (pin, salt) => {
  const s = salt+':'+pin;
  try {
    if (crypto?.subtle) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  } catch {}
  let h=5381; for(let i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))>>>0; }
  return 'fb'+h.toString(16);
};
const randSalt = () => { try{ const a=new Uint8Array(8); crypto.getRandomValues(a); return Array.from(a).map(b=>b.toString(16).padStart(2,'0')).join(''); }catch{ return String(Date.now()); } };

/* Ziffernblock — gemeinsam fuer „PIN festlegen", „PIN bestaetigen" und „Entsperren". */
function PinPad({ title, sub, value, onKey, onDel, err, extra }) {
  return (
    <div className={`pin-wrap${err?' err':''}`}>
      <div className="pin-lock">{err?'🔓':'🔒'}</div>
      <div className="pin-title">{title}</div>
      {sub&&<div className="pin-sub">{sub}</div>}
      <div className="pin-dots">
        {[0,1,2,3].map(i=><div key={i} className={`pin-dot${i<value.length?' on':''}${err?' bad':''}`}/>)}
      </div>
      <div className="pin-err">{err||''}</div>
      <div className="pin-pad">
        {['1','2','3','4','5','6','7','8','9'].map(n=>(
          <button key={n} className="pin-key" onClick={()=>onKey(n)}>{n}</button>
        ))}
        <div/>
        <button className="pin-key" onClick={()=>onKey('0')}>0</button>
        <button className="pin-key ghost" aria-label="Löschen" onClick={onDel}>⌫</button>
      </div>
      {extra}
    </div>
  );
}

/* Sperrbildschirm: legt beim ersten Mal eine PIN an (2× eingeben), danach Abfrage. */
function PrivLock({ onUnlock }) {
  const stored = ls(PRIV_PIN,null);
  const setup  = !stored?.h;
  const [pin,setPin]   = useState('');
  const [first,setFirst] = useState(null); // Setup: erste Eingabe
  const [err,setErr]   = useState('');
  const busy = useRef(false);

  const reset = m => { setErr(m); setPin(''); setTimeout(()=>setErr(''),1400); };

  const submit = async code => {
    if (busy.current) return; busy.current=true;
    try {
      if (setup) {
        if (first===null) { setFirst(code); setPin(''); return; }
        if (first!==code) { setFirst(null); reset('PINs stimmen nicht überein'); return; }
        const salt = randSalt();
        ss(PRIV_PIN, { h: await pinHash(code, salt), s: salt });
        onUnlock();
      } else {
        const h = await pinHash(code, stored.s||'');
        if (h===stored.h) onUnlock(); else reset('Falsche PIN');
      }
    } finally { busy.current=false; }
  };

  const onKey = n => { if (pin.length>=4) return; const v=pin+n; setPin(v); if (v.length===4) submit(v); };

  const title = setup ? (first===null?'PIN festlegen':'PIN wiederholen') : 'PIN eingeben';
  // Der Datenschutz-Hinweis steckt bewusst im Untertitel statt in einer eigenen
  // Notiz-Box — sonst wird das Pad auf kleinen Displays unten abgeschnitten.
  const sub   = setup
    ? (first===null
        ? 'Vier Ziffern schützen deinen privaten Bereich. Die Daten liegen nur auf diesem Gerät und werden nicht mit der WG geteilt.'
        : 'Zur Sicherheit noch einmal dieselbe PIN.')
    : 'Dein privater Finanzbereich ist gesperrt.';

  return (
    <div className="screen">
      <NBar title="Privat" color="var(--violet)" status="privat"/>
      <div className="scroll">
        <div className="content">
          <PinPad title={title} sub={sub} value={pin} err={err}
                  onKey={onKey} onDel={()=>{ setPin(p=>p.slice(0,-1)); }}/>
        </div>
      </div>
    </div>
  );
}

const PRIV_CATS=['Wohnen','Lebensmittel','Transport','Freizeit','Gesundheit','Versicherung','Sparen','Sonstiges'];
const monKey = d => (d||'').slice(0,7);
const monLabel = m => { const [y,mo]=m.split('-'); return ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'][(+mo||1)-1]+' '+y; };
const monShift = (m,delta) => { const [y,mo]=m.split('-').map(Number); const d=new Date(y,(mo-1)+delta,1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); };

function Finanzen() {
  const { undo } = useD();
  const [locked,setLocked] = useState(true);
  const [priv,setPriv_]    = useState(privLoad);
  /* Geschrieben wird zentral hier statt in jedem Aufrufer — so ist auch der Undo-Pfad
     abgedeckt und der Updater bleibt seiteneffektfrei. Schlägt das Schreiben fehl
     (voller Gerätespeicher), MUSS das sichtbar werden: diese Daten liegen nur hier,
     ein stiller Fehlschlag wäre unwiederbringlicher Verlust (verifiziert, s. Banner). */
  const [saveErr,setSaveErr] = useState(false);
  const mounted = useRef(false);
  useEffect(() => {
    if (!mounted.current) { mounted.current = true; return; } // beim Mount nichts zurückschreiben
    setSaveErr(!privSave(priv));
  }, [priv]);
  const setPriv = setPriv_;

  const [seg,setSeg]   = useState('txs');
  const [wiz,setWiz]   = useState(null);
  const [editTx,setEditTx]   = useState(null);
  const [editFix,setEditFix] = useState(null);
  const [mon,setMon]   = useState(() => todayISO().slice(0,7));

  if (locked) return <PrivLock onUnlock={()=>setLocked(false)}/>;

  const txs=priv.tx, fixed=priv.fix;
  const monTxs = txs.filter(t=>monKey(t.date)===mon);
  const inc = monTxs.filter(t=>t.type==='inc').reduce((s,t)=>s+t.amount,0);
  const exp = monTxs.filter(t=>t.type==='exp').reduce((s,t)=>s+t.amount,0);
  const fixMo = fixed.reduce((s,f)=>s+(f.freq==='m'?f.amount:f.amount/12),0);
  const avail = inc-exp-fixMo;
  const isCur = mon===todayISO().slice(0,7);

  const addTx  = d => setPriv({...priv, tx:[{id:uid(),type:d.type||'exp',amount:parseNum(d.amount)||0,category:d.cat||'Sonstiges',note:(d.note||'').trim(),date:d.date||todayISO()},...txs]});
  const saveTx = d => setPriv({...priv, tx:txs.map(x=>x.id===editTx.id?{...x,type:d.type||x.type,amount:parseNum(d.amount)||x.amount,category:d.cat||x.category,note:(d.note||'').trim(),date:d.date||x.date}:x)});
  const delTx  = id => { const it=txs.find(x=>x.id===id); setPriv({...priv, tx:txs.filter(x=>x.id!==id)}); undo('Buchung gelöscht', ()=>setPriv_(cur=>cur.tx.some(x=>x.id===id)?cur:{...cur,tx:[it,...cur.tx]})); };

  const addFix  = d => setPriv({...priv, fix:[{id:uid(),name:(d.name||'').trim(),amount:parseNum(d.amount)||0,freq:d.freq||'m',day:d.day?Math.min(31,Math.max(1,parseInt(d.day,10)||1)):null},...fixed]});
  const saveFix = d => setPriv({...priv, fix:fixed.map(x=>x.id===editFix.id?{...x,name:(d.name||x.name).trim(),amount:parseNum(d.amount)||x.amount,freq:d.freq||x.freq,day:d.day?Math.min(31,Math.max(1,parseInt(d.day,10)||1)):x.day}:x)});
  const delFix  = id => { const it=fixed.find(x=>x.id===id); setPriv({...priv, fix:fixed.filter(x=>x.id!==id)}); undo('Fixkosten gelöscht', ()=>setPriv_(cur=>cur.fix.some(x=>x.id===id)?cur:{...cur,fix:[it,...cur.fix]})); };

  const backup = () => {
    try {
      const blob=new Blob([JSON.stringify({v:1,exported:new Date().toISOString(),...priv},null,2)],{type:'application/json'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
      a.download=`privat-finanzen-${todayISO()}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    } catch {}
  };

  const txSteps=[
    {label:'Art',ok:d=>!!d.type,render:({data:d,setData:sd})=>(
      <div className="pick">
        {[['inc','📈 Einnahme','var(--green)'],['exp','📉 Ausgabe','var(--red)']].map(([v,l,c])=>(
          <button key={v} className={`pick-btn${d.type===v?' on':''}`} style={{background:c}} onClick={()=>sd({...d,type:v})}>{l}</button>
        ))}
      </div>
    )},
    {label:'Betrag & Datum',ok:d=>parseNum(d.amount)>0,render:({data:d,setData:sd})=>(
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        <div className="f-euro"><input autoFocus type="text" inputMode="decimal" className="field" placeholder="0,00" value={d.amount||''} onChange={e=>sd({...d,amount:e.target.value})}/></div>
        <input type="date" className="field" value={d.date||todayISO()} onChange={e=>sd({...d,date:e.target.value})}/>
      </div>
    )},
    {label:'Kategorie & Notiz',ok:d=>!!d.cat,render:({data:d,setData:sd})=>(
      <div style={{display:'flex',flexDirection:'column',gap:12}}>
        <div className="cat-grid">
          {PRIV_CATS.map(c=><button key={c} className={`cat-btn${d.cat===c?' on':''}`} onClick={()=>sd({...d,cat:c})}>{c}</button>)}
        </div>
        <input maxLength={100} className="field" placeholder="Notiz (optional)" value={d.note||''} onChange={e=>sd({...d,note:e.target.value})}/>
      </div>
    )},
  ];
  const fixSteps=[
    {label:'Bezeichnung',ok:d=>d.name?.trim(),render:({data:d,setData:sd})=><input autoFocus maxLength={100} className="field" placeholder="Miete, Strom, Handy …" value={d.name||''} onChange={e=>sd({...d,name:e.target.value})}/>},
    {label:'Betrag',ok:d=>parseNum(d.amount)>0,render:({data:d,setData:sd})=><div className="f-euro"><input autoFocus type="text" inputMode="decimal" className="field" placeholder="0,00" value={d.amount||''} onChange={e=>sd({...d,amount:e.target.value})}/></div>},
    {label:'Häufigkeit & Fälligkeit',ok:d=>!!d.freq,render:({data:d,setData:sd})=>(
      <div style={{display:'flex',flexDirection:'column',gap:12}}>
        <div className="pick">
          {[['m','Monatlich'],['y','Jährlich']].map(([v,l])=>(
            <button key={v} className={`pick-btn${d.freq===v?' on':''}`} style={{background:'var(--violet)'}} onClick={()=>sd({...d,freq:v})}>{l}</button>
          ))}
        </div>
        {d.freq==='m'&&<input type="text" inputMode="numeric" maxLength={2} className="field" placeholder="Fällig am … (Tag, optional)" value={d.day||''} onChange={e=>sd({...d,day:e.target.value.replace(/\D/g,'')})}/>}
      </div>
    )},
  ];

  return (
    <div className="screen">
      <NBar title="Privat" color="var(--violet)" status="privat"/>
      <div className="scroll">
        <div className="content">
          <div className="priv-note rise">🔒 Nur auf diesem Gerät · nicht mit der WG geteilt</div>

          {/* Bleibt stehen, bis das Speichern wieder klappt — nicht wegklickbar, weil die
              Änderung sonst beim Schließen der App spurlos verschwindet. */}
          {saveErr && (
            <div className="group rise" role="alert" style={{padding:'13px 16px',display:'flex',alignItems:'center',gap:12,border:'1px solid rgba(251,113,133,.42)',background:'rgba(251,113,133,.08)'}}>
              <div className="cell-icon" style={{background:'rgba(251,113,133,.14)',fontSize:15}}>⚠️</div>
              <div className="cell-content">
                <span className="cell-title" style={{color:'var(--red)'}}>Nicht gespeichert</span>
                <span className="cell-sub">Der Gerätespeicher ist voll — beim Schließen der App wäre die Änderung weg. Jetzt „⬇︎ Sichern" antippen, dann Speicher freimachen.</span>
              </div>
            </div>
          )}

          <div className="seg rise" style={{animationDelay:'40ms'}}>
            <button className="seg-btn" aria-label="Vorheriger Monat" onClick={()=>setMon(m=>monShift(m,-1))}>‹</button>
            <button className="seg-btn on" onClick={()=>setMon(todayISO().slice(0,7))}>{monLabel(mon)}</button>
            <button className="seg-btn" aria-label="Nächster Monat" disabled={isCur} style={isCur?{opacity:.3}:{}} onClick={()=>{ if(!isCur) setMon(m=>monShift(m,1)); }}>›</button>
          </div>

          <div className="summary rise" style={{animationDelay:'80ms'}}>
            <div className="sum-row">
              {/* Bewusst fmtT statt fmtK: bei Gehalt/Miete zählt der exakte Betrag —
                  fmtK würde 1450 als „1,4K" anzeigen (gerundet UND abgeschnitten). */}
              {[['Einnahmen',inc,'var(--green)'],['Ausgaben',exp,'var(--red)'],['Bilanz',inc-exp,inc-exp>=0?'var(--label)':'var(--red)']].map(([l,v,c])=>(
                <div key={l} className="sum-col">
                  <span className="sum-lbl">{l}</span>
                  <span className="sum-val" style={{color:c,fontSize:14}}>{v<0?'-':''}€{fmtT(Math.abs(v))}</span>
                </div>
              ))}
            </div>
            <div style={{borderTop:'1px solid var(--sep)',padding:'10px 0',textAlign:'center',fontSize:13,color:'var(--label2)'}}>
              Fixkosten/Mo. <span className="num" style={{color:'var(--violet)',fontWeight:700}}>€{fmtT(fixMo)}</span>
              {'  ·  '}bleibt <span className="num" style={{color:avail>=0?'var(--green)':'var(--red)',fontWeight:700}}>{avail<0?'-':''}€{fmtT(Math.abs(avail))}</span>
            </div>
          </div>

          <div className="seg rise" style={{animationDelay:'120ms'}}>
            {[['txs','💳 Buchungen'],['fix','📌 Fixkosten']].map(([v,l])=>(
              <button key={v} className={`seg-btn${seg===v?' on':''}`} onClick={()=>setSeg(v)}>{l}</button>
            ))}
          </div>

          {seg==='txs'?(
            <>
              <button className="btn" style={{background:'var(--violet)'}} onClick={()=>setWiz('tx')}>+ Buchung</button>
              {monTxs.length===0
                ?<div className="empty"><div className="empty-ico">💳</div><span style={{fontSize:14,color:'var(--label2)'}}>Keine Buchungen im {monLabel(mon)}</span></div>
                :(
                  <div className="group">
                    {monTxs.map(t=>(
                      <div key={t.id} className="cell">
                        <div className="cell-icon" style={{background:t.type==='inc'?'rgba(74,222,128,.13)':'rgba(251,113,133,.13)',fontSize:15}}>
                          {t.type==='inc'?'📈':'📉'}
                        </div>
                        <div className="cell-content" style={{cursor:'pointer'}} onClick={()=>setEditTx(t)}>
                          <span className="cell-title">{t.note?t.note:t.category}</span>
                          <span className="cell-sub">{t.note?`${t.category} · ${fmtDate(t.date)}`:fmtDate(t.date)}</span>
                        </div>
                        <span className="num" style={{fontWeight:700,fontSize:16,color:t.type==='inc'?'var(--green)':'var(--red)',cursor:'pointer'}} onClick={()=>setEditTx(t)}>
                          {t.type==='inc'?'+':'-'}€{fmt(t.amount)}
                        </span>
                        <button className="del-btn" aria-label="Buchung löschen" title="Buchung löschen" onClick={()=>delTx(t.id)}>×</button>
                      </div>
                    ))}
                  </div>
                )
              }
            </>
          ):(
            <>
              <button className="btn" style={{background:'var(--violet)'}} onClick={()=>setWiz('fix')}>+ Fixkosten</button>
              {fixed.length===0
                ?<div className="empty"><div className="empty-ico">📌</div><span style={{fontSize:14,color:'var(--label2)'}}>Noch keine Fixkosten</span></div>
                :(
                  <div className="group">
                    {fixed.map(f=>(
                      <div key={f.id} className="cell">
                        <div className="cell-icon" style={{background:'rgba(196,181,253,.13)',fontSize:15}}>📌</div>
                        <div className="cell-content" style={{cursor:'pointer'}} onClick={()=>setEditFix(f)}>
                          <span className="cell-title">{f.name}</span>
                          <span className="cell-sub">{f.freq==='m'?(f.day?`Monatlich · am ${f.day}.`:'Monatlich'):'Jährlich'}</span>
                        </div>
                        <div style={{textAlign:'right',flexShrink:0,cursor:'pointer'}} onClick={()=>setEditFix(f)}>
                          <div className="num" style={{fontSize:15,fontWeight:700}}>€{fmt(f.amount)}</div>
                          {f.freq==='y'&&<div className="num" style={{fontSize:11,color:'var(--label3)'}}>€{fmt(f.amount/12)}/Mo.</div>}
                        </div>
                        <button className="del-btn" aria-label="Fixkosten löschen" title="Fixkosten löschen" onClick={()=>delFix(f.id)}>×</button>
                      </div>
                    ))}
                  </div>
                )
              }
            </>
          )}

          <div style={{display:'flex',gap:9,marginTop:16}}>
            <button className="btn" style={{background:'var(--bg3)',color:'var(--label2)',flex:1,fontSize:13}} onClick={backup}>⬇︎ Sichern</button>
            <button className="btn" style={{background:'var(--bg3)',color:'var(--label2)',flex:1,fontSize:13}} onClick={()=>setLocked(true)}>🔒 Sperren</button>
          </div>
          <div className="section-ftr">Lokale Daten haben kein Cloud-Backup — „Sichern" legt eine JSON-Datei ab.</div>
        </div>
      </div>
      <Wiz open={wiz==='tx'}  onClose={()=>setWiz(null)} title="Buchung"   color="var(--violet)" steps={txSteps}  onFinish={addTx}/>
      <Wiz open={wiz==='fix'} onClose={()=>setWiz(null)} title="Fixkosten" color="var(--violet)" steps={fixSteps} onFinish={addFix}/>
      <Wiz open={!!editTx}  onClose={()=>setEditTx(null)}  title="Buchung bearbeiten"   color="var(--violet)" steps={txSteps}  onFinish={saveTx}  initial={editTx?{type:editTx.type,amount:String(editTx.amount).replace(".",","),cat:editTx.category,note:editTx.note||'',date:/^\d{4}-\d{2}-\d{2}$/.test(editTx.date||'')?editTx.date:todayISO()}:null}/>
      <Wiz open={!!editFix} onClose={()=>setEditFix(null)} title="Fixkosten bearbeiten" color="var(--violet)" steps={fixSteps} onFinish={saveFix} initial={editFix?{name:editFix.name,amount:String(editFix.amount).replace(".",","),freq:editFix.freq,day:editFix.day?String(editFix.day):''}:null}/>
    </div>
  );
}
/* ══════════════════════════

══════════════════════════ */
function Abos() {
  const { D, set, setFn, status, undo } = useD();
  const subs=D.ab||[];
  const del = id => { const s=subs.find(x=>x.id===id); set('ab',subs.filter(x=>x.id!==id)); undo(`„${s?.name||'Abo'}" gelöscht`, ()=>setFn('ab', cur => cur.some(x=>x.id===id)?cur:[s,...cur])); };
  const [wiz,setWiz] = useState(false);
  const [editSub,setEditSub] = useState(null);
  const save = d => set('ab',subs.map(x=>x.id===editSub.id?{...x,name:d.name||x.name,price:parseNum(d.price)||x.price,iv:d.iv||x.iv,em:d.em||x.em,cl:d.cl||x.cl}:x));

  const EMS=['📱','🎵','🎬','🎮','💻','📰','🛒','☁️','🏋️','📚','🧠','🔒'];
  const CLS=['#38bdf8','#4ade80','#818cf8','#fbbf24','#fb7185','#ec4899','#c4b5fd','#5eead4','#facc15','#a3e635'];

  const pct = s=>{ const d=daysSince(s.sd),p=s.iv==='m'?30:365; return (d%p)/p*100; };
  const dlf = s=>{ const d=daysSince(s.sd),p=s.iv==='m'?30:365; return p-(d%p); };
  const moTotal=subs.reduce((s,sub)=>s+(sub.iv==='m'?sub.price:sub.price/12),0);

  const add = d => set('ab',[{id:uid(),name:d.name||'Abo',price:parseNum(d.price)||0,iv:d.iv||'m',em:d.em||'📱',cl:d.cl||'#818cf8',sd:todayISO()},...subs]);

  const steps=[
    {label:'Name des Abos?',ok:d=>d.name?.trim(),render:({data:d,setData:sd})=><input autoFocus maxLength={200} className="field" placeholder="Netflix, Spotify, iCloud …" value={d.name||''} onChange={e=>sd({...d,name:e.target.value})}/>},
    {label:'Preis & Intervall',ok:d=>parseNum(d.price)>0,render:({data:d,setData:sd})=>(
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        <div className="f-euro"><input autoFocus type="text" inputMode="decimal" className="field" placeholder="0,00" value={d.price||''} onChange={e=>sd({...d,price:e.target.value})}/></div>
        <div className="seg">
          {[['m','Monatlich'],['y','Jährlich']].map(([v,l])=>(
            <button key={v} className={`seg-btn${d.iv===v?' on':''}`} onClick={()=>sd({...d,iv:v})}>{l}</button>
          ))}
        </div>
      </div>
    )},
    {label:'Symbol & Farbe',render:({data:d,setData:sd})=>(
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        <div className="emoji-grid">{EMS.map(e=><button key={e} className={`emoji-btn${d.em===e?' on':''}`} onClick={()=>sd({...d,em:e})}>{e}</button>)}</div>
        <div className="color-row">{CLS.map(c=><button key={c} className={`color-btn${d.cl===c?' on':''}`} style={{background:c,color:c}} onClick={()=>sd({...d,cl:c})}/>)}</div>
      </div>
    )},
  ];

  return (
    <div className="screen">
      <NBar title="Abos" color="var(--indigo)" status={status}/>
      <div className="scroll">
        <div className="content">
          {subs.length>0&&(
            <div className="hero rise" style={{'--glow':'rgba(129,140,248,.15)'}}>
              <div className="hero-lbl">Pro Monat</div>
              <div className="hero-big" style={{color:'var(--indigo)',margin:'6px 0 4px'}}>€<CountUp value={moTotal}/></div>
              <div style={{fontSize:12.5,color:'var(--label3)',fontWeight:500}}>€{fmt(moTotal*12)} pro Jahr · {subs.length} {subs.length===1?'Abo':'Abos'}</div>
            </div>
          )}
          <button className="btn rise" style={{background:'var(--indigo)',color:'#0a120c',animationDelay:'50ms'}} onClick={()=>setWiz(true)}>+ Abo hinzufügen</button>
          {subs.length===0
            ?<div className="empty"><div className="empty-ico">🔄</div><span style={{fontSize:14,color:'var(--label2)'}}>Noch keine Abos</span></div>
            :(
              <>
                <div className="sub-grid rise" style={{animationDelay:'100ms'}}>
                  {subs.map(s=>{
                    const p=pct(s),dl=dlf(s);
                    return(
                      <div key={s.id} className="sub-card" style={{cursor:'pointer'}} onClick={()=>setEditSub(s)} onContextMenu={e=>{e.preventDefault();del(s.id);}}>
                        <button className="del-btn" aria-label="Abo löschen" title="Abo löschen" onClick={e=>{e.stopPropagation();del(s.id);}}
                          style={{position:'absolute',top:6,right:6,padding:0,width:24,height:24,fontSize:18,color:'var(--label4)',zIndex:2}}>×</button>
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:2}}>
                          <span style={{fontSize:24,lineHeight:1}}>{s.em}</span>
                          <span className="num" style={{fontSize:9,color:'var(--label3)',letterSpacing:'.2em',marginRight:22}}>{s.iv==='m'?'MTL':'JÄHR'}</span>
                        </div>
                        <div style={{fontSize:14,fontWeight:700,color:'var(--label)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',marginBottom:2}}>{s.name}</div>
                        <div className="num" style={{fontSize:19,fontWeight:700,color:s.cl,marginBottom:10}}>€{fmt(s.price)}</div>
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                          <div>
                            <div className="num" style={{fontSize:11,fontWeight:700,color:s.cl}}>{dl}d</div>
                            <div style={{fontSize:10,color:'var(--label3)'}}>übrig</div>
                          </div>
                          <Ring pct={p} size={52} sw={4} color={s.cl}>
                            <span className="num" style={{fontSize:10,fontWeight:700,color:'var(--label)'}}>{Math.round(p)}%</span>
                          </Ring>
                        </div>
                        <div className="sub-bar-bg"><div className="sub-bar" style={{width:`${p}%`,background:s.cl}}/></div>
                      </div>
                    );
                  })}
                </div>
                <div style={{textAlign:'center',fontSize:11,color:'var(--label4)'}}>Tippen zum Bearbeiten · × zum Löschen</div>
              </>
            )
          }
        </div>
      </div>
      <Wiz open={wiz} onClose={()=>setWiz(false)} title="Neues Abo" color="var(--indigo)" steps={steps} onFinish={add}/>
      <Wiz open={!!editSub} onClose={()=>setEditSub(null)} title="Abo bearbeiten" color="var(--indigo)" steps={steps} onFinish={save} initial={editSub?{name:editSub.name,price:String(editSub.price).replace(".",","),iv:editSub.iv,em:editSub.em,cl:editSub.cl}:null}/>
    </div>
  );
}

/* ══════════════════════════
   EINSTELLUNGEN
══════════════════════════ */
function Einstellungen() {
  const { D, set, setFn, status, online, fbCfg, setFbCfg, wgCode, setWgCode, mods, setMods, replaceData, me, setMe, undo, askConfirm, deviceId, pushSave, pushRemove, pushPrefsUpdate } = useD();
  const users=D.users;
  const [cfgText,  setCfgText]  = useState(fbCfg ? JSON.stringify(fbCfg, null, 2) : '');
  const [codeInput,setCodeInput]= useState('');
  const [copied,   setCopied]   = useState(false);
  const [cfgErr,   setCfgErr]   = useState('');
  const [showSetup,setShowSetup]= useState(!fbCfg);
  const [importErr,setImportErr]= useState('');
  const [pendingJoin,setPendingJoin] = useState(null); // WG-Code, der beigetreten werden soll (Merge/Überschreiben-Wahl)
  const [showArchive,setShowArchive] = useState(false);
  const notifySupported = typeof window!=='undefined' && 'Notification' in window;
  const [notifyOn,setNotifyOn] = useState(()=>ls('wg_notify','off')==='on' && notifySupported && Notification.permission==='granted');
  const toggleNotify = async () => {
    if (!notifySupported) return;
    if (notifyOn) { ss('wg_notify','off'); setNotifyOn(false); return; }
    let perm = Notification.permission;
    if (perm !== 'granted') perm = await Notification.requestPermission();
    if (perm === 'granted') { ss('wg_notify','on'); ss('wg_notify_last', null); setNotifyOn(true); }
    else { ss('wg_notify','off'); setNotifyOn(false); }
  };
  const fileInputRef = useRef(null);

  /* ── Web-Push (Paket C) ── */
  const pushCapable = typeof window!=='undefined' && 'Notification' in window && 'serviceWorker' in navigator && 'PushManager' in window;
  const isStandalone = () => { try { return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; } catch { return false; } };
  const isIOS = () => { try { return /iphone|ipad|ipod/i.test(navigator.userAgent||''); } catch { return false; } };
  const iOSNeedsInstall = isIOS() && !isStandalone();
  const showPush = pushCapable || iOSNeedsInstall;
  const [pushOn,   setPushOn]   = useState(false);
  const [pushBusy, setPushBusy] = useState(false);
  const [pushMsg,  setPushMsg]  = useState('');
  const [pushPerm, setPushPerm] = useState(pushCapable ? Notification.permission : 'default');
  const flashPush = (m) => { setPushMsg(m); setTimeout(()=>setPushMsg(''), 4000); };
  /* Push-Feinschliff: konfigurierbare Typen pro Gerät + Ruhezeiten. Quelle der Wahrheit für die UI
     ist localStorage; bei aktivem Push zusätzlich in die RTDB-Subscription gespiegelt. */
  const PUSH_PREFS_DEF = { exp:true, shop:true, putz:true, settle:true, remind:true, quiet:false, qs:22, qe:8 };
  const [pushPrefs, setPushPrefs] = useState(() => ({ ...PUSH_PREFS_DEF, ...(ls('wg_push_prefs', {}) || {}) }));
  const setPref = (patch) => {
    setPushPrefs(prev => {
      const next = { ...prev, ...patch };
      ss('wg_push_prefs', next);
      if (pushOn) pushPrefsUpdate(next).catch(()=>{});
      return next;
    });
  };
  // Zustand aus der TATSÄCHLICHEN Subscription ableiten (nicht aus localStorage).
  useEffect(() => {
    if (!pushCapable) return;
    let alive = true;
    (async () => {
      try {
        const reg = await navigator.serviceWorker.ready;
        const sub = await reg.pushManager.getSubscription();
        if (alive) setPushOn(!!sub);
      } catch {}
    })();
    return () => { alive = false; };
  }, []);
  const enablePush = async () => {
    setPushBusy(true);
    try {
      let perm = Notification.permission;
      if (perm !== 'granted') perm = await Notification.requestPermission();
      setPushPerm(perm);
      if (perm !== 'granted') { flashPush('Berechtigung nicht erteilt.'); setPushBusy(false); return; }
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });
      const j = sub.toJSON() || {};
      await pushSave({ endpoint: j.endpoint, p256dh: (j.keys&&j.keys.p256dh)||null, auth: (j.keys&&j.keys.auth)||null, name: (users.find(u=>u.id===me)?.name)||'Gerät', t: Date.now(), ...pushPrefs });
      setPushOn(true);
      flashPush('Push aktiviert ✓');
    } catch (e) {
      // Falls Subscribe klappte, aber der RTDB-Write scheiterte (offline/keine DB): wieder abmelden, damit Zustand ehrlich bleibt.
      try { const reg = await navigator.serviceWorker.ready; const s = await reg.pushManager.getSubscription(); if (s) await s.unsubscribe(); } catch {}
      setPushOn(false);
      flashPush('Konnte nicht aktivieren — online und mit der WG verbunden?');
    }
    setPushBusy(false);
  };
  const disablePush = async () => {
    setPushBusy(true);
    try {
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if (sub) await sub.unsubscribe();
      await pushRemove();
      setPushOn(false);
      flashPush('Push deaktiviert');
    } catch { flashPush('Konnte nicht deaktivieren.'); }
    setPushBusy(false);
  };
  const togglePush = () => { if (pushBusy || !pushCapable || !PUSH_API || pushPerm==='denied') return; pushOn ? disablePush() : enablePush(); };
  const pushDisabled = !PUSH_API || !pushCapable || pushBusy || pushPerm==='denied';

  const hasLocalData = (D.hs?.length||0)+(D.gi?.length||0)+(D.ab?.length||0)+(D.pt?.length||0)+(D.sl?.length||0)
    +(D.rec?.length||0)+(D.pl?.length||0)+(D.stl?.length||0)+(D.arc?.length||0)+Object.keys(D.gp||{}).length > 0;

  /* ── Archiv: abgerechnete Posten + Abrechnungen älter als 3 volle Monate ──
     Cutoff = erster Tag des Monats, der 3 Monate vor dem aktuellen liegt
     (z.B. heute 2026-07 → Cutoff 2026-04-01). ISO-Datumsstrings sortieren
     lexikographisch korrekt, deshalb reicht String-Vergleich. */
  const archiveCutoff = ymShift(todayISO().slice(0,7), -3) + '-01';
  const arc  = D.arc || [];
  const oldHs  = (D.hs||[]).filter(i => i.settled && (i.settledAt||i.date) < archiveCutoff);
  const oldGi  = (D.gi||[]).filter(i => i.settled && (i.settledAt||i.date) < archiveCutoff);
  const oldStl = (D.stl||[]).filter(s => s.date < archiveCutoff);
  const archiveCandidates = [
    ...oldHs.map(i=>({...i,src:'hs'})),
    ...oldGi.map(i=>({...i,src:'gi'})),
    ...oldStl.map(s=>({...s,src:'stl'})),
  ];
  const archiveCount = archiveCandidates.length;
  const doArchive = async () => {
    if (!archiveCount) return;
    const ok = await askConfirm({ title:'Archivieren?', body:`${archiveCount} abgerechnete Einträge wandern ins Archiv. Sie bleiben in der Übersicht sichtbar.`, okLabel:'Archivieren' });
    if (!ok) return;
    const moved = archiveCandidates;
    const hsIds = new Set(oldHs.map(i=>i.id)), giIds = new Set(oldGi.map(i=>i.id)), stlIds = new Set(oldStl.map(s=>s.id));
    set('arc', [...moved, ...arc]);
    set('hs', (D.hs||[]).filter(i=>!hsIds.has(i.id)));
    set('gi', (D.gi||[]).filter(i=>!giIds.has(i.id)));
    set('stl', (D.stl||[]).filter(s=>!stlIds.has(s.id)));
    undo(`${moved.length} Einträge archiviert`, () => {
      setFn('arc', cur => cur.filter(a => !moved.some(m=>m.id===a.id && m.src===a.src)));
      ['hs','gi','stl'].forEach(k => {
        setFn(k, cur => {
          const back = moved.filter(m=>m.src===k).map(({src,...rest})=>rest).filter(r=>!cur.some(x=>x.id===r.id));
          return back.length ? [...back, ...cur] : cur;
        });
      });
    });
  };
  const arcByMonth = () => {
    const groups = {};
    [...arc].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).forEach(it => {
      const ym = ymOf(it.date) || 'unbekannt';
      (groups[ym] = groups[ym] || []).push(it);
    });
    return groups;
  };

  const saveCfg = () => {
    setCfgErr('');
    try {
      const parsed = JSON.parse(cfgText.trim());
      if (!parsed.databaseURL) { setCfgErr('databaseURL fehlt im Config-Objekt.'); return; }
      if (!parsed.apiKey)      { setCfgErr('apiKey fehlt im Config-Objekt.'); return; }
      setFbCfg(parsed);
      setShowSetup(false);
    } catch {
      setCfgErr('Kein gültiges JSON. Bitte das gesamte Config-Objekt einfügen.');
    }
  };

  const joinCode = () => {
    const c = codeInput.trim().toUpperCase();
    if (!c) return;
    if (c === wgCode) { setCodeInput(''); return; } // eigener Code: nichts zu tun — sonst bliebe der wg_join_mode-Marker liegen (Init-Effekt feuert nicht) und würde beim nächsten Reload unbeabsichtigt greifen
    if (hasLocalData) { setPendingJoin(c); return; } // Merge/Überschreiben per Dialog wählen
    sessionStorage.setItem('wg_join_mode','remote');
    setWgCode(c);
    setCodeInput('');
  };
  const doJoin = (mode) => {
    sessionStorage.setItem('wg_join_mode', mode);
    setWgCode(pendingJoin);
    setCodeInput('');
    setPendingJoin(null);
  };

  /* Export */
  const exportData = () => {
    const payload = { _v:1, exportedAt:new Date().toISOString(), data:D };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `wg-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  };

  /* CSV-Export: Ausgaben (hs/gi inkl. Archiv) + Abrechnungen — Semikolon + BOM für deutsches Excel */
  const exportCsv = () => {
    const esc = v => { const s=String(v==null?'':v); return /[;"\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
    const eur = n => Number(n||0).toFixed(2).replace('.',',');
    const uname = id => (D.users||[]).find(u=>u.id===id)?.name||'';
    const catLabel = k => (CATS.find(c=>c[0]===k)||GROW_CATS.find(c=>c[0]===k))?.[2]||'';
    const rows = [['Modul','Name','Betrag (€)','Bezahlt von','Datum','Kategorie','Status']];
    const addRow = (i,mod,st) => rows.push([mod,i.name||'',eur(i.price),uname(i.paidBy),i.date||'',catLabel(i.cat),st]);
    (D.hs||[]).forEach(i=>addRow(i,'Haushalt',i.settled?'abgerechnet':'offen'));
    (D.gi||[]).forEach(i=>addRow(i,'Growbox',i.settled?'abgerechnet':'offen'));
    (D.arc||[]).filter(a=>a.src==='hs'||a.src==='gi').forEach(a=>addRow(a,a.src==='hs'?'Haushalt':'Growbox','archiviert'));
    [...(D.stl||[]), ...(D.arc||[]).filter(a=>a.src==='stl')].forEach(s=>
      rows.push(['Abrechnung', s.mod==='hs'?'Haushalt':'Growbox', eur(s.amount!=null?s.amount:s.total), `${uname(s.fromId)} → ${uname(s.toId)}`, s.date||'', '', `${s.n||0} Posten`]));
    const blob = new Blob(['﻿'+rows.map(r=>r.map(esc).join(';')).join('\r\n')], {type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `wg-export-${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  };

  /* Import */
  const importFile = (file) => {
    setImportErr('');
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async e => {
      let payload;
      try {
        const parsed = JSON.parse(e.target.result);
        payload = parsed?.data ? parsed.data : parsed;
        if (typeof payload !== 'object' || !payload) throw new Error('invalid');
      } catch {
        setImportErr('Datei ist kein gültiges Backup-JSON.');
        return;
      }
      if (await askConfirm({title:'Backup importieren',body:'Import überschreibt alle aktuellen Daten auf diesem Gerät (und im Sync). Fortfahren?',okLabel:'Importieren',danger:true}))
        replaceData(payload);
    };
    reader.readAsText(file);
  };

  const [copyFail,setCopyFail] = useState(false);
  const copyCode = async () => {
    const ok = await (async () => {
      try { if (navigator.clipboard) { await navigator.clipboard.writeText(wgCode); return true; } } catch {}
      // Fallback ohne Clipboard-API (z.B. http oder iOS-Sonderfälle): verstecktes Textfeld + execCommand
      try {
        const ta=document.createElement('textarea'); ta.value=wgCode;
        ta.style.position='fixed'; ta.style.top='-1000px'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.focus(); ta.select();
        const done=document.execCommand('copy'); ta.remove(); return done;
      } catch { return false; }
    })();
    if (ok) { setCopyFail(false); setCopied(true); setTimeout(()=>setCopied(false), 2000); }
    else    { setCopyFail(true);  setTimeout(()=>setCopyFail(false), 2500); }
  };

  const statusColor  = !online?'var(--amber)':status==='synced'?'var(--lime)':status==='connecting'?'var(--amber)':status==='error'?'var(--red)':'var(--label3)';
  const statusLabel  = !online ? 'Offline (lokal speichern, sync wenn online)' : {local:'Nur lokal',connecting:'Verbinde …',synced:'Live synchronisiert ✓',error:'Verbindungsfehler'}[status];

  return (
    <div className="screen">
      <NBar title="Mehr" color="var(--label)" status={status}/>
      <div className="scroll"><div className="content">

        {/* Sync Status */}
        <div className="rise">
          <div className="section-hdr">Sync-Status</div>
          <div className="group">
            <div className="cell">
              <div style={{width:10,height:10,borderRadius:'50%',background:statusColor,boxShadow:`0 0 10px ${statusColor}`,flexShrink:0}}/>
              <div className="cell-content">
                <span className="cell-title" style={{color:statusColor,fontSize:15}}>{statusLabel}</span>
                {status!=='local'&&<span className="cell-sub">WG-Code: {wgCode}</span>}
              </div>
            </div>
          </div>
        </div>

        {/* WG Code sharing */}
        {fbCfg&&(
          <div className="rise" style={{animationDelay:'40ms'}}>
            <div className="section-hdr">WG-Code teilen</div>
            <div className="group">
              <div className="cell">
                <div className="cell-content">
                  <span className="cell-title num" style={{letterSpacing:'.05em',fontSize:19,fontWeight:700,color:'var(--lime)'}}>{wgCode}</span>
                  <span className="cell-sub">Diesen Code auf dem anderen Gerät eingeben</span>
                </div>
                <button onClick={copyCode} style={{background:'none',border:'none',padding:'7px 4px',color:copyFail?'var(--red)':copied?'var(--green)':'var(--mint)',fontSize:13,fontWeight:700,flexShrink:0}}>
                  {copyFail?'Manuell kopieren':copied?'Kopiert ✓':'Kopieren'}
                </button>
              </div>
              <div className="cell" style={{gap:8}}>
                <input className="field" style={{flex:1,padding:'10px 12px',fontSize:15}} placeholder="Anderen Code eingeben …"
                  value={codeInput} onChange={e=>setCodeInput(e.target.value.toUpperCase())}/>

/* ══════════════════════════
   STATISTIK / ÜBERSICHT
══════════════════════════ */
function Statistik() {
  const { D, status, setFn } = useD();
  const users=D.users, hs=D.hs||[], gi=D.gi||[], ab=D.ab||[], gp=D.gp||{}, arc=D.arc||[], pl=D.pl||[];
  const [ym,setYm] = useState(()=>todayISO().slice(0,7));
  const nowYm = todayISO().slice(0,7);
  const [budCat,setBudCat] = useState(null); // Kategorie, für die gerade ein Budget gesetzt wird
  // Charts erst beim ersten Sichtbarwerden füllen (once) — nutzt die bestehenden width/height-Transitions
  const [payRef,paySeen]   = useInView();
  const [bearRef,bearSeen] = useInView();
  const [catRef,catSeen]   = useInView();
  const [gcatRef,gcatSeen] = useInView();
  const [trendRef,trendSeen] = useInView();
  const [plRef,plSeen]     = useInView();

  // Archivierte hs/gi-Ausgaben fließen weiter in Monatswähler/Trend/Größte Posten ein
  // (stl-Archiv-Einträge sind Abrechnungen, keine Ausgaben — bleiben außen vor).
  const arcExpenses = arc.filter(a=>a.src==='hs'||a.src==='gi').map(({src,...rest})=>({...rest,mod:src}));
  const all = [...hs.map(i=>({...i,mod:'hs'})), ...gi.map(i=>({...i,mod:'gi'})), ...arcExpenses];
  const month = all.filter(i=>ymOf(i.date)===ym);
  const total = month.reduce((s,i)=>s+(i.price||0),0);
  const hsSum = month.filter(i=>i.mod==='hs').reduce((s,i)=>s+i.price,0);
  const giSum = month.filter(i=>i.mod==='gi').reduce((s,i)=>s+i.price,0);
  const paidBy = users.map(u=>({...u, paid: month.filter(i=>i.paidBy===u.id).reduce((s,i)=>s+i.price,0)}));
  /* Tatsächlicher Anteil je Person (nach Split): Haushalt owedBy/50-50, Growbox nach Pflanzen-Anteil */
  const giTot = Object.values(gp).reduce((s,v)=>s+(parseInt(v)||0),0);
  const shareOf = (i,id) => i.mod==='hs'
    ? (i.owedBy ? (i.owedBy===id?i.price:0) : i.price/users.length)
    : i.price * (giTot>0 ? (parseInt(gp[id]||0)/giTot) : 1/users.length);
  const bears = users.map(u=>({...u, share: month.reduce((s,i)=>s+shareOf(i,u.id),0)}));
  const top = [...month].sort((a,b)=>b.price-a.price).slice(0,5);
  const moAbos = ab.reduce((s,x)=>s+(x.iv==='m'?x.price:x.price/12),0);
  const trend = Array.from({length:6},(_,k)=>{ const m=ymShift(ym,-(5-k)); return {m, t: all.filter(i=>ymOf(i.date)===m).reduce((s,i)=>s+i.price,0)}; });
  const trendMax = Math.max(...trend.map(t=>t.t),1);

  // Δ zum Vormonat: prev≈0 → keine sinnvolle Prozent-Basis, Zeile bleibt weg.
  const prevYm = ymShift(ym,-1);
  const prev = all.filter(i=>ymOf(i.date)===prevYm).reduce((s,i)=>s+(i.price||0),0);
  const deltaRatio = prev>0.005 ? Math.abs(total-prev)/prev : null;
  const deltaPct = deltaRatio!=null ? Math.round(deltaRatio*100) : null;

  // Gesamt-Saldo über alles (2 Personen): offene hs+gi-Posten, gleiche Split-Logik wie die Tabs.
  // Nur Anzeige — abgerechnet wird weiter pro Modul.
  const openAll = [...hs.filter(i=>!i.settled).map(i=>({...i,mod:'hs'})), ...gi.filter(i=>!i.settled).map(i=>({...i,mod:'gi'}))];
  const netOf = id => openAll.reduce((s,i)=>s+(i.paidBy===id?(i.price||0):0)-shareOf(i,id),0);
  const nets = users.map(u=>({...u, net:netOf(u.id)}));
  const netDeb = nets.find(n=>n.net<-0.01), netCred = nets.find(n=>n.net>0.01);

  // Kategorien · Haushalt (nur hs-Posten des Monats, inkl. archivierte).
  const hsMonth = month.filter(i=>i.mod==='hs');
  const catBuckets = (() => {
    const sums = {};

/* Persönliche Netto-Bilanz (Haushalt + Growbox) aus me-Sicht — fürs Start-Pop-up.
   total<0 = ich schulde. hs/g = Netto pro Bereich, other = der Gläubiger (2-Personen-WG). */
function myBalance(D, me, mods){
  const users = D.users||[];
  const open = (D.hs||[]).filter(i=>!i.settled);
  const shareOf=(i,id)=>i.owedBy?(i.owedBy===id?i.price:0):i.price/(users.length||1);
  const hs = me ? open.reduce((s,i)=>s+((i.paidBy===me?(i.price||0):0)-shareOf(i,me)),0) : 0;
  const growOn = mods.grow!==false;
  const g = (me&&growOn) ? growCalc(D).net(me) : 0;
  const other = users.find(u=>u.id!==me) || null;
  return { total: hs+g, hs, g, growOn, other };
}

/* Idiotensicheres Start-Pop-up: großer offener Betrag, wenn me beim Öffnen Schulden hat. */
function DebtAlert({ info, onClose }){
  const amt = Math.abs(info.total);
  // Aufschlüsselung nur zeigen, wenn KEIN Bereich ein Guthaben ist — sonst summieren die Teilbeträge
  // nicht zum Gesamtbetrag (z.B. Haushalt −35 + Growbox +2 = −33 → „€33" mit „Haushalt €35" wäre widersprüchlich).
  const noCredit = info.hs < 0.01 && (!info.growOn || info.g < 0.01);
  const showBreakdown = noCredit && (info.hs < -0.01 || (info.growOn && info.g < -0.01));
  return ReactDOM.createPortal(
    <div className="overlay" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="sheet-handle"/>
        <div className="sheet-body" style={{textAlign:'center',alignItems:'center',gap:6,paddingTop:6}}>
          <div style={{fontSize:44,lineHeight:1}}>💸</div>
          <div className="hero-lbl" style={{marginTop:6}}>Deine Bilanz</div>
          <div style={{fontSize:15.5,color:'var(--label2)',fontWeight:600}}>Du schuldest {info.other?.name || 'der WG'}</div>
          <div className="num" style={{fontSize:56,fontWeight:800,color:'var(--amber)',lineHeight:1.05,margin:'6px 0 4px'}}>€{fmt(amt)}</div>
          {showBreakdown && (
            <div style={{display:'flex',justifyContent:'center',gap:22,marginTop:6,fontSize:13.5,color:'var(--label3)'}}>
              {info.hs<-0.01 && <span>Haushalt <span className="num" style={{color:'var(--label2)',fontWeight:700}}>€{fmt(-info.hs)}</span></span>}
              {info.growOn&&info.g<-0.01 && <span>Growbox <span className="num" style={{color:'var(--label2)',fontWeight:700}}>€{fmt(-info.g)}</span></span>}
            </div>
          )}
        </div>
        <div className="sheet-acts">
          <button className="btn" style={{background:'var(--mint)',color:'#0a120c',flex:1}} onClick={onClose}>Später</button>
        </div>
      </div>
    </div>,
    document.body
  );
}
