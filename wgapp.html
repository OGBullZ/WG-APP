  return (
    <div className="rise" data-testid="quick-msgs" style={{animationDelay:'78ms'}}>
      <div className="section-hdr">{TT("💬 Kurz Bescheid")}</div>
      <div className="group" style={{padding:'12px 14px',display:'flex',flexDirection:'column',gap:10}}>
        {recent.map(m=>{ const u=users.find(x=>x.id===m.by); return (
          <div key={m.id} data-testid="qm-row" style={{fontSize:13.5,lineHeight:1.35}}>
            <b style={{color:u?.color}}>{m.by===me?'Du':u?.name||'Jemand'}</b> <span style={{color:'var(--label2)',fontSize:11.5}}>{fmtHM(m.ts).replace('morgen ','')}</span><br/>{m.text}
          </div>); })}
        {me ? (
          <>
            <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
              {QUICK_MSGS.map(q=><button key={q} type="button" data-testid="qm-preset" style={chipSt(false)} onClick={()=>send(q)}>{q}</button>)}
            </div>
            <form onSubmit={e=>{e.preventDefault();send(txt);}} style={{display:'flex',gap:8}}>
              <input className="field" maxLength={80} placeholder={TT("Eigene Nachricht …")} aria-label={TT("Eigene Nachricht")} value={txt} onChange={e=>setTxt(e.target.value)} style={{flex:1}}/>
              <button type="submit" className="btn" style={{width:'auto',padding:'0 16px',flexShrink:0,background:'var(--mint)'}}>{TT("Senden")}</button>
            </form>
          </>
        ) : <span style={{fontSize:12.5,color:'var(--label2)'}}>{TT("Gerät unter Mehr → Personen wählen, dann kannst du Nachrichten schicken.")}</span>}
      </div>
    </div>
  );
}

/* ── Reparaturen (Key `rp`): offen → gemeldet (md) → erledigt. Ab 14 Tagen „gemeldet" rot + Cron-Erinnerung (api/_wg.js) ── */
function RepairCard() {
  const { D, setFn, me, notifyOthers, undo } = useD();
  const [txt,setTxt] = useState('');
  const [showDone,setShowDone] = useState(false);
  const users = D.users || [];
  const all = (D.rp||[]).filter(Boolean).sort((a,b)=>(b.ts||0)-(a.ts||0));
  const openL = all.filter(r=>r.status!=='erledigt'), doneL = all.filter(r=>r.status==='erledigt');
  const add = () => {
    const t = txt.trim().slice(0,120); if (!t) return;
    const it = { id:uid(), text:t, by:me||null, ts:Date.now(), status:'offen' };
    setFn('rp', cur=>[it, ...(cur||[])]);
    notifyOthers(TT("🔧 Kaputt: {0}", t), TT("{0} hat es notiert", nameOfU(users, me)), TT("wg-repair"), TT("repair"));
    setTxt('');
  };
  const step = r => {
    const next = r.status==='offen' ? { status:'gemeldet', md:todayISO() } : { status:'erledigt', dd:todayISO() };
    setFn('rp', cur=>cur.map(x=>x.id===r.id?{...x,...next}:x));
    undo(next.status==='gemeldet'?'🔧 Als gemeldet markiert':'🔧 Erledigt', ()=>setFn('rp', cur=>cur.map(x=>x.id===r.id?r:x)));
  };
  const del = r => { setFn('rp', cur=>cur.filter(x=>x.id!==r.id)); undo(TT("🔧 Eintrag gelöscht"), ()=>setFn('rp', cur=>[r, ...cur])); };
  const row = r => {
    const age = r.md ? daysSince(r.md) : null, late = r.status==='gemeldet' && age>=14;
    return (
      <div key={r.id} className="cell" data-testid="repair-row">
        <div className="cell-content">
          <span className="cell-title">{r.text}</span>
          <span className="cell-sub" style={late?{color:'var(--red)',fontWeight:700}:null}>
            {r.status==='offen' ? `noch nicht gemeldet · ${nameOfU(users, r.by)}`
              : r.status==='gemeldet' ? (late ? `seit ${age} Tagen gemeldet – nachhaken!` : `gemeldet am ${fmtDM(r.md)}`)
              : `erledigt am ${fmtDM(r.dd)}`}
            {/* Frist aus der Mängelanzeige (wg-v76): läuft sie ab, wird die Zeile rot */}
            {r.due && r.status!=='erledigt' && <b data-testid="rp-frist" style={{color:-daysSince(r.due)<0?'var(--red)':'var(--amber)'}}> {TT("· Frist bis")} {fmtDM(r.due)}{-daysSince(r.due)<0?' (abgelaufen)':''}</b>}
          </span>
        </div>
        {r.status!=='erledigt' && <button className="btn btn-sec" style={{width:'auto',padding:'8px 12px',fontSize:13,flexShrink:0}} onClick={()=>step(r)}>{r.status==='offen'?'Gemeldet ✓':'Erledigt ✓'}</button>}
        <button className="del-btn" aria-label={TT("„{0}\" löschen", r.text)} onClick={()=>del(r)}>×</button>
      </div>
    );
  };
  return (
    <div className="rise" data-testid="repair-card" style={{animationDelay:'85ms'}}>
      <div className="section-hdr">{TT("🔧 Kaputt & Vermieter")}</div>
      <div className="group">
        {openL.map(row)}
        {showDone && doneL.slice(0,10).map(row)}
        <form className="cell" onSubmit={e=>{e.preventDefault();add();}} style={{gap:8}}>
          <input className="field" maxLength={120} placeholder={TT("Was ist kaputt? z. B. Heizung Bad")} aria-label={TT("Kaputtes eintragen")} value={txt} onChange={e=>setTxt(e.target.value)} style={{flex:1}}/>
          <button type="submit" className="btn" style={{width:54,flexShrink:0,background:'var(--mint)'}}>+</button>
        </form>
      </div>
      {doneL.length>0 && <button className="hit" onClick={()=>setShowDone(s=>!s)} style={{...hdrBtn,color:'var(--label2)',margin:'8px 4px 0'}}>{showDone?'Erledigte ausblenden':`${doneL.length} erledigte anzeigen`}</button>}
    </div>
  );
}

/* ── Jahresrückblick (Übersicht): Ausgaben je Monat, teuerster Monat, Top-Kategorie, Putz-Punkte, häufigste Aufgabe ──
   api/_wg.js → yearReview() schickt am 1.1. dieselben Zahlen als Push (beide zusammen ändern). */
function YearReview({ all, pl, pt, users }) {
  const cy = new Date().getFullYear();
  const [y,setY] = useState(cy);
  const ys = String(y);
  const items = all.filter(i=>String(i.date||'').startsWith(ys));
  if (!items.length && !pl.some(l=>String(l?.date||'').startsWith(ys)) && y===cy && !all.some(i=>String(i.date||'').startsWith(String(cy-1)))) return null;
  const months = Array.from({length:12}, (_,m)=>({ m, t:items.filter(i=>+String(i.date).slice(5,7)===m+1).reduce((s,i)=>s+(i.price||0),0) }));
  const total = months.reduce((s,x)=>s+x.t,0), max = Math.max(...months.map(x=>x.t), 1);
  const top = [...months].sort((a,b)=>b.t-a.t)[0];
  const catSum = {};
  items.filter(i=>i.mod==='hs' && i.cat).forEach(i=>{ catSum[i.cat]=(catSum[i.cat]||0)+(i.price||0); });
  const topCat = Object.entries(catSum).sort((a,b)=>b[1]-a[1])[0];
  const catLabel = k => { const c = CATS.find(x=>x[0]===k); return c ? `${c[1]} ${c[2]}` : k; };
  const plY = pl.filter(l=>l && String(l.date||'').startsWith(ys));
  const byId = {}; pt.forEach(t=>{ if(t) byId[t.id]=t; });
  const pts = users.map(u=>({ ...u, n:plY.filter(l=>l.userId===u.id).reduce((s,l)=>s+(l.pts||chorePts(byId[l.taskId])),0) }));
  const cnt = {}; plY.forEach(l=>{ cnt[l.name]=(cnt[l.name]||0)+1; });
  const topTask = Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  const line = (l, v) => <div style={{display:'flex',justifyContent:'space-between',gap:10,fontSize:13.5}}><span style={{color:'var(--label2)'}}>{l}</span><span style={{fontWeight:700,textAlign:'right'}}>{v}</span></div>;
  return (
    <div className="rise" data-testid="year-review" style={{animationDelay:'112ms'}}>
      <div className="section-hdr" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span>{TT("📅 Jahresrückblick")}</span>
        <span style={{display:'flex',gap:6}}>
          {[cy-1, cy].map(v=><button key={v} className="hit" onClick={()=>setY(v)} style={{...hdrBtn,color:y===v?'var(--sky)':'var(--label2)',fontWeight:y===v?800:600}}>{v}</button>)}
        </span>
      </div>
      <div className="group" style={{padding:16,display:'flex',flexDirection:'column',gap:10}}>
        <div><span className="num" style={{fontSize:26,fontWeight:800}}>€{fmt(total)}</span> <span style={{color:'var(--label2)',fontSize:13}}>{TT("ausgegeben in")} {y}</span></div>
        <div style={{display:'flex',alignItems:'flex-end',gap:3,height:56}} aria-hidden="true">
          {months.map(x=><div key={x.m} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:3,height:'100%',justifyContent:'flex-end'}}>
            <div style={{width:'100%',height:`${x.t>0?Math.max(x.t/max*100,4):0}%`,background:x.m===top.m&&x.t>0?'var(--amber)':'var(--sky)',borderRadius:'3px 3px 0 0'}}/>
            <span style={{fontSize:8.5,color:'var(--label2)',fontWeight:700}}>{MONTHS[x.m].slice(0,1)}</span>
          </div>)}
        </div>
        {top.t>0 && line('Teuerster Monat', `${MONTHS[top.m]} · €${fmt(top.t)}`)}
        {topCat && line('Top-Kategorie Haushalt', `${catLabel(topCat[0])} · €${fmt(topCat[1])}`)}
        {line('Putz-Punkte', pts.map(p=>`${p.name} ${p.n}`).join(' · '))}
        {topTask && line('Häufigste Aufgabe', `${topTask[0]} · ${topTask[1]}×`)}
      </div>
    </div>
  );
}

/* ── App-Kürzel (manifest.json → shortcuts, ?a=…): ausgabe | liste | muell | waesche.
   AppInner liest den Parameter einmal, die Karten verbrauchen ihn (SHORTCUT → null). ── */
let SHORTCUT = null;
function ShortcutRunner({ goTab }) {
  const { D, status, fbCfg, wgCode, undo } = useD();
  const done = useChoreDone();
  useEffect(()=>{
    if (SHORTCUT !== 'muell') return;
    if (fbCfg && wgCode && status !== 'synced') return;       // erst nach dem Sync, sonst hakt es auf altem Stand ab
    SHORTCUT = null;
    const ts = (D.pt||[]).filter(Boolean);
    const t = ts.find(x=>x.pk==='rest') || ts.find(x=>/müll/i.test(x.name||'')) || ts.find(x=>x.em==='🗑️');
    goTab('putz');
    if (t) done(t, null); else undo(TT("Keine Müll-Aufgabe im Putzplan"), ()=>{});
  }, [status, D.pt]);
  return null;
}

function Haushalt({goGrow, goPutz}) {
  const { D, set, setFn, status, me, setMe, undo, askConfirm, flashIds, notifyOthers, mods } = useD();
  const heuteOn = mods.heute !== false;   // Kommunikation, Timer und „Du bist dran" leben dann auf „Heute"
  const users = D.users, items = D.hs || [], list = D.sl || [];
  const meName = users.find(u=>u.id===me)?.name || 'Jemand';
  const [seg,setSeg] = useState('aus');
  const [wiz,setWiz] = useState(false);
  const [editItem,setEditItem] = useState(null);
  const [convItem,setConvItem] = useState(null);
  const [newName,setNewName] = useState('');
  const [showSettled,setShowSettled] = useState(false);
  const [recWiz,setRecWiz] = useState(false);
  const recs = D.rec || [];
  const listInput = useRef(null);
  const heroRef = useRef(null);          // Ziel für den Ausgabe-Flug
  // App-Kürzel „Ausgabe eintragen" / „Einkaufsliste" (einmal verbrauchen)
  // „Ausgabe“ mit Text (Sprach-Kurzbefehl): die Schnell-Zeile übernimmt, kein Formular
  // beim Rendern merken: die Schnell-Zeile (Kind) verbraucht SHORTCUT_TEXT, bevor dieser Effekt läuft
  const [voiceStart] = useState(() => !!SHORTCUT_TEXT && !!me);
  useEffect(()=>{ if (SHORTCUT==='ausgabe') { SHORTCUT=null; if (!voiceStart) { if (SHORTCUT_TEXT) { const q = parseQuick(SHORTCUT_TEXT); setWizInit(q ? { name:q.name, price:String(q.price).replace('.',',') } : { name:SHORTCUT_TEXT.slice(0,60) }); SHORTCUT_TEXT = null; } setWiz(true); } } else if (SHORTCUT==='liste') { SHORTCUT=null; setSeg('liste'); } }, []);
  const [leaving,setLeaving] = useState(null); // sl-Item, das gerade animiert abgehakt wird
  const [stamp,setStamp] = useState(false);    // grüner Ausgleich-Stempel
  const [bringOpen,setBringOpen] = useState(false); // „Bitte mitbringen"-Schnellfenster
  const [bringName,setBringName] = useState('');

  const addRec = d => {
    const tp={ id:uid(), name:d.name||'Posten', price:parseNum(d.price)||0, paidBy:d.paidBy||users[0].id, owedBy:d.owedBy||null, cat:d.cat||null, since:todayISO().slice(0,7) };
    const YM=todayISO().slice(0,7);
    set('rec',[tp,...recs]);
    set('hs',[{ id:`r-${tp.id}-${YM}`, name:tp.name, price:tp.price, paidBy:tp.paidBy, owedBy:tp.owedBy||null, cat:tp.cat, date:YM+'-01', settled:false, recur:true }, ...items]);
  };
  const delRec = id => { const r=recs.find(x=>x.id===id); set('rec',recs.filter(x=>x.id!==id)); undo(TT("„{0}\" beendet", r?.name||'Posten'), ()=>setFn('rec', cur => cur.some(x=>x.id===id)?cur:[r,...cur])); };

  const add    = d => { const amt=parseNum(d.price)||0; set('hs',[{id:uid(),name:d.name||'Einkauf',price:amt,paidBy:d.paidBy||users[0].id,date:d.date||todayISO(),owedBy:d.owedBy||null,cat:d.cat||null,shop:(d.shop||'').trim()||null,settled:false},...items]); flyExpense(amt,'#5eead4',heroRef.current); notifyOthers(TT("💸 {0} hat {1} € eingetragen", meName, fmt(amt)), d.name||'Einkauf', TT("wg-exp"), TT("exp")); };
  // Vergessenes schnell melden: landet in der Einkaufsliste + Sofort-Push „bitte bring X mit" an den anderen
  const sendBring = () => {
    const n=bringName.trim(); if(!n){ return; }
    const it={id:uid(),name:n,addedBy:me||null,date:todayISO(),done:false};
    set('sl',[it,...list]);
    notifyOthers(TT("🛒 Bitte bring {0} mit", n), meName?`— ${meName}`:'', TT("wg-shop"), TT("shop"));
    undo(TT("🛒 „{0}\" gesendet", n), ()=>setFn('sl', cur=>cur.filter(i=>i.id!==it.id)));
    setBringName(''); setBringOpen(false);
  };
  const save   = d => set('hs',items.map(i=>i.id===editItem.id?{...i,name:d.name||i.name,price:parseNum(d.price)||i.price,paidBy:d.paidBy||i.paidBy,date:d.date||i.date,owedBy:d.owedBy||null,cat:d.cat||null}:i));
  const toggle = id => set('hs',items.map(i=>i.id===id?{...i,settled:!i.settled,settledAt:!i.settled?todayISO():null}:i));
  const del    = id => { const it=items.find(i=>i.id===id); set('hs',items.filter(i=>i.id!==id)); undo(TT("„{0}\" gelöscht", it?.name||'Ausgabe'), ()=>setFn('hs', cur => cur.some(i=>i.id===id)?cur:[it,...cur])); };

  /* Einkaufsliste */
  const addL      = () => { const n=newName.trim(); if(!n){ listInput.current?.focus(); return; } set('sl',[{id:uid(),name:n,addedBy:me||null,date:todayISO(),done:false},...list]); setNewName(''); listInput.current?.focus(); notifyOthers(TT("🛒 {0} braucht {1}", meName, n), '', TT("wg-shop"), TT("shop")); };
  /* Kaufzähler für lernende Vorschläge: beim Abhaken (offen→erledigt) hochzählen.
     id = Slug (RTDB-Pfad-sicher), name behält die zuletzt getippte Schreibweise. */
  const bumpSlh   = name => { const n=String(name||'').trim(); if(!n) return; const sid=n.toLowerCase().replace(/[.#$/\[\]]/g,'_').slice(0,80); setFn('slh', cur => { const l=cur||[]; const ex=l.find(x=>x.id===sid); return ex ? l.map(x=>x.id===sid?{...x,n:(x.n||0)+1,name:n}:x) : [{id:sid,name:n,n:1},...l]; }); };
  /* Abhaken läuft zeitversetzt (Animation) → aktuelle Liste über Ref lesen und nur den einen Eintrag ändern.
     Vorher: zwei schnelle Haken — der zweite Timer schrieb die alte Liste zurück, der erste Haken war weg. */
  const listRef   = useRef(list); listRef.current = list;
  const toggleL   = id => {
    const it=listRef.current.find(i=>i.id===id); if(!it) return;
    if(!it.done) bumpSlh(it.name);
    setBought(b=>{ const nb = it.done ? {...b, ids:b.ids.filter(x=>x!==id)} : { t:Date.now(), ids:[...b.ids.filter(x=>x!==id), id] }; ss('wg_bought', nb); return nb; });
    setFn('sl', cur=>(cur||[]).map(i=>i.id===id?{...i,done:!it.done}:i));
  };
  /* Abhaken mit Wisch-Strich + Kollaps, dann erst in den Wagen wandern. Uncheck (done→offen) sofort. */
  const checkL    = i => { if(leaving===i.id) return; /* Doppel-Tap während der Abhak-Animation würde sonst doppelt togglen */ if(i.done||REDUCE()){ toggleL(i.id); return; } setLeaving(i.id); setTimeout(()=>{ toggleL(i.id); setLeaving(l=>l===i.id?null:l); }, 600); };
  const delL      = id => { const it=list.find(i=>i.id===id); set('sl',list.filter(i=>i.id!==id)); undo(TT("„{0}\" gelöscht", it?.name||'Eintrag'), ()=>setFn('sl', cur => cur.some(i=>i.id===id)?cur:[it,...cur])); };
  const clearDone = async () => { if(await askConfirm({title:TT("Erledigte leeren"),body:TT("{0} erledigte Einträge aus dem Wagen entfernen?", doneL),okLabel:TT("Leeren"),danger:true})) set('sl',list.filter(i=>!i.done)); };
  const convert   = d => { add(d); delL(convItem.id); };
  // Offene nach Laden-Bereich (Rundgang), erledigte dahinter
  // Touren (wg-v76): „Nur meine Tour" blendet fremde Einträge aus; Sortierung sonst wie gehabt nach Laden-Bereich
  const [onlyMine,setOnlyMine] = useState(false);
  const [shopFor,setShopFor] = useState(null);   // Eintrag, dem gerade ein Laden zugeordnet wird
  const tourList = onlyMine && me ? list.filter(i=>i.done || i.tour===me) : list;
  const sortedList=[...tourList.filter(i=>!i.done).sort((a,b)=>shopAreaIdx(a.name)-shopAreaIdx(b.name)),...tourList.filter(i=>i.done)];
  const openL=list.filter(i=>!i.done).length, doneL=list.length-openL;

  const open=items.filter(i=>!i.settled);
  const settled=items.filter(i=>i.settled);
  const tot=open.reduce((s,i)=>s+i.price,0);
  /* Anteil einer Person an einem Posten: owedBy gesetzt → diese Person trägt alles, sonst gleichmäßig */
  const shareOf=(i,id)=>i.owedBy?(i.owedBy===id?i.price:0):i.price/users.length;
  const bals=users.map(u=>({ ...u, paid:open.filter(i=>i.paidBy===u.id).reduce((s,i)=>s+i.price,0), net:open.filter(i=>i.paidBy===u.id).reduce((s,i)=>s+i.price,0) - open.reduce((s,i)=>s+shareOf(i,u.id),0) }));
  const settlements=(D.stl||[]).filter(s=>s.mod==='hs');
  /* Growbox-Hinweis: offene Grow-Kosten hier sichtbar machen, damit sie nicht übersehen werden (Bilanz bleibt getrennt — anderer Split) */
  const gc = growCalc(D);
  const gNet = me ? gc.net(me) : 0;
  /* Persönliche Gesamt-Bilanz (Haushalt + Growbox) aus me-Sicht — Donut zeigt die Zusammensetzung,
     damit Grow-Kosten nicht übersehen werden und „mein Anteil" nicht mit der WG-Gesamtsumme verwechselt wird. */
  const growOn  = mods.grow!==false;
  const hsShare = me ? open.reduce((s,i)=>s+shareOf(i,me),0) : 0;   // mein offener Haushalt-Anteil (50/50 bzw. owedBy)
  const giShare = (me&&growOn) ? gc.tCost*gc.share(me) : 0;          // mein offener Grow-Anteil (nach Pflanzen-Split)
  const myCost  = hsShare + giShare;                                // was ich diesen Zyklus insgesamt trage
  const hsNet   = me ? (bals.find(b=>b.id===me)?.net||0) : 0;
  const totalNet= hsNet + (growOn?gNet:0);                          // netto: bereits Ausgelegtes verrechnet
  // Verrechnen (wg-v72): Ist in der Growbox etwas offen, zeigt der Haushalt-Ausgleich EINEN Betrag (Haushalt ± Growbox)
  // und „Alles abrechnen" schließt beide. Vorher: PayPal/Banner 66,25 € (nur Haushalt), obwohl torbe aus der Growbox
  // 8 € bekommt → zu zahlen waren 58,25 € (gemeldet 19.09.). Nur bei 2 Personen: dort ist „wer schuldet wem" eindeutig.
  const giOpen  = growOn && gc.tCost > 0.004 && users.length === 2;
  const payBals = giOpen ? bals.map(b=>({ ...b, net: b.net + gc.net(b.id) })) : bals;
  const hsPct   = myCost>0 ? Math.round(hsShare/myCost*100) : 0;
  const giPct   = 100 - hsPct;

  /* Abrechnen: Ausgleich (wer→wem, wie viel) festhalten + offene Posten als abgerechnet markieren */
  const settleAll = () => {
    const debtor=payBals.find(b=>b.net<-0.01), creditor=payBals.find(b=>b.net>0.01);
    const oldStl=D.stl||[];
    const plan = settlePlan(payBals);   // ab 3 Personen mehrere Überweisungen — Beleg hält den ganzen Plan fest
    const rec={ id:uid(), mod:'hs', date:todayISO(), total:tot, n:open.length, fromId:users.length>2?null:(debtor?.id||null), toId:users.length>2?null:(creditor?.id||null),
      amount:users.length>2 ? Math.round(plan.reduce((s,t)=>s+t.amount,0)*100)/100 : (debtor?Math.abs(debtor.net):0), ...(plan.length>1?{ plan:planText(plan, users) }:{}), ...(giOpen?{ withGi:true }:{}) };
    // verrechnete Growbox: eigener Eintrag im Grow-Verlauf (Betrag 0 — bezahlt wurde über den Haushalt)
    const recG = giOpen ? { id:uid(), mod:'gi', date:todayISO(), total:gc.tCost, n:gc.open.length, fromId:debtor?.id||null, toId:creditor?.id||null, amount:0, viaHs:rec.id } : null;
    set('stl',[rec, ...(recG?[recG]:[]), ...oldStl]);
    set('hs',items.map(i=>i.settled?i:{...i,settled:true,settledAt:todayISO(),settlementId:rec.id}));
    if (recG) setFn('gi', cur=>(cur||[]).map(i=>i && !i.settled ? {...i,settled:true,settledAt:todayISO(),settlementId:recG.id} : i));
    setFn('pr', cur=>(cur||[]).map(x=>(x.mod==='hs'||(recG&&x.mod==='gi'))&&x.status==='open'?{...x,status:'ok',at:Date.now()}:x));   // offene „bezahlt"-Meldung erledigt
    undo(TT("Alles abgerechnet"), ()=>{ setFn('stl', cur=>cur.filter(s=>s.id!==rec.id && s.id!==recG?.id)); setFn('hs', cur=>cur.map(i=>i.settlementId===rec.id?{...i,settled:false,settledAt:null,settlementId:null}:i));
      if (recG) setFn('gi', cur=>cur.map(i=>i.settlementId===recG.id?{...i,settled:false,settledAt:null,settlementId:null}:i)); });
    if(!REDUCE()){ setStamp(true); setTimeout(()=>setStamp(false),1100); }
    notifyOthers(TT("🤝 {0} hat abgerechnet", meName), `€${fmt(tot)}`, TT("wg-settle"), TT("settle"));
  };

  // Bezahler standardmäßig auf das eigene Gerät (me) vorbelegen → ein Tap weniger im Normalfall
  const addInit = useMemo(()=>({ paidBy: me||undefined }), [me]);
  /* Kassenzettel-Summe: wer abhakt, trägt danach nur noch den Betrag ein (Name + Kategorie vorbelegt) */
  const [bought,setBought] = useState(()=>{ const b=ls('wg_bought',null); return b && Date.now()-(b.t||0) < 3*3600e3 && Array.isArray(b.ids) ? b : { t:0, ids:[] }; });
  const boughtItems = list.filter(i=>i && i.done && bought.ids.includes(i.id));
  const [wizInit,setWizInit] = useState(null);
  const openReceipt = () => { setWizInit({ receipt:true, items:boughtItems.map(i=>i.name), name:('Einkauf: '+boughtItems.map(i=>i.name).join(', ')).slice(0,120), paidBy:me||undefined, cat:'food', date:todayISO() }); setWiz(true); };
  const addFromWiz = d => {
    // Gemischter Einkauf: „nur für mich" als eigener Posten, den der Zahler selbst trägt; der Rest 50/50
    const total = parseNum(d.price), mine = Math.min(parseNum(d.mine)||0, total);
    const mineNames = Array.isArray(d.mineNames) ? d.mineNames : [];
    if (wizInit?.receipt && mine > 0.004 && mineNames.length && me && !d.owedBy) {   // nur bei 50/50 — „X zahlt alles" bleibt, wie gewählt
      const payer = d.paidBy || me, rest = Math.round((total - mine)*100)/100;
      const sharedNames = (d.items||[]).filter(n=>!mineNames.includes(n));
      if (rest > 0.004) add({ ...d, owedBy:null, price:String(rest).replace('.',','), name:('Einkauf: '+(sharedNames.join(', ')||'gemeinsam')).slice(0,120) });
      setFn('hs', cur=>[hsItem({ name:(`Einkauf nur ${nameOfU(users, me)}: ${mineNames.join(', ')}`).slice(0,120), price:mine, paidBy:payer, owedBy:me, cat:d.cat||null, date:d.date||todayISO() }), ...(cur||[])]);
    } else add(d);
    if (wizInit?.receipt) { const ids=boughtItems.map(i=>i.id); setFn('sl', cur=>cur.filter(i=>!ids.includes(i.id))); const nb={t:0,ids:[]}; ss('wg_bought',nb); setBought(nb); }
  };
  // Schritt 3 (Bezahler + Aufteilung kombiniert) mit Review-Karte oben — geteilt von steps/recSteps
  const payerSplitStep = (payLabel) => ({label:'Prüfen & aufteilen',ok:d=>!!d.paidBy,render:({data:d,setData:sd})=>(
    <div style={{display:'flex',flexDirection:'column',gap:18}}>
      <WizSum name={d.name} price={d.price}/>
      <div>
        <div className="sheet-sublbl">{payLabel}</div>
        <div className="pick">
          {users.map(u=><button key={u.id} className={`pick-btn${d.paidBy===u.id?' on':''}`} style={{background:u.color}} onClick={()=>sd({...d,paidBy:u.id})}>{u.name}</button>)}
        </div>
      </div>
      <div>
        <div className="sheet-sublbl">{TT("Wie aufteilen?")}</div>
        <div className="pick" style={{flexDirection:'column'}}>
          <button className={`pick-btn${!d.owedBy?' on':''}`} style={{background:'var(--mint)'}} onClick={()=>sd({...d,owedBy:null})}>{TT("Gleich teilen · 50/50")}</button>
          {users.map(u=><button key={u.id} className={`pick-btn${d.owedBy===u.id?' on':''}`} style={{background:u.color}} onClick={()=>sd({...d,owedBy:u.id})}>{u.name} {TT("zahlt alles")}</button>)}
        </div>
      </div>
    </div>
  )});
  /* Name-Schritt inkl. optionaler Kategorie-Chips — von steps UND recSteps genutzt. */
  const catChips = ({data:d,setData:sd}) => (
    <div className="chip-scroll" style={{display:'flex',gap:6,marginTop:10,overflowX:'auto',paddingBottom:2}}>
      {CATS.map(([k,em,label])=>(
        <button key={k} type="button" onClick={()=>sd({...d,cat:d.cat===k?null:k})}
          style={{fontSize:12,borderRadius:12,padding:'6px 10px',border:'none',fontWeight:d.cat===k?800:600,flexShrink:0,whiteSpace:'nowrap',
            background:d.cat===k?CAT_COLORS[k]:'var(--bg3)',color:d.cat===k?'#0a120c':'var(--label2)'}}>
          {em} {label}
        </button>
      ))}
    </div>
  );
  const steps=[
    {label:'Was wurde gekauft?',ok:d=>d.name?.trim(),render:({data:d,setData:sd})=>(
      <>
        <input autoFocus maxLength={200} className="field" placeholder={TT("Putzmittel, Toilettenpapier …")} value={d.name||''} onChange={e=>sd({...d,name:e.target.value})}/>
        {catChips({data:d,setData:sd})}
      </>
    )},
    {label:'Wie viel?',ok:d=>parseNum(d.price)>0,render:({data:d,setData:sd})=>(
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        <div className="f-euro"><input autoFocus type="text" inputMode="decimal" className="field" placeholder="0,00" value={d.price||''} onChange={e=>sd({...d,price:e.target.value})}/></div>
        <DateField value={d.date} onChange={v=>sd({...d,date:v})}/>
        <PriceHint name={d.name} price={d.price} onPick={v=>sd({...d,price:v})}/>
        {d.receipt && me && !d.owedBy && <ReceiptMine d={d} sd={sd}/>}
        {/* Laden merken (wg-v76): daraus entsteht der Preisvergleich je Laden */}
        <div className="sheet-sublbl">{TT("Wo gekauft? (optional)")}</div>
        <ShopPick value={d.shop||''} onPick={v=>sd({...d, shop:v})} allowClear/>
      </div>
    )},
    payerSplitStep('Wer hat bezahlt?'),
  ];
  /* Wiederkehrend: wie steps, aber ohne Datum (läuft monatlich) */
  const recSteps=[
    {label:'Was wiederholt sich?',ok:d=>d.name?.trim(),render:({data:d,setData:sd})=>(
      <>
        <input autoFocus maxLength={200} className="field" placeholder={TT("Internet, Putzkraft, Spotify-Family …")} value={d.name||''} onChange={e=>sd({...d,name:e.target.value})}/>
        {catChips({data:d,setData:sd})}
      </>
    )},
    {label:'Betrag pro Monat',ok:d=>parseNum(d.price)>0,render:({data:d,setData:sd})=><div className="f-euro"><input autoFocus type="text" inputMode="decimal" className="field" placeholder="0,00" value={d.price||''} onChange={e=>sd({...d,price:e.target.value})}/></div>},
    payerSplitStep('Wer zahlt es?'),
  ];

  return (
    <div className="screen">
      <NBar title={TT("Haushalt")} color="var(--mint)" status={status}/>
      <div className="scroll">
        <div className="content">
          <WhoAmI/>
          {!heuteOn && <><ChoreQuick goPutz={goPutz}/><AwayCard compact/><WashCard/></>}
          <div className="seg rise">
            {[['aus','💶 Ausgaben'],['liste',`🛒 Einkaufsliste${openL>0?` (${openL})`:''}`]].map(([v,l])=>(
              <button key={v} className={`seg-btn${seg===v?' on':''}`} onClick={()=>setSeg(v)}>{l}</button>
            ))}
          </div>
          {seg==='aus'?(
          <>
          {me ? (
          <div className="hero rise" ref={heroRef} style={{'--glow':'rgba(94,234,212,.16)',animationDelay:'40ms'}}>
            {stamp&&<div className="settle-stamp">✓</div>}
            <div className="hero-lbl" style={{marginBottom:16}}>{TT("Deine Bilanz")}</div>
            <div style={{display:'flex',alignItems:'center',gap:20}}>
              {/* Donut-Mitte zeigt jetzt den Netto-Saldo (was ich schulde / mein Guthaben) statt der Gesamtkosten —
                  die absolute Summe „dein Anteil" lebt nur noch im Übersicht-Tab. Ring = Zusammensetzung nach Prozent. */}
              {myCost>0.01 ? (
                <Donut segs={[{frac:hsShare/myCost,color:'var(--mint)'},...(growOn&&giShare>0?[{frac:giShare/myCost,color:'var(--lime)'}]:[])]} size={128} sw={14}>
                  {totalNet<-0.01 ? (
                    <>
                      <span className="num" style={{fontSize:23,fontWeight:800,color:'var(--amber)'}}>€<CountUp value={Math.abs(totalNet)}/></span>
                      <span style={{fontSize:9,color:'var(--label3)',letterSpacing:'.14em',textTransform:'uppercase',fontFamily:'var(--mono)'}}>{TT("ich schulde")}</span>
                    </>
                  ) : (
                    <>
                      <span style={{fontSize:26,color:'var(--green)'}}>✓</span>
                      <span style={{fontSize:9,color:'var(--label3)',letterSpacing:'.14em',textTransform:'uppercase',fontFamily:'var(--mono)'}}>{TT("alles gut")}</span>
                    </>
                  )}
                </Donut>
              ) : (
                <Donut segs={[{frac:1,color:'rgba(94,234,212,.18)'}]} size={128} sw={14}>
                  <span style={{fontSize:28}}>🎉</span>
                </Donut>
              )}
              <div style={{flex:1,display:'flex',flexDirection:'column',gap:14}}>
                <div style={{display:'flex',alignItems:'center',gap:9}}>
                  <div style={{width:9,height:9,borderRadius:'50%',background:'var(--mint)',boxShadow:'0 0 8px var(--mint)',flexShrink:0}}/>
                  <span style={{flex:1,fontSize:13.5,fontWeight:700,color:'var(--label2)'}}>{TT("Haushalt")}</span>
                  <span className="num" style={{fontSize:17,fontWeight:800}}>{myCost>0?hsPct:0}%</span>
                  <span className="num" style={{fontSize:11.5,color:'var(--label2)',width:52,textAlign:'right'}}>€{fmt(hsShare)}</span>
                </div>
                {growOn&&(
                  <button className="hit" onClick={goGrow} style={{display:'flex',alignItems:'center',gap:9,background:'none',border:'none',padding:0,cursor:'pointer',fontFamily:'inherit'}}>
                    <div style={{width:9,height:9,borderRadius:'50%',background:'var(--lime)',boxShadow:'0 0 8px var(--lime)',flexShrink:0}}/>
                    <span style={{flex:1,fontSize:13.5,fontWeight:700,color:'var(--label2)',textAlign:'left'}}>{TT("Growbox")}</span>
                    <span className="num" style={{fontSize:17,fontWeight:800,color:'var(--label)'}}>{myCost>0?giPct:0}%</span>
                    <span className="num" style={{fontSize:11.5,color:'var(--label2)',width:52,textAlign:'right'}}>€{fmt(giShare)}</span>
                    <span style={{color:'var(--label3)',fontSize:16,lineHeight:1,marginLeft:1}}>›</span>
                  </button>
                )}
              </div>
            </div>
            <div style={{marginTop:16,paddingTop:13,borderTop:'1px solid rgba(255,255,255,.08)',textAlign:'center',fontSize:11,color:'var(--label3)',fontWeight:500}}>
              {growOn?'Haushalt + Growbox':'Nur Haushalt'} {TT("· abgerechnet wird pro Bereich · Gesamtausgaben in der Übersicht")}
            </div>
          </div>
          ) : (
          <>
          <div className="hero rise" ref={heroRef} style={{'--glow':'rgba(94,234,212,.16)',animationDelay:'40ms'}}>
            {stamp&&<div className="settle-stamp">✓</div>}
            <div className="hero-lbl">{TT("Offene Ausgaben")}</div>
            <div className="hero-big" style={{color:'var(--mint)',margin:'6px 0 16px'}}>€<CountUp value={tot}/></div>
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              <div style={{fontSize:11,color:'var(--label3)',fontWeight:600,letterSpacing:'.03em',textTransform:'uppercase'}}>{TT("Ausgelegt")}</div>
              {bals.map(b=>(
                <div key={b.id} className="bar-row">
                  <span className="bar-name" style={{color:b.color}}>{b.name}</span>
                  <div className="bar-track"><div className="bar-fill" style={{width:`${tot>0?Math.min(b.paid/tot*100,100):0}%`,background:b.color,color:b.color}}/></div>
                  <span className="bar-val num">€{fmt(b.paid)}</span>
                </div>
              ))}
              <div style={{fontSize:12,color:'var(--label3)',marginTop:4,fontWeight:500,textAlign:'center',lineHeight:1.5}}>{TT("Wähle unter")} <b>{TT("Mehr → Personen")}</b> {TT("dein Gerät für deine persönliche Bilanz.")}</div>
            </div>
            {tot>0&&(open.every(i=>!i.owedBy)
              ?<div style={{fontSize:12,color:'var(--label3)',marginTop:12,fontWeight:500}}>{TT("50/50-Split · je")} <span className="num" style={{color:'var(--label2)'}}>€{fmt(tot/users.length)}</span></div>
              :<div style={{fontSize:12,color:'var(--label3)',marginTop:12,fontWeight:500}}>{TT("Gemischter Split · einzelne Posten trägt einer allein")}</div>)}

   GROW
══════════════════════════ */
/* Grow-Bilanz aus D: offene gi-Posten, Split nach Pflanzen-Anteilen (gp) — genutzt vom Grow-Tab und der Growbox-Hinweiskarte im Haushalt */
function growCalc(D){
  const users=D.users||[], plants=D.gp||{}, items=D.gi||[];
  const total=Object.values(plants).reduce((s,v)=>s+(parseInt(v)||0),0);
  const share=id=>total>0?(parseInt(plants[id]||0)/total):(users.length?1/users.length:0);
  const open=items.filter(i=>!i.settled);
  const tCost=open.reduce((s,i)=>s+i.price,0);
  const net=id=>open.filter(i=>i.paidBy===id).reduce((s,i)=>s+i.price,0)-tCost*share(id);
  return { total, share, open, tCost, net };
}
/* Offener Grow-Zyklus = der ohne `end`; bei mehreren (Sync-Kollision) gewinnt der zuletzt gestartete. */
const openCycle = D => (D.gz||[]).filter(c => c && !c.end)
  .slice().sort((a,b) => String(b.start||'').localeCompare(String(a.start||'')))[0] || null;

/* Abgeleitete Zyklus-Werte. Tag 1 = Starttag (nicht 0 — „Tag 0" liest sich niemand als heute).
   waterIn: Tage bis zum nächsten Gießen, ≤0 = fällig/überfällig; null in Phasen ohne Gießen.
   over: Tage über der typischen Phasendauer (>0 = Phase ist rechnerisch durch). */
function cycleInfo(cy) {
  if (!cy) return null;
  const ph = PHASE_OF(cy.phase);
  const iv = Math.max(1, parseInt(cy.wiv) || WATER_IV_DEF);
  const sinceW = daysSince(cy.lastW || cy.start);
  return {
    ph, iv, sinceW,
    dayTot: daysSince(cy.start) + 1,
    dayPh:  daysSince(cy.pAt || cy.start) + 1,
    watered: !!cy.lastW,
    waterIn: ph[4] ? iv - sinceW : null,
    over:    daysSince(cy.pAt || cy.start) + 1 - ph[3],
  };
}

function Grow() {
  const { D, set, setFn, status, undo, me, notifyOthers } = useD();
  const users=D.users, plants=D.gp||{}, items=D.gi||[];
  const meName = users.find(u=>u.id===me)?.name || 'Jemand';
  const [wiz,setWiz] = useState(false);
  const [editItem,setEditItem] = useState(null);
  const [showSettled,setShowSettled] = useState(false);
  const heroRef = useRef(null);
  const [stamp,setStamp] = useState(false);

  const { total, share, open, tCost, net } = growCalc(D);
  // Ganze Prozente (konsistent mit dem Haushalt-Hero); zweiter Wert als 100-Komplement → Summe exakt 100 %
  const p0 = users[0] ? Math.round(share(users[0].id)*100) : 0;
  const pctStr = id => (id===users[0]?.id ? p0 : 100-p0) + '%';
  const setP   = (uid2,v) => set('gp',{...plants,[uid2]:Math.max(0,parseInt(v)||0)});

  const add    = d => { const amt=parseNum(d.price)||0; set('gi',[{id:uid(),name:d.name||'Grow',price:amt,paidBy:d.paidBy||users[0].id,date:d.date||todayISO(),cat:d.cat||null,settled:false},...items]); flyExpense(amt,'#a3e635',heroRef.current); notifyOthers(TT("🌱 {0} hat {1} € eingetragen", meName, fmt(amt)), d.name||'Grow', TT("wg-exp"), TT("exp")); };
  const save   = d => set('gi',items.map(i=>i.id===editItem.id?{...i,name:d.name||i.name,price:parseNum(d.price)||i.price,paidBy:d.paidBy||i.paidBy,date:d.date||i.date,cat:d.cat||null}:i));
  const toggle = id => set('gi',items.map(i=>i.id===id?{...i,settled:!i.settled,settledAt:!i.settled?todayISO():null}:i));
  const del    = id => { const it=items.find(i=>i.id===id); set('gi',items.filter(i=>i.id!==id)); undo(TT("„{0}\" gelöscht", it?.name||'Ausgabe'), ()=>setFn('gi', cur => cur.some(i=>i.id===id)?cur:[it,...cur])); };

  const settled=items.filter(i=>i.settled);
  const bals=users.map(u=>({ ...u, paid:open.filter(i=>i.paidBy===u.id).reduce((s,i)=>s+i.price,0), net:net(u.id) }));

  /* Zyklus-Tracker: eine offene Runde mit Phase + Gieß-Rhythmus. Die Gieß-Erinnerung
     schickt der Cron (api/cron.js) aus denselben Feldern — Format nicht einseitig ändern. */
  const gzList=D.gz||[];
  const cy=openCycle(D), ci=cycleInfo(cy);
  const [cycWiz,setCycWiz]=useState(false);
  const patchCy=patch=>set('gz',gzList.map(c=>c.id===cy.id?{...c,...patch}:c));
  const startCycle=d=>{
    const rec={id:uid(),start:d.start||todayISO(),phase:d.phase||'keim',pAt:d.start||todayISO(),wiv:parseInt(d.wiv)||WATER_IV_DEF,lastW:null,wn:0};
    set('gz',[rec,...gzList]);
    notifyOthers(TT("🌱 {0} hat einen neuen Zyklus gestartet", meName), TT("{0} · ab {1}", PHASE_OF(rec.phase)[2], fmtDate(rec.start)), TT("wg-grow"), TT("exp"));
  };
  const setPhase=k=>{
    if(!cy||cy.phase===k) return;
    const prev={phase:cy.phase,pAt:cy.pAt};
    patchCy({phase:k,pAt:todayISO()});
    undo(TT("Phase: {0}", PHASE_OF(k)[2]), ()=>setFn('gz', cur=>cur.map(c=>c.id===cy.id?{...c,...prev}:c)));
    notifyOthers(TT("{0} Neue Phase: {1}", PHASE_OF(k)[1], PHASE_OF(k)[2]), TT("Tag {0} des Zyklus", ci.dayTot), TT("wg-grow"), TT("exp"));
  };
  const water=()=>{
    if(!cy) return;
    const prev={lastW:cy.lastW||null,lastWBy:cy.lastWBy||null,wn:cy.wn||0};
    patchCy({lastW:todayISO(),lastWBy:me,wn:(parseInt(cy.wn)||0)+1});
    undo(TT("Gießen eingetragen"), ()=>setFn('gz', cur=>cur.map(c=>c.id===cy.id?{...c,...prev}:c)));
  };
  const endCycle=()=>{
    if(!cy) return;
    patchCy({end:todayISO()});
    undo(TT("Zyklus beendet"), ()=>setFn('gz', cur=>cur.map(c=>c.id===cy.id?{...c,end:null}:c)));
  };
  const cycSteps=[
    {label:'Wann gestartet?',ok:()=>true,render:({data:d,setData:sd})=><DateField value={d.start} onChange={v=>sd({...d,start:v})}/>},
    {label:'In welcher Phase?',ok:d=>!!d.phase,render:({data:d,setData:sd})=>(
      <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
        {GROW_PHASES.map(([k,em,label,len])=>(
          <button key={k} type="button" onClick={()=>sd({...d,phase:k})}
            style={{flex:'1 1 44%',textAlign:'left',fontSize:13,borderRadius:14,padding:'11px 12px',border:'none',fontWeight:d.phase===k?800:600,
              background:d.phase===k?'var(--lime)':'var(--bg3)',color:d.phase===k?'var(--ink)':'var(--label2)'}}>
            {em} {label}<br/><span style={{fontSize:11,fontWeight:600,opacity:.7}}>{TT("meist ~")}{len} {TT("Tage")}</span>
          </button>
        ))}
      </div>
    )},
    {label:'Gießen alle wie viel Tage?',ok:d=>(parseInt(d.wiv)||0)>0,render:({data:d,setData:sd})=>(
      <div style={{display:'flex',flexDirection:'column',gap:10,alignItems:'center'}}>
        <div className="stepper" style={{alignSelf:'stretch',justifyContent:'space-between'}}>
          <button type="button" onClick={()=>sd({...d,wiv:Math.max(1,(parseInt(d.wiv)||WATER_IV_DEF)-1)})}>−</button>
          <span className="st-val" style={{color:'var(--lime)'}}>{parseInt(d.wiv)||WATER_IV_DEF}</span>
          <button type="button" onClick={()=>sd({...d,wiv:Math.min(14,(parseInt(d.wiv)||WATER_IV_DEF)+1)})}>+</button>
        </div>
        <span style={{fontSize:12.5,color:'var(--label3)'}}>{TT("Erinnerung kommt, sobald so viele Tage seit dem letzten Gießen um sind.")}</span>
      </div>
    )},
  ];

  /* Ernte-Log: Zyklus-Kosten = alle gi-Ausgaben (inkl. abgerechnet + Archiv) zwischen Vor-Ernte und Ernte */
  const ghList=D.gh||[];
  const [harvWiz,setHarvWiz]=useState(false);
  const allGiCost=[...items, ...(D.arc||[]).filter(a=>a.src==='gi')];
  const harvAsc=[...ghList].sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  const cycles=harvAsc.map((h,ix)=>{
    const from=ix>0?String(harvAsc[ix-1].date):'';
    const cost=allGiCost.filter(i=>String(i.date||'')>from&&String(i.date||'')<=String(h.date)).reduce((s,i)=>s+(Number(i.price)||0),0);
    const g=Number(h.grams)||0;
    return {...h,cost,gpg:g>0?cost/g:null};
  });
  const harv=[...cycles].reverse();
  const totG=cycles.reduce((s,h)=>s+(Number(h.grams)||0),0);
  const avgGpg=totG>0?cycles.reduce((s,h)=>s+h.cost,0)/totG:null;
  const addHarv=d=>{
    const g=parseNum(d.grams)||0; const note=(d.note||'').trim(); const date=d.date||todayISO();
    const rec={id:uid(),date,grams:g,...(note?{note}:{})};
    set('gh',[rec,...ghList]);
    // Geerntet heißt: die Runde ist durch. Sonst mahnt der Cron weiter zum Gießen.
    if(cy) set('gz',gzList.map(c=>c.id===cy.id?{...c,end:date,ghId:rec.id}:c));
    notifyOthers(TT("🌾 {0} hat eine Ernte eingetragen", meName), `${fmt(g)} g`, TT("wg-exp"), TT("exp"));
  };
  /* Die Ernte hat den Zyklus beendet — wird sie gelöscht (Fehleingabe), muss er wieder
     aufgehen. Sonst wäre die laufende Runde mit Phase und Gieß-Verlauf unerreichbar weg. */
  const delHarv=id=>{
    const it=ghList.find(x=>x.id===id);
    const linked=gzList.find(c=>c.ghId===id);
    set('gh',ghList.filter(x=>x.id!==id));
    if(linked) set('gz',gzList.map(c=>c.id===linked.id?{...c,end:null,ghId:null}:c));
    undo(TT("Ernte gelöscht"), ()=>{
      setFn('gh', cur => cur.some(x=>x.id===id)?cur:[it,...cur]);
      if(linked) setFn('gz', cur => cur.map(c=>c.id===linked.id?{...c,end:linked.end,ghId:linked.ghId}:c));
    });
  };
  const harvSteps=[
    {label:'Wann geerntet?',ok:()=>true,render:({data:d,setData:sd})=><DateField value={d.date} onChange={v=>sd({...d,date:v})}/>},
    {label:'Wie viel? (Gramm)',ok:d=>parseNum(d.grams)>0,render:({data:d,setData:sd})=><input autoFocus type="text" inputMode="decimal" className="field" placeholder="z. B. 42,5" value={d.grams||''} onChange={e=>sd({...d,grams:e.target.value})}/>},
    {label:'Notiz (optional)',ok:()=>true,render:({data:d,setData:sd})=><input autoFocus maxLength={200} className="field" placeholder={TT("Sorte, Qualität …")} value={d.note||''} onChange={e=>sd({...d,note:e.target.value})}/>},
  ];
  const settlements=(D.stl||[]).filter(s=>s.mod==='gi');

  const settleAll = () => {
    const debtor=bals.find(b=>b.net<-0.01), creditor=bals.find(b=>b.net>0.01);
    const oldStl=D.stl||[];
    const rec={ id:uid(), mod:'gi', date:todayISO(), total:tCost, n:open.length, fromId:debtor?.id||null, toId:creditor?.id||null, amount:debtor?Math.abs(debtor.net):0 };
    set('stl',[rec,...oldStl]);
    set('gi',items.map(i=>i.settled?i:{...i,settled:true,settledAt:todayISO(),settlementId:rec.id}));
    setFn('pr', cur=>(cur||[]).map(x=>x.mod==='gi'&&x.status==='open'?{...x,status:'ok',at:Date.now()}:x));
    undo(TT("Alles abgerechnet"), ()=>{ setFn('stl', cur=>cur.filter(s=>s.id!==rec.id)); setFn('gi', cur=>cur.map(i=>i.settlementId===rec.id?{...i,settled:false,settledAt:null,settlementId:null}:i)); });
    if(!REDUCE()){ setStamp(true); setTimeout(()=>setStamp(false),1100); }
    notifyOthers(TT("🤝 {0} hat abgerechnet", meName), `€${fmt(tCost)}`, TT("wg-settle"), TT("settle"));
  };

  /* Pflanzen-Slots: jede Pflanze als Icon in Besitzer-Farbe */
  const slots=[];
  users.forEach(u=>{ for(let i=0;i<(parseInt(plants[u.id])||0);i++) slots.push(u.color); });

  const addInit = useMemo(()=>({ paidBy: me||undefined }), [me]);
  const steps=[
    {label:'Was wurde gekauft?',ok:d=>d.name?.trim(),render:({data:d,setData:sd})=>(
      <>
        <input autoFocus maxLength={200} className="field" placeholder={TT("Dünger, Erde, Lampe …")} value={d.name||''} onChange={e=>sd({...d,name:e.target.value})}/>
        <div style={{display:'flex',flexWrap:'wrap',gap:6,marginTop:10}}>
          {GROW_CATS.map(([k,em,label])=>(
            <button key={k} type="button" onClick={()=>sd({...d,cat:d.cat===k?null:k})}
              style={{fontSize:12,borderRadius:12,padding:'6px 10px',border:'none',fontWeight:d.cat===k?800:600,
                background:d.cat===k?GROW_CAT_COLORS[k]:'var(--bg3)',color:d.cat===k?'#0a120c':'var(--label2)'}}>
              {em} {label}
            </button>
          ))}
        </div>
      </>
    )},
    {label:'Wie viel?',ok:d=>parseNum(d.price)>0,render:({data:d,setData:sd})=>(
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        <div className="f-euro"><input autoFocus type="text" inputMode="decimal" className="field" placeholder="0,00" value={d.price||''} onChange={e=>sd({...d,price:e.target.value})}/></div>
        <DateField value={d.date} onChange={v=>sd({...d,date:v})}/>
      </div>
    )},
    {label:'Prüfen & bezahlt von',ok:d=>!!d.paidBy,render:({data:d,setData:sd})=>(
      <div style={{display:'flex',flexDirection:'column',gap:18}}>
        <WizSum name={d.name} price={d.price}/>
        <div>
          <div className="sheet-sublbl">{TT("Wer hat bezahlt?")}</div>
          <div className="pick">
            {users.map(u=>(
              <button key={u.id} className={`pick-btn${d.paidBy===u.id?' on':''}`} style={{background:u.color}} onClick={()=>sd({...d,paidBy:u.id})}>
                {u.name}<br/><span style={{fontSize:11,fontWeight:600,opacity:.75}}>{TT("zahlt")} {pctStr(u.id)}</span>
              </button>
            ))}
          </div>
        </div>
      </div>
    )},
  ];

  return (
    <div className="screen">
      <NBar title={TT("Growbox")} color="var(--lime)" status={status}/>
      <div className="scroll"><div className="content">

        {/* Split-Hero: Donut + Pflanzen */}
        <div className="hero rise" ref={heroRef} style={{'--glow':'rgba(163,230,53,.17)'}}>
          {stamp&&<div className="settle-stamp">✓</div>}
          <div className="hero-lbl" style={{marginBottom:16}}>{TT("Kosten-Split nach Pflanzen")}</div>
          <div style={{display:'flex',alignItems:'center',gap:20}}>
            <Donut segs={users.map(u=>({frac:share(u.id),color:u.color}))}>
              <span className="num" style={{fontSize:30,fontWeight:700,color:'var(--lime)'}}>{total}</span>
              <span style={{fontSize:10,color:'var(--label3)',letterSpacing:'.14em',textTransform:'uppercase',fontFamily:'var(--mono)'}}>{TT("Pflanzen")}</span>
            </Donut>
            <div style={{flex:1,display:'flex',flexDirection:'column',gap:14}}>
              {users.map(u=>(
                <div key={u.id} style={{display:'flex',flexDirection:'column',gap:5}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
                    <span style={{fontSize:14,fontWeight:800,color:u.color}}>{u.name}</span>
                    <span className="num" style={{fontSize:13,fontWeight:700,color:'var(--label2)'}}>{pctStr(u.id)}</span>
                  </div>
                  <div className="stepper" style={{alignSelf:'stretch',justifyContent:'space-between'}}>
                    <button onClick={()=>setP(u.id,(parseInt(plants[u.id])||0)-1)}>−</button>
                    <span className="st-val" style={{color:u.color}}>{parseInt(plants[u.id])||0}</span>
                    <button onClick={()=>setP(u.id,(parseInt(plants[u.id])||0)+1)}>+</button>
                  </div>
                </div>
              ))}
            </div>
          </div>
          {slots.length>0&&(
            <div className="plant-row" style={{marginTop:20}}>
              {slots.map((c,i)=>(
                <div key={i} className="plant-slot" style={{animationDelay:`${i*45}ms`}}>
                  <Ic d={ICONS.leaf} color={c} size={24} sw={1.9}/>
                </div>
              ))}
            </div>
          )}
        </div>

        {/* Zyklus + Gießen: die tägliche Interaktion, deshalb direkt unter dem Hero */}
        {cy ? (
          <div className="rise" style={{animationDelay:'40ms'}}>
            <div className="section-hdr" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <span>{ci.ph[1]} {TT("Zyklus · Tag")} {ci.dayTot}</span>
              {/* Padding + gegenläufiger Margin: 44px Tap-Ziel, optisch bleibt es eine Kopfzeilen-Aktion */}
              <button style={{background:'none',border:'none',padding:'13px 6px',margin:'-13px -6px -7px',minHeight:44,font:'inherit',fontSize:11,letterSpacing:'.2em',color:'var(--lime)',fontFamily:'var(--mono)',textTransform:'uppercase'}}
                onClick={endCycle}>{TT("Beenden")}</button>
            </div>
            <div className="group">
              <div className="cell" style={{flexDirection:'column',alignItems:'stretch',gap:12}}>
                <div style={{display:'flex',gap:6}}>
                  {GROW_PHASES.map(([k,em,label])=>(
                    <button key={k} className={`phase-chip${cy.phase===k?' on':''}`} aria-pressed={cy.phase===k}
                      title={TT("Phase auf {0} setzen", label)} onClick={()=>setPhase(k)}>
                      <span className="em">{em}</span>{label}
                    </button>
                  ))}
                </div>
                <div>
                  <div className="bar-track">
                    <div className="bar-fill" style={{width:`${Math.min(ci.dayPh/ci.ph[3]*100,100)}%`,
                      background:ci.over>0?'var(--amber)':'var(--lime)',color:ci.over>0?'var(--amber)':'var(--lime)'}}/>
                  </div>
                  <div style={{fontSize:12,color:'var(--label3)',fontWeight:500,marginTop:7}}>
                    {TT("Tag")} <span className="num">{ci.dayPh}</span> {TT("in der")} {ci.ph[2]} {TT("· typisch ~")}{ci.ph[3]} {TT("Tage")}
                    {ci.over>0&&<span style={{color:'var(--amber)',fontWeight:700}}> · {ci.over} {TT("drüber")}{PHASE_NEXT(cy.phase)?` — ${PHASE_NEXT(cy.phase)[2]}?`:' — ernten?'}</span>}
                  </div>
                </div>
              </div>
              {ci.waterIn!==null ? (
                <div className="cell">
                  <div className="cell-icon" style={{background:'rgba(56,189,248,.12)',fontSize:15}}>💧</div>
                  <div className="cell-content">
                    {/* Ohne eingetragenes Gießen wäre „116 Tage überfällig" zwar korrekt gerechnet,
                        aber unsinnig zu lesen — dann lieber sagen, dass schlicht nichts erfasst ist. */}
                    <span className="cell-title" style={{color:ci.waterIn<0?'var(--red)':ci.waterIn===0?'var(--amber)':'var(--label)'}}>
                      {!ci.watered&&ci.waterIn<=0?'Noch nichts eingetragen'
                        :ci.waterIn<0?`${-ci.waterIn} Tag${-ci.waterIn===1?'':'e'} überfällig`
                        :ci.waterIn===0?'Heute gießen'
                        :`Gießen in ${ci.waterIn} Tag${ci.waterIn===1?'':'en'}`}
                    </span>
                    <span className="cell-sub">
                      {!ci.watered?`Noch nicht gegossen seit dem Start · alle ${ci.iv} Tage`
                        :`${ci.sinceW===0?'Zuletzt heute':ci.sinceW===1?'Zuletzt gestern':`Zuletzt vor ${ci.sinceW} Tagen`}${cy.lastWBy?` · ${users.find(u=>u.id===cy.lastWBy)?.name||'?'}`:''} · alle ${ci.iv} Tage${cy.wn>0?` · ${cy.wn}× im Zyklus`:''}`}
                    </span>
                  </div>
                  <button className="mini-btn" onClick={water}>{TT("Gegossen")}</button>
                </div>
              ) : (
                <div className="cell">
                  <div className="cell-icon" style={{background:'rgba(163,230,53,.12)',fontSize:15}}>🍂</div>
                  <div className="cell-content">
                    <span className="cell-title">{TT("Trocknung läuft")}</span>
                    <span className="cell-sub">{TT("In dieser Phase wird nicht gegossen — keine Erinnerungen")}</span>
                  </div>
                </div>
              )}
            </div>
          </div>
        ) : (
          <button className="btn btn-sec rise" style={{animationDelay:'40ms'}} onClick={()=>setCycWiz(true)}>{TT("🌱 Zyklus starten")}</button>
        )}

        {/* Offene Bilanz */}
        {open.length>0&&(
          <div className="rise" style={{animationDelay:'60ms'}}>
            <div className="section-hdr">{TT("Offene Bilanz · €")}{fmt(tCost)} {TT("gesamt")}</div>
            <div className="group">
              {bals.map(b=>(
                <div key={b.id} className="cell">
                  <div style={{width:10,height:10,borderRadius:'50%',background:b.color,boxShadow:`0 0 8px ${b.color}`,flexShrink:0}}/>
                  <div className="cell-content">
                    <span className="cell-title">{b.name}</span>
                    <span className="cell-sub">{TT("bezahlt €")}{fmt(b.paid)} {TT("· Anteil €")}{fmt(tCost*share(b.id))}</span>
                  </div>
                  <span className="num" style={{fontWeight:700,fontSize:15,color:b.net>.01?'var(--green)':b.net<-.01?'var(--red)':'var(--label3)'}}>{b.net>.01?'+':''}<CountUp value={b.net}/></span>
                </div>
              ))}
            </div>
            <div style={{height:8}}/>
            <Bal bals={bals} noShare mod="gi" onSettle={settleAll}/>
          </div>
        )}

        <button className="btn rise" style={{background:'var(--lime)',animationDelay:'100ms'}} onClick={()=>setWiz(true)}>{TT("+ Grow-Ausgabe")}</button>
        {open.length>0 && (() => {
          // Wie im Haushalt: abrechnen darf, wer Geld bekommt — der Schuldner meldet „Ich habe bezahlt"
          const deb = bals.find(b=>b.net<-0.01), cred = bals.find(b=>b.net>0.01);
          if (me && deb && deb.id===me) return <div className="rise" data-testid="settle-hint-gi" style={{fontSize:12.5,color:'var(--label2)',textAlign:'center'}}>{TT("Abrechnen macht")} {cred?.name}{TT(", sobald das Geld da ist – oben „Ich habe bezahlt“ tippen.")}</div>;
          return <button className="btn btn-sec rise" style={{animationDelay:'120ms'}} onClick={settleAll}>{TT("✓ Alles abrechnen (")}{open.length})</button>;
        })()}

        {items.length===0
          ?<div className="empty"><div className="empty-ico">🌱</div><span style={{fontSize:14,color:'var(--label2)'}}>{TT("Noch keine Ausgaben")}</span></div>
          :(
            <>
            {open.length>0&&(
            <div className="rise" style={{animationDelay:'140ms'}}>
              <div className="section-hdr">{TT("Offene Ausgaben")}</div>
              <div className="group">
                {open.map(item=>{
                  const payer=users.find(u=>u.id===item.paidBy);
                  return(
                    <div key={item.id} className="cell">
                      <button className="chk-btn" style={{border:'1.5px solid var(--sep)',background:'none'}} title={TT("Als abgerechnet markieren")} onClick={()=>toggle(item.id)}/>
                      <div className="cell-content" style={{cursor:'pointer'}} onClick={()=>setEditItem(item)}>
                        <span className="cell-title">{item.name}</span>
                        <span className="cell-sub">{fmtDate(item.date)} · <span style={{color:payer?.color}}>{payer?.name}</span></span>
                      </div>
                      <div style={{textAlign:'right',flexShrink:0,cursor:'pointer'}} onClick={()=>setEditItem(item)}>
                        <div className="num" style={{fontSize:15,fontWeight:700}}>€{fmt(item.price)}</div>
                        <div className="num" style={{fontSize:10.5}}>
                          {users.map(u=><span key={u.id} style={{color:u.color,marginLeft:5}}>{u.name} €{fmt(item.price*share(u.id))}</span>)}
                        </div>
                      </div>
                      <button className="del-btn" aria-label={TT("Eintrag löschen")} title={TT("Eintrag löschen")} onClick={()=>del(item.id)}>×</button>
                    </div>
                  );
                })}
              </div>
            </div>
            )}
            <SettlementHistory settlements={settlements} users={users} accent="var(--lime)"/>
            {settled.length>0&&(
              <div className="rise">
                <div className="section-hdr" style={{display:'flex',justifyContent:'space-between',alignItems:'center',cursor:'pointer'}} onClick={()=>setShowSettled(s=>!s)}>
                  <span>{TT("Posten-Details ·")} {settled.length}</span>
                  <span style={{color:'var(--lime)'}}>{showSettled?'Verbergen':'Anzeigen'}</span>
                </div>
                {showSettled&&(
                  <div className="group">
                    {settled.map(item=>{
                      const payer=users.find(u=>u.id===item.paidBy);
                      return(
                        <div key={item.id} className="cell dim">
                          <button className="chk-btn" style={{border:'1.5px solid var(--lime)',background:'var(--lime)'}} title={TT("Wieder öffnen")} onClick={()=>toggle(item.id)}><ChkIco/></button>
                          <div className="cell-content">
                            <span className="cell-title" style={{textDecoration:'line-through'}}>{item.name}</span>
                            <span className="cell-sub">{TT("abgerechnet")} {fmtDate(item.settledAt||item.date)} · <span style={{color:payer?.color}}>{payer?.name}</span></span>
                          </div>
                          <div className="num" style={{fontSize:15,fontWeight:700,color:'var(--label3)'}}>€{fmt(item.price)}</div>
                          <button className="del-btn" aria-label={TT("Eintrag löschen")} title={TT("Eintrag löschen")} onClick={()=>del(item.id)}>×</button>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}
            </>
          )
        }

        {/* Ernte-Log: Gramm je Ernte + Zyklus-Kosten (gi zwischen den Ernten) + €/g */}
        <div className="rise" style={{animationDelay:'160ms'}}>
          <div className="section-hdr" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <span>{TT("🌾 Ernten")}{harv.length>0?` · ${harv.length}`:''}</span>
            {avgGpg!=null&&<span className="num" style={{color:'var(--lime)',textTransform:'none',letterSpacing:0}}>Ø €{fmt(avgGpg)}/g</span>}
          </div>
          {harv.length>0&&(
            <div className="group" style={{marginBottom:10}}>
              {harv.map(h=>(
                <div key={h.id} className="cell">
                  <div className="cell-icon" style={{background:'rgba(163,230,53,.12)',fontSize:15}}>🌾</div>
                  <div className="cell-content">
                    <span className="cell-title"><span className="num">{fmt(Number(h.grams)||0)} g</span>{h.note?` · ${h.note}`:''}</span>
                    <span className="cell-sub">{fmtDate(h.date)} {TT("· Zyklus €")}{fmt(h.cost)}</span>
                  </div>
                  {h.gpg!=null&&<span className="num" style={{fontWeight:700,fontSize:14,color:'var(--lime)'}}>€{fmt(h.gpg)}/g</span>}
                  <button className="del-btn" aria-label={TT("Ernte löschen")} title={TT("Ernte löschen")} onClick={()=>delHarv(h.id)}>×</button>
                </div>
              ))}
            </div>
          )}
          <button className="btn btn-sec" style={{fontSize:14}} onClick={()=>setHarvWiz(true)}>{TT("+ Ernte erfassen")}</button>
        </div>
      </div></div>
      <Wiz open={cycWiz} onClose={()=>setCycWiz(false)} title={TT("Neuer Zyklus")} color="var(--lime)" steps={cycSteps} onFinish={startCycle} initial={{start:todayISO(),phase:'keim',wiv:WATER_IV_DEF}}/>
      <Wiz open={harvWiz} onClose={()=>setHarvWiz(false)} title={TT("Ernte")} color="var(--lime)" steps={harvSteps} onFinish={addHarv} initial={{date:todayISO()}}/>
      <Wiz open={wiz} onClose={()=>setWiz(false)} title={TT("Grow-Ausgabe")} color="var(--lime)" steps={steps} onFinish={add} initial={addInit} quickOk={d=>d.name?.trim()&&parseNum(d.price)>0&&d.paidBy}/>
      <Wiz open={!!editItem} onClose={()=>setEditItem(null)} title={TT("Bearbeiten")} color="var(--lime)" steps={steps} onFinish={save} initial={editItem?{name:editItem.name,price:String(editItem.price).replace(".",","),paidBy:editItem.paidBy,cat:editItem.cat||null,date:/^\d{4}-\d{2}-\d{2}$/.test(editItem.date||'')?editItem.date:todayISO()}:null}/>
    </div>
  );
}

/* ══════════════════════════
   PUTZPLAN
   Fairness (eine Herleitung für Putzplan, Haushalt-Karte, Tab-Punkt, Erinnerung und Übersicht):
   - Gutgeschrieben wird, WER DEN HAKEN SETZT (Gerät = Person). Bis wg-v58 bekam der Eingeteilte den Eintrag
     und danach wechselte es stur ab — wer fremden Müll rausbrachte, bekam nichts dafür und war gleich wieder dran.
   - Dran ist, wer DIESE Aufgabe in den letzten 90 Tagen seltener gemacht hat; Gleichstand → wer sie länger nicht gemacht hat.
   - Punkte je Aufgabe (1 kurz · 2 mittel · 3 groß) nur für die Gesamtbilanz — Bad zählt mehr als Müll.
══════════════════════════ */
let PICKUPS = [], ABSENCES = [];   // von DataProvider je Render gesetzt (D.mk / D.aw)
const CHORE_WINDOW = 90;
const CHORE_PTS = [[1,'⚡','Kurz','unter 5 Min.'],[2,'🧽','Mittel','~15 Min.'],[3,'💪','Groß','30 Min. +']];
// Vorlagen zum Antippen: [Name, Emoji, Intervall in Tagen, Punkte]
const CHORE_PRESETS = [
  ['Müll rausbringen','🗑️',3,1], ['Altpapier','📦',14,1], ['Altglas & Pfand','♻️',14,1], ['Spülmaschine ausräumen','🍽️',2,1],
  ['Küche putzen','🍳',7,2], ['Staubsaugen','🧹',7,2], ['Wischen','🪣',14,2], ['Bad putzen','🚿',7,3],
  ['Kühlschrank auswischen','🧊',30,2], ['Handtücher waschen','🧺',7,1], ['Fenster putzen','🪟',30,3], ['Pflanzen gießen','🌿',3,1],
  ['Tier füttern','🐾',1,1], ['Katzenklo','🐈',2,1], ['Blumen düngen','🪴',30,1], ['Aquarium','🐠',14,2],
];
const chorePts = t => [1,2,3].includes(+t?.pts) ? +t.pts : 2;
const isoMid = s => { const [y,m,d]=String(s||'').split('-').map(Number); return new Date(y||1970,(m||1)-1,d||1); };
const choreCut = days => { const c=new Date(); c.setDate(c.getDate()-days); c.setHours(0,0,0,0); return c; };
// Tage bis fällig (≤ 0 = heute/überfällig; nie gemacht = sofort fällig)
const choreDueIn = t => {
  // „Morgen" gedrückt: bis dahin nicht fällig (zählt nicht als Verspätung, bricht keine Serie); api/_wg.js spiegelt das
  if (t?.snooze && t.snooze > todayISO()) return Math.round((isoMid(t.snooze) - isoMid(todayISO()))/864e5);
  if (t?.pk) { const p = (PICKUPS||[]).find(x=>x && x.kind===t.pk); if (p) return pickupDueIn(p, t.lastDone); }   // an Müllabfuhr gekoppelt
  if(!t?.lastDone) return 0;
  const due=isoMid(t.lastDone); due.setDate(due.getDate()+(t.interval||7));
  const n=new Date(); n.setHours(0,0,0,0);
  return Math.round((due-n)/86400000);
};
// Wie oft hat jede Person diese Aufgabe im Fenster gemacht? → { userId: Anzahl }
const choreTally = (taskId, log, users) => {
  const j = users.map(u=>u.joined).filter(Boolean).sort().pop();   // Mitbewohner-Wechsel (wg-v70): Fenster beginnt frühestens am Einzug
  const cut = j && isoMid(j) > choreCut(CHORE_WINDOW) ? isoMid(j) : choreCut(CHORE_WINDOW), o={};
  users.forEach(u=>{ o[u.id]=0; });
  // Einträge aus Tagen, an denen der andere weg war, zählen nicht — sonst müsste er nach dem Urlaub „aufholen"
  (log||[]).forEach(l=>{ if(l && l.taskId===taskId && l.userId in o && isoMid(l.date)>=cut && !users.some(u=>u.id!==l.userId && isAway(u.id, l.date))) o[l.userId]++; });
  return o;
};
// Wer ist als Nächstes dran? log: neuester Eintrag zuerst (so hängt done() an, so sortiert der Sync)
const choreNextRaw = (taskId, log, users, fallback) => {
  if (users.length < 2) return users[0]?.id || fallback;
  const tally = choreTally(taskId, log, users);
  const lastIdx = id => { const i=(log||[]).findIndex(l=>l && l.taskId===taskId && l.userId===id); return i<0 ? Infinity : i; };
  const min = Math.min(...users.map(u=>tally[u.id]));
  const cand = users.filter(u=>tally[u.id]===min);
  if (cand.length === 1) return cand[0].id;
  // Gleichstand: wer am längsten nicht dran war (größter Index); beide nie → bisherige Einteilung behalten
  const best = [...cand].sort((a,b)=>lastIdx(b.id)-lastIdx(a.id));
  if (lastIdx(best[0].id) === lastIdx(best[1].id)) return cand.some(u=>u.id===fallback) ? fallback : best[0].id;
  return best[0].id;
};
// Wie choreNextRaw — wer heute abwesend ist, wird übersprungen (sofern der andere da ist)
const choreNext = (taskId, log, users, fallback) => {
  const r = choreNextRaw(taskId, log, users, fallback);
  if (!isAway(r)) return r;
  const o = users.find(u=>u.id!==r && !isAway(u.id));
  return o ? o.id : r;
};
// Einsatz-Punkte je Person seit `days` Tagen (alte Einträge ohne pts → Punkte der Aufgabe, sonst 2)
const choreScore = (log, tasks, users, days) => {
  const cut=choreCut(days), byId={};
  (tasks||[]).forEach(t=>{ byId[t.id]=t; });
  return users.map(u=>({...u, n:(log||[]).filter(l=>l && l.userId===u.id && isoMid(l.date)>=cut)
    .reduce((s,l)=>s+(l.pts||chorePts(byId[l.taskId])),0)}));
};
// Fällig und mir zugeteilt — Haushalt-Karte, Tab-Punkt und Erinnerung nutzen genau das
const choreMine = (tasks, me) => (tasks||[]).filter(t=>t && t.assignee===me && choreDueIn(t)<=0)
  .sort((a,b)=>choreDueIn(a)-choreDueIn(b));

/* Wochen-Duell: Einsatz-Punkte je Kalenderwoche (Mo–So, lokal). api/cron.js rechnet montags genauso — beide zusammen ändern. */
const weekStart = (d = new Date()) => { const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; };
// offset 0 = diese Woche, -1 = letzte Woche → [{...user, n}]
const choreWeek = (log, tasks, users, offset = 0) => {
  const from=weekStart(); from.setDate(from.getDate()+7*offset);
  const to=new Date(from); to.setDate(to.getDate()+7);
  const byId={}; (tasks||[]).forEach(t=>{ byId[t.id]=t; });
  return users.map(u=>({...u, n:(log||[]).filter(l=>{ if(!l||l.userId!==u.id) return false; const d=isoMid(l.date); return d>=from && d<to; })
    .reduce((s,l)=>s+(l.pts||chorePts(byId[l.taskId])),0)}));
};
// 👑 = Sieger der LETZTEN Woche (Gleichstand oder keine Punkte → niemand)
const choreCrown = (log, tasks, users) => {
  const w=choreWeek(log, tasks, users, -1).sort((a,b)=>b.n-a.n);
  return w.length>1 && w[0].n>w[1].n ? w[0].id : null;
};
// 🔥 Pünktlich-Serie: eigene Einträge ohne Verspätung in Folge (neueste zuerst).
// Bricht bei: eigener Verspätung (late>0), einer Aufgabe, die der andere für mich retten musste (miss),
// einer eigenen gerade überfälligen Aufgabe, und bei Einträgen von vor wg-v60 (ohne late — unbekannt).
const choreStreak = (log, tasks, userId) => {
  if ((tasks||[]).some(t=>t && t.assignee===userId && choreDueIn(t)<0)) return 0;
  let n=0;
  for (const l of (log||[])) {
    if (!l) continue;
    if (l.miss===userId) break;
    if (l.userId!==userId) continue;
    if (typeof l.late!=='number' || l.late>0) break;
    n++;
  }
  return n;
};

/* Haken setzen — von Putzplan UND Haushalt-Karte genutzt (eine Stelle für Gutschrift, Rotation, Undo, Push) */
function useChoreDone() {
  const { D, setFn, me, undo, notifyOthers, mods } = useD();
  const game = mods.game !== false;
  return (t, btnEl) => {
    const users = D.users || [];
    const by = users.some(u=>u.id===me) ? me : t.assignee;   // kein Gerät gewählt → wie früher der Eingeteilte
    const byU = users.find(u=>u.id===by);
    celebrateTask(btnEl, t.em, byU?.color || '#fbbf24');
    const iso = todayISO(); // lokal, nicht UTC — sonst zählt „erledigt" nachts vor 1/2 Uhr zum Vortag
    const late = Math.max(0, -choreDueIn(t));   // Tage über Fälligkeit (heute fällig = pünktlich)
    const entry = { id:uid(), taskId:t.id, name:t.name, em:t.em, userId:by, date:iso, pts:chorePts(t),
      late: by===t.assignee ? late : 0,          // wer fremde Aufgaben rettet, ist pünktlich …
      ...(late>0 && by!==t.assignee ? { miss:t.assignee } : {}) };   // … und die Serie des Eingeteilten bricht
    const log2 = [entry, ...(D.pl||[])];
    const next = choreNext(t.id, log2, users, t.assignee);
    const prev = { lastDone:t.lastDone||null, assignee:t.assignee, snooze:t.snooze||null };
    setFn('pt', cur => cur.map(x=>x.id===t.id?{...x,lastDone:iso,assignee:next,snooze:null}:x));
    setFn('pl', cur => [entry, ...cur].slice(0,300));
    const streak = choreStreak(log2, D.pt, by);
    const fire = game && streak>=2 ? ` · 🔥 ${streak}` : '';
    undo(TT("{0} „{1}\" erledigt{2}", t.em||'✅', t.name, fire), () => {
      setFn('pt', cur => cur.map(x=>x.id===t.id?{...x,...prev}:x));
      setFn('pl', cur => cur.filter(l=>l.id!==entry.id));
    });
    const tally = choreTally(t.id, log2, users);
    const stand = users.map(u=>`${u.name} ${tally[u.id]}×`).join(' · ');
    const byName = byU?.name || 'Jemand', nextName = users.find(u=>u.id===next)?.name || 'Der andere';
    notifyOthers(TT("✅ {0} hat „{1}\" erledigt", byName, t.name),
      (next===by ? `${byName} holt noch auf (${stand})` : `${nextName}, du bist dran! (${stand})`) + (game && streak>=3 ? ` · 🔥 ${streak} pünktlich in Folge` : ''), TT("wg-putz"), TT("putz"));
  };
}

/* Stand je Aufgabe als farbige Zahlen („5 : 3") — gleiche Reihenfolge wie die Personenliste */
function ChoreTally({ task, log, users }) {
  const tally = choreTally(task.id, log, users);
  return (
    <span className="num" title={`Letzte ${CHORE_WINDOW} Tage: `+users.map(u=>`${u.name} ${tally[u.id]}×`).join(', ')}>
      {users.map((u,i)=><React.Fragment key={u.id}>{i>0&&<span style={{color:'var(--label3)',margin:'0 1px'}}>:</span>}<span style={{color:u.color,fontWeight:800}}>{tally[u.id]}</span></React.Fragment>)}
    </span>
  );
}

/* Haushalt-Tab: „Du bist dran" — nur sichtbar, wenn mir etwas fällig ist. Ein Tipp = erledigt. */
function ChoreQuick({ goPutz }) {
  const { D, me, mods, setFn, undo, notifyOthers } = useD();
  const done = useChoreDone();
  if (mods.putz === false || !me) return null;
  // Auf morgen schieben: keine Strafe (nicht überfällig), mit Rückgängig
  const snooze = t => {
    const prev = t.snooze || null;
    setFn('pt', cur=>cur.map(x=>x.id===t.id?{...x,snooze:shiftISO(todayISO(),1)}:x));
    undo(TT("{0} „{1}\" auf morgen", t.em||'🧹', t.name), ()=>setFn('pt', cur=>cur.map(x=>x.id===t.id?{...x,snooze:prev}:x)));
  };
  // Aufgabe abgeben (wg-v75): Angebot an die anderen, die Zuteilung bleibt bis jemand übernimmt
  const giveUp = t => {
    if ((D.tb||[]).some(o=>o && o.taskId===t.id)) return;
    const o = { id:uid(), taskId:t.id, by:me, ts:Date.now(), note:'' };
    setFn('tb', cur=>[o, ...(cur||[])]);
    notifyOthers(TT("🤝 {0} kann „{1}\" nicht", nameOfU(D.users||[], me), t.name), TT("Wer übernimmt? In der App antippen"), TT("wg-tb"), TT("putz"));
    undo(TT("„{0}\" abgegeben", t.name), ()=>setFn('tb', cur=>cur.filter(x=>x.id!==o.id)));
  };
  const mine = choreMine(D.pt, me);
  if (!mine.length) return null;
  const users = D.users || [], meU = users.find(u=>u.id===me);
  const myStreak = mods.game !== false ? choreStreak(D.pl, D.pt, me) : 0;
  return (
    <div className="rise" data-testid="chore-quick" style={{animationDelay:'20ms'}}>
      <div className="section-hdr" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span>{TT("🧹 Du bist dran")}{myStreak>0?<span style={{color:'var(--amber)',marginLeft:6}} title={TT("pünktlich in Folge")}>🔥 {myStreak}</span>:null}</span>
        <button className="hit" onClick={goPutz} style={{background:'none',border:'none',color:'var(--amber)',fontWeight:700,fontSize:12,fontFamily:'inherit',cursor:'pointer',padding:0,textTransform:'none',letterSpacing:0}}>{TT("Putzplan ›")}</button>
      </div>
      <div className="group" style={{border:'1px solid rgba(251,191,36,.28)'}}>
        {mine.map(t=>{
          const d = choreDueIn(t);
          return (
            <div key={t.id} className="cell">
              <button className="done-btn" style={{borderColor:(meU?.color||'#888')+'66'}} aria-label={TT("{0} erledigt", t.name)} title={TT("{0} erledigt", t.name)} onClick={e=>done(t,e.currentTarget)}>
                <svg width={16} height={16} viewBox="0 0 24 24" fill="none" stroke={meU?.color||'#888'} strokeWidth={2.6} strokeLinecap="round" strokeLinejoin="round"><path d={ICONS.check}/></svg>
              </button>
              <div className="cell-content">
                <span className="cell-title">{t.em} {t.name}</span>
                <span className="cell-sub">{d<0?<b style={{color:'var(--red)'}}>{-d} {-d===1?'Tag':'Tage'} {TT("überfällig")}</b>:'heute fällig'} {TT("· Stand")} <ChoreTally task={t} log={D.pl} users={users}/></span>
              </div>
              <button className="btn btn-sec" aria-label={TT("{0} auf morgen", t.name)} style={{width:'auto',padding:'8px 11px',fontSize:12.5,flexShrink:0}} onClick={()=>snooze(t)}>{TT("Morgen")}</button>
              <button className="btn btn-sec" data-testid="chore-giveup" aria-label={TT("{0} abgeben", t.name)} style={{width:'auto',padding:'8px 11px',fontSize:12.5,flexShrink:0}} onClick={()=>giveUp(t)}>{TT("Kann nicht")}</button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* Wochen-Duell im Putzplan: Punkte dieser Woche, 👑 für den Sieger der letzten, 🔥 Serie je Person */
function ChoreDuel({ log, tasks, users, me }) {
  if (users.length < 2) return null;
  const week = choreWeek(log, tasks, users, 0), last = choreWeek(log, tasks, users, -1);
  const crown = choreCrown(log, tasks, users);
  const left = 7 - ((new Date().getDay()+6)%7);   // Tage inkl. heute bis Sonntag
  const [a, b] = week;
  const lead = a.n===b.n ? null : (a.n>b.n ? a : b);
  const side = (u, align) => (
    <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:align,gap:3,minWidth:0}}>
      <span style={{fontSize:14,fontWeight:800,color:u.color,whiteSpace:'nowrap'}} data-testid={`duel-name-${u.id}`}>
        {crown===u.id&&<span title={TT("Sieger letzte Woche")} style={{marginRight:4}}>👑</span>}{u.id===me?'Du':u.name}
      </span>
      <span style={{fontSize:11.5,fontWeight:700,color:choreStreak(log,tasks,u.id)>0?'var(--amber)':'var(--label3)'}} data-testid={`duel-streak-${u.id}`}>
        🔥 {choreStreak(log,tasks,u.id)} {TT("pünktlich")}
      </span>
    </div>
  );
  const lastTxt = last[0].n+last[1].n>0 ? `Letzte Woche ${last[0].n} : ${last[1].n}${crown?` · 👑 ${users.find(u=>u.id===crown)?.name}`:' · unentschieden'}` : null;
  return (
    <div data-testid="chore-duel" style={{margin:'2px 0 16px'}}>
      <div className="hero-lbl" style={{marginBottom:8,display:'flex',justifyContent:'space-between'}}>
        <span>{TT("Wochen-Duell")}</span><span>{left===1?'letzter Tag':`noch ${left} Tage`}</span>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:10}}>
        {side(a,'flex-start')}
        <span className="num" style={{fontSize:30,fontWeight:800,letterSpacing:'-.02em',whiteSpace:'nowrap'}}>
          <span style={{color:a.color}}>{a.n}</span><span style={{color:'var(--label3)',margin:'0 6px'}}>:</span><span style={{color:b.color}}>{b.n}</span>
        </span>
        {side(b,'flex-end')}
      </div>
      <div style={{fontSize:11.5,color:'var(--label3)',marginTop:6,textAlign:'center',fontWeight:600}} data-testid="duel-sub">
        {lead ? `${lead.id===me?'Du führst':`${lead.name} führt`} mit ${Math.abs(a.n-b.n)} P.` : 'Gleichstand'}{lastTxt?` · ${lastTxt}`:''}
      </div>
    </div>
  );
}

function Putzplan() {
  const { D, set, setFn, status, undo, me, mods } = useD();
  const users=D.users, tasks=D.pt||[], log=D.pl||[];
  const done = useChoreDone();
  const [wiz,setWiz] = useState(false);
  const [editTask,setEditTask] = useState(null);

  const del = id => { const t=tasks.find(x=>x.id===id); set('pt',tasks.filter(x=>x.id!==id)); undo(TT("„{0}\" gelöscht", t?.name||'Aufgabe'), ()=>setFn('pt', cur => cur.some(x=>x.id===id)?cur:[t,...cur])); };
  const ivOf = d => parseInt(d.interval)||7;
  // Neue Aufgabe: ohne Auswahl fängt an, wer sie anlegt — wer sich meldet, macht's
  const add = d => set('pt',[...tasks,{id:uid(),name:d.name?.trim()||'Aufgabe',em:d.em||'🧽',interval:ivOf(d),pts:chorePts(d),pk:d.pk||null,assignee:d.assignee||(users.some(u=>u.id===me)?me:users[0].id),lastDone:null}]);
  const save = d => set('pt',tasks.map(x=>x.id===editTask.id?{...x,name:d.name?.trim()||x.name,em:d.em||x.em,interval:parseInt(d.interval)||x.interval,pts:chorePts(d),pk:d.pk||null,assignee:d.assignee||x.assignee}:x));

  // Standard-Plan: die vier Klassiker + Altpapier/Altglas, abwechselnd eingeteilt
  const loadDefaults = () => set('pt',
    CHORE_PRESETS.filter(p=>['Müll rausbringen','Küche putzen','Bad putzen','Staubsaugen','Altpapier','Altglas & Pfand'].includes(p[0]))
      .map(([name,em,interval,pts],i)=>({id:uid(),name,em,interval,pts,assignee:users[i%users.length]?.id||users[0].id,lastDone:null})));

  /* Gesamtbilanz: Einsatz-Punkte der letzten 30 Tage */
  const counts=choreScore(log, tasks, users, 30);
  const totN=counts.reduce((s,c)=>s+c.n,0);

  const sorted=[...tasks].sort((a,b)=>choreDueIn(a)-choreDueIn(b));
  const dueNow=sorted.filter(t=>choreDueIn(t)<=0);
  // Meine fälligen zuerst
  const dueSorted=[...dueNow].sort((a,b)=>(b.assignee===me)-(a.assignee===me));

  const chip = t => {
    const d=choreDueIn(t);
    if(d<0)  return <span className="due-chip overdue" style={{background:'rgba(251,113,133,.15)',color:'var(--red)'}}>{-d}{TT("d ÜBERFÄLLIG")}</span>;
    if(d===0)return <span className="due-chip" style={{background:'rgba(251,191,36,.16)',color:'var(--amber)'}}>{TT("HEUTE")}</span>;
    return <span className="due-chip" style={{background:'rgba(255,255,255,.06)',color:'var(--label3)'}}>{TT("IN")} {d}d</span>;
  };
  const ivText = n => n===1?'täglich':n===7?'wöchentlich':n===14?'alle 2 Wochen':n===30?'monatlich':`alle ${n} Tage`;

  const PRESET_PK = { 'Müll rausbringen':'rest', 'Altpapier':'papier', 'Altglas & Pfand':'glas' };   // Vorlage → Tonne, falls eingetragen
  const EMS=['🐾','🐈','🪴','🐠','🗑️','♻️','📦','🍽️','🍳','🚿','🧹','🪣','🧽','🧺','🪟','🧊','🌿','🛒','🧴','🛏️'];
  const IVS=[['1','Täglich'],['2','Alle 2 Tage'],['3','Alle 3 Tage'],['7','Wöchentlich'],['14','Alle 2 Wochen'],['30','Monatlich']];
  const steps=[
    {label:'Was ist zu tun?',ok:d=>d.name?.trim(),render:({data:d,setData:sd})=>(
      <>
        <input autoFocus maxLength={200} className="field" placeholder={TT("Müll rausbringen, Bad putzen …")} value={d.name||''} onChange={e=>sd({...d,name:e.target.value})}/>
        {/* Vorlage antippen = Name, Symbol, Rhythmus und Aufwand auf einmal (danach „Fertig" oder weiter anpassen) */}
        <div data-testid="chore-presets" style={{display:'flex',flexWrap:'wrap',gap:6,marginTop:10}}>
          {CHORE_PRESETS.filter(p=>!tasks.some(t=>t.name===p[0])||d.name===p[0]).map(([name,em,iv,pts])=>(
            <button key={name} type="button" className="hit" onClick={()=>sd({...d,name,em,interval:String(iv),pts,pk:(D.mk||[]).some(p=>p&&p.kind===PRESET_PK[name])?PRESET_PK[name]:null})}
              style={{fontSize:12.5,borderRadius:12,padding:'7px 10px',border:'none',fontWeight:d.name===name?800:600,fontFamily:'inherit',cursor:'pointer',
                background:d.name===name?'var(--amber)':'var(--bg3)',color:d.name===name?'var(--ink)':'var(--label2)'}}>
              {em} {name}
            </button>
          ))}
        </div>
      </>
    )},
    {label:'Wie oft?',ok:d=>!!(d.interval||d.pk),render:({data:d,setData:sd})=>(
      <>
        <div className="cat-grid">
          {IVS.map(([v,l])=><button key={v} className={`cat-btn${!d.pk&&d.interval===v?' on':''}`} onClick={()=>sd({...d,interval:v,pk:null})}>{l}</button>)}
        </div>
        {/* An die Müllabfuhr koppeln: fällig am Vorabend der Abholung statt fester Rhythmus */}
        {(D.mk||[]).filter(Boolean).length>0 && (
          <>
