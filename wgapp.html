/* ══════════════════════════
   PRIVATER FINANZBEREICH
   Bewusst NICHT gesynct: Buchungen (tx) + Fixkosten (fix) liegen ausschliesslich
   in localStorage `wg_priv` auf DIESEM Geraet — nie in der RTDB, nie im WG-Export.
   Zusaetzlich per 4-stelliger PIN gesperrt (Hash+Salt in `wg_priv_pin`; die PIN
   selbst wird nirgends gespeichert). Entsperrung gilt nur fuer die laufende
   Sitzung — App neu laden = wieder gesperrt.
══════════════════════════ */
const PRIV_KEY='wg_priv', PRIV_PIN='wg_priv_pin';
const privLoad = () => { const p=ls(PRIV_KEY,null)||{}; return { tx:Array.isArray(p.tx)?p.tx:[], fix:Array.isArray(p.fix)?p.fix:[] }; };
const privSave = p => ss(PRIV_KEY,{tx:p.tx||[],fix:p.fix||[]}); // false = nicht geschrieben (voller Speicher)

/* PIN-Hash: SHA-256(salt+pin), hex. Fallback (kein crypto.subtle, z.B. http-Kontext)
   ist ein simpler Rolling-Hash — schwaecher, aber die Sperre bleibt funktionsfaehig. */
const pinHash = async (pin, salt) => {
  const s = salt+':'+pin;
  try {
    if (crypto?.subtle) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  } catch {}
  let h=5381; for(let i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))>>>0; }
  return 'fb'+h.toString(16);
};
const randSalt = () => { try{ const a=new Uint8Array(8); crypto.getRandomValues(a); return Array.from(a).map(b=>b.toString(16).padStart(2,'0')).join(''); }catch{ return String(Date.now()); } };

/* Ziffernblock — gemeinsam fuer „PIN festlegen", „PIN bestaetigen" und „Entsperren". */
function PinPad({ title, sub, value, onKey, onDel, err, extra }) {
  return (
    <div className={`pin-wrap${err?' err':''}`}>
      <div className="pin-lock">{err?'🔓':'🔒'}</div>
      <div className="pin-title">{title}</div>
      {sub&&<div className="pin-sub">{sub}</div>}
      <div className="pin-dots">
        {[0,1,2,3].map(i=><div key={i} className={`pin-dot${i<value.length?' on':''}${err?' bad':''}`}/>)}
      </div>
      <div className="pin-err">{err||''}</div>
      <div className="pin-pad">
        {['1','2','3','4','5','6','7','8','9'].map(n=>(
          <button key={n} className="pin-key" onClick={()=>onKey(n)}>{n}</button>
        ))}
        <div/>
        <button className="pin-key" onClick={()=>onKey('0')}>0</button>
        <button className="pin-key ghost" aria-label={TT("Löschen")} onClick={onDel}>⌫</button>
      </div>
      {extra}
    </div>
  );
}

/* Sperrbildschirm: legt beim ersten Mal eine PIN an (2× eingeben), danach Abfrage. */
function PrivLock({ onUnlock }) {
  const stored = ls(PRIV_PIN,null);
  const setup  = !stored?.h;
  const [pin,setPin]   = useState('');
  const [first,setFirst] = useState(null); // Setup: erste Eingabe
  const [err,setErr]   = useState('');
  const busy = useRef(false);

  const reset = m => { setErr(m); setPin(''); setTimeout(()=>setErr(''),1400); };

  const submit = async code => {
    if (busy.current) return; busy.current=true;
    try {
      if (setup) {
        if (first===null) { setFirst(code); setPin(''); return; }
        if (first!==code) { setFirst(null); reset('PINs stimmen nicht überein'); return; }
        const salt = randSalt();
        ss(PRIV_PIN, { h: await pinHash(code, salt), s: salt });
        onUnlock();
      } else {
        const h = await pinHash(code, stored.s||'');
        if (h===stored.h) onUnlock(); else reset('Falsche PIN');
      }
    } finally { busy.current=false; }
  };

  const onKey = n => { if (pin.length>=4) return; const v=pin+n; setPin(v); if (v.length===4) submit(v); };

  const title = setup ? (first===null?'PIN festlegen':'PIN wiederholen') : 'PIN eingeben';
  // Der Datenschutz-Hinweis steckt bewusst im Untertitel statt in einer eigenen
  // Notiz-Box — sonst wird das Pad auf kleinen Displays unten abgeschnitten.
  const sub   = setup
    ? (first===null
        ? 'Vier Ziffern schützen deinen privaten Bereich. Die Daten liegen nur auf diesem Gerät und werden nicht mit der WG geteilt.'
        : 'Zur Sicherheit noch einmal dieselbe PIN.')
    : 'Dein privater Finanzbereich ist gesperrt.';

  return (
    <div className="screen">
      <NBar title={TT("Privat")} color="var(--violet)" status="privat"/>
      <div className="scroll">
        <div className="content">
          <PinPad title={title} sub={sub} value={pin} err={err}
                  onKey={onKey} onDel={()=>{ setPin(p=>p.slice(0,-1)); }}/>
        </div>
      </div>
    </div>
  );
}

const PRIV_CATS=['Wohnen','Lebensmittel','Transport','Freizeit','Gesundheit','Versicherung','Sparen','Sonstiges'];
const monKey = d => (d||'').slice(0,7);
const monLabel = m => { const [y,mo]=m.split('-'); return ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'][(+mo||1)-1]+' '+y; };
const monShift = (m,delta) => { const [y,mo]=m.split('-').map(Number); const d=new Date(y,(mo-1)+delta,1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); };

function Finanzen() {
  const { undo } = useD();
  const [locked,setLocked] = useState(true);
  const [priv,setPriv_]    = useState(privLoad);
  /* Geschrieben wird zentral hier statt in jedem Aufrufer — so ist auch der Undo-Pfad
     abgedeckt und der Updater bleibt seiteneffektfrei. Schlägt das Schreiben fehl
     (voller Gerätespeicher), MUSS das sichtbar werden: diese Daten liegen nur hier,
     ein stiller Fehlschlag wäre unwiederbringlicher Verlust (verifiziert, s. Banner). */
  const [saveErr,setSaveErr] = useState(false);
  const mounted = useRef(false);
  useEffect(() => {
    if (!mounted.current) { mounted.current = true; return; } // beim Mount nichts zurückschreiben
    setSaveErr(!privSave(priv));
  }, [priv]);
  const setPriv = setPriv_;

  const [seg,setSeg]   = useState('txs');
  const [wiz,setWiz]   = useState(null);
  const [editTx,setEditTx]   = useState(null);
  const [editFix,setEditFix] = useState(null);
  const [mon,setMon]   = useState(() => todayISO().slice(0,7));

  if (locked) return <PrivLock onUnlock={()=>setLocked(false)}/>;

  const txs=priv.tx, fixed=priv.fix;
  const monTxs = txs.filter(t=>monKey(t.date)===mon);
  const inc = monTxs.filter(t=>t.type==='inc').reduce((s,t)=>s+t.amount,0);
  const exp = monTxs.filter(t=>t.type==='exp').reduce((s,t)=>s+t.amount,0);
  const fixMo = fixed.reduce((s,f)=>s+(f.freq==='m'?f.amount:f.amount/12),0);
  const avail = inc-exp-fixMo;
  const isCur = mon===todayISO().slice(0,7);

  const addTx  = d => setPriv({...priv, tx:[{id:uid(),type:d.type||'exp',amount:parseNum(d.amount)||0,category:d.cat||'Sonstiges',note:(d.note||'').trim(),date:d.date||todayISO()},...txs]});
  const saveTx = d => setPriv({...priv, tx:txs.map(x=>x.id===editTx.id?{...x,type:d.type||x.type,amount:parseNum(d.amount)||x.amount,category:d.cat||x.category,note:(d.note||'').trim(),date:d.date||x.date}:x)});
  const delTx  = id => { const it=txs.find(x=>x.id===id); setPriv({...priv, tx:txs.filter(x=>x.id!==id)}); undo(TT("Buchung gelöscht"), ()=>setPriv_(cur=>cur.tx.some(x=>x.id===id)?cur:{...cur,tx:[it,...cur.tx]})); };

  const addFix  = d => setPriv({...priv, fix:[{id:uid(),name:(d.name||'').trim(),amount:parseNum(d.amount)||0,freq:d.freq||'m',day:d.day?Math.min(31,Math.max(1,parseInt(d.day,10)||1)):null},...fixed]});
  const saveFix = d => setPriv({...priv, fix:fixed.map(x=>x.id===editFix.id?{...x,name:(d.name||x.name).trim(),amount:parseNum(d.amount)||x.amount,freq:d.freq||x.freq,day:d.day?Math.min(31,Math.max(1,parseInt(d.day,10)||1)):x.day}:x)});
  const delFix  = id => { const it=fixed.find(x=>x.id===id); setPriv({...priv, fix:fixed.filter(x=>x.id!==id)}); undo(TT("Fixkosten gelöscht"), ()=>setPriv_(cur=>cur.fix.some(x=>x.id===id)?cur:{...cur,fix:[it,...cur.fix]})); };

  const backup = () => {
    try {
      const blob=new Blob([JSON.stringify({v:1,exported:new Date().toISOString(),...priv},null,2)],{type:'application/json'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
      a.download=`privat-finanzen-${todayISO()}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
      ss('wg_priv_exported', Date.now()); setPriv_(p => ({ ...p }));   // Erinnerung zurücksetzen (neu zeichnen)
    } catch {}
  };

  const txSteps=[
    {label:'Art',ok:d=>!!d.type,render:({data:d,setData:sd})=>(
      <div className="pick">
        {[['inc','📈 Einnahme','var(--green)'],['exp','📉 Ausgabe','var(--red)']].map(([v,l,c])=>(
          <button key={v} className={`pick-btn${d.type===v?' on':''}`} style={{background:c}} onClick={()=>sd({...d,type:v})}>{l}</button>
        ))}
      </div>
    )},
    {label:'Betrag & Datum',ok:d=>parseNum(d.amount)>0,render:({data:d,setData:sd})=>(
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        <div className="f-euro"><input autoFocus type="text" inputMode="decimal" className="field" placeholder="0,00" value={d.amount||''} onChange={e=>sd({...d,amount:e.target.value})}/></div>
        <input type="date" className="field" value={d.date||todayISO()} onChange={e=>sd({...d,date:e.target.value})}/>
      </div>
    )},
    {label:'Kategorie & Notiz',ok:d=>!!d.cat,render:({data:d,setData:sd})=>(
      <div style={{display:'flex',flexDirection:'column',gap:12}}>
        <div className="cat-grid">
          {PRIV_CATS.map(c=><button key={c} className={`cat-btn${d.cat===c?' on':''}`} onClick={()=>sd({...d,cat:c})}>{c}</button>)}
        </div>
        <input maxLength={100} className="field" placeholder={TT("Notiz (optional)")} value={d.note||''} onChange={e=>sd({...d,note:e.target.value})}/>
      </div>
    )},
  ];
  const fixSteps=[
    {label:'Bezeichnung',ok:d=>d.name?.trim(),render:({data:d,setData:sd})=><input autoFocus maxLength={100} className="field" placeholder={TT("Miete, Strom, Handy …")} value={d.name||''} onChange={e=>sd({...d,name:e.target.value})}/>},
    {label:'Betrag',ok:d=>parseNum(d.amount)>0,render:({data:d,setData:sd})=><div className="f-euro"><input autoFocus type="text" inputMode="decimal" className="field" placeholder="0,00" value={d.amount||''} onChange={e=>sd({...d,amount:e.target.value})}/></div>},
    {label:'Häufigkeit & Fälligkeit',ok:d=>!!d.freq,render:({data:d,setData:sd})=>(
      <div style={{display:'flex',flexDirection:'column',gap:12}}>
        <div className="pick">
          {[['m','Monatlich'],['y','Jährlich']].map(([v,l])=>(
            <button key={v} className={`pick-btn${d.freq===v?' on':''}`} style={{background:'var(--violet)'}} onClick={()=>sd({...d,freq:v})}>{l}</button>
          ))}
        </div>
        {d.freq==='m'&&<input type="text" inputMode="numeric" maxLength={2} className="field" placeholder={TT("Fällig am … (Tag, optional)")} value={d.day||''} onChange={e=>sd({...d,day:e.target.value.replace(/\D/g,'')})}/>}
      </div>
    )},
  ];

  return (
    <div className="screen">
      <NBar title={TT("Privat")} color="var(--violet)" status="privat"/>
      <div className="scroll">
        <div className="content">
          <div className="priv-note rise">{TT("🔒 Nur auf diesem Gerät · nicht mit der WG geteilt")}</div>

          {/* Bleibt stehen, bis das Speichern wieder klappt — nicht wegklickbar, weil die
              Änderung sonst beim Schließen der App spurlos verschwindet. */}
          {saveErr && (
            <div className="group rise" role="alert" style={{padding:'13px 16px',display:'flex',alignItems:'center',gap:12,border:'1px solid rgba(251,113,133,.42)',background:'rgba(251,113,133,.08)'}}>
              <div className="cell-icon" style={{background:'rgba(251,113,133,.14)',fontSize:15}}>⚠️</div>
              <div className="cell-content">
                <span className="cell-title" style={{color:'var(--red)'}}>{TT("Nicht gespeichert")}</span>
                <span className="cell-sub">{TT("Der Gerätespeicher ist voll — beim Schließen der App wäre die Änderung weg. Jetzt „⬇︎ Sichern\" antippen, dann Speicher freimachen.")}</span>
              </div>
            </div>
          )}

          <div className="seg rise" style={{animationDelay:'40ms'}}>
            <button className="seg-btn" aria-label={TT("Vorheriger Monat")} onClick={()=>setMon(m=>monShift(m,-1))}>‹</button>
            <button className="seg-btn on" onClick={()=>setMon(todayISO().slice(0,7))}>{monLabel(mon)}</button>
            <button className="seg-btn" aria-label={TT("Nächster Monat")} disabled={isCur} style={isCur?{opacity:.3}:{}} onClick={()=>{ if(!isCur) setMon(m=>monShift(m,1)); }}>›</button>
          </div>

          <div className="summary rise" style={{animationDelay:'80ms'}}>
            <div className="sum-row">
              {/* Bewusst fmtT statt fmtK: bei Gehalt/Miete zählt der exakte Betrag —
                  fmtK würde 1450 als „1,4K" anzeigen (gerundet UND abgeschnitten). */}
              {[['Einnahmen',inc,'var(--green)'],['Ausgaben',exp,'var(--red)'],['Bilanz',inc-exp,inc-exp>=0?'var(--label)':'var(--red)']].map(([l,v,c])=>(
                <div key={l} className="sum-col">
                  <span className="sum-lbl">{l}</span>
                  <span className="sum-val" style={{color:c,fontSize:14}}>{v<0?'-':''}€{fmtT(Math.abs(v))}</span>
                </div>
              ))}
            </div>
            <div style={{borderTop:'1px solid var(--sep)',padding:'10px 0',textAlign:'center',fontSize:13,color:'var(--label2)'}}>
              {TT("Fixkosten/Mo.")} <span className="num" style={{color:'var(--violet)',fontWeight:700}}>€{fmtT(fixMo)}</span>
              {'  ·  '}{TT("bleibt")} <span className="num" style={{color:avail>=0?'var(--green)':'var(--red)',fontWeight:700}}>{avail<0?'-':''}€{fmtT(Math.abs(avail))}</span>
            </div>
          </div>

          <div className="seg rise" style={{animationDelay:'120ms'}}>
            {[['txs','💳 Buchungen'],['fix','📌 Fixkosten']].map(([v,l])=>(
              <button key={v} className={`seg-btn${seg===v?' on':''}`} onClick={()=>setSeg(v)}>{l}</button>
            ))}

  const [wiz,setWiz] = useState(false);
  const [editSub,setEditSub] = useState(null);
  const save = d => set('ab',subs.map(x=>x.id===editSub.id?{...x,name:d.name||x.name,price:parseNum(d.price)||x.price,iv:d.iv||x.iv,em:d.em||x.em,cl:d.cl||x.cl}:x));

  const EMS=['📱','🎵','🎬','🎮','💻','📰','🛒','☁️','🏋️','📚','🧠','🔒'];

  const pct = s=>{ const d=daysSince(s.sd),p=s.iv==='m'?30:365; return (d%p)/p*100; };

      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        <div className="emoji-grid">{EMS.map(e=><button key={e} className={`emoji-btn${d.em===e?' on':''}`} onClick={()=>sd({...d,em:e})}>{e}</button>)}</div>
        <div className="color-row">{CLS.map(c=><button key={c} className={`color-btn${d.cl===c?' on':''}`} style={{background:c,color:c}} onClick={()=>sd({...d,cl:c})}/>)}</div>
      </div>
    )},
  ];

  return (
    <div className="screen">
      <NBar title={TT("Abos")} color="var(--indigo)" status={status}/>

          {subs.length===0
            ?<div className="empty"><div className="empty-ico">🔄</div><span style={{fontSize:14,color:'var(--label2)'}}>{TT("Noch keine Abos")}</span></div>
            :(
              <>
                <div className="sub-grid rise" style={{animationDelay:'100ms'}}>

                      </div>
                    );
                  })}
                </div>
                <div style={{textAlign:'center',fontSize:11,color:'var(--label4)'}}>{TT("Tippen zum Bearbeiten · × zum Löschen")}</div>
              </>
            )
          }
        </div>
      </div>
      <Wiz open={wiz} onClose={()=>setWiz(false)} title={TT("Neues Abo")} color="var(--indigo)" steps={steps} onFinish={add}/>
      <Wiz open={!!editSub} onClose={()=>setEditSub(null)} title={TT("Abo bearbeiten")} color="var(--indigo)" steps={steps} onFinish={save} initial={editSub?{name:editSub.name,price:String(editSub.price).replace(".",","),iv:editSub.iv,em:editSub.em,cl:editSub.cl}:null}/>
    </div>
  );

function Einstellungen() {
  const { D, set, setFn, status, online, fbCfg, setFbCfg, wgCode, setWgCode, mods, setMods, replaceData, me, setMe, undo, askConfirm, deviceId, pushSave, pushRemove, pushPrefsUpdate, rotateWgCode, listPushDevices } = useD();
  const users=D.users;
  const [cfgText,  setCfgText]  = useState(fbCfg ? JSON.stringify(fbCfg, null, 2) : '');
  const [codeInput,setCodeInput]= useState('');
  const [copied,   setCopied]   = useState(false);
  const [cfgErr,   setCfgErr]   = useState('');
  const [showSetup,setShowSetup]= useState(!fbCfg);
  const [importErr,setImportErr]= useState('');
  const [pendingJoin,setPendingJoin] = useState(null); // WG-Code, der beigetreten werden soll (Merge/Überschreiben-Wahl)
  const [showArchive,setShowArchive] = useState(false);

  /* WG-Code wechseln (Logik in DataProvider.rotateWgCode) */
  const [rotBusy,setRotBusy] = useState(false);
  const [rotErr,setRotErr]   = useState('');
  const [newCodeShown,setNewCodeShown] = useState(null);   // nach dem Wechsel: neuer Code zum Weitergeben
  const doRotate = async () => {
    setRotErr('');
    if (!online || status !== 'synced') { setRotErr('Geht nur online und synchronisiert.'); return; }
    const ok = await askConfirm({ title:TT("WG-Code wechseln"), danger:true, okLabel:TT("Code wechseln"),
      body:TT("Die WG bekommt einen neuen Code. Wer den alten Code kennt (z. B. ein Ex-Mitbewohner oder ein altes Handy), kommt danach nicht mehr an eure Daten. Dein Mitbewohner muss den neuen Code einmal eingeben. Vorher wird automatisch gesichert.") });
    if (!ok) return;
    setRotBusy(true);
    try { setNewCodeShown(await rotateWgCode()); }
    catch (e) {
      const m = String(e && e.message);
      setRotErr(m === 'pending' ? 'Erst synchronisieren lassen, dann nochmal.' : m === 'server' ? 'Server nicht erreichbar — nichts geändert.' : m === 'moved' ? 'Dieser Code wurde schon gewechselt.' : 'Hat nicht geklappt — nichts geändert.');
    }
    setRotBusy(false);
  };

  /* Automatische Backups (Server-Snapshots, s. api/backup.js). Einspielen = derselbe Weg wie der JSON-Import. */
  const [bkOpen,setBkOpen] = useState(false);
  const [bkDays,setBkDays] = useState(null);     // null = lädt · [] = keine · string = Fehlertext
  const [bkMsg,setBkMsg]   = useState('');
  const bkPost = body => fetch(`${PUSH_API}/api/backup`, { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body) });
  const fmtBkDay = k => { const [d, t] = String(k).split('T'); const [y, m, dd] = d.split('-'); return `${dd}.${m}.${y}` + (t ? ` · ${t.replace('-', ':')} Uhr` : ' · täglich'); };
  const fmtErrTime = t => { const d = new Date(t || 0), z = n => String(n).padStart(2, '0'); return `${z(d.getDate())}.${z(d.getMonth()+1)}. ${z(d.getHours())}:${z(d.getMinutes())}`; };
  const loadBackups = async () => {
    setBkDays(null); setBkMsg('');
    try { const r = await fetch(`${PUSH_API}/api/backup?code=${encodeURIComponent(wgCode)}`); const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); setBkDays(j.days || []); ss('wg_bk_age', backupAgeDays(j.days || [])); }
    catch (e) { setBkDays('Backups gerade nicht erreichbar (' + ((e && e.message) || '?') + ').'); }
  };
  const openBackups = () => { setBkOpen(true); loadBackups(); };
  const bkAgeS = ls('wg_bk_age', null);   // vom Backup-Wächter (AppInner): Tage seit der neuesten Server-Sicherung
  // Wo kommt Push an? (Geräte unter diesem Code) — damit sichtbar wird, wenn es beim Mitbewohner fehlt
  const [pushDevs,setPushDevs] = useState(null);
  useEffect(() => { if (status === 'synced' && listPushDevices) listPushDevices().then(setPushDevs).catch(() => {}); }, [status]);
  const snapshotNow = async () => {
    setBkMsg('Sichere …');
    try {
      const j = await (await bkPost({ code: wgCode, action:'snapshot' })).json();
      setBkMsg(j.result === 'ok' ? '✓ Gesichert' : j.result === 'exists' ? 'In den letzten 10 Min. schon gesichert' : j.result === 'leer' ? 'Nichts zu sichern' : 'Fehler: ' + (j.error || j.result));
      loadBackups();
    } catch { setBkMsg('Server nicht erreichbar'); }
  };
  const restoreBackup = async (day) => {
    if (!await askConfirm({ title:TT("Backup einspielen"), danger:true, okLabel:TT("Einspielen"), body:TT("Stand vom {0} einspielen? Das ersetzt die aktuellen Daten auf allen Geräten. Der jetzige Stand wird vorher gesichert.", fmtBkDay(day)) })) return;
    setBkMsg('Lade …');
    try {
      await bkPost({ code: wgCode, action:'snapshot' }).catch(() => {});   // Sicherheitsnetz: jetzigen Stand vorher sichern
      const r = await fetch(`${PUSH_API}/api/backup?code=${encodeURIComponent(wgCode)}&day=${encodeURIComponent(day)}`);
      const j = await r.json(); if (!r.ok || !j.data) throw new Error(j.error || r.status);
      // Snapshot kommt im DB-Format (Listen als {id:item}) — für replaceData in Arrays umwandeln, sonst wären alle Listen leer
      replaceData(normalizeRemote(j.data)); setBkMsg('✓ Eingespielt'); setBkOpen(false);
    } catch (e) { setBkMsg('Einspielen fehlgeschlagen (' + ((e && e.message) || '?') + ')'); }
  };
  const notifySupported = typeof window!=='undefined' && 'Notification' in window;
  const [notifyOn,setNotifyOn] = useState(()=>ls('wg_notify','off')==='on' && notifySupported && Notification.permission==='granted');
  const toggleNotify = async () => {
    if (!notifySupported) return;
    if (notifyOn) { ss('wg_notify','off'); setNotifyOn(false); return; }
    let perm = Notification.permission;
    if (perm !== 'granted') perm = await Notification.requestPermission();
    if (perm === 'granted') { ss('wg_notify','on'); ss('wg_notify_last', null); setNotifyOn(true); }
    else { ss('wg_notify','off'); setNotifyOn(false); }
  };
  const fileInputRef = useRef(null);

  /* ── Web-Push (Paket C) ── */
  const pushCapable = typeof window!=='undefined' && 'Notification' in window && 'serviceWorker' in navigator && 'PushManager' in window;
  const isStandalone = () => { try { return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; } catch { return false; } };
  const isIOS = () => { try { return /iphone|ipad|ipod/i.test(navigator.userAgent||''); } catch { return false; } };
  const iOSNeedsInstall = isIOS() && !isStandalone();
  const showPush = pushCapable || iOSNeedsInstall;
  const [pushOn,   setPushOn]   = useState(false);
  const [pushBusy, setPushBusy] = useState(false);
  const [pushMsg,  setPushMsg]  = useState('');
  const [pushPerm, setPushPerm] = useState(pushCapable ? Notification.permission : 'default');
  const flashPush = (m) => { setPushMsg(m); setTimeout(()=>setPushMsg(''), 4000); };
  /* Push-Feinschliff: konfigurierbare Typen pro Gerät + Ruhezeiten. Quelle der Wahrheit für die UI
     ist localStorage; bei aktivem Push zusätzlich in die RTDB-Subscription gespiegelt (PUSH_PREFS_DEF global). */
  const [pushPrefs, setPushPrefs] = useState(() => ({ ...PUSH_PREFS_DEF, ...(ls('wg_push_prefs', {}) || {}) }));
  const setPref = (patch) => {
    setPushPrefs(prev => {
      const next = { ...prev, ...patch };
      ss('wg_push_prefs', next);
      if (pushOn) pushPrefsUpdate(next).catch(()=>{});
      return next;
    });
  };
  // Zustand aus der TATSÄCHLICHEN Subscription ableiten (nicht aus localStorage).
  useEffect(() => {
    if (!pushCapable) return;
    let alive = true;
    (async () => {
      try {
        const reg = await navigator.serviceWorker.ready;
        const sub = await reg.pushManager.getSubscription();
        if (alive) setPushOn(!!sub);
      } catch {}
    })();
    return () => { alive = false; };
  }, []);
  const enablePush = async () => {
    setPushBusy(true);
    try {
      let perm = Notification.permission;
      if (perm !== 'granted') perm = await Notification.requestPermission();
      setPushPerm(perm);
      if (perm !== 'granted') { flashPush(TT("Berechtigung nicht erteilt.")); setPushBusy(false); return; }
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });
      const j = sub.toJSON() || {};
      await pushSave({ endpoint: j.endpoint, p256dh: (j.keys&&j.keys.p256dh)||null, auth: (j.keys&&j.keys.auth)||null, name: (users.find(u=>u.id===me)?.name)||'Gerät', uid: me||null, t: Date.now(), ...pushPrefs });
      setPushOn(true);
      flashPush(TT("Push aktiviert ✓"));
    } catch (e) {
      // Falls Subscribe klappte, aber der RTDB-Write scheiterte (offline/keine DB): wieder abmelden, damit Zustand ehrlich bleibt.
      try { const reg = await navigator.serviceWorker.ready; const s = await reg.pushManager.getSubscription(); if (s) await s.unsubscribe(); } catch {}
      setPushOn(false);
      flashPush(TT("Konnte nicht aktivieren — online und mit der WG verbunden?"));
    }
    setPushBusy(false);
  };
  const disablePush = async () => {
    setPushBusy(true);
    try {
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if (sub) await sub.unsubscribe();
      await pushRemove();
      setPushOn(false);
      flashPush(TT("Push deaktiviert"));
    } catch { flashPush(TT("Konnte nicht deaktivieren.")); }
    setPushBusy(false);
  };
  const togglePush = () => { if (pushBusy || !pushCapable || !PUSH_API || pushPerm==='denied') return; pushOn ? disablePush() : enablePush(); };
  const pushDisabled = !PUSH_API || !pushCapable || pushBusy || pushPerm==='denied';

  const hasLocalData = (D.hs?.length||0)+(D.gi?.length||0)+(D.ab?.length||0)+(D.pt?.length||0)+(D.sl?.length||0)
    +(D.rec?.length||0)+(D.pl?.length||0)+(D.stl?.length||0)+(D.arc?.length||0)+Object.keys(D.gp||{}).length > 0;

  /* ── Archiv: abgerechnete Posten + Abrechnungen älter als 3 volle Monate ──
     Cutoff = erster Tag des Monats, der 3 Monate vor dem aktuellen liegt
     (z.B. heute 2026-07 → Cutoff 2026-04-01). ISO-Datumsstrings sortieren
     lexikographisch korrekt, deshalb reicht String-Vergleich. */
  const archiveCutoff = ymShift(todayISO().slice(0,7), -3) + '-01';
  const arc  = D.arc || [];
  const oldHs  = (D.hs||[]).filter(i => i.settled && (i.settledAt||i.date) < archiveCutoff);
  const oldGi  = (D.gi||[]).filter(i => i.settled && (i.settledAt||i.date) < archiveCutoff);
  const oldStl = (D.stl||[]).filter(s => s.date < archiveCutoff);
  const archiveCandidates = [
    ...oldHs.map(i=>({...i,src:'hs'})),
    ...oldGi.map(i=>({...i,src:'gi'})),
    ...oldStl.map(s=>({...s,src:'stl'})),
  ];
  const archiveCount = archiveCandidates.length;
  const doArchive = async () => {
    if (!archiveCount) return;
    const ok = await askConfirm({ title:TT("Archivieren?"), body:TT("{0} abgerechnete Einträge wandern ins Archiv. Sie bleiben in der Übersicht sichtbar.", archiveCount), okLabel:TT("Archivieren") });
    if (!ok) return;
    const moved = archiveCandidates;
    const hsIds = new Set(oldHs.map(i=>i.id)), giIds = new Set(oldGi.map(i=>i.id)), stlIds = new Set(oldStl.map(s=>s.id));
    set('arc', [...moved, ...arc]);
    set('hs', (D.hs||[]).filter(i=>!hsIds.has(i.id)));
    set('gi', (D.gi||[]).filter(i=>!giIds.has(i.id)));
    set('stl', (D.stl||[]).filter(s=>!stlIds.has(s.id)));
    undo(TT("{0} Einträge archiviert", moved.length), () => {
      setFn('arc', cur => cur.filter(a => !moved.some(m=>m.id===a.id && m.src===a.src)));
      ['hs','gi','stl'].forEach(k => {
        setFn(k, cur => {
          const back = moved.filter(m=>m.src===k).map(({src,...rest})=>rest).filter(r=>!cur.some(x=>x.id===r.id));
          return back.length ? [...back, ...cur] : cur;
        });
      });
    });
  };
  const arcByMonth = () => {
    const groups = {};
    [...arc].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).forEach(it => {
      const ym = ymOf(it.date) || 'unbekannt';
      (groups[ym] = groups[ym] || []).push(it);
    });
    return groups;
  };

  const saveCfg = () => {
    setCfgErr('');
    try {
      const parsed = JSON.parse(cfgText.trim());
      if (!parsed.databaseURL) { setCfgErr('databaseURL fehlt im Config-Objekt.'); return; }
      if (!parsed.apiKey)      { setCfgErr('apiKey fehlt im Config-Objekt.'); return; }
      setFbCfg(parsed);
      setShowSetup(false);
    } catch {
      setCfgErr('Kein gültiges JSON. Bitte das gesamte Config-Objekt einfügen.');
    }
  };

  const joinCode = () => {
    const c = codeInput.trim().toUpperCase();
    if (!c) return;
    if (c === wgCode) { setCodeInput(''); return; } // eigener Code: nichts zu tun — sonst bliebe der wg_join_mode-Marker liegen (Init-Effekt feuert nicht) und würde beim nächsten Reload unbeabsichtigt greifen
    if (hasLocalData) { setPendingJoin(c); return; } // Merge/Überschreiben per Dialog wählen
    sessionStorage.setItem('wg_join_mode','remote');
    setWgCode(c);
    setCodeInput('');
  };
  const doJoin = (mode) => {
    sessionStorage.setItem('wg_join_mode', mode);
    setWgCode(pendingJoin);
    setCodeInput('');
    setPendingJoin(null);
  };

  /* Export */
  const exportData = () => {
    const payload = { _v:1, exportedAt:new Date().toISOString(), data:D };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `wg-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  };

  /* CSV-Export: Ausgaben (hs/gi inkl. Archiv) + Abrechnungen — Semikolon + BOM für deutsches Excel */
  const exportCsv = () => {
    const esc = v => { const s=String(v==null?'':v); return /[;"\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
    const eur = n => Number(n||0).toFixed(2).replace('.',',');
    const uname = id => (D.users||[]).find(u=>u.id===id)?.name||'';
    const catLabel = k => (CATS.find(c=>c[0]===k)||GROW_CATS.find(c=>c[0]===k))?.[2]||'';
    const rows = [['Modul','Name','Betrag (€)','Bezahlt von','Datum','Kategorie','Status']];
    const addRow = (i,mod,st) => rows.push([mod,i.name||'',eur(i.price),uname(i.paidBy),i.date||'',catLabel(i.cat),st]);
    (D.hs||[]).forEach(i=>addRow(i,'Haushalt',i.settled?'abgerechnet':'offen'));
    (D.gi||[]).forEach(i=>addRow(i,'Growbox',i.settled?'abgerechnet':'offen'));
    (D.arc||[]).filter(a=>a.src==='hs'||a.src==='gi').forEach(a=>addRow(a,a.src==='hs'?'Haushalt':'Growbox','archiviert'));
    [...(D.stl||[]), ...(D.arc||[]).filter(a=>a.src==='stl')].forEach(s=>
      rows.push(['Abrechnung', s.mod==='hs'?'Haushalt':'Growbox', eur(s.amount!=null?s.amount:s.total), `${uname(s.fromId)} → ${uname(s.toId)}`, s.date||'', '', `${s.n||0} Posten`]));
    const blob = new Blob(['﻿'+rows.map(r=>r.map(esc).join(';')).join('\r\n')], {type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `wg-export-${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  };

  /* Import */
  const importFile = (file) => {
    setImportErr('');
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async e => {
      let payload;
      try {
        const parsed = JSON.parse(e.target.result);
        payload = parsed?.data ? parsed.data : parsed;
        if (typeof payload !== 'object' || !payload) throw new Error('invalid');
      } catch {
        setImportErr('Datei ist kein gültiges Backup-JSON.');
        return;
      }
      if (await askConfirm({title:TT("Backup importieren"),body:TT("Import überschreibt alle aktuellen Daten auf diesem Gerät (und im Sync). Fortfahren?"),okLabel:TT("Importieren"),danger:true}))
        replaceData(normalizeRemote(payload));   // nimmt beide Formen: App-Export (Listen als Arrays) und Server-/Off-site-Kopie (Listen als {id:item})
    };
    reader.readAsText(file);
  };

  const [copyFail,setCopyFail] = useState(false);
  const copyCode = async () => {
    const ok = await (async () => {
      try { if (navigator.clipboard) { await navigator.clipboard.writeText(wgCode); return true; } } catch {}
      // Fallback ohne Clipboard-API (z.B. http oder iOS-Sonderfälle): verstecktes Textfeld + execCommand
      try {
        const ta=document.createElement('textarea'); ta.value=wgCode;
        ta.style.position='fixed'; ta.style.top='-1000px'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.focus(); ta.select();
        const done=document.execCommand('copy'); ta.remove(); return done;
      } catch { return false; }
    })();
    if (ok) { setCopyFail(false); setCopied(true); setTimeout(()=>setCopied(false), 2000); }
    else    { setCopyFail(true);  setTimeout(()=>setCopyFail(false), 2500); }
  };

  const statusColor  = status==='moved'?'var(--red)':!online?'var(--amber)':status==='synced'?'var(--lime)':status==='connecting'?'var(--amber)':status==='error'?'var(--red)':'var(--label3)';
  const statusLabel  = !online ? 'Offline (lokal speichern, sync wenn online)' : {local:'Nur lokal',connecting:'Verbinde …',synced:'Live synchronisiert ✓',error:'Verbindungsfehler',moved:'WG-Code wurde geändert — neuen Code eingeben'}[status];

  return (
    <div className="screen">
      <NBar title={TT("Mehr")} color="var(--label)" status={status}/>
      <div className="scroll"><div className="content">

        <Fold id="wg" title={TT("🔗 WG-Code & Verbindung")} sub={TT("Code teilen, Sync, Datenbank")} alert={status==='moved'}>
        {/* Sync Status */}
        <div className="rise">
          <div className="section-hdr">{TT("Sync-Status")}</div>
          <div className="group">
            <div className="cell">
              <div style={{width:10,height:10,borderRadius:'50%',background:statusColor,boxShadow:`0 0 10px ${statusColor}`,flexShrink:0}}/>
              <div className="cell-content">
                <span className="cell-title" style={{color:statusColor,fontSize:15}}>{statusLabel}</span>
                {status!=='local'&&<span className="cell-sub">{TT("WG-Code:")} {wgCode}</span>}
              </div>
            </div>
          </div>
        </div>

        {/* WG Code sharing */}
        {fbCfg&&(
          <div className="rise" style={{animationDelay:'40ms'}}>
            <div className="section-hdr">{TT("WG-Code teilen")}</div>
            <div className="group">
              <div className="cell">
                <div className="cell-content">
                  <span className="cell-title num" style={{letterSpacing:'.05em',fontSize:19,fontWeight:700,color:'var(--lime)'}}>{wgCode}</span>
                  <span className="cell-sub">{TT("Diesen Code auf dem anderen Gerät eingeben")}</span>
                </div>
                <button onClick={copyCode} style={{background:'none',border:'none',padding:'7px 4px',color:copyFail?'var(--red)':copied?'var(--green)':'var(--mint)',fontSize:13,fontWeight:700,flexShrink:0}}>
                  {copyFail?'Manuell kopieren':copied?'Kopiert ✓':'Kopieren'}
                </button>
              </div>
              <div className="cell" style={{gap:8}}>
                <input className="field" style={{flex:1,padding:'10px 12px',fontSize:15}} placeholder={TT("Anderen Code eingeben …")}
                  value={codeInput} onChange={e=>setCodeInput(e.target.value.toUpperCase())}/>
                <button onClick={joinCode} style={{background:'var(--mint)',border:'none',borderRadius:11,padding:'11px 14px',color:'var(--ink)',fontSize:14,fontWeight:800,flexShrink:0}}>
                  {TT("Beitreten")}
                </button>
              </div>
              {status!=='moved' && (
                <button className="cell" disabled={rotBusy} onClick={doRotate}
                  style={{width:'100%',border:'none',background:'none',textAlign:'left',fontFamily:'inherit',cursor:rotBusy?'default':'pointer'}}>
                  <div className="cell-icon" style={{background:'rgba(251,113,133,.12)',fontSize:15}}>🔄</div>
                  <div className="cell-content">
                    <span className="cell-title">{rotBusy?'Wechsle Code …':'WG-Code wechseln'}</span>
                    <span className="cell-sub">{TT("Z. B. wenn jemand ausgezogen ist — der alte Code wird gesperrt")}</span>
                  </div>
                </button>
              )}
            </div>
            {rotErr&&<div className="section-ftr" style={{color:'var(--red)'}}>{rotErr}</div>}
            <div className="section-ftr">{TT("⚠️ Beim Beitreten kannst du wählen: mergen oder überschreiben.")}</div>
          </div>
        )}

        {/* Firebase Setup */}
        <div className="rise" style={{animationDelay:'80ms'}}>
          <div className="section-hdr" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <span>{TT("Firebase")} {fbCfg?'(konfiguriert)':'einrichten'}</span>
            {fbCfg&&<button style={{background:'none',border:'none',padding:'7px 4px',color:'var(--mint)',fontSize:13,fontWeight:600,fontFamily:'Hanken Grotesk'}} onClick={()=>setShowSetup(!showSetup)}>{showSetup?'Schließen':'Ändern'}</button>}
          </div>

          {(!fbCfg||showSetup)&&(
            <div className="setup-card" style={{display:'flex',flexDirection:'column',gap:14}}>
              <div>
                <div style={{fontSize:13,fontWeight:700,color:'var(--label)',marginBottom:10}}>{TT("Firebase-Projekt erstellen (kostenlos, 2 Min.)")}</div>
                {[
                  ['console.firebase.google.com öffnen','Neues Projekt anlegen → beliebiger Name → Weiter'],
                  ['Realtime Database aktivieren','Build → Realtime Database → Datenbank erstellen → „Im Testmodus starten"'],
                  ['Web-App hinzufügen','Projekteinstellungen (⚙️) → App hinzufügen → Web → Config-Objekt kopieren'],
                  ['Hier einfügen','Das gesamte JSON-Objekt unten einfügen'],
                ].map(([title,desc],i)=>(
                  <div key={i} className="setup-step">
                    <div className="step-num">{i+1}</div>
                    <div>
                      <div style={{fontSize:13,fontWeight:700,color:'var(--label)'}}>{title}</div>
                      <div style={{fontSize:12,color:'var(--label3)',marginTop:2,lineHeight:1.5}}>{desc}</div>
                    </div>
                  </div>
                ))}
              </div>
              <textarea
                style={{width:'100%',background:'var(--bg3)',border:'none',borderRadius:11,padding:'12px',fontSize:12,color:'var(--label)',fontFamily:'var(--mono)',lineHeight:1.6,minHeight:140,resize:'vertical'}}
                placeholder={'{\n  "apiKey": "AIza…",\n  "databaseURL": "https://…",\n  "projectId": "…"\n}'}
                value={cfgText} onChange={e=>setCfgText(e.target.value)}
              />
              {cfgErr&&<div style={{fontSize:12,color:'var(--red)'}}>{cfgErr}</div>}
              <button className="btn" style={{background:cfgText.trim()?'var(--lime)':'var(--bg3)',color:cfgText.trim()?'var(--ink)':'var(--label3)'}} onClick={saveCfg}>
                {TT("Verbinden")}
              </button>
              {fbCfg&&(
                <button style={{background:'none',border:'none',color:'var(--red)',fontSize:14,fontWeight:600}} onClick={()=>{setFbCfg(null);setCfgText('');setShowSetup(false);}}>
                  {TT("Firebase trennen")}
                </button>
              )}
            </div>
          )}
          {fbCfg&&!showSetup&&(
            <div className="group">
              <div className="cell">
                <div className="cell-icon" style={{background:'rgba(163,230,53,.12)',fontSize:16}}>🔥</div>
                <div className="cell-content">
                  <span className="cell-title">{TT("Verbunden")}</span>
                  <span className="cell-sub">{fbCfg.projectId}</span>
                </div>
                <span style={{fontSize:12,color:'var(--green)',fontWeight:700}}>{TT("Aktiv")}</span>
              </div>
            </div>
          )}
        </div>

        </Fold>
        <Fold id="look" title={TT("🎨 Ansicht & Kalender")} sub={TT("Module, Spielelemente, Hell/Dunkel, Kalender-Abo")}>
        {/* Module sichtbar */}
        <div className="rise" style={{animationDelay:'120ms'}}>
          <div className="section-hdr">{TT("Module anzeigen")}</div>
          <div className="group">
            {[['heute','Heute (Startseite)','var(--mint)'],['haus','Haushalt','var(--mint)'],['grow','Growbox','var(--lime)'],['putz','Putzplan','var(--amber)'],['fin','Privat','var(--violet)'],['abos','Abos','var(--indigo)'],['stats','Übersicht','var(--sky)']].map(([k,label,c])=>(
              <div key={k} className="cell">
                <div style={{width:10,height:10,borderRadius:'50%',background:c,boxShadow:mods[k]?`0 0 8px ${c}`:'none',opacity:mods[k]?1:.35,flexShrink:0}}/>
                <div className="cell-content">
                  <span className="cell-title">{label}</span>
                </div>
                <button onClick={()=>setMods({...mods,[k]:!mods[k]})}
                  style={{background:mods[k]?c:'var(--bg3)',color:mods[k]?'var(--ink)':'var(--label)',border:'none',borderRadius:14,padding:'7px 16px',fontSize:13,fontWeight:800}}>
                  {mods[k]?'An':'Aus'}
                </button>
              </div>
            ))}
          </div>
          <div className="section-ftr">{TT("Mindestens ein Modul muss aktiv sein.")}</div>
        </div>

        {/* Spielelemente: nur dieses Gerät; die Push-Einstellung „game" zieht mit (Montags-Ergebnis vom Server) */}
        <div className="rise" style={{animationDelay:'125ms'}}>
          <div className="section-hdr">{TT("Spielelemente")}</div>
          <div className="group">
            <div className="cell">
              <div className="cell-icon" style={{background:'rgba(251,191,36,.12)',fontSize:17}}>👑</div>
              <div className="cell-content">
                <span className="cell-title">{TT("Wochen-Duell &amp; Serie")}</span>
                <span className="cell-sub">{TT("👑 Wochensieger, 🔥 pünktlich in Folge, Montags-Ergebnis per Push")}</span>
              </div>
              <button data-testid="game-toggle" aria-pressed={mods.game!==false}
                onClick={()=>{ const on = mods.game===false; setMods({...mods, game:on}); setPref({game:on}); }}
                style={{background:mods.game!==false?'var(--amber)':'var(--bg3)',color:mods.game!==false?'var(--ink)':'var(--label)',border:'none',borderRadius:14,padding:'7px 16px',fontSize:13,fontWeight:800}}>
                {mods.game!==false?'An':'Aus'}
              </button>
            </div>
          </div>
          <div className="section-ftr">{TT("Gilt nur für dieses Gerät. Punkte und Fairness zählen immer, du blendest nur Duell und Serie aus.")}</div>
        </div>
        <LookCard/>
        <CalendarCard/>
        <VoiceCard/>

        </Fold>
        <Fold id="data" title={TT("💾 Daten & Backup")} sub={TT("Archiv, Backups, Fehlerprotokoll")} alert={(typeof bkAgeS==='number' && bkAgeS>2) || (D.err||[]).length>0}>
        {/* Archiv */}
        <div className="rise" style={{animationDelay:'150ms'}}>
          <div className="section-hdr">{TT("Archiv")}</div>
          <div className="group">
            <div className="cell">
              <div className="cell-icon" style={{background:'rgba(56,189,248,.12)',fontSize:15}}>🗄️</div>
              <div className="cell-content">
                <span className="cell-title">{TT("Abgerechnetes archivieren")}</span>
                <span className="cell-sub">{archiveCount>0 ? `${archiveCount} Posten älter als 3 Monate` : 'Nichts zu archivieren'}</span>
              </div>
              <button onClick={doArchive} disabled={archiveCount===0}
                style={{background:archiveCount>0?'var(--sky)':'var(--bg3)',color:archiveCount>0?'var(--ink)':'var(--label2)',border:'none',borderRadius:14,padding:'7px 16px',fontSize:13,fontWeight:800,opacity:archiveCount===0?.5:1}}>
                {TT("Archivieren")}
              </button>
            </div>
            {arc.length>0 && (
              <div className="cell" style={{cursor:'pointer'}} onClick={()=>setShowArchive(true)}>
                <div className="cell-icon" style={{background:'rgba(148,163,184,.12)',fontSize:15}}>📂</div>
                <div className="cell-content">
                  <span className="cell-title">{TT("Archiv ansehen")}</span>
                  <span className="cell-sub">{arc.length} {TT("Einträge")}</span>
                </div>
              </div>
            )}
          </div>
        </div>

        {/* Backup / Restore */}
        <div className="rise" style={{animationDelay:'160ms'}}>
          <div className="section-hdr">{TT("Backup")}</div>
          {typeof bkAgeS==='number' && bkAgeS>2 && (
            <div role="alert" style={{margin:'0 0 10px',padding:'11px 13px',borderRadius:13,background:'rgba(251,191,36,.1)',border:'1px solid rgba(251,191,36,.35)',fontSize:13,color:'var(--label)',lineHeight:1.5}}>
              {TT("⚠️ Letzte automatische Sicherung vor")} {bkAgeS} {TT("Tagen — der tägliche Server-Job läuft offenbar nicht. „Automatische Backups → Jetzt sichern\" hilft sofort; bitte Bescheid geben.")}
            </div>
          )}
          <div className="group">
            <div className="cell" style={{cursor:'pointer'}} onClick={exportData}>
              <div className="cell-icon" style={{background:'rgba(74,222,128,.12)',fontSize:15}}>⬇️</div>
              <div className="cell-content">
                <span className="cell-title">{TT("Als JSON exportieren")}</span>
                <span className="cell-sub">{TT("Lädt eine Backup-Datei herunter")}</span>
              </div>
            </div>
            <div className="cell" style={{cursor:'pointer'}} onClick={exportCsv}>
              <div className="cell-icon" style={{background:'rgba(56,189,248,.12)',fontSize:15}}>📊</div>
              <div className="cell-content">
                <span className="cell-title">{TT("Als CSV exportieren")}</span>
                <span className="cell-sub">{TT("Ausgaben + Abrechnungen für Excel/Sheets")}</span>
              </div>
            </div>
            <div className="cell" style={{cursor:'pointer'}} onClick={()=>fileInputRef.current?.click()}>
              <div className="cell-icon" style={{background:'rgba(94,234,212,.12)',fontSize:15}}>⬆️</div>
              <div className="cell-content">
                <span className="cell-title">{TT("Backup importieren")}</span>
                <span className="cell-sub">{TT("Überschreibt aktuelle Daten")}</span>
              </div>
            </div>
            {PUSH_API && fbCfg && status!=='moved' && (
              <button className="cell" onClick={openBackups}
                style={{width:'100%',border:'none',background:'none',textAlign:'left',fontFamily:'inherit',cursor:'pointer'}}>
                <div className="cell-icon" style={{background:'rgba(129,140,248,.12)',fontSize:15}}>☁️</div>
                <div className="cell-content">
                  <span className="cell-title">{TT("Automatische Backups")}</span>
                  <span className="cell-sub">{TT("Täglich auf dem Server, je 14 Tage — löschen kann sie in der Zeit niemand")}</span>
                </div>
                <span style={{color:'var(--label3)',fontSize:22,lineHeight:1,flexShrink:0}}>›</span>
              </button>
            )}
          </div>
          <input ref={fileInputRef} type="file" accept="application/json,.json" style={{display:'none'}}
            onChange={e=>{importFile(e.target.files?.[0]); e.target.value='';}}/>
          {importErr&&<div className="section-ftr" style={{color:'var(--red)'}}>{importErr}</div>}
        </div>

        {/* Fehlerprotokoll — nur sichtbar, wenn es Einträge gibt (Einträge aller Geräte, max. 30) */}
        {(D.err||[]).length>0 && (
          <div className="rise" style={{animationDelay:'180ms'}}>
            <div className="section-hdr" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <span>{TT("🐞 Fehlerprotokoll ·")} {(D.err||[]).length}</span>
              <button style={{background:'none',border:'none',padding:'7px 4px',color:'var(--mint)',fontSize:13,fontWeight:700,fontFamily:'inherit'}} onClick={()=>set('err',[])}>{TT("Protokoll leeren")}</button>
            </div>
            <div className="group">
              {(D.err||[]).slice(0,30).map(e=>(
                <div key={e.id} className="cell err-row">
                  <div className="cell-content" style={{minWidth:0}}>
                    <span className="cell-sub">{fmtErrTime(e.t)} · {e.dev||'?'}{e.b?` · Build ${e.b}`:''}</span>
                    <span className="num" style={{fontSize:12.5,color:'var(--label)',wordBreak:'break-word',lineHeight:1.45}}>{e.m}{e.s?` (${e.s}${e.l?':'+e.l:''})`:''}</span>
                  </div>
                </div>
              ))}
            </div>
            <div className="section-ftr">{TT("Fehler von allen Geräten der WG. Wenn etwas komisch läuft: Screenshot dieser Liste weitergeben.")}</div>
          </div>
        )}

        </Fold>
        <Fold id="home" title={TT("🏠 Wohnung")} sub={TT("Wartung, Ausleihe, Inventar, Kaution, Gast-Link, Auszug")}>
        <MaintCard/>
        <LoanCard/>
        <InventoryCard/>
        <LandlordCard/>
        <DepositCard/>
        <GuestCard/>
        <MoveOutCard/>
        </Fold>

/* ══════════════════════════
   STATISTIK / ÜBERSICHT
══════════════════════════ */
function Statistik() {
  const { D, status, setFn, mods } = useD();
  const users=D.users, hs=D.hs||[], gi=D.gi||[], ab=D.ab||[], gp=D.gp||{}, arc=D.arc||[], pl=D.pl||[];
  const [ym,setYm] = useState(()=>todayISO().slice(0,7));
  const nowYm = todayISO().slice(0,7);
  const [budCat,setBudCat] = useState(null); // Kategorie, für die gerade ein Budget gesetzt wird
  // Charts erst beim ersten Sichtbarwerden füllen (once) — nutzt die bestehenden width/height-Transitions
  const [payRef,paySeen]   = useInView();
  const [bearRef,bearSeen] = useInView();
  const [catRef,catSeen]   = useInView();
  const [gcatRef,gcatSeen] = useInView();
  const [trendRef,trendSeen] = useInView();
  const [plRef,plSeen]     = useInView();

  // Archivierte hs/gi-Ausgaben fließen weiter in Monatswähler/Trend/Größte Posten ein
  // (stl-Archiv-Einträge sind Abrechnungen, keine Ausgaben — bleiben außen vor).
  const arcExpenses = arc.filter(a=>a.src==='hs'||a.src==='gi').map(({src,...rest})=>({...rest,mod:src}));
  const all = [...hs.map(i=>({...i,mod:'hs'})), ...gi.map(i=>({...i,mod:'gi'})), ...arcExpenses];
  const month = all.filter(i=>ymOf(i.date)===ym);
  const total = month.reduce((s,i)=>s+(i.price||0),0);
  const hsSum = month.filter(i=>i.mod==='hs').reduce((s,i)=>s+i.price,0);
  const giSum = month.filter(i=>i.mod==='gi').reduce((s,i)=>s+i.price,0);
  const paidBy = users.map(u=>({...u, paid: month.filter(i=>i.paidBy===u.id).reduce((s,i)=>s+i.price,0)}));
  /* Tatsächlicher Anteil je Person (nach Split): Haushalt owedBy/50-50, Growbox nach Pflanzen-Anteil */
  const giTot = Object.values(gp).reduce((s,v)=>s+(parseInt(v)||0),0);
  const shareOf = (i,id) => i.mod==='hs'
    ? (i.owedBy ? (i.owedBy===id?i.price:0) : i.price/users.length)
    : i.price * (giTot>0 ? (parseInt(gp[id]||0)/giTot) : 1/users.length);
  const bears = users.map(u=>({...u, share: month.reduce((s,i)=>s+shareOf(i,u.id),0)}));
  const top = [...month].sort((a,b)=>b.price-a.price).slice(0,5);
  const moAbos = ab.reduce((s,x)=>s+(x.iv==='m'?x.price:x.price/12),0);
  const trend = Array.from({length:6},(_,k)=>{ const m=ymShift(ym,-(5-k)); return {m, t: all.filter(i=>ymOf(i.date)===m).reduce((s,i)=>s+i.price,0)}; });
  const trendMax = Math.max(...trend.map(t=>t.t),1);

  // Δ zum Vormonat: prev≈0 → keine sinnvolle Prozent-Basis, Zeile bleibt weg.
  const prevYm = ymShift(ym,-1);
  const prev = all.filter(i=>ymOf(i.date)===prevYm).reduce((s,i)=>s+(i.price||0),0);
  const deltaRatio = prev>0.005 ? Math.abs(total-prev)/prev : null;
  const deltaPct = deltaRatio!=null ? Math.round(deltaRatio*100) : null;

  // Gesamt-Saldo über alles (2 Personen): offene hs+gi-Posten, gleiche Split-Logik wie die Tabs.
  // Nur Anzeige — abgerechnet wird weiter pro Modul.
  const openAll = [...hs.filter(i=>!i.settled).map(i=>({...i,mod:'hs'})), ...gi.filter(i=>!i.settled).map(i=>({...i,mod:'gi'}))];
  const netOf = id => myBalance(D, id, mods).total;   // gleiche Rechnung wie Heute/Pop-up (Growbox nach Pflanzen-Anteilen)

/* Persönliche Netto-Bilanz (Haushalt + Growbox) aus me-Sicht — fürs Start-Pop-up.
   total<0 = ich schulde. hs/g = Netto pro Bereich, other = der Gläubiger (2-Personen-WG). */
function myBalance(D, me, mods){
  const users = D.users||[];
  const open = (D.hs||[]).filter(i=>!i.settled);
  const shareOf=(i,id)=>i.owedBy?(i.owedBy===id?i.price:0):i.price/(users.length||1);
  const hs = me ? open.reduce((s,i)=>s+((i.paidBy===me?(i.price||0):0)-shareOf(i,me)),0) : 0;
  const growOn = mods.grow!==false;
  const g = (me&&growOn) ? growCalc(D).net(me) : 0;
  const other = users.length === 2 ? (users.find(u=>u.id!==me) || null) : null;   // ab 3 Personen kein festes Gegenüber
  return { total: hs+g, hs, g, growOn, other };
}

/* Idiotensicheres Start-Pop-up: großer offener Betrag, wenn me beim Öffnen Schulden hat. */
function DebtAlert({ info, onClose }){
  const amt = Math.abs(info.total);
  // Aufschlüsselung nur zeigen, wenn KEIN Bereich ein Guthaben ist — sonst summieren die Teilbeträge
  // nicht zum Gesamtbetrag (z.B. Haushalt −35 + Growbox +2 = −33 → „€33" mit „Haushalt €35" wäre widersprüchlich).
  const noCredit = info.hs < 0.01 && (!info.growOn || info.g < 0.01);
  const showBreakdown = noCredit && (info.hs < -0.01 || (info.growOn && info.g < -0.01));
  return ReactDOM.createPortal(
    <div className="overlay" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="sheet-handle"/>
        <div className="sheet-body" style={{textAlign:'center',alignItems:'center',gap:6,paddingTop:6}}>
          <div style={{fontSize:44,lineHeight:1}}>💸</div>
          <div className="hero-lbl" style={{marginTop:6}}>{TT("Deine Bilanz")}</div>
          <div style={{fontSize:15.5,color:'var(--label2)',fontWeight:600}}>{TT("Du schuldest")} {info.other?.name || 'der WG'}</div>
          <div className="num" style={{fontSize:56,fontWeight:800,color:'var(--amber)',lineHeight:1.05,margin:'6px 0 4px'}}>€{fmt(amt)}</div>
          {showBreakdown && (
            <div style={{display:'flex',justifyContent:'center',gap:22,marginTop:6,fontSize:13.5,color:'var(--label3)'}}>
              {info.hs<-0.01 && <span>{TT("Haushalt")} <span className="num" style={{color:'var(--label2)',fontWeight:700}}>€{fmt(-info.hs)}</span></span>}
              {info.growOn&&info.g<-0.01 && <span>{TT("Growbox")} <span className="num" style={{color:'var(--label2)',fontWeight:700}}>€{fmt(-info.g)}</span></span>}
            </div>
          )}
        </div>
        <div className="sheet-acts">
          <button className="btn" style={{background:'var(--mint)',color:'var(--ink)',flex:1}} onClick={onClose}>{TT("Später")}</button>
        </div>
      </div>
    </div>,
    document.body
  );
}

/* Start-Fenster: fordert zum Aktivieren der Push-Benachrichtigungen auf — ohne Push kommen keine
   Ausgaben-/Einkaufs-/Board-Meldungen an. iOS-Safari ohne Installation kann kein Push → Install-Hinweis. */
function PushPrompt({ onClose }){
  const { D, me, pushSave } = useD();
  const [busy,setBusy] = useState(false);
  const [err,setErr] = useState('');
  const iOS = (()=>{ try { return /iphone|ipad|ipod/i.test(navigator.userAgent||''); } catch { return false; } })();
  const standalone = (()=>{ try { return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; } catch { return false; } })();
  const capable = typeof window!=='undefined' && 'Notification' in window && 'serviceWorker' in navigator && 'PushManager' in window;
  const needsInstall = iOS && !standalone && !capable;
  const activate = async () => {
    setBusy(true); setErr('');
    try {
      let perm = Notification.permission;
      if (perm !== 'granted') perm = await Notification.requestPermission();
      if (perm !== 'granted') { setErr('Nicht erlaubt. Du kannst es später unter „Mehr → Push an die WG" nachholen.'); setBusy(false); return; }
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });
      const j = sub.toJSON()||{};
      const prefs = { ...PUSH_PREFS_DEF, ...(ls('wg_push_prefs',{})||{}) };
      await pushSave({ endpoint:j.endpoint, p256dh:(j.keys&&j.keys.p256dh)||null, auth:(j.keys&&j.keys.auth)||null, name:(D.users?.find(u=>u.id===me)?.name)||'Gerät', t:Date.now(), ...prefs });
      onClose();
    } catch { setErr('Konnte nicht aktivieren — bist du online und mit der WG verbunden?'); setBusy(false); }
  };
  return ReactDOM.createPortal(
    <div className="overlay" onClick={busy?undefined:onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="sheet-handle"/>
        <div className="sheet-body" style={{gap:12,paddingTop:6,textAlign:'center',alignItems:'center'}}>
          <div style={{fontSize:44,lineHeight:1}}>🔔</div>
          <div className="hero-lbl">{TT("Benachrichtigungen")}</div>
          <div style={{fontSize:14,color:'var(--label2)',lineHeight:1.55}}>
            {needsInstall
              ? <>{TT("Damit die App vollständig funktioniert, füge sie erst zum Home-Bildschirm hinzu: in Safari unten auf")} <b>{TT("Teilen")}</b> → <b>{TT("Zum Home-Bildschirm")}</b>{TT(". Danach kannst du Push aktivieren.")}</>
              : <>{TT("Erlaube Benachrichtigungen, sonst verpasst du neue Ausgaben, Einkäufe, Besuch und Erinnerungen.")} <b>{TT("Ohne Push funktioniert die App nicht vollständig.")}</b></>}
          </div>
          {err && <div style={{fontSize:12.5,color:'var(--amber)',fontWeight:600,lineHeight:1.5}}>{err}</div>}
        </div>
        <div className="sheet-acts">
          <button className="btn btn-sec" style={{flex:1}} disabled={busy} onClick={onClose}>{TT("Später")}</button>
          {!needsInstall && <button className="btn" style={{background:'var(--sky)',color:'var(--ink)',flex:1,whiteSpace:'nowrap',opacity:busy?.6:1}} disabled={busy} onClick={activate}>{busy?'…':'🔔 Erlauben'}</button>}
        </div>
      </div>
    </div>, document.body);
}

function AppInner() {
  const { mods, remotePulse, D, me, pushSave, status, wgCode, setFn, fbCfg } = useD();
  // App-Kürzel (?a=…) einmal lesen und aus der Adresse entfernen — sonst liefe es bei jedem Neuladen erneut
  useState(() => { try { const q = new URLSearchParams(location.search), jn = q.get('join'); if (jn) { JOIN_CODE = jn.trim().toUpperCase().slice(0,60); history.replaceState(null, '', location.pathname); } } catch {}
  try { const q = new URLSearchParams(location.search), a = q.get('a'); if (a) { SHORTCUT = a; const t = q.get('t'); if (t && a==='ausgabe') SHORTCUT_TEXT = t.slice(0,80); history.replaceState(null, '', location.pathname); } } catch {} return null; });
  const visibleTabs = TABS.filter(t => t.id==='set' || mods[t.id] !== false);
  const [tab,setTab_] = useState(() => {
    if (SHORTCUT) return SHORTCUT==='muell' ? 'putz' : (SHORTCUT==='waesche' && mods.heute!==false) ? 'heute' : 'haus';   // Timer lebt auf „Heute“
    const saved = ls('wg_tab', null); // letzten Tab merken
    return (saved && (saved==='set' || mods[saved] !== false)) ? saved : (visibleTabs[0]?.id || 'set');
  });
  const [dir,setDir] = useState(1); // Slide-Richtung: +1 neuer Tab rechts, -1 links
  const idxOf = (id) => TABS.findIndex(t => t.id===id);
  const setTab = (id) => { setDir(idxOf(id) >= idxOf(tab) ? 1 : -1); setTab_(id); ss('wg_tab', id); };
  const [toast,setToast] = useState(false);
  // Fehlerprotokoll: roter Punkt am Tab „Mehr", bis dieses Gerät die Einträge gesehen hat (je Gerät gemerkt)
  const [errSeen,setErrSeen] = useState(() => ls('wg_err_seen', 0) || 0);
  const errNew = (D.err || []).some(e => (e.t || 0) > errSeen);
  useEffect(() => { if (tab === 'set' && errNew) { const t = Date.now(); setErrSeen(t); ss('wg_err_seen', t); } }, [tab, errNew]);
  /* Backup-Wächter: höchstens alle 6 Std. die Liste der Server-Backups holen. Ist die neueste älter als 2 Tage (oder
     gibt es 2 Tage nach dem ersten Blick noch keine), läuft der tägliche Server-Job offenbar nicht — das soll auffallen
     (Punkt am Tab „Mehr" + Hinweis im Backup-Bereich) statt still wegzubrechen. */
  const [bkAge,setBkAge] = useState(() => ls('wg_bk_age', null));
  useEffect(() => {
    if (!PUSH_API || status !== 'synced' || !navigator.onLine || !wgCode) return;
    if (Date.now() - (ls('wg_bk_check', 0) || 0) < 6 * 3600e3) return;
    ss('wg_bk_check', Date.now());
    fetch(`${PUSH_API}/api/backup?code=${encodeURIComponent(wgCode)}`).then(r => r.ok ? r.json() : null).then(j => {
      if (!j || !Array.isArray(j.days)) return;
      const age = backupAgeDays(j.days); ss('wg_bk_age', age); setBkAge(age);
    }).catch(() => {});
  }, [status, wgCode]);
  const bkStale = typeof bkAge === 'number' && bkAge > 2;
  const myChores = me ? choreMine(D.pt, me).length : 0;   // Tab-Punkt Putzplan
  /* Abwesenheit: Aufgaben von Abwesenden gehen an den, der da ist (idempotent — beide Geräte schreiben dasselbe) */
  useEffect(() => {
    if (fbCfg && wgCode && status !== 'synced') return;
    const users = D.users || []; if (users.length < 2) return;
    const away = users.filter(u=>isAway(u.id)).map(u=>u.id);
    if (!away.length || away.length === users.length) return;
    if (!(D.pt||[]).some(t=>t && away.includes(t.assignee))) return;
    const to = users.find(u=>!away.includes(u.id)).id;
    setFn('pt', cur=>cur.map(t=>t && away.includes(t.assignee) ? {...t, assignee:to} : t));
  }, [D.pt, D.aw, status]);
  // „Neue Version": ein neuer Service Worker hat übernommen (s. Skript am Seitenende) — Hinweis mit Knopf
  const [updReady,setUpdReady] = useState(() => !!window.__wgUpdReady);
  useEffect(() => { const on = () => setUpdReady(true); window.addEventListener('wg-update', on); return () => window.removeEventListener('wg-update', on); }, []);
  // Einrichtungs-Assistent (wg-v72): frisches Gerät oder Einladungslink; „Mehr → Mein Profil einrichten" öffnet 'personal'.
  // Einladungslink auf einem schon eingerichteten Gerät mit anderem Code wird ignoriert (würde sonst die WG wechseln).
  const [onb,setOnb] = useState(() => {
    const fresh = !!ls('wg_fresh', null) && !ls(SETUP_KEY, null);
    if (JOIN_CODE && !fresh) JOIN_CODE = null;
    return JOIN_CODE ? 'join' : fresh ? 'new' : null;
  });
  useEffect(() => { const h = () => setOnb('personal'); window.addEventListener('wg-onboarding', h); return () => window.removeEventListener('wg-onboarding', h); }, []);
  // Start-Flow (max. 1× pro Woche, nicht bei jedem Öffnen): erst PayPal einrichten (falls kein Handle),
  // danach der offene Schuldbetrag groß (idiotensicher) — beide mit „Später"-Option.
  const [debtInfo,setDebtInfo] = useState(null);
  const [startStep,setStartStep] = useState(null); // 'push' | 'pp' | 'debt' | null
  const [startNeedsPP,setStartNeedsPP] = useState(false); // merkt sich für die Weiterschaltung push → pp
  const startShownRef = useRef(false);
  useEffect(() => {
    if (startShownRef.current) return;
    if (!me || !(D.users||[]).length) return;
    // kurz warten, bis der initiale RTDB-Sync durch ist → Flow nutzt den frischesten Stand
    let retry = null;
    const tryStart = () => {
      if (startShownRef.current) return;
      // Ist schon ein Fenster offen (z. B. direkt nach dem Öffnen „+ Ausgabe" angetippt), nicht dazwischenfunken:
      // sonst legt sich das Startfenster über das halb ausgefüllte Formular (per Test-Wackler gefunden, 15.09.).
      // Neu versuchen, sobald es zu ist — der Hinweis selbst geht nicht verloren.
      if (document.querySelector('.overlay')) { retry = setTimeout(tryStart, 1500); return; }
      startShownRef.current = true;
      if (ls(SETUP_KEY, null) === todayISO()) return;     // gerade eingerichtet → Assistent hat schon gefragt
      const last = ls('wg_start_shown', null);
      if (last && daysSince(last) < 7) return;            // diese Woche schon dran → nichts
      // Push: fehlt die Berechtigung (oder iOS ohne Installation), ist die App nicht vollständig → zuerst auffordern
      const capable = 'Notification' in window && 'serviceWorker' in navigator && 'PushManager' in window;
      const iOS = /iphone|ipad|ipod/i.test(navigator.userAgent||'');
      const standalone = (()=>{ try { return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; } catch { return false; } })();
      const needsPush = !!PUSH_API && ((capable && Notification.permission!=='granted') || (iOS && !standalone));
      const meUser = (D.users||[]).find(u=>u.id===me);
      const needsPP = !!(meUser && !ppHandle(meUser.pp));
      const bal = myBalance(D, me, mods);
      const hasDebt = bal.total < -0.01;
      if (!needsPush && !needsPP && !hasDebt) return;      // nichts zu zeigen → Marker NICHT setzen
      ss('wg_start_shown', todayISO());                    // Wochen-Sperre erst ab dem Moment, wo etwas gezeigt wurde
      if (hasDebt) setDebtInfo(bal);
      setStartNeedsPP(needsPP);
      setStartStep(needsPush ? 'push' : needsPP ? 'pp' : 'debt');
    };
    const t = setTimeout(tryStart, 700);
    return () => { clearTimeout(t); clearTimeout(retry); };
  }, [me, D, mods]);
  // Wenn der aktive Tab versteckt wird, auf ersten sichtbaren springen
  useEffect(() => {
    if (!visibleTabs.find(t=>t.id===tab)) setTab(visibleTabs[0]?.id || 'set');
  }, [mods]);
  // Lokale Erinnerungen: einmal pro Tag beim Öffnen — überfällige Putzaufgaben & bald fällige Abos
  useEffect(() => {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    if (ls('wg_notify','off') !== 'on') return;
    const today = todayISO();
    if (ls('wg_notify_last', null) === today) return;
    const timer = setTimeout(() => {
      const tasks = D.pt || [], subs = D.ab || [];
      const due  = (mods.putz!==false) ? (me ? choreMine(tasks, me) : tasks.filter(t=>choreDueIn(t)<=0)) : [];
      const soon = (mods.abos!==false) ? subs.filter(s=>{ const d=daysSince(s.sd),p=s.iv==='m'?30:365; return (p-(d%p))<=3; }) : [];
      const msgs = [];
      if (due.length)  msgs.push(`🧹 ${due.length} Putzaufgabe${due.length>1?'n':''} ${me?'für dich ':''}fällig: ${due.slice(0,3).map(t=>t.name).join(', ')}`);
      if (soon.length) msgs.push(`🔄 ${soon.length} Abo${soon.length>1?'s':''} bald fällig: ${soon.slice(0,3).map(s=>s.name).join(', ')}`);
      if (msgs.length) { ss('wg_notify_last', today); showLocalNote('WG — Erinnerung', msgs.join('\n')); }
    }, 4000);
    return () => clearTimeout(timer);
  }, [D, mods, me]);
  // Live-Toast wenn Änderung vom anderen Gerät reinkommt
  useEffect(() => {
    if (remotePulse === 0) return;
    setToast(true);
    const t = setTimeout(()=>setToast(false), 2800);
    return () => clearTimeout(t);
  }, [remotePulse]);
  return (
    <>
      <div key={tab} className={`tab-view ${dir>=0?'tab-in-r':'tab-in-l'}`}>
        {/* Seitenüberschrift: das Dokument hatte bisher gar keine Überschrift —
            Screenreader konnten nicht sagen, welcher Bereich offen ist. */}
        <h1 className="sr-only">{(TABS.find(t=>t.id===tab)||{}).label || 'WG'}</h1>
        {tab==='heute'&&<Heute goTab={setTab}/>}
        {tab==='haus'&&<Haushalt goGrow={()=>setTab('grow')} goPutz={()=>setTab('putz')}/>}
        {tab==='grow'&&<Grow/>}
        {tab==='putz'&&<Putzplan/>}
        {tab==='fin' &&<Finanzen/>}
        {tab==='abos'&&<Abos/>}
        {tab==='stats'&&<Statistik/>}
        {tab==='set' &&<Einstellungen/>}
      </div>
      {toast&&(
        <div className="toast">
          <Ic d={ICONS.bolt} color="var(--lime)" size={14} sw={2.2}/>
          {TT("Live aktualisiert — neuer Eintrag vom anderen Gerät")}
        </div>
      )}
      <GlobalUI/>
      {onb && <Onboarding mode={onb} onDone={()=>setOnb(null)}/>}
      {startStep==='push' && <PushPrompt onClose={()=>setStartStep(startNeedsPP ? 'pp' : (debtInfo ? 'debt' : null))}/>}
      {startStep==='pp' && <PayPalSetup onClose={()=>setStartStep(debtInfo ? 'debt' : null)}/>}
      {startStep==='debt' && debtInfo && <DebtAlert info={debtInfo} onClose={()=>setStartStep(null)}/>}
      {status==='moved' && (
        <div className="moved-banner" role="alert">
          <span>{TT("🔑 Euer WG-Code wurde geändert. Frag deinen Mitbewohner nach dem neuen Code.")}</span>
          <button onClick={()=>setTab('set')}>{TT("Neuen Code eingeben ›")}</button>
        </div>
      )}
      {status!=='moved' && updReady && (
        <div className="moved-banner upd-banner" role="status">
          <span>{TT("✨ Eine neue Version der App ist da.")}</span>
          <button onClick={()=>location.reload()}>{TT("Jetzt neu laden")}</button>
        </div>
      )}
      <ShortcutRunner goTab={setTab}/>
      <div className="tabbar">
        {visibleTabs.map(t=>(
          <button key={t.id} className={`tabitem${tab===t.id?' on':''}`} aria-current={tab===t.id?'page':undefined}
            onClick={()=>setTab(t.id)} style={{color:tab===t.id?t.color:'var(--label3)'}}>
            {tab===t.id&&<div className="tab-glow"/>}
            {t.id==='putz' && myChores>0 && tab!=='putz' && <span className="tab-dot" style={{background:'var(--amber)'}} aria-label={TT("{0} Putzaufgabe{1} für dich fällig", myChores, myChores>1?'n':'')}/>}
            {t.id==='set' && (errNew || bkStale) && tab!=='set' && <span className="tab-dot" aria-label={bkStale ? 'Backup-Warnung' : 'Neue Einträge im Fehlerprotokoll'}/>}
            <Ic d={t.icon} color={tab===t.id?t.color:'var(--label3)'} size={23} sw={tab===t.id?2.1:1.6}/>
            <span>{t.label}</span>
          </button>
        ))}
      </div>
    </>
  );
}

/* Notbremse für Abstürze beim Rendern: statt einer weißen Seite eine Ansicht mit „Neu laden" — und der Fehler
   landet im Fehlerprotokoll (Früh-Skript-Warteschlange → err). Klasse, weil nur Klassen Render-Fehler fangen können.
   Liegt INNERHALB von DataProvider, damit das Nachtragen ins Protokoll (drain) weiterläuft. */
class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  componentDidCatch(err) {
    try { window.__wgErr && window.__wgErr('Render: ' + ((err && err.message) || err), 'react', 0); } catch {}
  }
  render() {
    if (!this.state.err) return this.props.children;
    return (
      <div style={{minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:14,padding:'32px 24px',textAlign:'center',color:'var(--label)'}}>
        <div style={{fontSize:44,lineHeight:1}}>😵</div>
        <div style={{fontSize:18,fontWeight:800}}>{TT("Da ist etwas schiefgelaufen")}</div>
        <div style={{fontSize:14,color:'var(--label2)',lineHeight:1.55,maxWidth:320}}>{TT("Eure Daten sind gespeichert. Der Fehler steht im Fehlerprotokoll unter „Mehr\".")}</div>
        <div className="num" style={{fontSize:11.5,color:'var(--label3)',maxWidth:320,wordBreak:'break-word'}}>{String((this.state.err && this.state.err.message) || this.state.err).slice(0,160)}</div>
        <button className="btn" style={{background:'var(--mint)',color:'var(--ink)',maxWidth:260}} onClick={()=>location.reload()}>{TT("Neu laden")}</button>
      </div>
    );
  }
}

function App() {
  return (
    <DataProvider>
      <ErrorBoundary>
        <AppInner/>
      </ErrorBoundary>
    </DataProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
/* ── JSX-Compile-Cache ───────────────────────────────────────────────────────
   Der App-Code oben ist JSX und musste bisher bei JEDEM Start von
   @babel/standalone (2,8 MB) im Browser übersetzt werden. Gemessen mit 4× CPU-
   Drosselung (≈ Mittelklasse-Handy): 11,6 s bis die App bedienbar war, davon
   9,6 s ein einziger Long-Task (Babel-Parse + Transform).

   Jetzt: einmal übersetzen, Ergebnis unter einem Hash des Quelltexts in
   localStorage legen und beim nächsten Start direkt ausführen — Babel wird dann
   gar nicht erst geladen. Ändert sich der Quelltext (Deploy), ändert sich der
   Hash → automatisch neu übersetzt, kein Bump von Hand nötig.
   Kein Build-Schritt, die Datei bleibt weiterhin allein lauffähig. */
(function () {
  var src = document.getElementById('jsx-src').textContent;
  // FNV-1a über den Quelltext (~10 ms) — Cache-Schlüssel, damit alter Code nie überlebt
  var h = 2166136261;
  for (var i = 0; i < src.length; i++) { h ^= src.charCodeAt(i); h = Math.imul(h, 16777619); }
  var KEY = 'wg_jsx_' + (h >>> 0).toString(36) + '_' + src.length;
  window.__wgBuild = (h >>> 0).toString(36);   // Build-Kennung fürs Fehlerprotokoll (ändert sich mit jedem Deploy)

  function run(code) {
    var s = document.createElement('script');
    s.text = code + '\n//# sourceURL=wgapp-jsx.js';
    document.head.appendChild(s);
  }

  var cached = null;
  try { cached = localStorage.getItem(KEY); } catch (e) {}
  if (cached) {
    run(cached);
    // Selbstheilung: sollte das Kompilat im Speicher je beschädigt sein, rendert nichts.
    // Dann Cache wegwerfen und EINMAL pro Sitzung neu laden (kein Reload-Kreisel).
    setTimeout(function () {
      if (document.getElementById('root').firstChild) return;
      try {
        if (sessionStorage.getItem('wg_jsx_healed')) return;
        sessionStorage.setItem('wg_jsx_healed', '1');
        localStorage.removeItem(KEY);
      } catch (e) { return; }
      location.reload();
    }, 5000);
    return;
  }

  // Quelltext hat sich geändert → alte Kompilate wegräumen (sonst wächst der Speicher)
  try {
    Object.keys(localStorage).forEach(function (k) { if (k.indexOf('wg_jsx_') === 0) localStorage.removeItem(k); });
  } catch (e) {}

  var b = document.createElement('script');
  b.src = 'vendor/babel-standalone-7.25.6.min.js';   // selbst gehostet (npm @babel/standalone), liegt im SW-Cache
  b.onload = function () {
    var code;
    try {
      // exakt die Optionen, die babel-standalone für <script type="text/babel"> nutzt
      // (nur ohne inline-sourcemap — die verdoppelt das Kompilat im Cache)
      code = Babel.transform(src, {
        filename: 'wgapp.jsx',
        presets: ['react', 'env'],
        plugins: ['transform-class-properties', 'transform-object-rest-spread', 'transform-flow-strip-types'],
        sourceMaps: false,
        // Seit wg-v75 ist der Quelltext > 500 KB. Ohne feste Angabe schaltet Babel selbst auf „compact"
        // und schreibt dabei einen Hinweis in die Konsole — Tests werten jede Konsolenmeldung als Fehler.
        compact: true
      }).code;
    } catch (err) {
      console.error('JSX-Transform fehlgeschlagen', err);
      try { window.__wgErr && window.__wgErr('JSX-Transform: ' + (err && err.message), 'loader', 0); } catch (e) {}
      return;
    }
    try { localStorage.setItem(KEY, code); } catch (e) {}   // voller Speicher: läuft trotzdem, nur ohne Cache
    run(code);
  };
  b.onerror = function () {
    document.getElementById('root').innerHTML =
      '<div style="padding:48px 24px;text-align:center;font-family:system-ui;color:#f2f6f3">' +
      '<div style="font-size:34px">📡</div><p style="opacity:.7;line-height:1.6">' +
      'App konnte nicht geladen werden.<br>Einmal mit Internet öffnen, danach läuft sie wieder offline.</p></div>';
  };
  document.head.appendChild(b);
})();
</script>
<script>
/* Service Worker: App offline-fähig nach erstem Laden — und Updates zeitnah holen.
   iOS lädt eine installierte PWA beim Zurückholen aus dem Hintergrund NICHT neu: ohne eigenes Nachsehen lief dort
   alter Code, bis die App ganz geschlossen wurde. Deshalb beim Zurückkehren (höchstens alle 15 Min.) nachsehen.
   Übernimmt ein neuer Service Worker, meldet die App „Neue Version" — und lädt beim nächsten Zurückkehren selbst neu,
   sofern gerade kein Fenster (Formular) offen ist, damit keine halbe Eingabe verloren geht. */
if ('serviceWorker' in navigator) {
  window.__wgUpdLast = Date.now();
  var wgHadController = !!navigator.serviceWorker.controller;   // erster Besuch: die Übernahme ist kein Update
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!wgHadController) { wgHadController = true; return; }
    window.__wgUpdReady = true;
    window.dispatchEvent(new Event('wg-update'));
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    if (window.__wgUpdReady && !document.querySelector('.overlay')) { location.reload(); return; }
    if (Date.now() - window.__wgUpdLast < 15 * 60e3) return;
    window.__wgUpdLast = Date.now();
    navigator.serviceWorker.getRegistration().then(function (r) { if (r) r.update().catch(function () {}); });
  });
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
