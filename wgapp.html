/* ══════════════════════════
   HAUSHALT
══════════════════════════ */
/* Abo-Logins teilen — Karte im Haushalt-Tab (unter „Ankündigungen").
   Ersteller: „Login freigeben" → Dienst/Login/Passwort → Einmal-Code (nur jetzt sichtbar) → per
   Push/Messenger schicken. Empfänger: „Code eingeben" → Login für `view` Minuten sehen + kopieren.
   Klartext gibt es nur lokal: gemerkte Logins des Erstellers (wg_lg) und der gerade sichtbare
   Login beim Empfänger (wg_lg_view, wird nach Ablauf gelöscht). Krypto s. LOGIN_*. */
function LoginShare() {
  const { D, setFn, me, notifyOthers, undo } = useD();
  const users = D.users, shares = D.ls || [];
  const meName = users.find(u=>u.id===me)?.name || 'Jemand';
  const other  = users.find(u=>u.id!==me)?.name || 'Dein Mitbewohner';
  const nameOf = id => users.find(u=>u.id===id)?.name || '?';
  const canCrypto = !!(window.crypto && crypto.subtle);   // nur im sicheren Kontext (HTTPS/localhost)
  const [now,setNow]       = useState(Date.now());
  const [saved,setSaved]   = useState(()=>ls(LG_SAVED,[])||[]);
  // Gerade sichtbarer Login (Empfänger) — abgelaufene Reste schon beim Start wegräumen
  const [view,setView]     = useState(()=>{ const v=ls(LG_VIEW,null); if(v && v.until>Date.now()) return v; try{localStorage.removeItem(LG_VIEW);}catch{} return null; });
  const [viewOpen,setViewOpen] = useState(false);
  const [showPw,setShowPw] = useState(false);
  const [copied,setCopied] = useState('');                // Button-Feedback „✓ Kopiert"
  const [form,setForm]     = useState(null);              // offenes Freigabe-Sheet {svc,u,p,view,remember}
  const [made,setMade]     = useState(null);              // gerade erzeugt {code,svc,view}
  const [redeem,setRedeem] = useState(null);              // Freigabe, deren Code gerade eingegeben wird
  const [code,setCode]     = useState('');
  const [busy,setBusy]     = useState(false);
  const [err,setErr]       = useState('');

  const wipeView = () => { try{localStorage.removeItem(LG_VIEW);}catch{} setView(null); setViewOpen(false); setShowPw(false); };
  const flash = k => { setCopied(k); setTimeout(()=>setCopied(c=>c===k?'':c),1600); };
  const copy = async (k,t) => { if(await copyTxt(t)) flash(k); };

  // Uhr: sekündlich solange ein Login sichtbar ist (Countdown), sonst alle 30 s für die Ablauf-Anzeige
  useEffect(()=>{ const t=setInterval(()=>setNow(Date.now()), view?1000:30000); return ()=>clearInterval(t); },[!!view]);
  // Sichtdauer vorbei → Klartext vom Gerät löschen
  useEffect(()=>{ if(view && view.until<=now) wipeView(); },[now,view]);
  // Abgelaufene Freigaben + Grabsteine aus der WG räumen — idempotent, jedes Gerät darf das
  useEffect(()=>{ if(shares.some(s=>!(s.exp>now))) setFn('ls', cur=>(cur||[]).filter(s=>s.exp>Date.now())); },[shares,now]);

  const incoming = shares.filter(s=>s.by!==me && !s.used && s.ct && s.exp>now);
  const mine     = shares.filter(s=>s.by===me && s.exp>now);

  /* ── Ersteller ── */
  const openForm  = () => { setMade(null); setErr(''); setForm({ svc:'', u:'', p:'', view:15, remember:true }); };
  const closeForm = () => { if(busy) return; setForm(null); setMade(null); setErr(''); };
  const formOk = form && form.svc.trim() && (form.u.trim() || form.p);
  const create = async () => {
    if(!formOk || busy) return;
    const svc=form.svc.trim(), u=form.u.trim(), p=form.p, mins=form.view;
    setBusy(true); setErr('');
    try {
      const id=uid(), c=genLoginCode(), t=Date.now();
      const sealed = await loginSeal({u,p}, c, id);
      // setFn statt set: zwischen Klick und fertiger Verschlüsselung kann ein Fremd-Update gekommen sein
      setFn('ls', cur=>[{ id, svc, by:me||null, ts:t, exp:t+LOGIN_TTL, view:mins, ...sealed }, ...(cur||[])]);
      // Merken bzw. Vergessen auf diesem Gerät — ein Eintrag je Dienst
      const rest = saved.filter(x=>x.svc.toLowerCase()!==svc.toLowerCase());
      const next = form.remember ? [{ id:uid(), svc, u, p }, ...rest] : rest;
      setSaved(next); ss(LG_SAVED, next);
      setMade({ code:c, svc, view:mins });
    } catch { setErr('Verschlüsseln hat nicht geklappt — nochmal versuchen.'); }
    setBusy(false);
  };
  const codeMsg = m => `WG-App · ${m.svc}-Login · Code: ${fmtLoginCode(m.code)} (24 Std gültig, nur einmal)`;
  const sendPush  = () => { notifyOthers(TT("🔑 {0} teilt den {1}-Login", meName, made.svc), TT("Code: {0} · in der WG-App unter Haushalt eingeben", fmtLoginCode(made.code)), TT("wg-login")); flash('push'); };
  // Teilen-Menü (WhatsApp & Co.); Abbrechen wirft AbortError → dann einfach nichts tun
  const shareCode = async () => { try { await navigator.share({ text:codeMsg(made) }); } catch {} };
  const revoke = id => {
    const it = shares.find(s=>s.id===id);
    setFn('ls', cur=>(cur||[]).filter(s=>s.id!==id));
    if(it && !it.used) undo(TT("🔑 Freigabe „{0}\" zurückgezogen", it.svc), ()=>setFn('ls', cur=>(cur||[]).some(s=>s.id===id)?cur:[it,...(cur||[])]));
  };

  /* ── Empfänger ── */
  const openRedeem = s => { setRedeem(s); setCode(''); setErr(''); };
  const doRedeem = async () => {
    const c = normLoginCode(code);
    if(!redeem || c.length!==8 || busy) return;
    const cur = (D.ls||[]).find(x=>x.id===redeem.id);   // aktueller Stand: evtl. inzwischen zurückgezogen
    if(!cur || cur.used || !cur.ct) { setErr('Diese Freigabe gibt es nicht mehr.'); return; }
    setBusy(true); setErr('');
    const obj = await loginOpen(cur, c);
    setBusy(false);
    if(!obj) { setErr('Code stimmt nicht.'); return; }
    const mins = Math.min(60, Math.max(1, Number(cur.view)||15));
    const v = { id:cur.id, svc:cur.svc, by:cur.by, u:obj.u||'', p:obj.p||'', from:Date.now(), until:Date.now()+mins*60e3 };
    ss(LG_VIEW, v); setView(v);
    // Einmalig: Chiffretext sofort durch einen Grabstein ersetzen — der Ersteller sieht „geöffnet"
    setFn('ls', l=>(l||[]).map(x=>x.id===cur.id ? { id:x.id, svc:x.svc, by:x.by, ts:x.ts, exp:x.exp, seq:x.seq, used:Date.now(), usedBy:me||null } : x));
    notifyOthers(TT("🔓 {0} hat den {1}-Login geöffnet", meName, cur.svc), '', TT("wg-login"));
    setRedeem(null); setCode(''); setShowPw(false); setViewOpen(true);
  };

  const rowTitle = { fontSize:14, fontWeight:700, color:'var(--label)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' };
  const rowSub   = { fontSize:11.5, color:'var(--label3)', fontWeight:500 };
  const quietBtn = { display:'flex', alignItems:'center', justifyContent:'center', gap:7, padding:'11px 14px', borderRadius:12, border:'none', background:'var(--bg3)', color:'var(--label2)', fontWeight:700, fontSize:13, fontFamily:'inherit', cursor:'pointer' };

  return (
    <>
      <div className="rise" style={{animationDelay:'78ms'}}>
        <div className="section-hdr">{TT("🔑 Abo-Logins")}</div>
        <div className="group" style={{padding:'12px 14px',display:'flex',flexDirection:'column',gap:11}}>
          {view && (
            <button onClick={()=>setViewOpen(true)} style={{...quietBtn,justifyContent:'space-between',background:'rgba(129,140,248,.14)',color:'var(--indigo)'}}>
              <span>🔓 {view.svc} {TT("· noch")} <span className="num">{fmtLeft(view.until-now)}</span> {TT("sichtbar")}</span><span style={{fontSize:18,lineHeight:1}}>›</span>
            </button>
          )}
          {incoming.map(s=>(
            <div key={s.id} style={{display:'flex',alignItems:'center',gap:11}}>
              <span style={{fontSize:19,lineHeight:1,flexShrink:0}}>🔑</span>
              <div style={{flex:1,minWidth:0}}>
                <div style={rowTitle}>{s.svc}</div>
                <div style={rowSub}>{TT("von")} {nameOf(s.by)} {TT("· einlösbar bis")} {fmtHM(s.exp)}</div>
              </div>
              <button className="mini-btn" style={{background:'var(--indigo)'}} onClick={()=>openRedeem(s)}>{TT("Code eingeben")}</button>
            </div>
          ))}
          {mine.map(s=>(
            <div key={s.id} style={{display:'flex',alignItems:'center',gap:11}}>
              <span style={{fontSize:19,lineHeight:1,flexShrink:0}}>{s.used?'✅':'⏳'}</span>
              <div style={{flex:1,minWidth:0}}>
                <div style={rowTitle}>{s.svc}</div>
                <div style={rowSub}>{s.used ? `${nameOf(s.usedBy)} hat ihn um ${fmtHM(s.used)} geöffnet` : `wartet auf ${other} · Code gültig bis ${fmtHM(s.exp)}`}</div>
              </div>
              <button className="del-btn" aria-label={s.used?'Hinweis entfernen':'Freigabe zurückziehen'} title={s.used?'Hinweis entfernen':'Freigabe zurückziehen'} onClick={()=>revoke(s.id)}>×</button>
            </div>
          ))}
          <button style={{...quietBtn,opacity:canCrypto?1:.5}} disabled={!canCrypto} onClick={openForm}>
            🔑 {canCrypto ? 'Login freigeben' : 'Login freigeben (nur über HTTPS)'}
          </button>
        </div>
      </div>

      {form && ReactDOM.createPortal(
        <div className="overlay" onClick={closeForm}>
          <div className="sheet" onClick={e=>e.stopPropagation()}>
            <div className="sheet-handle"/>
            {!made ? (<>
              <div className="sheet-body" style={{gap:12,paddingTop:6}}>
                <div style={{textAlign:'center',fontSize:38,lineHeight:1}}>🔑</div>
                <div className="hero-lbl" style={{textAlign:'center'}}>{TT("Login freigeben")}</div>
                <div style={{fontSize:13.5,color:'var(--label2)',lineHeight:1.5,textAlign:'center'}}>
                  {other} {TT("bekommt einen Einmal-Code und sieht den Login danach nur kurz. In der WG-Datenbank liegt er nur verschlüsselt.")}
                </div>
                {saved.length>0 && (
                  <div className="chip-scroll" style={{display:'flex',gap:7,overflowX:'auto'}}>
                    {saved.map(x=>(
                      <button key={x.id} onClick={()=>setForm(f=>({...f,svc:x.svc,u:x.u,p:x.p,remember:true}))}
                        style={{flexShrink:0,whiteSpace:'nowrap',padding:'8px 13px',borderRadius:11,border:'none',fontFamily:'inherit',fontWeight:700,fontSize:12.5,cursor:'pointer',
                          background:form.svc===x.svc?'var(--indigo)':'var(--bg3)',color:form.svc===x.svc?'var(--ink)':'var(--label2)'}}>{x.svc}</button>
                    ))}
                  </div>
                )}
                <input className="field" autoFocus maxLength={60} list="lg-abos" aria-label={TT("Dienst")} placeholder={TT("Dienst — Netflix, Apple TV …")}
                  value={form.svc} onChange={e=>setForm(f=>({...f,svc:e.target.value}))}/>
                <datalist id="lg-abos">{(D.ab||[]).map(a=><option key={a.id} value={a.name}/>)}</datalist>
                <input className="field" maxLength={200} aria-label={TT("E-Mail oder Benutzername")} placeholder={TT("E-Mail / Benutzername")}
                  autoComplete="off" autoCapitalize="none" spellCheck={false}
                  value={form.u} onChange={e=>setForm(f=>({...f,u:e.target.value}))}/>
                <input className="field" type="password" maxLength={200} aria-label={TT("Passwort")} placeholder={TT("Passwort")} autoComplete="new-password"
                  value={form.p} onChange={e=>setForm(f=>({...f,p:e.target.value}))}
                  onKeyDown={e=>{ if(e.key==='Enter') create(); }}/>
                <div>
                  <div className="sheet-sublbl">{TT("Sichtbar für")} {other}</div>
                  <div className="seg">
                    {LOGIN_VIEW.map(([m,l])=>(
                      <button key={m} className={`seg-btn${form.view===m?' on':''}`} onClick={()=>setForm(f=>({...f,view:m}))}>{l}</button>
                    ))}
                  </div>
                </div>
                <label style={{display:'flex',alignItems:'center',gap:9,fontSize:13.5,color:'var(--label2)',cursor:'pointer'}}>
                  <input type="checkbox" checked={form.remember} onChange={e=>setForm(f=>({...f,remember:e.target.checked}))} style={{width:18,height:18,accentColor:'var(--indigo)'}}/>
                  {TT("Auf diesem Gerät merken")}
                </label>
                {err && <div style={{color:'var(--red)',fontSize:13,fontWeight:600,textAlign:'center'}}>{err}</div>}
              </div>
              <div className="sheet-acts">
                <button className="btn btn-sec" style={{flex:1}} onClick={closeForm}>{TT("Abbrechen")}</button>
                <button className="btn" disabled={!formOk||busy} onClick={create}
                  style={{background:'var(--indigo)',color:'var(--ink)',flex:1,whiteSpace:'nowrap',opacity:formOk&&!busy?1:.45,cursor:formOk&&!busy?'pointer':'default'}}>
                  {busy?'Verschlüssele …':'Code erzeugen'}
                </button>
              </div>
            </>) : (<>
              <div className="sheet-body" style={{gap:10,paddingTop:6,textAlign:'center',alignItems:'center'}}>
                <div style={{fontSize:38,lineHeight:1}}>🔑</div>
                <div className="hero-lbl">{made.svc} {TT("· Einmal-Code")}</div>
                <div className="num" data-testid="lg-code" style={{fontSize:34,fontWeight:800,letterSpacing:'.1em',color:'var(--indigo)',userSelect:'all',margin:'4px 0'}}>{fmtLoginCode(made.code)}</div>
                <div style={{fontSize:13.5,color:'var(--label2)',lineHeight:1.5}}>
                  {TT("Gilt 24 Std und nur einmal. Danach sieht")} {other} {TT("den Login")} {LOGIN_VIEW.find(v=>v[0]===made.view)?.[1]||`${made.view} Min`} {TT("lang.")}
                </div>
                <div style={{fontSize:12,color:'var(--label3)'}}>{TT("Der Code wird nur jetzt angezeigt.")}</div>
              </div>
              <div className="sheet-acts" style={{flexDirection:'column'}}>
                <button className="btn" style={{background:'var(--indigo)',color:'var(--ink)'}} onClick={sendPush}>{copied==='push'?'✓ Push gesendet':`🔔 Per Push an ${other}`}</button>
                <div style={{display:'flex',gap:10}}>
                  <button className="btn btn-sec" style={{flex:1}} onClick={()=>copy('code', codeMsg(made))}>{copied==='code'?'✓ Kopiert':'📋 Kopieren'}</button>
                  {typeof navigator.share==='function' && <button className="btn btn-sec" style={{flex:1}} onClick={shareCode}>{TT("📤 Teilen")}</button>}
                </div>
                <button className="btn btn-sec" onClick={closeForm}>{TT("Fertig")}</button>
              </div>
            </>)}
          </div>
        </div>, document.body)}

      {redeem && ReactDOM.createPortal(
        <div className="overlay" onClick={()=>!busy&&setRedeem(null)}>
          <div className="sheet" onClick={e=>e.stopPropagation()}>
            <div className="sheet-handle"/>
            <div className="sheet-body" style={{gap:12,paddingTop:6}}>
              <div style={{textAlign:'center',fontSize:38,lineHeight:1}}>🔑</div>
              <div className="hero-lbl" style={{textAlign:'center'}}>{redeem.svc} {TT("· von")} {nameOf(redeem.by)}</div>
              <div style={{fontSize:13.5,color:'var(--label2)',lineHeight:1.5,textAlign:'center'}}>
                {TT("Gib den Einmal-Code ein. Danach siehst du den Login")} {Math.min(60,Math.max(1,Number(redeem.view)||15))} {TT("Min lang.")}
              </div>
              <input className="field num" autoFocus aria-label={TT("Einmal-Code")} placeholder={TT("XXXX-XXXX")} maxLength={9}
                autoCapitalize="characters" autoComplete="one-time-code" spellCheck={false}
                style={{textAlign:'center',fontSize:22,letterSpacing:'.12em',fontWeight:700}}
                value={code} onChange={e=>{ setCode(fmtLoginCode(normLoginCode(e.target.value).slice(0,8))); setErr(''); }}
                onKeyDown={e=>{ if(e.key==='Enter') doRedeem(); }}/>
              {err && <div role="alert" style={{color:'var(--red)',fontSize:13,fontWeight:600,textAlign:'center'}}>{err}</div>}
            </div>
            <div className="sheet-acts">
              <button className="btn btn-sec" style={{flex:1}} onClick={()=>!busy&&setRedeem(null)}>{TT("Abbrechen")}</button>
              <button className="btn" disabled={normLoginCode(code).length!==8||busy} onClick={doRedeem}
                style={{background:'var(--indigo)',color:'var(--ink)',flex:1,whiteSpace:'nowrap',opacity:normLoginCode(code).length===8&&!busy?1:.45}}>
                {busy?'Prüfe …':'🔓 Öffnen'}
              </button>
            </div>
          </div>
        </div>, document.body)}

      {viewOpen && view && ReactDOM.createPortal(
        <div className="overlay" onClick={()=>setViewOpen(false)}>
          <div className="sheet" onClick={e=>e.stopPropagation()}>
            <div className="sheet-handle"/>
            <div className="sheet-body" style={{gap:12,paddingTop:6}}>
              <div style={{textAlign:'center',fontSize:38,lineHeight:1}}>🔓</div>

              </div>
              <div className="group">
                <div className="cell">
                  <div className="cell-content" style={{minWidth:0}}>

                  <div className="cell-content" style={{minWidth:0}}>
                    <span className="cell-sub">{TT("Passwort")}</span>
                    <span className="cell-title num" data-testid="lg-pw" style={{wordBreak:'break-all',fontSize:15}}>{view.p ? (showPw ? view.p : '•'.repeat(Math.min(12,view.p.length))) : '—'}</span>

                  {view.p && <button className="mini-btn" style={{background:'var(--indigo)'}} onClick={()=>copy('p',view.p)}>{copied==='p'?'✓ Kopiert':'Kopieren'}</button>}
                </div>
              </div>
              <div style={{fontSize:12,color:'var(--label3)',textAlign:'center',lineHeight:1.5}}>{TT("Danach wird der Login von diesem Gerät gelöscht.")}</div>

              <button className="btn btn-sec" style={{flex:1}} onClick={()=>setViewOpen(false)}>{TT("Schließen")}</button>

    </>
  );
}

/* ── Vermieter & Notfall (seit wg-v76): Mängel-Schreiben mit Frist und ein Infoblatt für den Ernstfall.
   Beides liegt in `cf` (Einträge `vermieter` und `notfall`) — keine neuen Listen-Keys.
   Das Schreiben ist eine Vorlage, kein Rechtsrat: Frist standardmäßig 14 Tage, Text zum Anpassen. ── */
const LL_DAYS = 14;
function LandlordCard() {
  const { D, setFn, me, undo } = useD();
  const users = D.users || [];
  const cf = (D.cf||[]).find(x=>x && x.id==='vermieter') || {};
  const nf = (D.cf||[]).find(x=>x && x.id==='notfall') || {};
  const [f,setF] = useState(null);      // Vermieter-Daten
  const [n,setN] = useState(null);      // Notfall-Daten
  const [sheet,setSheet] = useState(false);
  const [msg,setMsg] = useState('');
  const openRep = (D.rp||[]).filter(r=>r && r.status!=='erledigt');
  const wg = (D.cf||[]).find(x=>x && x.id==='wg');
  const save = () => { setFn('cf', cur=>[{ id:'vermieter', name:f.name.trim().slice(0,80), email:f.email.trim().slice(0,120), addr:f.addr.trim().slice(0,200) }, ...(cur||[]).filter(x=>x && x.id!=='vermieter')]); setF(null); };
  const saveN = () => { setFn('cf', cur=>[{ id:'notfall', strom:n.strom.trim().slice(0,120), wasser:n.wasser.trim().slice(0,120), heizung:n.heizung.trim().slice(0,120), hausmeister:n.hausmeister.trim().slice(0,120), notiz:n.notiz.trim().slice(0,300) }, ...(cur||[]).filter(x=>x && x.id!=='notfall')]); setN(null); };
  // Fristen setzen: ab Versand zählt die Frist je Mangel (wird in der Reparatur-Karte angezeigt)
  const setFristen = () => {
    const due = shiftISO(todayISO(), LL_DAYS), ids = openRep.map(r=>r.id);
    const prev = openRep.map(r=>({ id:r.id, due:r.due||null, md:r.md||null }));
    setFn('rp', cur=>cur.map(r=>ids.includes(r.id)?{...r, status:'gemeldet', md:r.md||todayISO(), due}:r));
    undo(TT("Frist bis {0} vermerkt", fmtDate(due)), ()=>setFn('rp', cur=>cur.map(r=>{ const p = prev.find(x=>x.id===r.id); return p?{...r, due:p.due, md:p.md}:r; })));
  };
  const letter = () => {
    const due = shiftISO(todayISO(), LL_DAYS);
    const list = openRep.map((r,i)=>`${i+1}. ${r.text}${r.md?` (bemerkt am ${fmtDate(r.md)})`:''}`).join('\n');
    return [
      `${cf.name || 'An die Vermieterin / den Vermieter'}`,
      cf.addr || '',
      '',
      `${fmtDate(todayISO())}`,
      '',
      `Mängelanzeige${wg?.name ? ` – ${wg.name}` : ''}`,
      '',
      'Sehr geehrte Damen und Herren,',
      '',
      'in unserer Wohnung sind folgende Mängel aufgetreten:',
      '',
      list || '(keine offenen Mängel)',
      '',
      `wir bitten Sie, die Mängel bis zum ${fmtDate(due)} zu beseitigen.`,
      '',
      'Mit freundlichen Grüßen',
      users.map(u=>u.name).join(', '),
    ].join('\n');
  };
  const copy = async () => { setMsg(await copyTxt(letter()) ? 'Text kopiert ✓' : 'Kopieren ging nicht – bitte markieren.'); setTimeout(()=>setMsg(''), 3000); };
  const mail = () => `mailto:${encodeURIComponent(cf.email||'')}?subject=${encodeURIComponent('Mängelanzeige' + (wg?.name ? ` – ${wg.name}` : ''))}&body=${encodeURIComponent(letter())}`;
  return (
    <div data-testid="landlord-card">
      <div className="section-hdr" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span>{TT("📮 Vermieter & Mängel")}</span>
        <button className="hit" onClick={()=>setF({ name:cf.name||'', email:cf.email||'', addr:cf.addr||'' })} style={{...hdrBtn,color:'var(--sky)'}}>{cf.name?'Ändern':'+ Eintragen'}</button>
      </div>
      <div className="group">
        <div className="cell"><div className="cell-content">
          <span className="cell-title">{cf.name || 'Noch kein Vermieter hinterlegt'}</span>
          <span className="cell-sub">{openRep.length ? `${openRep.length} offene${openRep.length===1?'r':''} Mangel${openRep.length===1?'':'-Einträge'} – Schreiben mit ${LL_DAYS} Tagen Frist` : 'Keine offenen Mängel'}{cf.email?` · ${cf.email}`:''}</span>
        </div></div>
        {openRep.length>0 && <button className="cell hit" data-testid="ll-open" onClick={()=>setSheet(true)} style={{width:'100%',background:'none',fontFamily:'inherit',color:'var(--sky)',fontWeight:700,fontSize:14,cursor:'pointer'}}>{TT("Mängelanzeige erzeugen …")}</button>}
      </div>

      <div className="section-hdr" style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:14}}>
        <span>{TT("🆘 Notfall-Infos")}</span>
        <button className="hit" onClick={()=>setN({ strom:nf.strom||'', wasser:nf.wasser||'', heizung:nf.heizung||'', hausmeister:nf.hausmeister||'', notiz:nf.notiz||'' })} style={{...hdrBtn,color:'var(--red)'}}>{nf.strom||nf.wasser?'Ändern':'+ Eintragen'}</button>
      </div>
      <div className="group">
        {[['⚡','Sicherungskasten',nf.strom],['🚰','Wasser-Absperrhahn',nf.wasser],['🔥','Heizung/Therme',nf.heizung],['🧰','Hausmeister',nf.hausmeister]].filter(x=>x[2]).map(([em,l,v])=>(
          <div key={l} className="cell" data-testid="nf-row"><span style={{fontSize:18}}>{em}</span><div className="cell-content"><span className="cell-title">{l}</span><span className="cell-sub">{v}</span></div></div>
        ))}
        {!(nf.strom||nf.wasser||nf.heizung||nf.hausmeister) && <div className="cell"><div className="cell-content"><span className="cell-sub">{TT("Wo ist der Sicherungskasten, wo der Absperrhahn? Einmal eintragen – steht dann auch im Gast-Link.")}</span></div></div>}
        {nf.notiz && <div className="cell"><div className="cell-content"><span className="cell-sub">{nf.notiz}</span></div></div>}
      </div>

      <MiniSheet open={!!f} onClose={()=>setF(null)} title={TT("Vermieter")} color="var(--sky)">
        {f && <>
          <input className="field" autoFocus maxLength={80} placeholder={TT("Name / Hausverwaltung")} aria-label={TT("Name des Vermieters")} value={f.name} onChange={e=>setF({...f,name:e.target.value})}/>
          <input className="field" maxLength={120} placeholder={TT("E-Mail (optional)")} aria-label={TT("E-Mail des Vermieters")} autoCapitalize="off" autoCorrect="off" spellCheck={false} value={f.email} onChange={e=>setF({...f,email:e.target.value})}/>
          <textarea className="field" rows={3} maxLength={200} placeholder={TT("Anschrift (optional)")} aria-label={TT("Anschrift des Vermieters")} value={f.addr} onChange={e=>setF({...f,addr:e.target.value})}/>
          <button className="btn" style={{background:'var(--sky)'}} onClick={save}>{TT("Speichern")}</button>
        </>}
      </MiniSheet>
      <MiniSheet open={!!n} onClose={()=>setN(null)} title={TT("Notfall-Infos")} color="var(--red)">
        {n && <>
          <input className="field" autoFocus maxLength={120} placeholder={TT("Sicherungskasten, z. B. Flur links oben")} aria-label={TT("Sicherungskasten")} value={n.strom} onChange={e=>setN({...n,strom:e.target.value})}/>
          <input className="field" maxLength={120} placeholder={TT("Wasser-Absperrhahn, z. B. unter der Spüle")} aria-label={TT("Wasser-Absperrhahn")} value={n.wasser} onChange={e=>setN({...n,wasser:e.target.value})}/>
          <input className="field" maxLength={120} placeholder={TT("Heizung/Therme, z. B. Bad, Code 1234")} aria-label={TT("Heizung")} value={n.heizung} onChange={e=>setN({...n,heizung:e.target.value})}/>
          <input className="field" maxLength={120} placeholder={TT("Hausmeister, Name + Telefon")} aria-label={TT("Hausmeister")} value={n.hausmeister} onChange={e=>setN({...n,hausmeister:e.target.value})}/>
          <textarea className="field" rows={3} maxLength={300} placeholder={TT("Weitere Hinweise (optional)")} aria-label={TT("Weitere Hinweise")} value={n.notiz} onChange={e=>setN({...n,notiz:e.target.value})}/>
          <div style={{fontSize:12.5,color:'var(--label2)'}}>{TT("Steht auch auf der Gast-Seite – also keine Schlüssel-Verstecke eintragen.")}</div>
          <button className="btn" style={{background:'var(--red)',color:'#fff'}} onClick={saveN}>{TT("Speichern")}</button>
        </>}
      </MiniSheet>

      {sheet && ReactDOM.createPortal(
        <div className="print-sheet" data-testid="ll-sheet" role="dialog" aria-label={TT("Mängelanzeige")}>
          <div className="no-print" style={{display:'flex',gap:8,marginBottom:16,flexWrap:'wrap'}}>
            <button className="btn" style={{width:'auto',padding:'0 16px',background:'#0f766e',color:'#fff'}} onClick={()=>window.print()}>{TT("Drucken / PDF")}</button>
            {cf.email && <a className="btn" data-testid="ll-mail" href={mail()} style={{width:'auto',padding:'0 16px',background:'#e5e7eb',color:'#111',textDecoration:'none',display:'flex',alignItems:'center'}}>{TT("Als E-Mail")}</a>}
            <button className="btn" style={{width:'auto',padding:'0 16px',background:'#e5e7eb',color:'#111'}} onClick={copy}>{TT("Text kopieren")}</button>
            <button className="btn" data-testid="ll-frist" style={{width:'auto',padding:'0 16px',background:'#e5e7eb',color:'#111'}} onClick={()=>{ setFristen(); setSheet(false); }}>{TT("Abgeschickt – Frist merken")}</button>
            <button className="btn" style={{width:'auto',padding:'0 16px',background:'#e5e7eb',color:'#111'}} onClick={()=>setSheet(false)}>{TT("Schließen")}</button>
          </div>
          <pre data-testid="ll-text" style={{whiteSpace:'pre-wrap',fontFamily:'inherit',fontSize:14,lineHeight:1.6,margin:0}}>{letter()}</pre>
          {msg && <p className="no-print" style={{color:'#0f766e',fontWeight:700}}>{msg}</p>}
        </div>, document.body)}
    </div>
  );
}

/* ══════════════════════════
   LADEN & ESSEN (seit wg-v76): Preise je Laden, Reste-Rezepte, Einkaufs-Touren.
   Keine neuen Listen-Keys — `hs`-Posten und `sl`-Einträge bekommen das Feld `shop` (einfacher String).
══════════════════════════ */
const SHOPS_DEF = ['Rewe','Lidl','Aldi','Edeka','Netto','Penny','Kaufland','dm','Rossmann','Bio-Laden','Markt'];
// Läden, die die WG wirklich nutzt (aus den bisherigen Posten), plus die Vorschläge
const shopsKnown = D => {
  const used = [...new Set(hsAll(D).map(i=>String(i.shop||'').trim()).filter(Boolean))];
  return [...used, ...SHOPS_DEF.filter(s=>!used.some(u=>u.toLowerCase()===s.toLowerCase()))];
};
/* Preise je Laden für einen Artikel: günstigster und letzter Kauf (nur Posten mit Laden-Angabe) */
const priceByShop = (D, name) => {
  const n = String(name||'').trim().toLowerCase(); if (!n) return [];
  const hits = hsAll(D).filter(i=>String(i.name||'').trim().toLowerCase()===n && i.price>0 && String(i.shop||'').trim());
  const byShop = {};
  hits.forEach(i=>{ const s = String(i.shop).trim(); const cur = byShop[s];
    if (!cur || i.price < cur.price - 0.001 || (Math.abs(i.price-cur.price)<0.001 && String(i.date||'') > String(cur.date||''))) byShop[s] = { shop:s, price:i.price, date:i.date }; });
  return Object.values(byShop).sort((a,b)=>a.price-b.price);
};
/* Laden-Auswahl (Chips + eigener Name) — im Ausgaben-Formular und an Listeneinträgen */
function ShopPick({ value, onPick, allowClear }) {
  const { D } = useD();
  const [own,setOwn] = useState('');
  const shops = shopsKnown(D).slice(0, 12);
  return (
    <div style={{display:'flex',flexWrap:'wrap',gap:6}} data-testid="shop-pick">
      {allowClear && <button type="button" style={chipSt(!value)} onClick={()=>onPick('')}>{TT("egal")}</button>}
      {shops.map(s=><button key={s} type="button" aria-pressed={value===s} style={chipSt(value===s)} onClick={()=>onPick(value===s?'':s)}>{s}</button>)}
      <form onSubmit={e=>{ e.preventDefault(); if (own.trim()) { onPick(own.trim().slice(0,30)); setOwn(''); } }} style={{display:'flex',gap:6,flexBasis:'100%'}}>
        <input className="field" maxLength={30} placeholder={TT("anderer Laden")} aria-label={TT("Anderer Laden")} value={own} onChange={e=>setOwn(e.target.value)} style={{flex:1,padding:'7px 10px',fontSize:13.5}}/>
        {own.trim() && <button type="submit" className="btn" style={{width:'auto',padding:'0 14px',background:'var(--mint)'}}>+</button>}
      </form>
    </div>
  );
}

/* ── Reste-Rezepte: einfache Vorschläge aus dem, was im Kühlschrank und Vorrat liegt.
   Bewusst eine feste, kurze Liste ohne Netz — Vorschläge, die man ohne Rezeptbuch kocht.
   Sortiert nach: nutzt bald Ablaufendes → möglichst wenig fehlt. ── */
const RECIPES = [
  ['Nudeln mit Tomatensoße','🍝',['nudeln','tomaten','zwiebel','knoblauch']],
  ['Kartoffelauflauf','🥔',['kartoffeln','sahne','käse','zwiebel']],
  ['Gemüsepfanne mit Reis','🍚',['reis','paprika','zucchini','möhren','zwiebel']],
  ['Rührei mit Brot','🍳',['eier','brot','butter','käse']],
  ['Gemüsesuppe','🥣',['möhren','kartoffeln','zwiebel','brühe','sellerie']],
  ['Pfannkuchen','🥞',['mehl','eier','milch','zucker']],
  ['Käse-Sandwich','🥪',['brot','käse','butter','tomaten']],
  ['Bratkartoffeln mit Ei','🍳',['kartoffeln','eier','zwiebel','speck']],
  ['Couscous-Salat','🥗',['couscous','gurke','tomaten','zitrone','öl']],
  ['Milchreis','🍮',['reis','milch','zucker','zimt']],
  ['Ofengemüse','🔥',['kartoffeln','paprika','zucchini','öl','zwiebel']],
  ['Pasta mit Pesto','🌿',['nudeln','pesto','käse']],
];
const norm = s => String(s||'').toLowerCase().replace(/[^a-zäöüß]/g,'');
// Was ist da? Kühlschrank (mit Ablaufdatum) + Vorrat-Vorlagen, die als „da" gelten
const haveList = D => {
  const kf = (D.kf||[]).filter(Boolean).map(k=>({ name:k.name, exp:k.exp }));
  const vr = (D.vr||[]).filter(v=>v && !v.hidden && (stockLeft(v) ?? 9) > 0).map(v=>({ name:v.name, exp:null }));
  return [...kf, ...vr];
};
const recipeIdeas = D => {
  const have = haveList(D);
  const soon = have.filter(h=>h.exp && -daysSince(h.exp) <= 3).map(h=>norm(h.name));
  const has = ing => have.some(h=>{ const a = norm(h.name), b = norm(ing); return a && b && (a.includes(b) || b.includes(a)); });
  return RECIPES.map(([name,em,ings])=>{
    const da = ings.filter(has), miss = ings.filter(i=>!has(i));
    const usesSoon = ings.filter(i=>soon.some(s=>s.includes(norm(i)) || norm(i).includes(s))).length;
    return { name, em, ings, da, miss, usesSoon };
  }).filter(r=>r.da.length >= 2)
    .sort((a,b)=> b.usesSoon - a.usesSoon || a.miss.length - b.miss.length || b.da.length - a.da.length)
    .slice(0, 3);
};
function RecipeCard() {
  const { D, setFn, me, notifyOthers, undo } = useD();
  const ideas = recipeIdeas(D);
  if (!ideas.length) return null;
  const addMissing = r => {
    const list = D.sl || [];
    const miss = r.miss.filter(n=>!list.some(i=>i && !i.done && norm(i.name)===norm(n)));
    if (!miss.length) return;
    const add = miss.map(n=>({ id:uid(), name:n.charAt(0).toUpperCase()+n.slice(1), addedBy:me||null, date:todayISO(), done:false }));
    setFn('sl', cur=>[...add, ...(cur||[])]);
    notifyOthers(TT("🛒 Für {0}", r.name), miss.join(', '), TT("wg-shop"), TT("shop"));
    undo(TT("🛒 {0} auf die Liste", add.length), ()=>{ const ids=add.map(a=>a.id); setFn('sl', cur=>cur.filter(i=>!ids.includes(i.id))); });
  };
  const plan = r => {
    const it = { id:uid(), date:todayISO(), dish:r.name, cook:me||null, ings:r.ings.join(', ').slice(0,300) };
    setFn('ep', cur=>[it, ...(cur||[])]);
    notifyOthers(TT("🍝 Heute: {0}", r.name), TT("{0} kocht", nameOfU(D.users||[], me)), TT("wg-ep"), TT("board"));
    undo(TT("🍝 {0} eingeplant", r.name), ()=>setFn('ep', cur=>cur.filter(x=>x.id!==it.id)));
  };
  return (
    <div className="rise" data-testid="recipe-card">
      <div className="section-hdr">{TT("🍲 Reste verwerten")}</div>
      <div className="group">
        {ideas.map(r=>(
          <div key={r.name} className="cell" data-testid="recipe-row" style={{flexWrap:'wrap',gap:8}}>
            <span style={{fontSize:20}}>{r.em}</span>
            <div className="cell-content">
              <span className="cell-title">{r.name}{r.usesSoon>0 && <b style={{color:'var(--amber)',fontSize:12.5}}> {TT("· nutzt Ablaufendes")}</b>}</span>
              <span className="cell-sub">{r.da.join(', ')} {TT("da")}{r.miss.length?` · fehlt: ${r.miss.join(', ')}`:' · alles da ✓'}</span>
            </div>
            {r.miss.length>0 && <button className="btn btn-sec" aria-label={TT("Fehlendes für {0} auf die Liste", r.name)} style={{width:'auto',padding:'8px 11px',fontSize:13}} onClick={()=>addMissing(r)}>🛒 {r.miss.length}</button>}
            <button className="btn btn-sec" aria-label={TT("{0} einplanen", r.name)} style={{width:'auto',padding:'8px 11px',fontSize:13}} onClick={()=>plan(r)}>{TT("Einplanen")}</button>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ── Einkaufs-Touren: Einträge bekommen einen Laden; wer eine Tour übernimmt, steht an der Gruppe.
   „Nur meine Tour" blendet den Rest aus, damit im Laden nur das Nötige auf dem Schirm ist. ── */
function TourBar({ list, tour, setTour, onlyMine, setOnlyMine }) {
  const { D, setFn, me, notifyOthers, undo } = useD();
  const users = D.users || [];
  const open = list.filter(i=>!i.done);
  const shops = [...new Set(open.map(i=>String(i.shop||'').trim()).filter(Boolean))];
  if (!shops.length && !open.some(i=>i.tour)) return null;
  const take = shop => {
    const ids = open.filter(i=>String(i.shop||'').trim()===shop).map(i=>i.id);
    setFn('sl', cur=>cur.map(i=>ids.includes(i.id)?{...i, tour:me}:i));
    notifyOthers(TT("🧭 {0} geht zu {1}", nameOfU(users, me), shop), TT("{0} Sachen von der Liste", ids.length), TT("wg-shop"), TT("shop"));
    undo(TT("Tour {0} übernommen", shop), ()=>setFn('sl', cur=>cur.map(i=>ids.includes(i.id)?{...i, tour:null}:i)));
  };
  return (
    <div data-testid="tour-bar" style={{display:'flex',flexWrap:'wrap',gap:6,padding:'2px 2px 6px'}}>
      {shops.map(s=>{ const its = open.filter(i=>String(i.shop||'').trim()===s); const t = its.find(i=>i.tour)?.tour;
        const u = users.find(x=>x.id===t);
        return <button key={s} type="button" data-testid="tour-chip" style={chipSt(!!t)} onClick={()=>{ if (!t && me) take(s); }}>
          🧭 {s} · {its.length}{t ? ` · ${t===me?'du':u?.name||'jemand'}` : ''}
        </button>; })}
      {me && open.some(i=>i.tour===me) && <button type="button" data-testid="tour-only" aria-pressed={onlyMine} style={chipSt(onlyMine)} onClick={()=>setOnlyMine(!onlyMine)}>{onlyMine?'✓ ':''}{TT("Nur meine Tour")}</button>}
    </div>
  );
}

/* ══════════════════════════
   FAIR (seit wg-v75): Auslage-Rotation, Abrechnungs-Wächter, Budget-Hochrechnung,
   Aufgabe abgeben/übernehmen, Belegung & Ruhezeiten.
   Neue Listen-Keys: tb (Aufgaben-Abgaben), bk (Belegungen) — `cf` bekommt den Eintrag `limit`.
══════════════════════════ */

/* ── Wer streckt diesmal vor? Zählt die offenen Posten der letzten 30 Tage je Person.
   Vorschlag ist die Person mit dem kleinsten ausgelegten Betrag — so bleibt niemand dauerhaft in Vorleistung. ── */
const advanceNext = (D, users) => {
  const cut = shiftISO(todayISO(), -30);
  const open = (D.hs||[]).filter(i=>i && !i.settled && i.date >= cut);
  if (open.length < 3 || users.length < 2) return null;
  const paid = users.map(u=>({ ...u, sum: open.filter(i=>i.paidBy===u.id).reduce((s,i)=>s+(Number(i.price)||0), 0) }));
  const min = paid.reduce((a,b)=>a.sum<=b.sum?a:b), max = paid.reduce((a,b)=>a.sum>=b.sum?a:b);
  if (max.sum - min.sum < 20) return null;   // unter 20 € Unterschied ist es egal
  return { next: min, max };
};
function AdvanceHint() {
  const { D, me } = useD();
  const users = D.users || [];
  const a = advanceNext(D, users);
  if (!a) return null;
  return (
    <div className="rise" data-testid="advance-hint" style={{fontSize:12.5,color:'var(--label2)',textAlign:'center',padding:'0 8px',lineHeight:1.5}}>
      {TT("💡 Diesmal wäre")} <b style={{color:a.next.color}}>{a.next.id===me?'du':a.next.name}</b> {TT("mit Auslegen dran –")} {a.max.id===me?'du hast':`${a.max.name} hat`} {TT("zuletzt €")}{fmt(a.max.sum)} {TT("vorgestreckt,")} {a.next.id===me?'du':a.next.name} €{fmt(a.next.sum)}.
    </div>
  );
}

/* ── Abrechnungs-Wächter: erinnert, wenn die offene Summe zu groß oder zu alt wird.
   Grenzen in `cf` (Eintrag `limit`: max €, days). Standard 50 € / 30 Tage; api/_wg.js rechnet genauso. ── */
const DEBT_DEF = { max: 50, days: 30 };
const debtWatch = (D, mods) => {
  const users = D.users || [];
  const cfg = { ...DEBT_DEF, ...((D.cf||[]).find(x=>x && x.id==='limit') || {}) };
  const open = (D.hs||[]).filter(i=>i && !i.settled);
  if (!open.length || users.length < 2) return null;
  const nets = users.map(u=>({ ...u, net: myBalance(D, u.id, mods).total }));
  const top = Math.max(...nets.map(n=>Math.abs(n.net)));
  const oldest = open.map(i=>i.date).filter(Boolean).sort()[0];
  const age = oldest ? daysSince(oldest) : 0;
  const overMax = top >= Number(cfg.max), overAge = age >= Number(cfg.days);
  if (!overMax && !overAge) return null;
  return { cfg, top, age, overMax, overAge, nets };
};
function DebtWatch() {
  const { D, setFn, mods, me } = useD();
  const [f,setF] = useState(null);
  const w = debtWatch(D, mods);
  const save = () => { setFn('cf', cur=>[{ id:'limit', max:Math.max(1, parseNum(f.max)||DEBT_DEF.max), days:Math.max(1, parseInt(f.days,10)||DEBT_DEF.days) }, ...(cur||[]).filter(x=>x && x.id!=='limit')]); setF(null); };
  const cfg = { ...DEBT_DEF, ...((D.cf||[]).find(x=>x && x.id==='limit') || {}) };
  return (
    <>
      {w && (
        <div className="rise" data-testid="debt-watch" style={{borderRadius:14,border:'1px solid rgba(251,191,36,.45)',background:'rgba(251,191,36,.08)',padding:'12px 14px',display:'flex',flexDirection:'column',gap:6}}>
          <span style={{fontSize:14,fontWeight:800}}>{TT("⏳ Zeit zum Abrechnen")}</span>
          <span style={{fontSize:13,color:'var(--label2)',lineHeight:1.5}}>
            {w.overMax && `Offen sind €${fmt(w.top)} (eure Grenze: €${fmt(cfg.max)}).`}{w.overMax && w.overAge ? ' ' : ''}
            {w.overAge && `Der älteste offene Posten ist ${w.age} Tage alt (Grenze: ${cfg.days}).`}
          </span>
          <button className="btn btn-sec" style={{width:'auto',padding:'7px 12px',fontSize:12.5,alignSelf:'flex-start'}} onClick={()=>setF({ max:String(cfg.max).replace('.',','), days:String(cfg.days) })}>{TT("Grenzen ändern")}</button>
        </div>
      )}
      <MiniSheet open={!!f} onClose={()=>setF(null)} title={TT("Wann erinnern?")} color="var(--amber)">
        {f && <>
          <div className="sheet-sublbl">{TT("Erinnern, wenn offen mehr ist als")}</div>
          <div className="f-euro"><input className="field" inputMode="decimal" aria-label={TT("Grenze in Euro")} value={f.max} onChange={e=>setF({...f,max:e.target.value})}/></div>
          <label className="sheet-sublbl" htmlFor="dw-days">{TT("… oder der älteste Posten älter ist als (Tage)")}</label>
          <input id="dw-days" className="field" type="number" min="1" max="365" value={f.days} onChange={e=>setF({...f,days:e.target.value})}/>
          <button className="btn" style={{background:'var(--amber)',color:'var(--ink)'}} onClick={save}>{TT("Speichern")}</button>
        </>}
      </MiniSheet>
    </>
  );
}

/* ── Aufgabe abgeben (Key `tb`): „Ich kann heute nicht" → andere sehen das Angebot und können übernehmen.
   Übernehmen setzt den Zuständigen um; die Punkte bekommt, wer sie später abhakt. ── */
function ChoreHandover({ compact }) {
  const { D, setFn, me, notifyOthers, undo } = useD();
  const users = D.users || [], tasks = D.pt || [];
  const offers = (D.tb||[]).filter(o=>o && tasks.some(t=>t.id===o.taskId));
  if (!offers.length) return null;
  const take = o => {
    const t = tasks.find(x=>x.id===o.taskId);
    setFn('pt', cur=>cur.map(x=>x.id===o.taskId?{...x, assignee:me}:x));
    setFn('tb', cur=>cur.filter(x=>x.id!==o.id));
    notifyOthers(TT("🤝 {0} übernimmt „{1}\"", nameOfU(users, me), t?.name||'die Aufgabe'), TT("statt {0}", nameOfU(users, o.by)), TT("wg-tb"), TT("putz"));
    undo(TT("„{0}\" übernommen", t?.name), ()=>{ setFn('pt', cur=>cur.map(x=>x.id===o.taskId?{...x, assignee:o.by}:x)); setFn('tb', cur=>[o, ...cur]); });
  };
  const back = o => { setFn('tb', cur=>cur.filter(x=>x.id!==o.id)); undo(TT("Abgabe zurückgezogen"), ()=>setFn('tb', cur=>[o, ...cur])); };
  return (
    <div className="rise" data-testid="handover-card">
      {!compact && <div className="section-hdr">{TT("🤝 Kann jemand übernehmen?")}</div>}
      <div className="group">
        {offers.map(o=>{ const t = tasks.find(x=>x.id===o.taskId); return (
          <div key={o.id} className="cell" data-testid="handover-row" style={{flexWrap:'wrap',gap:8}}>
            <span style={{fontSize:18}}>{t?.em||'🧹'}</span>
            <div className="cell-content">
              <span className="cell-title">{t?.name || 'Aufgabe'}</span>
              <span className="cell-sub">{nameOfU(users, o.by)} {TT("kann nicht")}{o.note?` · „${o.note}"`:''}</span>
            </div>
            {o.by===me
              ? <button className="btn btn-sec" style={{width:'auto',padding:'8px 11px',fontSize:13}} onClick={()=>back(o)}>{TT("Doch selbst")}</button>
              : me && <button className="btn" style={{width:'auto',padding:'8px 11px',fontSize:13,background:'var(--amber)',color:'var(--ink)'}} onClick={()=>take(o)}>{TT("Übernehmen")}</button>}
          </div>); })}
      </div>
    </div>
  );
}

/* ── Belegung & Ruhezeiten (Key `bk`): Bad, Waschmaschine, Küche als Zeitfenster; Ruhe und Party als Ansage.
   Überschneidungen beim selben Bereich werden vor dem Speichern gemeldet. ── */
const BK_KINDS = [['bad','🚿','Bad'],['wash','🧺','Waschmaschine'],['kueche','🍳','Küche'],['ruhe','🤫','Ruhe bitte'],['party','🎉','Party/Besuch']];
const bkOverlap = (list, it) => list.some(x=>x && x.id!==it.id && x.kind===it.kind && x.date===it.date && x.from < it.to && it.from < x.to);
function BookCard() {
  const { D, setFn, me, notifyOthers, undo } = useD();
  const users = D.users || [];
  const [f,setF] = useState(null);
  const [msg,setMsg] = useState('');
  const today = todayISO(), end = shiftISO(today, 2);
  const list = (D.bk||[]).filter(b=>b && b.date>=today && b.date<=end).sort((a,b)=>(a.date+a.from).localeCompare(b.date+b.from));
  const save = () => {
    const it = { id:uid(), kind:f.kind, date:f.date, from:f.from, to:f.to, by:me||null, note:f.note.trim().slice(0,60) };
    if (it.from >= it.to) { setMsg(TT("Ende muss nach dem Start liegen.")); return; }
    if (bkOverlap(D.bk||[], it)) { setMsg(TT("Da ist schon jemand eingetragen – anderes Fenster wählen.")); return; }
    setFn('bk', cur=>[it, ...(cur||[]).filter(x=>x && x.date>=shiftISO(today,-7))]);   // Altes räumt sich selbst weg
    const [em,label] = [(BK_KINDS.find(k=>k[0]===it.kind)||[])[1], (BK_KINDS.find(k=>k[0]===it.kind)||[])[2]];
    notifyOthers(`${em} ${label}: ${boardWhen(it.date)} ${it.from}–${it.to}`, `${nameOfU(users, me)}${it.note?` · ${it.note}`:''}`, TT("wg-bk"), TT("board"));
    undo(TT("{0} {1} eingetragen", em, label), ()=>setFn('bk', cur=>cur.filter(x=>x.id!==it.id)));
    setF(null); setMsg('');
  };
  const del = b => { setFn('bk', cur=>cur.filter(x=>x.id!==b.id)); undo(TT("Eintrag entfernt"), ()=>setFn('bk', cur=>[b, ...cur])); };
  return (
    <div className="rise" data-testid="book-card">
      <div className="section-hdr" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span>{TT("🗓️ Belegung & Ruhezeiten")}</span>
        {me && <button className="hit" onClick={()=>{ setMsg(''); setF({ kind:'bad', date:todayISO(), from:'07:00', to:'07:30', note:'' }); }} style={{...hdrBtn,color:'var(--sky)'}}>{TT("+ Eintragen")}</button>}
      </div>
      {list.length>0 && <div className="group">
        {list.map(b=>{ const k = BK_KINDS.find(x=>x[0]===b.kind) || ['','🗓️','']; const u = users.find(x=>x.id===b.by); return (
          <div key={b.id} className="cell" data-testid="book-row">
            <span style={{fontSize:18}}>{k[1]}</span>
            <div className="cell-content">
              <span className="cell-title">{k[2]} · {b.from}–{b.to}</span>
              <span className="cell-sub">{boardWhen(b.date)} · <b style={{color:u?.color}}>{b.by===me?'du':u?.name||'jemand'}</b>{b.note?` · ${b.note}`:''}</span>
            </div>
            {b.by===me && <button className="del-btn" aria-label={TT("{0} {1} entfernen", k[2], b.from)} onClick={()=>del(b)}>×</button>}
          </div>); })}
      </div>}
      {!list.length && <div className="group"><div className="cell"><div className="cell-content"><span className="cell-sub">{TT("Duschzeit, Waschtag, Lernphase oder Besuch eintragen – die anderen sehen es sofort.")}</span></div></div></div>}
      <MiniSheet open={!!f} onClose={()=>{ setF(null); setMsg(''); }} title={TT("Eintragen")} color="var(--sky)">
        {f && <>
          <div style={{display:'flex',flexWrap:'wrap',gap:6}}>{BK_KINDS.map(([k,em,l])=><button key={k} type="button" style={chipSt(f.kind===k)} onClick={()=>setF({...f,kind:k})}>{em} {l}</button>)}</div>
          <label className="sheet-sublbl" htmlFor="bk-date">{TT("Tag")}</label>
          <input id="bk-date" type="date" className="field" min={todayISO()} value={f.date} onChange={e=>setF({...f,date:e.target.value})}/>
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            <input type="time" className="field" aria-label={TT("Von")} value={f.from} onChange={e=>setF({...f,from:e.target.value})} style={{flex:1}}/>
            <span style={{color:'var(--label2)'}}>{TT("bis")}</span>
            <input type="time" className="field" aria-label={TT("Bis")} value={f.to} onChange={e=>setF({...f,to:e.target.value})} style={{flex:1}}/>
          </div>
          <input className="field" maxLength={60} placeholder={TT("Notiz (optional), z. B. Prüfung lernen")} aria-label={TT("Notiz")} value={f.note} onChange={e=>setF({...f,note:e.target.value})}/>
          {msg && <span data-testid="book-msg" style={{fontSize:13,color:'var(--red)',fontWeight:700}}>{msg}</span>}
          <button className="btn" style={{background:'var(--sky)'}} onClick={save}>{TT("Speichern")}</button>
        </>}
      </MiniSheet>
    </div>
  );
}

/* ── Miete (seit wg-v73, Key `mi`): Einstellung {id:'cfg', total, day, mode, holder, s_<uid>} + Zahlungen {id:'<ym>-<uid>'}
   Bewusst KEIN hs-Posten: Miete läuft am WG-Topf vorbei (jede Person zahlt an den Vermieter bzw. an die Person,
   die einsammelt). Sonst stünde sie doppelt in Bilanz und Abrechnung.
   Anteile: eigener Betrag je Person, sonst gleich — der Rest-Cent landet bei der letzten Person, damit die Summe stimmt. ── */
const rentShares = (cfg, users) => {
  if (!cfg || !users.length) return {};
  const total = Number(cfg.total) || 0;
  const own = users.map(u => (cfg['s_' + u.id] === undefined || cfg['s_' + u.id] === null ? null : Number(cfg['s_' + u.id]) || 0));
  const restUsers = own.filter(x => x === null).length;
  const rest = Math.max(0, total - own.reduce((s, x) => s + (x || 0), 0));
  const each = restUsers ? Math.round(rest / restUsers * 100) / 100 : 0;
  const out = {}; let used = 0, lastAuto = -1;
  users.forEach((u, i) => { const v = own[i] === null ? each : own[i]; out[u.id] = v; used += v; if (own[i] === null) lastAuto = i; });
  if (lastAuto >= 0 && Math.abs(used - total) > 0.001) out[users[lastAuto].id] = Math.round((out[users[lastAuto].id] + (total - used)) * 100) / 100;
  return out;
};
// Fälligkeit im Monat ym (Tag wird auf die Monatslänge gekappt: der 31. im Februar = Monatsletzter)
const rentDue = (cfg, ym) => { const [y, m] = ym.split('-').map(Number); const last = new Date(y, m, 0).getDate();
  return `${ym}-${String(Math.min(Math.max(1, Number(cfg?.day) || 1), last)).padStart(2, '0')}`; };
function RentCard() {
  const { D, setFn, me, notifyOthers, undo } = useD();
  const users = D.users || [];
  const list = (D.mi || []).filter(Boolean);
  const cfg = list.find(x => x.id === 'cfg');
  const [ym, setYm] = useState(() => todayISO().slice(0, 7));
  const [f, setF] = useState(null);
  if (!users.length) return null;
  const shares = rentShares(cfg, users);
  const paidOf = id => list.find(x => x.id === `${ym}-${id}`);
  const openUsers = users.filter(u => !paidOf(u.id));
  const due = cfg ? rentDue(cfg, ym) : null;
  const late = due ? -daysSince(due) < 0 : false;
  const shiftYm = n => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); setYm(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`); };
  const save = () => {
    const total = parseNum(f.total); if (!(total > 0)) return;
    const s = Object.fromEntries(users.map(u => ['s_' + u.id, f.s[u.id].trim() === '' ? null : parseNum(f.s[u.id])]));
    setFn('mi', cur => [{ id: 'cfg', total, day: Math.min(28, Math.max(1, parseInt(f.day, 10) || 1)), mode: f.mode, holder: f.mode === 'holder' ? (f.holder || me) : null, ...s }, ...(cur || []).filter(x => x && x.id !== 'cfg')]);
    setF(null);
  };
  // „Bezahlt" je Person und Monat; Eintrag ist der Beleg (wer, wann, wie viel) — Klick nochmal nimmt ihn zurück
  const toggle = u => {
    const id = `${ym}-${u.id}`, had = paidOf(u.id);
    if (had) { setFn('mi', cur => cur.filter(x => x.id !== id)); undo(TT("Miete {0} wieder offen", u.name), () => setFn('mi', cur => [had, ...cur])); return; }
    const it = { id, ym, userId: u.id, amount: shares[u.id] || 0, ts: Date.now(), by: me || null };
    setFn('mi', cur => [it, ...(cur || [])]);
    const restNames = users.filter(x => x.id !== u.id && !paidOf(x.id)).map(x => x.name);
    notifyOthers(TT("💶 Miete {0}: {1} hat gezahlt", ymLabel(ym), u.name), restNames.length ? `Offen: ${restNames.join(', ')}` : 'Alle haben gezahlt ✓', TT("wg-mi"), TT("exp"));
    undo(TT("Miete {0} als gezahlt vermerkt", u.name), () => setFn('mi', cur => cur.filter(x => x.id !== id)));
  };
  return (
    <div className="rise" data-testid="rent-card">
      <div className="section-hdr" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <span>{TT("🏠 Miete")}</span>
        <button className="hit" onClick={() => setF({ total: cfg ? String(cfg.total).replace('.', ',') : '', day: String(cfg?.day || 3), mode: cfg?.mode || 'extern', holder: cfg?.holder || me,
          s: Object.fromEntries(users.map(u => [u.id, cfg && cfg['s_' + u.id] != null ? String(cfg['s_' + u.id]).replace('.', ',') : ''])) })} style={{ ...hdrBtn, color: 'var(--sky)' }}>{cfg ? 'Ändern' : '+ Einrichten'}</button>
      </div>
      <div className="group">
        {!cfg ? <div className="cell"><div className="cell-content"><span className="cell-sub">{TT("Miete eintragen – die App zeigt jeden Monat, wer schon gezahlt hat, und erinnert rechtzeitig.")}</span></div></div> : <>
          <div className="cell" style={{ gap: 8 }}>
            <button className="hit" aria-label={TT("Vormonat")} onClick={() => shiftYm(-1)} style={{ ...hdrBtn, fontSize: 18 }}>‹</button>
            <div className="cell-content" style={{ textAlign: 'center' }}>
              <span className="cell-title" data-testid="rent-month">{ymLabel(ym)} · {users.length - openUsers.length}/{users.length} {TT("bezahlt")}</span>
              <span className="cell-sub">€{fmt(cfg.total)} {TT("gesamt · fällig am")} {fmtDate(due)}{cfg.mode === 'holder' ? ` · an ${nameOfU(users, cfg.holder)}` : ''}</span>
            </div>
            <button className="hit" aria-label={TT("Folgemonat")} onClick={() => shiftYm(1)} style={{ ...hdrBtn, fontSize: 18 }}>›</button>
          </div>
          {users.map(u => { const p = paidOf(u.id), mayMark = u.id === me || (cfg.mode === 'holder' && cfg.holder === me); return (
            <div key={u.id} className="cell" data-testid="rent-row">
              <div style={{ width: 10, height: 10, borderRadius: '50%', background: u.color, flexShrink: 0 }} />
              <div className="cell-content">
                <span className="cell-title">{u.name} · €{fmt(shares[u.id] || 0)}</span>
                <span className="cell-sub" style={p ? { color: 'var(--green)', fontWeight: 700 } : late ? { color: 'var(--red)', fontWeight: 700 } : undefined}>
                  {p ? `bezahlt${p.ts ? ` am ${fmtDate(isoOfTs(p.ts))}` : ''}${p.by && p.by !== u.id ? ` (vermerkt von ${nameOfU(users, p.by)})` : ''}` : late ? 'offen – überfällig' : 'offen'}
                </span>
              </div>
              {mayMark && <button className="btn btn-sec" data-testid={p ? 'rent-undo' : 'rent-pay'} aria-label={p ? `${u.name}: Zahlung zurücknehmen` : `${u.name} hat gezahlt`} style={{ width: 'auto', padding: '8px 11px', fontSize: 13, flexShrink: 0 }} onClick={() => toggle(u)}>{p ? 'Zurück' : u.id === me ? 'Bezahlt ✓' : 'Erhalten ✓'}</button>}
            </div>); })}
        </>}
      </div>
      <MiniSheet open={!!f} onClose={() => setF(null)} title={TT("Miete")} color="var(--sky)">
        {f && <>
          <div className="f-euro"><input className="field" autoFocus inputMode="decimal" placeholder={TT("Miete gesamt (warm)")} aria-label={TT("Miete gesamt")} value={f.total} onChange={e => setF({ ...f, total: e.target.value })} /></div>
          <label className="sheet-sublbl" htmlFor="mi-day">{TT("Fällig am … des Monats")}</label>
          <input id="mi-day" className="field" type="number" min="1" max="28" value={f.day} onChange={e => setF({ ...f, day: e.target.value })} />
          <div style={{ display: 'flex', gap: 6 }}>
            <button type="button" style={{ ...chipSt(f.mode === 'extern'), flex: 1 }} onClick={() => setF({ ...f, mode: 'extern' })}>{TT("Jede/r selbst")}</button>
            <button type="button" style={{ ...chipSt(f.mode === 'holder'), flex: 1 }} onClick={() => setF({ ...f, mode: 'holder' })}>{TT("Eine Person sammelt")}</button>
          </div>
          {f.mode === 'holder' && <div className="pick">{users.map(u => <button key={u.id} type="button" className={`pick-btn${f.holder === u.id ? ' on' : ''}`} style={{ background: u.color }} onClick={() => setF({ ...f, holder: u.id })}>{u.name}</button>)}</div>}
          <div className="sheet-sublbl">{TT("Anteile (leer = gleich verteilt)")}</div>
          {users.map(u => <div key={u.id} className="f-euro"><input className="field" inputMode="decimal" placeholder={u.name} aria-label={TT("Mietanteil {0}", u.name)} value={f.s[u.id]} onChange={e => setF({ ...f, s: { ...f.s, [u.id]: e.target.value } })} /></div>)}
          <button className="btn" style={{ background: 'var(--sky)' }} onClick={save}>{TT("Speichern")}</button>
        </>}
      </MiniSheet>
    </div>
  );
}

/* ══════════════════════════
   EINRICHTUNG (seit wg-v72): Assistent Schritt für Schritt, animiert.
   Modi: 'found' (neue WG gründen), 'join' (per Code/Einladungslink beitreten), 'personal' (aus „Mehr“: eigenes Profil nachziehen).
   Erscheint nur auf einem wirklich neuen Gerät (wg_fresh: Code wurde auf diesem Gerät erzeugt, noch nie eingerichtet)
   oder mit Einladungslink ?join=CODE. Bestehende Geräte sehen ihn nie ungefragt.
   Jeder Schritt speichert sofort — bricht man ab, bleibt das Bisherige erhalten.
══════════════════════════ */
let JOIN_CODE = null;          // aus ?join=… (AppInner liest die URL einmal)
const SETUP_KEY = 'wg_setup_v1';
const ONB_COLORS = ['#38bdf8','#fbbf24','#a78bfa','#f472b6','#34d399','#fb923c'];
const ONB_WG_EM = ['🏠','🏡','🌿','🐈','🎸','🍕','🌻','🚲'];
const ONB_MODS = [['putz','🧽','Putzplan','Wer ist dran – fair verteilt'],['grow','🌱','Growbox','Pflanzen, Gießen, Kosten nach Anteil'],['fin','🔒','Privat','Eigene Finanzen, nur auf diesem Handy'],
  ['abos','📱','Abos','Netflix & Co. mit Kündigungsfrist'],['stats','📊','Übersicht','Monat, Zähler, Nebenkosten'],['game','👑','Spielelemente','Wochen-Duell & Pünktlich-Serie']];
const ONB_CHORES_PRE = ['Müll rausbringen','Bad putzen','Küche putzen','Staubsaugen'];
// nächster Termin eines Wochentags (0 = So … 6 = Sa) ab heute
const nextWeekdayISO = wd => { const d=new Date(); d.setHours(12); d.setDate(d.getDate()+((wd-d.getDay()+7)%7)); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
// gibt es unter diesem Code eine WG? (liest nur die Personen; eigene App-Instanz wie der DataProvider)
async function onbCodeExists(fbCfg, code) {
  const appName = 'wg-' + (fbCfg.projectId || fbCfg.databaseURL || 'default');
  let app; try { app = firebase.app(appName); } catch { app = firebase.initializeApp(fbCfg, appName); }
  const snap = await Promise.race([firebase.database(app).ref(`wg/${code}/users`).once('value'), new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')), 8000))]);
  const v = snap && snap.val(); return !!(v && (Array.isArray(v) ? v.length : Object.keys(v).length));
}

/* Bausteine des Assistenten (Modulebene: stabile Komponententypen → keine Neu-Montage bei jedem Tastendruck) */
const OnbBig = ({ children, onClick, color='var(--mint)', disabled, tid }) => <button className="btn onb-big" data-testid={tid} disabled={disabled} onClick={onClick} style={{background:disabled?'var(--bg3)':color}}>{children}</button>;
const OnbTitle = ({ em, t, s }) => <div className="onb-title"><div className="onb-em" aria-hidden="true">{em}</div><h2>{t}</h2>{s && <p>{s}</p>}</div>;
const OnbDots = ({ value, onPick, taken=[] }) => <div style={{display:'flex',gap:8}}>{ONB_COLORS.map(c=><button key={c} type="button" aria-label={TT("Farbe {0}", c)} aria-pressed={value===c} onClick={()=>onPick(c)} disabled={taken.includes(c) && value!==c}
  style={{width:30,height:30,borderRadius:'50%',border:value===c?'3px solid var(--label)':'2px solid transparent',background:c,opacity:taken.includes(c)&&value!==c?.25:1,cursor:'pointer',transition:'transform .15s',transform:value===c?'scale(1.12)':'none'}}/>)}</div>;

function Onboarding({ mode: startMode, onDone }) {
  const { D, set, setFn, me, setMe, mods, setMods, wgCode, setWgCode, status, fbCfg, pushSave } = useD();
  const users = D.users || [];
  const [mode,setMode] = useState(startMode === 'personal' ? 'personal' : JOIN_CODE ? 'join' : null);
  const [step,setStep] = useState(startMode === 'personal' ? 'who' : JOIN_CODE ? 'code' : 'welcome');
  const [dir,setDir] = useState(1);            // Animationsrichtung (1 = vor, -1 = zurück)
  const [f,setF] = useState(() => ({
    name:'', color:ONB_COLORS[0], mates:[{ name:'', color:ONB_COLORS[1] }], wgName:'', wgEm:'🏠',
    mods:{ ...MOD_DEF, ...mods }, chores:[...ONB_CHORES_PRE], trash:{}, code:JOIN_CODE||'', pp:'', holder:'', iban:'',
  }));
  const [msg,setMsg] = useState('');
  const [busy,setBusy] = useState(false);
  const [pushState,setPushState] = useState(null);   // null | 'ok' | 'denied' | 'install' | 'err'
  const up = patch => setF(x=>({ ...x, ...patch }));
  const [copied,setCopied] = useState(false);
  const meU = users.find(u=>u.id===me);

  const flows = {
    found:    ['welcome','people','wg','mods', ...(f.mods.putz!==false ? ['putz'] : []), 'money','push','invite','done'],
    join:     ['welcome','code','who','mods','money','push','done'],
    personal: ['who','mods','money','push','done'],
  };
  const flow = flows[mode || 'found'];
  const idx = Math.max(0, flow.indexOf(step));
  const go = s => { setMsg(''); setDir(flow.indexOf(s) >= idx ? 1 : -1); setStep(s); };
  const next = () => go(flow[Math.min(flow.length-1, idx+1)]);
  const back = () => idx > 0 && go(flow[idx-1]);

  // Beim Beitreten: sobald der Server-Stand da ist, den Code-Schritt verlassen
  const [waitJoin,setWaitJoin] = useState(false);
  useEffect(()=>{ if (waitJoin && status==='synced' && wgCode===f.code) { setWaitJoin(false); setBusy(false); go('who'); } }, [waitJoin, status, wgCode, D.users]);
  // Profilfelder für „personal“/„join“ mit dem vorhandenen Stand vorbelegen
  useEffect(()=>{ if (meU && (step==='who' || step==='money')) up({ name: f.name || meU.name, color: meU.color || f.color, pp: f.pp || meU.pp || '', holder: f.holder || meU.holder || '', iban: f.iban || meU.iban || '' }); }, [step, me]);

  /* ── Aktionen je Schritt (speichern sofort) ── */
  const savePeople = () => {
    const name = f.name.trim(); if (!name) { setMsg(TT("Wie heißt du?")); return; }
    const mates = f.mates.map(m=>({ ...m, name:m.name.trim() })).filter(m=>m.name);
    const all = [{ id:uid(), name:name.slice(0,40), color:f.color, joined:todayISO() }, ...mates.map(m=>({ id:uid(), name:m.name.slice(0,40), color:m.color, joined:todayISO() }))];
    set('users', all); setMe(all[0].id); next();
  };
  const saveWg = () => { if (f.wgName.trim()) setFn('cf', cur=>[{ id:'wg', name:f.wgName.trim().slice(0,40), em:f.wgEm }, ...(cur||[]).filter(x=>x && x.id!=='wg')]); next(); };
  const saveMods = () => { setMods({ ...mods, ...f.mods }); next(); };
  const savePutz = () => {
    const us = D.users || [];
    const tasks = f.chores.map((n,i)=>{ const p = CHORE_PRESETS.find(c=>c[0]===n) || [n,'🧽',7,2]; return { id:uid(), name:p[0], em:p[1], interval:p[2], pts:p[3], assignee:us[i % Math.max(1,us.length)]?.id || me, lastDone:null }; });
    if (tasks.length) setFn('pt', cur=>[...(cur||[]).filter(t=>t && !f.chores.includes(t.name)), ...tasks]);
    const picks = Object.entries(f.trash).filter(([,v])=>v && v.on).map(([k,v])=>({ id:'mk-'+k, kind:k, start:v.start, every:+v.every||1 }));
    if (picks.length) setFn('mk', cur=>[...(cur||[]).filter(x=>x && !picks.some(p=>p.id===x.id)), ...picks]);
    next();
  };
  const saveMoney = () => {
    if (f.iban.trim() && !ibanValid(f.iban)) { setMsg(TT("Die IBAN stimmt nicht – bitte prüfen oder leer lassen.")); return; }
    if (me) set('users', (D.users||[]).map(u=>u.id===me ? { ...u, pp:f.pp.trim(), holder:f.holder.trim(), iban:ibanClean(f.iban), ...(mode!=='found' && f.name.trim() ? { name:f.name.trim().slice(0,40), color:f.color } : {}) } : u));
    next();
  };
  const joinNow = async () => {
    const c = f.code.trim().toUpperCase(); if (!c) return;
    if (c === wgCode) { go('who'); return; }
    setBusy(true); setMsg('');
    try {
      if (!(await onbCodeExists(fbCfg, c))) { setMsg(TT("Unter diesem Code gibt es keine WG – Tippfehler?")); setBusy(false); return; }
      sessionStorage.setItem('wg_join_mode', 'remote');   // Server-Stand gewinnt (frisches Gerät hat nichts Eigenes)
      up({ code:c }); setWgCode(c); setWaitJoin(true);
    } catch { setMsg(TT("Keine Verbindung – bitte online gehen und nochmal tippen.")); setBusy(false); }
  };
  const pickMe = id => { setMe(id); const u = users.find(x=>x.id===id); if (u) up({ name:u.name, color:u.color||f.color, pp:u.pp||'', holder:u.holder||'', iban:u.iban||'' }); };
  const addMe = () => {
    const name = f.name.trim(); if (!name) { setMsg(TT("Wie heißt du?")); return; }
    const color = ONB_COLORS.find(c=>!users.some(u=>u.color===c)) || f.color;
    const nu = { id:uid(), name:name.slice(0,40), color, joined:todayISO() };
    set('users', [...users, nu]); setMe(nu.id); next();
  };
  const enablePushNow = async () => {
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent||''), standalone = (()=>{ try { return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; } catch { return false; } })();
    if (!('Notification' in window && 'serviceWorker' in navigator && 'PushManager' in window)) { setPushState(ios && !standalone ? 'install' : 'err'); return; }
    setBusy(true);
    try {
      const perm = Notification.permission === 'granted' ? 'granted' : await Notification.requestPermission();
      if (perm !== 'granted') { setPushState('denied'); setBusy(false); return; }
      const reg = await Promise.race([navigator.serviceWorker.ready, new Promise(r=>setTimeout(()=>r(null), 5000))]);
      if (!reg) throw new Error('kein Service Worker');
      const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });
      const j = sub.toJSON() || {};
      await pushSave({ endpoint:j.endpoint, p256dh:(j.keys&&j.keys.p256dh)||null, auth:(j.keys&&j.keys.auth)||null, name:meU?.name||'Gerät', uid:me||null, t:Date.now() });
      setPushState('ok');
    } catch { setPushState('err'); }
    setBusy(false);
  };
  const finish = () => { ss(SETUP_KEY, todayISO()); try { localStorage.removeItem('wg_fresh'); } catch {} JOIN_CODE = null; onDone(); };

  const appUrl = location.origin + location.pathname.replace(/wgapp\.html$/, '');
  const invite = `${appUrl}?join=${encodeURIComponent(wgCode||'')}`;
  const waText = `Hey! Ich hab unsere WG-App eingerichtet 🏠 Tipp auf den Link, dann bist du direkt drin: ${invite}`;

  const screens = {
    welcome: <>
      <OnbTitle em="🏠" t="Willkommen!" s="In zwei Minuten ist eure WG-App eingerichtet – Namen, Putzplan, Geld und Benachrichtigungen."/>
      <OnbBig tid="onb-found" onClick={()=>{ setMode('found'); setDir(1); setStep('people'); }}>{TT("✨ Neue WG gründen")}</OnbBig>
      <OnbBig tid="onb-join" color="var(--sky)" onClick={()=>{ setMode('join'); setDir(1); setStep('code'); }}>{TT("🔑 Ich habe einen Code oder Link")}</OnbBig>
    </>,
    people: <>
      <OnbTitle em="👋" t="Wer wohnt bei euch?" s="Erst du, dann deine Mitbewohner. Farben helfen beim schnellen Erkennen."/>
      <input className="field" autoFocus maxLength={40} placeholder={TT("Dein Name")} aria-label={TT("Dein Name")} value={f.name} onChange={e=>up({ name:e.target.value })}/>
      <OnbDots value={f.color} onPick={c=>up({ color:c })} taken={f.mates.map(m=>m.color)}/>
      <div className="sheet-sublbl" style={{marginTop:6}}>{TT("Mitbewohner")}</div>
      {f.mates.map((m,i)=><div key={i} className="onb-row" style={{display:'flex',flexDirection:'column',gap:6}}>
        <div style={{display:'flex',gap:6}}>
          <input className="field" maxLength={40} placeholder={TT("Name {0}", i+1)} aria-label={TT("Mitbewohner {0}", i+1)} value={m.name} style={{flex:1}} onChange={e=>up({ mates:f.mates.map((x,j)=>j===i?{...x,name:e.target.value}:x) })}/>
          {f.mates.length>1 && <button type="button" className="del-btn" aria-label={TT("Mitbewohner {0} entfernen", i+1)} onClick={()=>up({ mates:f.mates.filter((_,j)=>j!==i) })}>×</button>}
        </div>
        <OnbDots value={m.color} onPick={c=>up({ mates:f.mates.map((x,j)=>j===i?{...x,color:c}:x) })} taken={[f.color, ...f.mates.filter((_,j)=>j!==i).map(x=>x.color)]}/>
      </div>)}
      {f.mates.length<5 && <button type="button" className="btn btn-sec" onClick={()=>up({ mates:[...f.mates, { name:'', color:ONB_COLORS.find(c=>c!==f.color && !f.mates.some(m=>m.color===c)) || ONB_COLORS[0] }] })}>{TT("+ Weitere Person")}</button>}
      <OnbBig tid="onb-next" onClick={savePeople} disabled={!f.name.trim()}>{TT("Weiter")}</OnbBig>
    </>,
    wg: <>
      <OnbTitle em={f.wgEm} t="Wie heißt eure WG?" s="Optional – steht dann oben auf „Heute“."/>
      <input className="field" autoFocus maxLength={40} placeholder={TT("z. B. WG Sonnenallee")} aria-label={TT("Name der WG")} value={f.wgName} onChange={e=>up({ wgName:e.target.value })}/>
      <div style={{display:'flex',flexWrap:'wrap',gap:8}}>{ONB_WG_EM.map(e=><button key={e} type="button" aria-pressed={f.wgEm===e} onClick={()=>up({ wgEm:e })} style={{...chipSt(f.wgEm===e),fontSize:22,padding:'6px 10px'}}>{e}</button>)}</div>
      <OnbBig tid="onb-next" onClick={saveWg}>{f.wgName.trim() ? 'Weiter' : 'Überspringen'}</OnbBig>
    </>,
    mods: <>
      <OnbTitle em="🧩" t="Was braucht ihr?" s="Haushalt & Einkauf sind immer dabei. Alles hier lässt sich später unter „Mehr“ ändern."/>
      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        {ONB_MODS.map(([k,em,l,s])=>{ const on = f.mods[k]!==false; return (
          <button key={k} type="button" className="onb-mod" aria-pressed={on} onClick={()=>up({ mods:{ ...f.mods, [k]:!on } })}
            style={{display:'flex',alignItems:'center',gap:12,padding:'12px 14px',borderRadius:14,border:on?'2px solid var(--mint)':'2px solid var(--sep)',background:on?'rgba(94,234,212,.08)':'var(--bg2)',color:'var(--label)',textAlign:'left',fontFamily:'inherit',cursor:'pointer',transition:'all .2s'}}>
            <span style={{fontSize:24}}>{em}</span>
            <span style={{flex:1}}><b style={{display:'block',fontSize:15}}>{l}</b><span style={{fontSize:12.5,color:'var(--label2)'}}>{s}</span></span>
            <span style={{fontSize:18,color:on?'var(--mint)':'var(--label3)'}}>{on?'✓':'○'}</span>
          </button>); })}
      </div>
      <OnbBig tid="onb-next" onClick={saveMods}>{TT("Weiter")}</OnbBig>
    </>,
    putz: <>
      <OnbTitle em="🧽" t="Putzplan & Müll" s="Antippen, was bei euch anfällt – wer dran ist, verteilt die App fair."/>
      <div style={{display:'flex',flexWrap:'wrap',gap:6}}>{CHORE_PRESETS.slice(0,12).map(([n,em])=>{ const on=f.chores.includes(n); return <button key={n} type="button" aria-pressed={on} style={chipSt(on)} onClick={()=>up({ chores:on?f.chores.filter(x=>x!==n):[...f.chores,n] })}>{em} {n}</button>; })}</div>
      <div className="sheet-sublbl" style={{marginTop:8}}>{TT("Müllabfuhr (optional)")}</div>
      {Object.entries(PICK_KINDS).map(([k,[em,l]])=>{ const t=f.trash[k]; return (
        <div key={k} style={{display:'flex',flexDirection:'column',gap:6}}>
          <button type="button" aria-pressed={!!t?.on} style={{...chipSt(!!t?.on),alignSelf:'flex-start'}} onClick={()=>up({ trash:{ ...f.trash, [k]: t?.on ? { ...t, on:false } : { on:true, start:t?.start||nextWeekdayISO(3), every:t?.every||(k==='rest'||k==='bio'?1:2) } } })}>{em} {l}</button>
          {t?.on && <div style={{display:'flex',gap:6,alignItems:'center',paddingLeft:6}}>
            <input type="date" className="field" aria-label={TT("{0}: nächste Abholung", l)} value={t.start} onChange={e=>up({ trash:{ ...f.trash, [k]:{ ...t, start:e.target.value } } })} style={{flex:1,minWidth:0}}/>
            <select className="field" aria-label={TT("{0}: Rhythmus", l)} value={t.every} onChange={e=>up({ trash:{ ...f.trash, [k]:{ ...t, every:+e.target.value } } })} style={{width:'auto',flexShrink:0}}>
              <option value={1}>{TT("wöchentlich")}</option><option value={2}>{TT("alle 2 Wo.")}</option><option value={4}>{TT("alle 4 Wo.")}</option>
            </select>
          </div>}
        </div>); })}
      <OnbBig tid="onb-next" onClick={savePutz}>{TT("Weiter")}</OnbBig>
    </>,
    code: <>
      <OnbTitle em="🔑" t="WG beitreten" s="Den Code bekommst du von deinem Mitbewohner – oder du tippst einfach auf seinen Einladungslink."/>
      <input className="field num" autoFocus placeholder={TT("z. B. BLAU-MOND-ABC234")} aria-label={TT("WG-Code")} autoCapitalize="characters" autoCorrect="off" spellCheck={false} value={f.code} onChange={e=>up({ code:e.target.value.toUpperCase() })} style={{fontSize:18,letterSpacing:'.04em',textAlign:'center'}}/>
      <OnbBig tid="onb-joinnow" onClick={joinNow} disabled={busy || !f.code.trim()}>{busy ? 'Verbinde …' : 'Beitreten'}</OnbBig>
    </>,
    who: <>
      <OnbTitle em="🙋" t={mode==='personal' ? 'Das bist du' : 'Wer bist du?'} s={mode==='personal' ? 'Name und Farbe für dieses Handy – die anderen sehen die Änderung sofort.' : 'Tipp auf deinen Namen – oder trag dich neu ein.'}/>
      {users.length>0 && <div className="pick">{users.map(u=><button key={u.id} type="button" className={`pick-btn${me===u.id?' on':''}`} style={{background:u.color}} aria-label={TT("Ich bin {0}", u.name)} onClick={()=>pickMe(u.id)}>{u.name}</button>)}</div>}
      {mode!=='personal' && <>
        <div className="sheet-sublbl" style={{marginTop:6}}>{TT("Ich bin neu hier")}</div>
        <div style={{display:'flex',gap:6}}>
          <input className="field" maxLength={40} placeholder={TT("Dein Name")} aria-label={TT("Neu: dein Name")} value={me?'':f.name} onChange={e=>{ if (me) setMe(null); up({ name:e.target.value }); }} style={{flex:1}}/>
          <button type="button" className="btn" style={{width:'auto',padding:'0 16px',background:'var(--mint)'}} onClick={addMe}>{TT("Hinzufügen")}</button>
        </div>
      </>}
      {mode==='personal' && me && <>
        <input className="field" maxLength={40} aria-label={TT("Dein Name")} value={f.name} onChange={e=>up({ name:e.target.value })}/>
        <OnbDots value={f.color} onPick={c=>up({ color:c })} taken={users.filter(u=>u.id!==me).map(u=>u.color)}/>
      </>}
      <OnbBig tid="onb-next" disabled={!me} onClick={()=>{ if (mode==='personal' && f.name.trim()) set('users', users.map(u=>u.id===me?{ ...u, name:f.name.trim().slice(0,40), color:f.color }:u)); next(); }}>{TT("Weiter")}</OnbBig>
    </>,
    money: <>
      <OnbTitle em="💶" t="So bekommst du Geld zurück" s="Wenn jemand dir etwas schuldet, zeigt die App deine Daten zum Antippen bzw. Kopieren. Alles optional."/>
      <div style={{display:'flex',alignItems:'center',gap:6}}><span style={{fontSize:14,color:'var(--label3)',fontWeight:700}}>{TT("paypal.me/")}</span>
        <input className="field" maxLength={100} placeholder={TT("dein-name")} aria-label={TT("PayPal.me-Name")} autoCapitalize="off" autoCorrect="off" spellCheck={false} value={f.pp} onChange={e=>up({ pp:e.target.value })} style={{flex:1}}/></div>
      <input className="field" maxLength={70} placeholder={TT("Kontoinhaber (wie auf der Karte)")} aria-label={TT("Kontoinhaber")} value={f.holder} onChange={e=>up({ holder:e.target.value })}/>
      <input className="field num" maxLength={42} placeholder={TT("IBAN")} aria-label={TT("IBAN")} autoCapitalize="characters" autoCorrect="off" spellCheck={false} value={f.iban} onChange={e=>up({ iban:e.target.value })}/>
      {f.iban.trim() && <span data-testid="onb-iban" style={{fontSize:13,fontWeight:700,color:ibanValid(f.iban)?'var(--green)':'var(--amber)'}}>{ibanValid(f.iban) ? `✓ ${ibanFmt(f.iban)}` : '⚠️ IBAN stimmt noch nicht'}</span>}
      <span style={{fontSize:12,color:'var(--label2)'}}>{TT("Sichtbar nur für eure WG, nie im Gast-Link.")}</span>
      <OnbBig tid="onb-next" onClick={saveMoney}>{f.pp.trim() || f.iban.trim() ? 'Speichern & weiter' : 'Überspringen'}</OnbBig>
    </>,
    push: <>
      <OnbTitle em="🔔" t="Nichts mehr verpassen" s="Die App meldet sich nur, wenn es dich betrifft:"/>
      <div className="onb-list">
        {[['🗑️','Müll: am Vorabend, wenn du dran bist'],['🧽','Putzplan: wenn deine Aufgabe fällig ist'],['💶','Geld: neue Ausgaben und Zahlungen'],['🛒','Einkauf: wenn etwas auf die Liste kommt']].map(([e,t],i)=><div key={i} className="onb-li" style={{animationDelay:`${120+i*90}ms`}}><span>{e}</span>{t}</div>)}
      </div>
      {pushState==='ok' ? <div data-testid="onb-push-ok" className="onb-ok">{TT("✓ Benachrichtigungen sind an")}</div>
        : pushState==='install' ? <div className="onb-hint">{TT("Auf dem iPhone geht das nur in der installierten App:")} <b>{TT("Teilen ⬆️ → „Zum Home-Bildschirm“")}</b>{TT(", dann die App von dort öffnen – der Assistent macht dort weiter.")}</div>
        : pushState==='denied' ? <div className="onb-hint">{TT("Blockiert – in den Handy-Einstellungen für diese App erlauben. Später unter „Mehr → Benachrichtigungen“.")}</div>
        : pushState==='err' ? <div className="onb-hint">{TT("Hat nicht geklappt – später unter „Mehr → Benachrichtigungen“ nochmal.")}</div> : null}
      {pushState!=='ok' && <OnbBig tid="onb-push" color="var(--sky)" onClick={enablePushNow} disabled={busy}>{busy ? '…' : 'Benachrichtigungen erlauben'}</OnbBig>}
      <button type="button" className="btn btn-sec" data-testid="onb-next" onClick={next}>{pushState==='ok' ? 'Weiter' : 'Später'}</button>
    </>,
    invite: <>
      <OnbTitle em="💌" t="Mitbewohner einladen" s="Ein Tipp auf den Link – und sie sind in eurer WG. Nur an Mitbewohner schicken: der Link ist der Zugang."/>
      <div className="onb-code num" data-testid="onb-code">{wgCode}</div>
      <a className="btn onb-big" data-testid="onb-wa" href={'https://wa.me/?text='+encodeURIComponent(waText)} target="_blank" rel="noopener" style={{background:'#25d366',color:'#062b14',textDecoration:'none',display:'flex',alignItems:'center',justifyContent:'center'}}>{TT("Per WhatsApp einladen")}</a>
      <button type="button" className="btn btn-sec" onClick={async()=>{ if (navigator.share) { try { await navigator.share({ text:waText }); return; } catch {} } setCopied(await copyTxt(invite)); }}>{copied ? 'Link kopiert ✓' : 'Link teilen / kopieren'}</button>
      <OnbBig tid="onb-next" onClick={next}>{TT("Weiter")}</OnbBig>
    </>,
    done: <>
      <div className="onb-confetti" aria-hidden="true">{Array.from({ length: REDUCE() ? 0 : 36 }, (_,i)=><i key={i} style={{ left:`${(i*53)%100}%`, background:ONB_COLORS[i%ONB_COLORS.length], animationDelay:`${(i%9)*70}ms`, animationDuration:`${1100+(i%5)*180}ms` }}/>)}</div>
      <OnbTitle em="🎉" t={`Fertig${meU ? `, ${meU.name}` : ''}!`} s={mode==='found' ? 'Eure WG ist eingerichtet. Sobald die anderen den Link öffnen, seid ihr verbunden.' : 'Alles eingerichtet. Viel Spaß in der WG!'}/>
      <OnbBig tid="onb-finish" onClick={finish}>{TT("Los geht's")}</OnbBig>
    </>,
  };
  const canBack = idx > 0 && !['done'].includes(step) && !(mode==='join' && step==='who') && step!=='welcome';
  return ReactDOM.createPortal(
    <div className="overlay onb" data-testid="onboarding" role="dialog" aria-modal="true" aria-label={TT("Einrichtung")}>
      <div className="onb-card">
        {step!=='welcome' && step!=='done' && <div className="onb-top">
          {canBack ? <button type="button" className="onb-back" aria-label={TT("Zurück")} onClick={back}>‹</button> : <span style={{width:32}}/>}
          <div className="onb-bar"><div style={{ width:`${Math.round(idx/(flow.length-1)*100)}%` }}/></div>
          {mode==='personal' ? <button type="button" className="onb-back" aria-label={TT("Schließen")} onClick={onDone}>×</button> : <span style={{width:32}}/>}
        </div>}
        <div key={step} className={`onb-step ${dir>0?'fwd':'bwd'}`} data-step={step}>
          {screens[step]}
          {msg && <div data-testid="onb-msg" className="onb-msg">{msg}</div>}
        </div>
      </div>
    </div>, document.body);
}

/* ── Push-Hinweis auf „Heute" (seit wg-v71): Push fehlte beim Mitbewohner, der Hinweis stand nur tief unter „Mehr".
   1) Dieses Gerät: aus / blockiert / iPhone nicht auf dem Home-Bildschirm → Karte mit dem passenden nächsten Schritt.
   2) Andere Person ohne Push-Gerät → Karte mit „Per WhatsApp Bescheid geben" (Push erreicht sie ja gerade nicht).
   Zuordnung Gerät → Person über uid (seit wg-v71), ältere Einträge über den Namen. „Später" blendet 7 Tage aus. ── */
let PUSH_JUMP = false;
