// Scrollt beim Öffnen von „Mehr" zur Benachrichtigungs-Gruppe, wenn man von der Heute-Karte kommt
function PushJump() {
  useEffect(()=>{ if (!PUSH_JUMP) return; PUSH_JUMP = false; setTimeout(()=>document.querySelector('[data-fold="push"]')?.scrollIntoView({ block:'start', behavior:'smooth' }), 80); }, []);
  return null;
}   // Heute → Mehr: Benachrichtigungen aufklappen und hinscrollen
const PUSH_NUDGE_KEY = 'wg_push_nudge';
function PushNudge({ goTab }) {
  const { D, me, status, listPushDevices, pushPrefsUpdate } = useD();
  const users = D.users || [];
  const [mine,setMine] = useState(null);   // 'on' | 'off' | 'denied' | 'install' | 'na'
  const [devs,setDevs] = useState(null);
  const [later,setLater] = useState(()=>{ const n = ls(PUSH_NUDGE_KEY, null); return !!(n && n.until > Date.now()); });
  useEffect(()=>{
    let alive = true;
    (async ()=>{
      try {
        const ios = /iphone|ipad|ipod/i.test(navigator.userAgent||'');
        const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        if (!('Notification' in window && 'serviceWorker' in navigator && 'PushManager' in window)) { if (alive) setMine(ios && !standalone ? 'install' : 'na'); return; }
        if (Notification.permission === 'denied') { if (alive) setMine('denied'); return; }
        // ohne aktiven Service Worker (z. B. erster Aufruf) lieber nichts behaupten → nach 3 s „unbekannt"
        const reg = await Promise.race([navigator.serviceWorker.ready, new Promise(r=>setTimeout(()=>r(null), 3000))]);
        if (!reg) { if (alive) setMine('na'); return; }
        const sub = await reg.pushManager.getSubscription();
        if (alive) setMine(sub ? 'on' : 'off');
      } catch { if (alive) setMine('na'); }
    })();
    return ()=>{ alive = false; };
  }, []);
  useEffect(()=>{ if (status==='synced' && listPushDevices) listPushDevices().then(setDevs).catch(()=>{}); }, [status]);
  // Alte Anmeldungen (vor wg-v71) nachträglich der Person zuordnen
  useEffect(()=>{ if (mine==='on' && me && pushPrefsUpdate) pushPrefsUpdate({ uid:me }).catch(()=>{}); }, [mine, me]);
  const hasPush = u => (devs||[]).some(d=>d.uid ? d.uid===u.id : d.name===u.name);
  const missing = me && Array.isArray(devs) && !later ? users.filter(u=>u.id!==me && !hasPush(u)) : [];
  const own = mine==='off' || mine==='denied' || mine==='install';
  if (!own && !missing.length) return null;
  const appUrl = location.origin + location.pathname.replace(/wgapp\.html$/, '');
  const wa = u => 'https://wa.me/?text=' + encodeURIComponent(`Hey ${u.name}, schalt bitte in der WG-App die Benachrichtigungen ein (Müll, Putzplan, Zahlungen): App öffnen → auf „Heute" oben „Einschalten" tippen. Auf dem iPhone die App vorher über Teilen → „Zum Home-Bildschirm" hinzufügen. ${appUrl}`);
  const jump = () => { ss('wg_fold_push', true); PUSH_JUMP = true; goTab('set'); };
  const snooze = () => { ss(PUSH_NUDGE_KEY, { until: Date.now() + 7*864e5 }); setLater(true); };
  return (
    <div className="group rise" data-testid="push-nudge">
      {own && (
        <div className="cell" data-testid="push-nudge-own" style={{gap:10,flexWrap:'wrap'}}>
          <span style={{fontSize:20}}>🔔</span>
          <div className="cell-content">
            <span className="cell-title">{mine==='install' ? 'Erst zum Home-Bildschirm hinzufügen' : mine==='denied' ? 'Benachrichtigungen sind blockiert' : 'Benachrichtigungen sind aus'}</span>
            <span className="cell-sub">{mine==='install' ? 'Auf dem iPhone kommen sie nur in der installierten App: Teilen ⬆️ → „Zum Home-Bildschirm", dann von dort öffnen.'
              : mine==='denied' ? 'In den Handy-Einstellungen für diese App bzw. Seite erlauben – sonst kommen Müll, Putzplan und Zahlungen nicht an.'
              : 'Ohne sie verpasst du Müll, Putzplan und Zahlungen.'}</span>
          </div>
          {mine==='off' && <button className="btn" style={{width:'auto',padding:'9px 14px',fontSize:14,flexShrink:0,background:'var(--sky)'}} onClick={jump}>{TT("Einschalten")}</button>}
        </div>
      )}
      {missing.map(u=>(
        <div key={u.id} className="cell" data-testid="push-nudge-other" style={{gap:10,flexWrap:'wrap'}}>
          <span style={{fontSize:20}}>🔕</span>
          <div className="cell-content">
            <span className="cell-title">{u.name} {TT("bekommt keine Benachrichtigungen")}</span>
            <span className="cell-sub">{TT("Kein Handy von")} {u.name} {TT("hat Push eingeschaltet.")}</span>
          </div>
          {/* Knöpfe in eigener Zeile — nebeneinander quetschten sie den Text auf eine Wortbreite (Foto 19.09.) */}
          <div style={{flexBasis:'100%',display:'flex',gap:8,paddingLeft:30}}>
            <a className="btn" data-testid="push-nudge-wa" href={wa(u)} target="_blank" rel="noopener" style={{flex:1,padding:'9px 12px',fontSize:13.5,background:'#25d366',color:'#062b14',textDecoration:'none',display:'flex',alignItems:'center',justifyContent:'center'}}>{TT("Per WhatsApp sagen")}</a>
            <button className="btn btn-sec" style={{width:'auto',padding:'9px 14px',fontSize:13.5}} onClick={snooze}>{TT("Später")}</button>
          </div>
        </div>
      ))}
    </div>
  );
}

/* ══════════════════════════
   MEHR (seit wg-v70): Status, Umfragen, Ausleihe, Wartung, Verbrauchs-Verlauf, Monatsbericht, Kaution,
   Wochen-Korb, Mitbewohner-Wechsel, Gast-Link.
   Neue Listen-Keys: st, vo, lh, wa, kt, wk, ga — Items nur mit einfachen Feldern (DB-Regel `$f`).
══════════════════════════ */

/* ── Status „unterwegs / zurück um" (Key `st`, id = userId): {text, back, until} — verfällt von selbst ── */
const STATUS_PRESETS = [['🚶','Unterwegs'],['💼','Bei der Arbeit'],['📚','Lerne – bitte leise'],['😴','Schlafe'],['🏋️','Beim Sport']];
// „HH:MM" → nächster Zeitpunkt dieser Uhrzeit (heute, sonst morgen)
const nextTimeTs = hhmm => { const m=/^(\d{1,2}):(\d{2})$/.exec(hhmm||''); if(!m) return null; const d=new Date(); d.setHours(+m[1],+m[2],0,0); if(d.getTime()<=Date.now()) d.setDate(d.getDate()+1); return d.getTime(); };
const endOfDayTs = () => { const d=new Date(); d.setHours(23,59,59,0); return d.getTime(); };
function StatusCard() {
  const { D, setFn, me } = useD();
  const users = D.users || [];
  const [f,setF] = useState(null);   // {text, back}
  const [now,setNow] = useState(Date.now());
  useEffect(()=>{ const t=setInterval(()=>setNow(Date.now()), 60000); return ()=>clearInterval(t); }, []);   // abgelaufene Status verschwinden ohne Neuladen
  if (!me || users.length < 2) return null;
  const live = id => { const s=(D.st||[]).find(x=>x && x.id===id); return s && s.text && (!s.until || s.until>now) ? s : null; };
  const mine = live(me), others = users.filter(u=>u.id!==me).map(u=>({ u, s:live(u.id) })).filter(x=>x.s);
  const save = () => {
    const text = (f.text||'').trim().slice(0,60); if (!text) return;
    // mit „zurück um" hält der Status bis dahin (+1 Std. Kulanz), sonst bis Mitternacht
    const bt = nextTimeTs(f.back);
    setFn('st', cur=>[{ id:me, text, back:f.back||'', until: bt ? bt+3600e3 : endOfDayTs() }, ...(cur||[]).filter(x=>x && x.id!==me)]);
    setF(null);
  };
  const clear = () => setFn('st', cur=>(cur||[]).filter(x=>x && x.id!==me));
  const line = s => `${s.text}${s.back?` · zurück um ${s.back}`:''}`;
  return (
    <div className="rise" data-testid="status-card">
      <div className="group">
        {others.map(({u,s})=>(
          <div key={u.id} className="cell" data-testid="status-other"><span style={{fontSize:18}}>📍</span>
            <div className="cell-content"><span className="cell-title"><b style={{color:u.color}}>{u.name}</b>: {line(s)}</span></div>
          </div>))}
        <div className="cell" style={{gap:8}}>
          <span style={{fontSize:18}}>🙋</span>
          <div className="cell-content">
            <span className="cell-title" data-testid="status-mine">{mine ? `Du: ${line(mine)}` : 'Kein Status'}</span>
            <span className="cell-sub">{mine ? 'verschwindet von selbst' : 'Unterwegs? Zurück um …? Die anderen sehen es hier'}</span>
          </div>
          {mine && <button className="btn btn-sec" style={{width:'auto',padding:'8px 11px',fontSize:13,flexShrink:0}} onClick={clear}>{TT("Zurück ✓")}</button>}
          <button className="btn btn-sec" style={{width:'auto',padding:'8px 11px',fontSize:13,flexShrink:0}} onClick={()=>setF({ text:mine?.text||'', back:mine?.back||'' })}>{mine?'Ändern':'Status'}</button>
        </div>
      </div>
      <MiniSheet open={!!f} onClose={()=>setF(null)} title={TT("Mein Status")} color="var(--sky)">
        {f && <>
          <div style={{display:'flex',flexWrap:'wrap',gap:6}}>{STATUS_PRESETS.map(([em,l])=>{ const t=`${em} ${l}`; return <button key={l} type="button" style={chipSt(f.text===t)} onClick={()=>setF({...f,text:t})}>{t}</button>; })}</div>
          <input className="field" maxLength={60} placeholder={TT("Oder eigener Text")} aria-label={TT("Status-Text")} value={f.text} onChange={e=>setF({...f,text:e.target.value})}/>
          <label className="sheet-sublbl" htmlFor="st-back">{TT("Zurück um (optional)")}</label>
          <input id="st-back" type="time" className="field" value={f.back} onChange={e=>setF({...f,back:e.target.value})}/>
          <button className="btn" style={{background:'var(--sky)'}} onClick={save}>{TT("Zeigen")}</button>
        </>}
      </MiniSheet>
    </div>
  );
}

/* ── Umfragen (Key `vo`): {q, opts ("A|B|C"), by, ts, until, anon, v_<uid>: Index}
   Ergebnis erst nach der eigenen Stimme (keine Beeinflussung); entschieden, wenn alle gestimmt haben oder die Frist um ist. ── */
const pollOpts = p => String(p.opts||'').split('|').filter(Boolean);
const pollDone = (p, users) => users.every(u=>Number.isInteger(p['v_'+u.id])) || (p.until && p.until < todayISO());
function PollCard() {
  const { D, setFn, me, notifyOthers, undo } = useD();
  const users = D.users || [];
  const [f,setF] = useState(null);   // {q, opts:[..], until, anon}
  const cut = shiftISO(todayISO(), -7);
  const polls = (D.vo||[]).filter(p=>p && p.q && (!pollDone(p, users) || (p.until||todayISO()) >= cut)).sort((a,b)=>(b.ts||0)-(a.ts||0));
  const create = () => {
    const q = f.q.trim().slice(0,120), opts = f.opts.map(o=>o.trim().replace(/\|/g,'/').slice(0,40)).filter(Boolean);
    if (!q || opts.length < 2 || !me) return;
    const p = { id:uid(), q, opts:opts.join('|'), by:me, ts:Date.now(), until:f.until, anon:!!f.anon };
    setFn('vo', cur=>[p, ...(cur||[]).filter(x=>x && (x.ts||0) > Date.now()-60*864e5)]);   // alte Umfragen (>60 Tage) aufräumen
    notifyOthers(TT("🗳️ Umfrage: {0}", q), TT("{0} – bis {1}", opts.join(' · '), fmtDM(f.until)), TT("wg-vo"), TT("board"));
    setF(null);
  };
  const vote = (p, i) => {
    const after = { ...p, ['v_'+me]:i };
    setFn('vo', cur=>cur.map(x=>x.id===p.id?{...x,['v_'+me]:i}:x));
    if (!pollDone(p, users) && pollDone(after, users)) { const w = pollWinner(after); notifyOthers(TT("🗳️ Entschieden: {0}", p.q), w, TT("wg-vo"), TT("board")); }
  };
  const pollWinner = p => { const o=pollOpts(p), n=o.map((_,i)=>users.filter(u=>p['v_'+u.id]===i).length), max=Math.max(...n);
    const top=o.filter((_,i)=>n[i]===max); return max===0 ? 'Keine Stimmen' : top.length>1 ? `Gleichstand: ${top.join(' / ')}` : `${top[0]} (${max} von ${users.length})`; };
  const del = p => { setFn('vo', cur=>cur.filter(x=>x.id!==p.id)); undo(TT("Umfrage entfernt"), ()=>setFn('vo', cur=>[p, ...cur])); };
  return (
    <div className="rise" data-testid="poll-card">
      <div className="section-hdr" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span>{TT("🗳️ Abstimmen")}</span>
        {me && <button className="hit" onClick={()=>setF({ q:'', opts:['',''], until:shiftISO(todayISO(),3), anon:false })} style={{...hdrBtn,color:'var(--mint)'}}>{TT("+ Umfrage")}</button>}
      </div>
      {polls.length>0 && <div className="group">
        {polls.map(p=>{ const o=pollOpts(p), mineV=p['v_'+me], done=pollDone(p, users), show=done || Number.isInteger(mineV);
          const waiting = users.filter(u=>!Number.isInteger(p['v_'+u.id])).map(u=>u.name);
          return (
            <div key={p.id} className="cell" data-testid="poll-row" style={{flexDirection:'column',alignItems:'stretch',gap:8,padding:'12px 16px'}}>
              <div style={{display:'flex',gap:8,alignItems:'flex-start'}}>
                <span className="cell-title" style={{flex:1}}>{p.q}</span>
                <button className="del-btn" aria-label={TT("Umfrage „{0}\" entfernen", p.q)} onClick={()=>del(p)}>×</button>
              </div>
              {o.map((opt,i)=>{ const who=users.filter(u=>p['v_'+u.id]===i), pct=users.length?who.length/users.length*100:0; return (
                <button key={i} type="button" disabled={done || !me} aria-pressed={mineV===i} onClick={()=>vote(p,i)}
                  style={{position:'relative',overflow:'hidden',textAlign:'left',border:mineV===i?'2px solid var(--mint)':'1px solid var(--sep)',borderRadius:12,padding:'9px 12px',background:'var(--bg3)',color:'var(--label)',fontFamily:'inherit',fontSize:14,fontWeight:600,cursor:done?'default':'pointer'}}>
                  {show && <span style={{position:'absolute',inset:0,width:`${pct}%`,background:'rgba(94,234,212,.18)'}}/>}
                  <span style={{position:'relative'}}>{opt}{show?` · ${who.length}`:''}{show && !p.anon && who.length?<span style={{color:'var(--label2)',fontWeight:500}}> ({who.map(u=>u.name).join(', ')})</span>:''}</span>
                </button>); })}
              <span className="cell-sub" data-testid="poll-state">{done ? `✅ ${pollWinner(p)}` : `${show?'':'Ergebnis nach deiner Stimme · '}offen bis ${fmtDM(p.until)}${waiting.length?` · fehlt: ${waiting.join(', ')}`:''}${p.anon?' · ohne Namen':''}`}</span>
            </div>); })}
      </div>}
      <MiniSheet open={!!f} onClose={()=>setF(null)} title={TT("Umfrage")} color="var(--mint)">
        {f && <>
          <input className="field" autoFocus maxLength={120} placeholder={TT("Frage, z. B. Welcher Staubsauger?")} aria-label={TT("Frage")} value={f.q} onChange={e=>setF({...f,q:e.target.value})}/>
          {f.opts.map((o,i)=><input key={i} className="field" maxLength={40} placeholder={TT("Möglichkeit {0}", i+1)} aria-label={TT("Möglichkeit {0}", i+1)} value={o} onChange={e=>setF({...f,opts:f.opts.map((x,j)=>j===i?e.target.value:x)})}/>)}
          {f.opts.length<5 && <button type="button" className="btn btn-sec" onClick={()=>setF({...f,opts:[...f.opts,'']})}>{TT("+ Möglichkeit")}</button>}
          <label className="sheet-sublbl" htmlFor="vo-until">{TT("Abstimmen bis")}</label>
          <input id="vo-until" type="date" className="field" min={todayISO()} value={f.until} onChange={e=>setF({...f,until:e.target.value||todayISO()})}/>
          <button type="button" style={chipSt(f.anon)} aria-pressed={f.anon} onClick={()=>setF({...f,anon:!f.anon})}>{f.anon?'✓ ':''}{TT("Ohne Namen anzeigen")}</button>
          <button className="btn" style={{background:'var(--mint)'}} onClick={create}>{TT("Starten")}</button>
        </>}
      </MiniSheet>
    </div>
  );
}

/* ── Ausleihe (Key `lh`): {what, person, dir: 'out' (wir haben verliehen) | 'in' (wir haben geliehen), since, due, by} ── */
function LoanCard() {
  const { D, setFn, me, undo } = useD();
  const [f,setF] = useState(null);
  const items = (D.lh||[]).filter(Boolean).sort((a,b)=>String(a.due||'9').localeCompare(String(b.due||'9')));
  const save = () => {
    if (!f.what.trim() || !f.person.trim()) return;
    setFn('lh', cur=>[{ id:uid(), what:f.what.trim().slice(0,60), person:f.person.trim().slice(0,40), dir:f.dir, since:todayISO(), due:f.due||null, by:me||null }, ...(cur||[])]);
    setF(null);
  };
  const back = it => { setFn('lh', cur=>cur.filter(x=>x.id!==it.id)); undo(TT("↩️ {0} zurück", it.what), ()=>setFn('lh', cur=>[it, ...cur])); };
  return (
    <div data-testid="loan-card">
      <div className="section-hdr" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span>{TT("🤝 Ausgeliehen")}</span>
        <button className="hit" onClick={()=>setF({ what:'', person:'', dir:'out', due:shiftISO(todayISO(),14) })} style={{...hdrBtn,color:'var(--mint)'}}>{TT("+ Eintrag")}</button>
      </div>
      <div className="group">
        {!items.length && <div className="cell"><div className="cell-content"><span className="cell-sub">{TT("Bohrmaschine an den Nachbarn, Beamer von Freunden – mit Rückgabe-Erinnerung.")}</span></div></div>}
        {items.map(it=>{ const d = it.due ? -daysSince(it.due) : null; return (
          <div key={it.id} className="cell" data-testid="loan-row">
            <div className="cell-content">
              <span className="cell-title">{it.dir==='out' ? `${it.what} → ${it.person}` : `${it.what} ← von ${it.person}`}</span>
              <span className="cell-sub" style={d!==null && d<=0 ? {color:d<0?'var(--red)':'var(--amber)',fontWeight:700} : undefined}>
                {it.dir==='out'?'verliehen':'geliehen'} {TT("seit")} {fmtDM(it.since)}{d===null ? '' : d<0 ? ` · ${-d} ${-d===1?'Tag':'Tage'} über der Zeit` : d===0 ? ' · heute zurück' : ` · zurück bis ${fmtDM(it.due)}`}
              </span>
            </div>
            <button className="btn btn-sec" aria-label={TT("{0} ist zurück", it.what)} style={{width:'auto',padding:'8px 11px',fontSize:13,flexShrink:0}} onClick={()=>back(it)}>{TT("Zurück ✓")}</button>
          </div>); })}
      </div>
      <MiniSheet open={!!f} onClose={()=>setF(null)} title={TT("Ausleihe")} color="var(--mint)">
        {f && <>
          <div style={{display:'flex',gap:6}}>
            <button type="button" style={{...chipSt(f.dir==='out'),flex:1}} onClick={()=>setF({...f,dir:'out'})}>{TT("Wir verleihen")}</button>
            <button type="button" style={{...chipSt(f.dir==='in'),flex:1}} onClick={()=>setF({...f,dir:'in'})}>{TT("Wir leihen")}</button>
          </div>
          <input className="field" autoFocus maxLength={60} placeholder={TT("Was? z. B. Bohrmaschine")} aria-label={TT("Gegenstand der Ausleihe")} value={f.what} onChange={e=>setF({...f,what:e.target.value})}/>
          <input className="field" maxLength={40} placeholder={f.dir==='out'?'An wen?':'Von wem?'} aria-label={TT("Person")} value={f.person} onChange={e=>setF({...f,person:e.target.value})}/>
          <label className="sheet-sublbl" htmlFor="lh-due">{TT("Zurück bis (optional)")}</label>

/* ── Wartung (Key `wa`): {name, em, every (Monate), last} — lange Abstände, die der Putzplan nicht abbildet.
   Fällig = last + every Monate; nie gemacht = jetzt. api/_wg.js (maintDue) rechnet genauso. ── */
const MAINT_PRESETS = [['Rauchmelder testen','🚨',12],['Wasserkocher entkalken','🫖',2],['Kaffeemaschine entkalken','☕',3],['Dunstabzug-Filter','🌬️',3],
  ['Waschmaschine: Flusensieb','🧺',3],['Duschkopf entkalken','🚿',3],['Heizung entlüften','🔥',12],['Kühlschrank abtauen','🧊',6],['Spülmaschine: Filter','🍽️',1],['Abflüsse reinigen','🪠',3]];
const addMonthsISO = (iso, n) => { const [y,m,d]=String(iso).split('-').map(Number); const x=new Date(y,m-1+n,1); const last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate(); x.setDate(Math.min(d,last)); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; };
const maintDue = t => t.last ? addMonthsISO(t.last, t.every||12) : todayISO();
const maintDueIn = t => -daysSince(maintDue(t));
function MaintCard() {
  const { D, setFn, me, undo } = useD();
  const [f,setF] = useState(null);
  const items = (D.wa||[]).filter(Boolean).sort((a,b)=>maintDue(a).localeCompare(maintDue(b)));
  const has = n => items.some(t=>t.name===n);
  const add = (name, em, every) => { if (!name.trim() || has(name.trim())) return; setFn('wa', cur=>[...(cur||[]), { id:uid(), name:name.trim().slice(0,50), em:em||'🔧', every:Math.max(1,Math.min(60,+every||12)), last:null }]); };
  const del = t => { setFn('wa', cur=>cur.filter(x=>x.id!==t.id)); undo(TT("„{0}\" entfernt", t.name), ()=>setFn('wa', cur=>[...cur, t])); };
  return (
    <div data-testid="maint-card">
      <div className="section-hdr" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span>{TT("🔧 Wartung · alle paar Monate")}</span>
        <button className="hit" onClick={()=>setF({ name:'', every:'6' })} style={{...hdrBtn,color:'var(--amber)'}}>{TT("+ Eigene")}</button>
      </div>
      <div className="group">
        {items.map(t=>{ const d = maintDueIn(t); return (
          <div key={t.id} className="cell" data-testid="maint-row">
            <span style={{fontSize:18}}>{t.em}</span>
            <div className="cell-content">
              <span className="cell-title">{t.name}</span>
              <span className="cell-sub" style={d<=0?{color:'var(--amber)',fontWeight:700}:undefined}>{!t.last ? 'noch nie – jetzt fällig' : d<0 ? `seit ${-d} Tagen fällig` : d===0 ? 'heute fällig' : `nächstes Mal ${fmtDate(maintDue(t))}`} {TT("· alle")} {t.every} {TT("Mon.")}</span>
            </div>
            <button className="del-btn" aria-label={TT("{0} entfernen", t.name)} onClick={()=>del(t)}>×</button>
          </div>); })}
        <div className="cell" style={{flexWrap:'wrap',gap:6,padding:'10px 16px'}}>
          {MAINT_PRESETS.filter(p=>!has(p[0])).map(([n,em,m])=><button key={n} type="button" data-testid="maint-preset" style={chipSt(false)} onClick={()=>add(n,em,m)}>{em} {n}</button>)}
        </div>
      </div>
      <MiniSheet open={!!f} onClose={()=>setF(null)} title={TT("Wartung")} color="var(--amber)">
        {f && <>
          <input className="field" autoFocus maxLength={50} placeholder={TT("z. B. Fenster abdichten")} aria-label={TT("Wartungsaufgabe")} value={f.name} onChange={e=>setF({...f,name:e.target.value})}/>
          <label className="sheet-sublbl" htmlFor="wa-every">{TT("Alle … Monate")}</label>
          <input id="wa-every" type="number" min="1" max="60" className="field" value={f.every} onChange={e=>setF({...f,every:e.target.value})}/>
          <button className="btn" style={{background:'var(--amber)'}} onClick={()=>{ add(f.name,'🔧',f.every); setF(null); }}>{TT("Speichern")}</button>
        </>}
      </MiniSheet>
    </div>
  );
}

/* ── Heute: was an Wartung fällig und an Ausleihe überfällig ist — mit Erledigt-Knopf, sonst unsichtbar ── */
function HomeDueCard() {
  const { D, setFn, me, undo } = useD();
  const maint = (D.wa||[]).filter(t=>t && maintDueIn(t)<=0);
  const loans = (D.lh||[]).filter(l=>l && l.due && -daysSince(l.due)<=0);
  if (!maint.length && !loans.length) return null;
  const done = t => { const prev=t.last; setFn('wa', cur=>cur.map(x=>x.id===t.id?{...x,last:todayISO(),by:me||null}:x)); undo(TT("🔧 {0} erledigt", t.name), ()=>setFn('wa', cur=>cur.map(x=>x.id===t.id?{...x,last:prev}:x))); };
  const back = l => { setFn('lh', cur=>cur.filter(x=>x.id!==l.id)); undo(TT("↩️ {0} zurück", l.what), ()=>setFn('lh', cur=>[l, ...cur])); };
  return (
    <div className="group rise" data-testid="home-due">
      {maint.map(t=>(
        <div key={t.id} className="cell" data-testid="home-due-maint"><span style={{fontSize:18}}>{t.em}</span>
          <div className="cell-content"><span className="cell-title">{t.name}</span><span className="cell-sub">{TT("Wartung fällig · alle")} {t.every} {TT("Mon.")}</span></div>
          <button className="btn btn-sec" aria-label={TT("{0} erledigt", t.name)} style={{width:'auto',padding:'8px 11px',fontSize:13,flexShrink:0}} onClick={()=>done(t)}>{TT("Erledigt ✓")}</button>
        </div>))}

          <button className="btn btn-sec" aria-label={TT("{0} ist zurück", l.what)} style={{width:'auto',padding:'8px 11px',fontSize:13,flexShrink:0}} onClick={()=>back(l)}>{TT("Zurück ✓")}</button>

    </div>

/* ── Verbrauchs-Verlauf aus den Zählerständen: Monatsverbrauch per linearer Interpolation zwischen Ablesungen.
   Ein Monat zählt nur, wenn Ablesungen ihn ganz einschließen (sonst wäre er geraten). ── */
const monthStart = ym => isoMid(ym+'-01');
const monthlyUse = reads => {
  const r = [...reads].filter(z=>z && z.date && Number.isFinite(+z.value)).sort((a,b)=>a.date.localeCompare(b.date));
  if (r.length < 2) return [];
  const t = z => isoMid(z.date).getTime();
  const at = ts => { for (let i=1;i<r.length;i++) if (ts <= t(r[i])) { const a=r[i-1], b=r[i], span=t(b)-t(a); return span>0 ? a.value + (b.value-a.value)*(ts-t(a))/span : b.value; } return null; };
  const out = []; const d = new Date(isoMid(r[0].date)); if (d.getDate() !== 1) { d.setDate(1); d.setMonth(d.getMonth()+1); }   // erster voller Monat (Ablesung am 1. zählt)
  while (true) {
    const s = new Date(d), e = new Date(d); e.setMonth(e.getMonth()+1);
    if (e.getTime() > t(r[r.length-1])) break;
    const use = at(e.getTime()) - at(s.getTime());
    out.push({ ym:`${s.getFullYear()}-${String(s.getMonth()+1).padStart(2,'0')}`, use:Math.max(0, use) });
    d.setMonth(d.getMonth()+1);
  }
  return out;
};
function ConsumptionCard() {
  const { D } = useD();
  const reads = (D.zs||[]).filter(z=>z && !z.cfg);
  const series = Object.keys(METER_KINDS).map(k=>({ k, m:monthlyUse(reads.filter(z=>z.kind===k)) })).filter(x=>x.m.length);
  if (!series.length) return null;
  return (
    <div className="rise" data-testid="use-card">
      <div className="section-hdr">{TT("📉 Verbrauch je Monat")}</div>
      <div className="group" style={{padding:'12px 14px',display:'flex',flexDirection:'column',gap:16}}>
        {series.map(({k,m})=>{
          const [em,label,unit] = METER_KINDS[k], last12 = m.slice(-12), max = Math.max(...last12.map(x=>x.use), 0.0001), cur = m[m.length-1];
          const prevYear = m.find(x=>x.ym === `${+cur.ym.slice(0,4)-1}${cur.ym.slice(4)}`);
          const before = m.slice(0,-1).slice(-6), avg = before.length>=3 ? before.reduce((s,x)=>s+x.use,0)/before.length : null;
          return (
            <div key={k} data-testid="use-series">
              <div style={{fontSize:14,fontWeight:700,marginBottom:6}}>{em} {label} · {ymLabel(cur.ym)}: {fmtN(cur.use,1)} {unit}</div>
              <div style={{display:'flex',alignItems:'flex-end',gap:4,height:64}} aria-hidden="true">
                {last12.map(x=><div key={x.ym} title={`${ymLabel(x.ym)}: ${fmtN(x.use,1)} ${unit}`} style={{flex:1,height:`${Math.max(4, x.use/max*100)}%`,borderRadius:4,background:x===cur?'var(--sky)':'var(--bg3)'}}/>)}
              </div>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'var(--label3)',marginTop:3}}><span>{ymLabel(last12[0].ym)}</span><span>{ymLabel(cur.ym)}</span></div>
              <div className="cell-sub" data-testid="use-note" style={{marginTop:4}}>
                {prevYear && prevYear.use>0 ? `${cur.use>=prevYear.use?'+':'−'}${fmtN(Math.abs(cur.use/prevYear.use-1)*100,0)} % gegenüber ${ymLabel(prevYear.ym)}` : 'Vorjahresvergleich ab einem Jahr Ablesungen'}
                {avg && cur.use > avg*1.3 && <b style={{color:'var(--amber)'}}> {TT("· ⚠️ deutlich über dem Schnitt (")}{fmtN(avg,1)} {unit})</b>}
              </div>
            </div>
          );
        })}
        <span style={{fontSize:12,color:'var(--label2)'}}>{TT("Monate zwischen zwei Ablesungen werden gleichmäßig aufgeteilt – je öfter abgelesen, desto genauer.")}</span>
      </div>
    </div>
  );
}

/* ── Kaution (Key `kt`, ein Eintrag id 'k'): {total, c_<uid>, refund, back}
   Rückzahlung auf das Konto von X → je andere Person ein Posten „X schuldet ihr ihren Anteil" (anteilig nach Einzahlung). ── */
function DepositCard() {
  const { D, setFn, me, notifyOthers, undo } = useD();
  const users = D.users || [];
  const k = (D.kt||[]).find(x=>x && x.id==='k');
  const [f,setF] = useState(null);   // Bearbeiten: {total, c:{uid:betrag}}
  const [r,setR] = useState(null);   // Rückzahlung: {amount, to}
  const paid = u => Number(k?.['c_'+u.id])||0;
  const sum = k ? users.reduce((s,u)=>s+paid(u),0) : 0;
  const edit = () => { const t = k?.total || ''; setF({ total:t?String(t).replace('.',','):'', c:Object.fromEntries(users.map(u=>[u.id, k ? String(paid(u)).replace('.',',') : ''])) }); };
  const save = () => {
    const total = parseNum(f.total); if (!(total>0)) return;
    const c = Object.fromEntries(users.map(u=>['c_'+u.id, parseNum(f.c[u.id]) || (k ? 0 : Math.round(total/users.length*100)/100)]));
    setFn('kt', cur=>[{ ...(k||{}), id:'k', total, ...c }, ...(cur||[]).filter(x=>x && x.id!=='k')]); setF(null);
  };
  const refund = () => {
    const R = parseNum(r.amount); if (!(R>=0) || !sum) return;
    const items = users.filter(u=>u.id!==r.to && paid(u)>0).map(u=>hsItem({ name:`🔑 Kaution zurück: Anteil ${u.name}`, price:Math.round(R*paid(u)/sum*100)/100, paidBy:u.id, owedBy:r.to, cat:'fix' })).filter(i=>i.price>0);
    if (items.length) setFn('hs', cur=>[...items, ...(cur||[])]);
    setFn('kt', cur=>cur.map(x=>x.id==='k'?{...x,refund:R,back:todayISO(),to:r.to}:x));
    notifyOthers(TT("🔑 Kaution zurück"), TT("€{0} auf dem Konto von {1} – Anteile stehen in der Abrechnung", fmt(R), nameOfU(users, r.to)), TT("wg-kt"), TT("exp"));
    undo(TT("🔑 Kaution verbucht"), ()=>{ const ids=items.map(i=>i.id); setFn('hs', cur=>cur.filter(i=>!ids.includes(i.id))); setFn('kt', cur=>cur.map(x=>x.id==='k'?{...x,refund:null,back:null,to:null}:x)); });
    setR(null);
  };
  return (
    <div data-testid="deposit-card">
      <div className="section-hdr" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span>{TT("🔑 Kaution")}</span>
        <button className="hit" onClick={edit} style={{...hdrBtn,color:'var(--mint)'}}>{k?'Ändern':'+ Eintragen'}</button>
      </div>
      <div className="group">
        {!k ? <div className="cell"><div className="cell-content"><span className="cell-sub">{TT("Wer hat wie viel Kaution gezahlt? Beim Auszug wird die Rückzahlung anteilig verrechnet.")}</span></div></div> : <>
          <div className="cell" data-testid="deposit-row"><div className="cell-content">
            <span className="cell-title">€{fmt(k.total)}{Math.abs(sum-k.total)>0.01?<b style={{color:'var(--amber)'}}> {TT("· eingetragen €")}{fmt(sum)}</b>:''}</span>
            <span className="cell-sub">{users.map(u=>`${u.name} €${fmt(paid(u))}`).join(' · ')}{k.back?` · zurück: €${fmt(k.refund)} am ${fmtDate(k.back)}`:''}</span>
          </div></div>
          {!k.back && <button className="cell hit" data-testid="deposit-refund" onClick={()=>setR({ amount:String(k.total).replace('.',','), to:me||users[0]?.id })} style={{width:'100%',background:'none',fontFamily:'inherit',color:'var(--mint)',fontWeight:700,fontSize:14,cursor:'pointer'}}>{TT("Kaution zurückbekommen …")}</button>}
        </>}
      </div>
      <MiniSheet open={!!f} onClose={()=>setF(null)} title={TT("Kaution")} color="var(--mint)">
        {f && <>
          <div className="f-euro"><input className="field" autoFocus inputMode="decimal" placeholder={TT("Gesamt, z. B. 1200")} aria-label={TT("Kaution gesamt")} value={f.total} onChange={e=>setF({...f,total:e.target.value})}/></div>
          <div className="sheet-sublbl">{TT("Davon eingezahlt (leer = gleich verteilt)")}</div>
          {users.map(u=><div key={u.id} className="f-euro"><input className="field" inputMode="decimal" placeholder={u.name} aria-label={TT("Kaution {0}", u.name)} value={f.c[u.id]} onChange={e=>setF({...f,c:{...f.c,[u.id]:e.target.value}})}/></div>)}
          <button className="btn" style={{background:'var(--mint)'}} onClick={save}>{TT("Speichern")}</button>
        </>}
      </MiniSheet>
      <MiniSheet open={!!r} onClose={()=>setR(null)} title={TT("Kaution zurück")} color="var(--mint)">
        {r && <>
          <div className="sheet-sublbl">{TT("Wie viel kam zurück? (nach Abzügen)")}</div>
          <div className="f-euro"><input className="field" inputMode="decimal" aria-label={TT("Rückzahlung")} value={r.amount} onChange={e=>setR({...r,amount:e.target.value})}/></div>
          <div className="sheet-sublbl">{TT("Auf wessen Konto?")}</div>
          <div className="pick">{users.map(u=><button key={u.id} type="button" className={`pick-btn${r.to===u.id?' on':''}`} style={{background:u.color}} onClick={()=>setR({...r,to:u.id})}>{u.name}</button>)}</div>
          <div style={{fontSize:12.5,color:'var(--label2)'}}>{TT("Aufgeteilt nach dem, was jede Person eingezahlt hat.")}</div>
          <button className="btn" style={{background:'var(--mint)'}} onClick={refund}>{TT("Verrechnen")}</button>
        </>}
      </MiniSheet>
    </div>
  );
}

/* ── Wochen-Korb (Key `wk`): übliche Einkäufe, ein Tipp setzt alles Fehlende auf die Liste ── */
function BasketCard() {
  const { D, setFn, me, notifyOthers, undo } = useD();
  const [txt,setTxt] = useState('');
  const [edit,setEdit] = useState(false);
  const basket = (D.wk||[]).filter(x=>x && x.name);
  const onList = n => (D.sl||[]).some(i=>i && !i.done && i.name.toLowerCase()===n.toLowerCase());
  const miss = basket.filter(b=>!onList(b.name));
  const addToBasket = n => { n=n.trim().slice(0,60); if (!n || basket.some(b=>b.name.toLowerCase()===n.toLowerCase())) return; setFn('wk', cur=>[...(cur||[]), { id:uid(), name:n }]); };
  const fromHistory = () => [...(D.slh||[])].filter(x=>x && (x.n||0)>=3).sort((a,b)=>(b.n||0)-(a.n||0)).map(x=>x.name).filter(n=>n && !basket.some(b=>b.name.toLowerCase()===n.toLowerCase())).slice(0,8).forEach(addToBasket);
  const fill = () => {
    if (!miss.length) return;
    const add = miss.map(b=>({ id:uid(), name:b.name, addedBy:me||null, date:todayISO(), done:false }));
    setFn('sl', cur=>[...add, ...(cur||[])]);
    notifyOthers(TT("🧺 Wochen-Korb auf der Liste"), add.map(a=>a.name).join(', '), TT("wg-shop"), TT("shop"));
    undo(TT("🧺 {0} auf die Liste", add.length), ()=>{ const ids=add.map(a=>a.id); setFn('sl', cur=>cur.filter(i=>!ids.includes(i.id))); });
  };
  return (
    <div className="rise" data-testid="basket-card">
      <div className="section-hdr" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span>{TT("🧺 Wochen-Korb")}</span>
        <button className="hit" onClick={()=>setEdit(e=>!e)} style={{...hdrBtn,color:'var(--mint)'}}>{edit?'Fertig':'Bearbeiten'}</button>
      </div>
      <div className="group" style={{padding:'12px 14px',display:'flex',flexDirection:'column',gap:10}}>
        {basket.length>0 && <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
          {basket.map(b=><span key={b.id} style={{...chipSt(onList(b.name)),display:'inline-flex',alignItems:'center',gap:6}}>{b.name}{edit && <button type="button" aria-label={TT("{0} aus dem Korb", b.name)} onClick={()=>setFn('wk', cur=>cur.filter(x=>x.id!==b.id))} style={{background:'none',border:'none',color:'inherit',fontSize:15,padding:0,cursor:'pointer'}}>×</button>}</span>)}
        </div>}
        {!basket.length && !edit && <span style={{fontSize:13,color:'var(--label2)'}}>{TT("Was ihr jede Woche kauft, einmal eintragen – danach reicht ein Tipp.")}</span>}
        {(edit || !basket.length) && <form onSubmit={e=>{ e.preventDefault(); addToBasket(txt); setTxt(''); }} style={{display:'flex',gap:8}}>
          <input className="field" maxLength={60} placeholder={TT("z. B. Milch")} aria-label={TT("In den Wochen-Korb")} value={txt} onChange={e=>setTxt(e.target.value)} style={{flex:1}}/>
          <button type="submit" className="btn" style={{width:54,flexShrink:0,background:'var(--mint)'}}>+</button>
        </form>}
        {(edit || !basket.length) && (D.slh||[]).some(x=>x && (x.n||0)>=3) && <button type="button" className="btn btn-sec" onClick={fromHistory}>{TT("Aus häufigen Käufen füllen")}</button>}
        {basket.length>0 && !edit && <button className="btn" data-testid="basket-fill" disabled={!miss.length} style={{background:miss.length?'var(--mint)':'var(--bg3)'}} onClick={fill}>{miss.length ? `🧺 ${miss.length} auf die Liste` : 'Alles schon auf der Liste ✓'}</button>}
      </div>
    </div>
  );
}

/* ── Mitbewohner-Wechsel: neue Person übernimmt den Platz einer ausziehenden.
   Voraussetzung: deren Bilanz ist ausgeglichen und sie verwaltet kein offenes Sparziel.
   Übernimmt: offene Putz-Aufgaben, Kautions-Anteil. Neu: `joined` = heute bei allen → Putz-Fairness startet neu (choreTally). ── */
const NEW_COLORS = ['#a78bfa','#f472b6','#34d399','#fb923c','#60a5fa','#facc15'];
function SwapCard() {
  const { D, set, setFn, me, setMe, notifyOthers, askConfirm } = useD();
  const users = D.users || [];
  const [f,setF] = useState(null);   // {old, name}
  if (users.length < 2) return null;
  const gc = growCalc(D);
  const netOf = id => hsNetOf(D, id) + (gc.tCost ? gc.net(id) : 0);
  const blockers = id => [
    Math.abs(netOf(id)) > 0.01 && `Offene Beträge (€${fmt(Math.abs(netOf(id)))}) – erst im Haushalt „Alles abrechnen"`,
    (D.sg||[]).some(g=>g && !g.bought && (g.holder===id || (Number(g['c_'+id])||0)>0)) && 'Offenes Sparziel – erst kaufen oder auflösen',
  ].filter(Boolean);
  const go = async () => {
    const name = f.name.trim().slice(0,40), old = users.find(u=>u.id===f.old);
    if (!name || !old || blockers(old.id).length) return;
    if (!(await askConfirm({ title:TT("{0} zieht aus", old.name), body:TT("{0} übernimmt den Platz: offene Putz-Aufgaben und der Kautions-Anteil gehen über, der Putz-Ausgleich startet für alle neu. Rückgängig geht das nicht.", name), okLabel:TT("Wechseln") }))) return;
    const color = NEW_COLORS.find(c=>!users.some(u=>u.color===c)) || NEW_COLORS[0];
    const nu = { id:uid(), name, color, joined:todayISO() };
    set('users', users.map(u=>u.id===old.id ? nu : { ...u, joined:todayISO() }));
    setFn('pt', cur=>(cur||[]).map(t=>t && t.assignee===old.id ? { ...t, assignee:nu.id } : t));
    setFn('aw', cur=>(cur||[]).filter(a=>a && a.userId!==old.id));
    setFn('st', cur=>(cur||[]).filter(s=>s && s.id!==old.id));
    setFn('kt', cur=>(cur||[]).map(k=>k && k.id==='k' ? { ...k, ['c_'+nu.id]:Number(k['c_'+old.id])||0, ['c_'+old.id]:0 } : k));
    if (me===old.id) setMe(null);   // das Gerät der ausziehenden Person fragt danach „Wer bist du?"
    notifyOthers(TT("👋 {0} zieht ein", name), TT("übernimmt den Platz von {0}", old.name), TT("wg-users"), TT("board"));
    setF(null);
  };
  const cur = f && users.find(u=>u.id===f.old), bl = cur ? blockers(cur.id) : [];
  const kt = (D.kt||[]).find(x=>x && x.id==='k');
  return (
    <div data-testid="swap-card">
      <button className="cell hit" onClick={()=>setF({ old:users.find(u=>u.id!==me)?.id || users[0].id, name:'' })} style={{width:'100%',background:'var(--bg2)',borderRadius:14,fontFamily:'inherit',color:'var(--label)',textAlign:'left',cursor:'pointer',marginTop:10}}>
        <span style={{fontSize:18}}>🔄</span>
        <div className="cell-content"><span className="cell-title">{TT("Mitbewohner-Wechsel")}</span><span className="cell-sub">{TT("Jemand zieht aus, jemand Neues ein")}</span></div>
      </button>
      <MiniSheet open={!!f} onClose={()=>setF(null)} title={TT("Mitbewohner-Wechsel")} color="var(--sky)">
        {f && <>
          <div className="sheet-sublbl">{TT("Wer zieht aus?")}</div>
          <div className="pick">{users.map(u=><button key={u.id} type="button" className={`pick-btn${f.old===u.id?' on':''}`} style={{background:u.color}} onClick={()=>setF({...f,old:u.id})}>{u.name}</button>)}</div>
          {bl.length>0 && <div data-testid="swap-block" style={{fontSize:13,color:'var(--red)',fontWeight:700,display:'flex',flexDirection:'column',gap:4}}>{bl.map(b=><span key={b}>⛔ {b}</span>)}</div>}
          <input className="field" maxLength={40} placeholder={TT("Name der neuen Person")} aria-label={TT("Neue Person")} value={f.name} onChange={e=>setF({...f,name:e.target.value})}/>
          {kt && cur && Number(kt['c_'+cur.id])>0 && <div style={{fontSize:12.5,color:'var(--label2)'}}>{TT("Kaution:")} {cur.name}{TT("s Anteil €")}{fmt(kt['c_'+cur.id])} {TT("geht auf die neue Person über – das Geld klärt ihr direkt untereinander.")}</div>}
          <button className="btn" disabled={!!bl.length || !f.name.trim()} style={{background:bl.length||!f.name.trim()?'var(--bg3)':'var(--sky)'}} onClick={go}>{TT("Wechsel durchführen")}</button>
        </>}
      </MiniSheet>
    </div>
  );
}

/* ── Gast-Link (Key `ga`, ein Eintrag id 'info': {wifi, pw, note, v}) → Vercel /api/guest rendert eine Nur-Lese-Seite
   mit WLAN, gültigen WG-Regeln und Müllplan. Schlüssel aus Code + v abgeleitet; v++ macht alte Links ungültig. ── */
function GuestCard() {
  const { D, setFn, wgCode } = useD();
  const info = (D.ga||[]).find(x=>x && x.id==='info') || { id:'info', wifi:'', pw:'', note:'', v:1 };
  const [f,setF] = useState(null);
  const [tok,setTok] = useState(null);
  const [msg,setMsg] = useState('');
  const url = tok ? `${PUSH_API}/api/guest?t=${tok}` : '';
  const save = () => { setFn('ga', cur=>[{ ...info, wifi:f.wifi.trim().slice(0,60), pw:f.pw.slice(0,80), note:f.note.trim().slice(0,300) }, ...(cur||[]).filter(x=>x && x.id!=='info')]); setF(null); };
  const make = async () => {
    setMsg('');
    try {
      const r = await fetch(PUSH_API + '/api/guest', { method:'POST', headers:{ 'content-type':'application/json' }, body:JSON.stringify({ code:wgCode, v:info.v||1 }) });
      const j = await r.json().catch(()=>({}));
      if (!r.ok || !j.token) throw new Error(j.error || `Fehler ${r.status}`);
      setTok(j.token);
    } catch (e) { setMsg(TT("Link ging nicht ({0}).", e.message)); }
  };
  const renew = () => { setFn('ga', cur=>[{ ...info, v:(info.v||1)+1 }, ...(cur||[]).filter(x=>x && x.id!=='info')]); setTok(null); setMsg(TT("Alter Link ist ungültig – neuen erzeugen.")); };
  const copy = async () => setMsg(await copyTxt(url) ? 'Kopiert ✓ – per Messenger an den Besuch schicken.' : 'Kopieren ging nicht – bitte markieren.');
  return (
    <div data-testid="guest-card">
      <div className="section-hdr" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span>{TT("🛎️ Gast-Link")}</span>
        <button className="hit" onClick={()=>setF({ wifi:info.wifi||'', pw:info.pw||'', note:info.note||'' })} style={{...hdrBtn,color:'var(--sky)'}}>{TT("Angaben")}</button>
      </div>
      <div className="group" style={{padding:'12px 14px',display:'flex',flexDirection:'column',gap:8,fontSize:13,color:'var(--label2)'}}>
        <span>{TT("Besuch bekommt eine Seite zum Lesen: WLAN")}{info.wifi?` („${info.wifi}")`:''}{TT(", eure gültigen WG-Regeln und die nächsten Müll-Termine – ohne WG-Code, ohne Zugriff auf Geld.")}</span>
        {!tok ? <button className="btn btn-sec" onClick={make}>{TT("Link erzeugen")}</button> : <>
          <code data-testid="guest-url" style={{fontSize:11.5,wordBreak:'break-all',userSelect:'all'}}>{url}</code>
          <div style={{display:'flex',gap:8}}>
            <button className="btn btn-sec" onClick={copy}>{TT("Kopieren")}</button>
            <a className="btn btn-sec" href={url} target="_blank" rel="noopener" style={{display:'flex',alignItems:'center',justifyContent:'center',textDecoration:'none'}}>{TT("Ansehen")}</a>
          </div>
        </>}
        <button className="btn btn-sec" onClick={renew}>{TT("Alle Gast-Links ungültig machen")}</button>
        {msg && <span data-testid="guest-msg">{msg}</span>}
      </div>
      <MiniSheet open={!!f} onClose={()=>setF(null)} title={TT("Für Gäste")} color="var(--sky)">
        {f && <>
          <input className="field" maxLength={60} placeholder={TT("WLAN-Name")} aria-label={TT("WLAN-Name")} value={f.wifi} onChange={e=>setF({...f,wifi:e.target.value})}/>
          <input className="field" maxLength={80} placeholder={TT("WLAN-Passwort")} aria-label={TT("WLAN-Passwort")} autoCapitalize="off" autoCorrect="off" spellCheck={false} value={f.pw} onChange={e=>setF({...f,pw:e.target.value})}/>
          <textarea className="field" maxLength={300} rows={3} placeholder={TT("Hinweis, z. B. Handtücher im Schrank links")} aria-label={TT("Hinweis für Gäste")} value={f.note} onChange={e=>setF({...f,note:e.target.value})}/>
          <div style={{fontSize:12.5,color:'var(--label2)'}}>{TT("Keine Schlüssel-Verstecke eintragen – wer den Link hat, sieht alles hier.")}</div>
          <button className="btn" style={{background:'var(--sky)'}} onClick={save}>{TT("Speichern")}</button>
        </>}
      </MiniSheet>
    </div>
  );
}

/* ══════════════════════════
   PLUS (seit wg-v68): Sparziel, Nebenkosten, Essensplan, Kühlschrank, Inventar, Auszug, WG-Regeln, Check-in, Sprach-Kurzbefehl
   Neue Listen-Keys: sg, ep, kf, inv, rg, ci — Items nur mit einfachen Feldern (DB-Regel). Beträge je Person als Feld `c_<userId>`.
══════════════════════════ */
const otherOf = (users, me) => (users||[]).find(u=>u.id!==me);
const hsItem = (o) => ({ id:uid(), date:todayISO(), settled:false, ...o });   // neuer Haushalt-Posten mit Standardfeldern

/* ── Sparziel (Key `sg`): {name, target, holder, c_<uid>, bought} — Einzahlungen gehen an den „Verwalter".
   Beim Kauf: Ausgabe (Verwalter zahlt, 50/50) + je Einzahlung des anderen ein Posten „an Verwalter gezahlt".
   So rechnet die bestehende Bilanz alles richtig, ohne neues Rechenmodell. ── */
function SavingsCard() {
  const { D, setFn, me, notifyOthers, undo } = useD();
  const [add,setAdd] = useState(null);   // {name,target}
  const [pay,setPay] = useState(null);   // {goal, amount}
  const [buy,setBuy] = useState(null);   // {goal, price}
  const users = D.users || [];
  const goals = (D.sg||[]).filter(g=>g && !g.bought);
  if (!me) return null;
  const sum = g => users.reduce((s,u)=>s+(Number(g['c_'+u.id])||0), 0);
  const create = () => {
    const t = parseNum(add.target); if (!add.name.trim() || !(t>0)) return;
    const g = { id:uid(), name:add.name.trim().slice(0,60), target:t, holder:me, ts:Date.now() };
    setFn('sg', cur=>[g, ...(cur||[])]);
    notifyOthers(TT("🐷 Neues Sparziel: {0}", g.name), TT("€{0} · {1} verwaltet das Geld", fmt(t), nameOfU(users, me)), TT("wg-sg"), TT("exp"));
    setAdd(null);
  };
  const deposit = () => {
    const a = parseNum(pay.amount); if (!(a>0)) return;
    const g = pay.goal, k = 'c_'+me;
    setFn('sg', cur=>cur.map(x=>x.id===g.id?{...x,[k]:(Number(x[k])||0)+a}:x));
    undo(TT("🐷 €{0} eingezahlt", fmt(a)), ()=>setFn('sg', cur=>cur.map(x=>x.id===g.id?{...x,[k]:Math.max(0,(Number(x[k])||0)-a)}:x)));
    if (g.holder!==me) notifyOthers(TT("🐷 {0} zahlt €{1} ein", nameOfU(users, me), fmt(a)), TT("{0} · bitte Geld annehmen", g.name), TT("wg-sg"), TT("exp"));
    setPay(null);
  };
  const cur_ = g => (D.sg||[]).find(x=>x && x.id===g.id) || g;   // aktueller Stand — anderes Gerät kann inzwischen eingezahlt haben
  const bought = () => {
    const p = parseNum(buy.price); if (!(p>0)) return;
    const g = cur_(buy.goal), h = g.holder;
    const items = [hsItem({ name:`🐷 ${g.name}`, price:p, paidBy:h, owedBy:null, cat:'home', sg:g.id })];
    // Einzahlungen der anderen hat der Verwalter schon bekommen → als „gezahlt an Verwalter" verbuchen
    users.filter(u=>u.id!==h).forEach(u=>{ const c = Number(g['c_'+u.id])||0; if (c>0) items.push(hsItem({ name:`🐷 ${g.name}: Einzahlung ${u.name}`, price:c, paidBy:u.id, owedBy:h, sg:g.id })); });
    setFn('hs', cur=>[...items, ...(cur||[])]);
    setFn('sg', cur=>cur.map(x=>x.id===g.id?{...x,bought:todayISO(),price:p}:x));
    notifyOthers(TT("🛍️ {0} gekauft", g.name), TT("€{0} · in der Abrechnung", fmt(p)), TT("wg-sg"), TT("exp"));
    undo(TT("🛍️ {0} als Ausgabe eingetragen", g.name), ()=>{ const ids=items.map(i=>i.id); setFn('hs', cur=>cur.filter(i=>!ids.includes(i.id))); setFn('sg', cur=>cur.map(x=>x.id===g.id?{...x,bought:null,price:null}:x)); });
    setBuy(null);
  };
  // Ziel auflösen: Verwalter gibt die Einzahlungen der anderen zurück → als Posten „Verwalter schuldet" verbuchen
  const dissolve = () => {
    const g = cur_(buy.goal), h = g.holder;
    const items = users.filter(u=>u.id!==h).map(u=>({ u, c:Number(g['c_'+u.id])||0 })).filter(x=>x.c>0)
      .map(({u,c})=>hsItem({ name:`🐷 ${g.name} aufgelöst: Einzahlung ${u.name} zurück`, price:c, paidBy:u.id, owedBy:h, sg:g.id }));
    if (items.length) setFn('hs', cur=>[...items, ...(cur||[])]);
    setFn('sg', cur=>cur.filter(x=>x.id!==g.id));
    notifyOthers(TT("🐷 Sparziel aufgelöst: {0}", g.name), items.length ? 'Einzahlungen stehen in der Abrechnung' : 'Es war noch nichts eingezahlt', TT("wg-sg"), TT("exp"));
    undo(TT("🐷 {0} aufgelöst", g.name), ()=>{ const ids=items.map(i=>i.id); setFn('hs', cur=>cur.filter(i=>!ids.includes(i.id))); setFn('sg', cur=>[g, ...cur]); });
    setBuy(null);
  };
  return (
    <div className="rise" data-testid="savings-card">
      <div className="section-hdr" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span>{TT("🐷 Gemeinsam sparen")}</span>
        <button className="hit" onClick={()=>setAdd({ name:'', target:'' })} style={{...hdrBtn,color:'var(--mint)'}}>{TT("+ Ziel")}</button>
      </div>
      {goals.length>0 && (
        <div className="group">
          {goals.map(g=>{
            const s = sum(g), pct = Math.min(100, s/g.target*100);
            return (
              <div key={g.id} className="cell" data-testid="savings-row" style={{flexWrap:'wrap',gap:8}}>
                <div className="cell-content">
                  <span className="cell-title">{g.name} · €{fmt(s)} / €{fmt(g.target)}</span>
                  <span className="cell-sub">{users.map(u=>`${u.name} €${fmt(Number(g['c_'+u.id])||0)}`).join(' · ')} {TT("· Geld bei")} {nameOfU(users, g.holder)}</span>
                </div>
                <button className="btn btn-sec" style={{width:'auto',padding:'8px 11px',fontSize:13}} onClick={()=>setPay({ goal:g, amount:'' })}>{TT("Einzahlen")}</button>
                <button className="btn btn-sec" style={{width:'auto',padding:'8px 11px',fontSize:13}} onClick={()=>setBuy({ goal:g, price:String(g.target).replace('.',',') })}>{TT("Gekauft")}</button>
                <div style={{flexBasis:'100%',height:5,borderRadius:3,background:'var(--bg3)',overflow:'hidden'}}><div style={{width:`${pct}%`,height:'100%',background:'var(--mint)'}}/></div>
              </div>
            );
          })}
        </div>
      )}
      <MiniSheet open={!!add} onClose={()=>setAdd(null)} title={TT("Sparziel")} color="var(--mint)">
        {add && <>
          <input className="field" autoFocus maxLength={60} placeholder={TT("z. B. Neuer Staubsauger")} aria-label={TT("Name des Sparziels")} value={add.name} onChange={e=>setAdd({...add,name:e.target.value})}/>
          <div className="f-euro"><input className="field" inputMode="decimal" placeholder={TT("Ziel, z. B. 150")} aria-label={TT("Zielbetrag")} value={add.target} onChange={e=>setAdd({...add,target:e.target.value})}/></div>
          <div style={{fontSize:12.5,color:'var(--label2)'}}>{TT("Du verwaltest das Geld: Einzahlungen gehen an dich, beim Kauf zahlst du.")}</div>
          <button className="btn" style={{background:'var(--mint)'}} onClick={create}>{TT("Anlegen")}</button>
        </>}
      </MiniSheet>
      <MiniSheet open={!!pay} onClose={()=>setPay(null)} title={pay?`Einzahlen · ${pay.goal.name}`:''} color="var(--mint)">
        {pay && <>
          <div className="f-euro"><input className="field" autoFocus inputMode="decimal" placeholder="0,00" aria-label={TT("Einzahlung")} value={pay.amount} onChange={e=>setPay({...pay,amount:e.target.value})}/></div>
          {pay.goal.holder!==me && <div style={{fontSize:12.5,color:'var(--label2)'}}>{TT("Überweise den Betrag an")} {nameOfU(users, pay.goal.holder)} {TT("– hier wird er nur vermerkt.")}</div>}
          <button className="btn" style={{background:'var(--mint)'}} onClick={deposit}>{TT("Vermerken")}</button>
        </>}
      </MiniSheet>
      <MiniSheet open={!!buy} onClose={()=>setBuy(null)} title={buy?`Gekauft · ${buy.goal.name}`:''} color="var(--mint)">
        {buy && <>
          <div className="sheet-sublbl">{TT("Was hat es gekostet? (")}{nameOfU(users, buy.goal.holder)} {TT("zahlt)")}</div>
          <div className="f-euro"><input className="field" autoFocus inputMode="decimal" aria-label={TT("Kaufpreis")} value={buy.price} onChange={e=>setBuy({...buy,price:e.target.value})}/></div>
          <div style={{fontSize:12.5,color:'var(--label2)'}}>{TT("Wird 50/50 geteilt; Einzahlungen werden dabei verrechnet.")}</div>
          <button className="btn" style={{background:'var(--mint)'}} onClick={bought}>{TT("Als Ausgabe eintragen")}</button>
          <button className="btn btn-sec" onClick={dissolve}>{TT("Doch nicht kaufen – Ziel auflösen")}</button>
        </>}
      </MiniSheet>
    </div>
  );
}

/* ── Nebenkosten-Abrechnung (Übersicht): Nachzahlung/Guthaben nach Anteil verteilen → Haushalt-Posten (nk:true) ──
   Nachzahlung, Zahler Z: je Person ein Posten (Z zahlt, Person trägt ihren Anteil).
   Guthaben, Empfänger E: E schuldet den anderen ihren Anteil → Posten (andere „zahlt", E trägt). */
const NK_KINDS = [['strom','⚡ Strom'],['wasser','💧 Wasser'],['heizung','🔥 Heizung'],['nk','🏠 Nebenkosten']];
function CostsCard() {
  const { D, setFn, me, notifyOthers, undo } = useD();
  const users = D.users || [];
  const [f,setF] = useState(null);   // {kind, year, amount, credit, who, share}
  const done = hsAll(D).filter(i=>i.nk).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  if (users.length < 2) return null;
  const [a, b] = users;
  const save = () => {
    const amt = parseNum(f.amount); if (!(amt>0)) return;
    const label = `${(NK_KINDS.find(k=>k[0]===f.kind)||['',''])[1]} ${f.year}`;
    const shares = nkShares(amt);
    const items = [];
    if (!f.credit) users.forEach(u=>{ if (shares[u.id]>0) items.push(hsItem({ name:`${label} – Nachzahlung (${u.name})`, price:shares[u.id], paidBy:f.who, owedBy:u.id, cat:'fix', nk:true })); });
    else users.filter(u=>u.id!==f.who).forEach(u=>{ if (shares[u.id]>0) items.push(hsItem({ name:`${label} – Guthaben-Anteil ${u.name}`, price:shares[u.id], paidBy:u.id, owedBy:f.who, cat:'fix', nk:true })); });
    if (!items.length) return;
    setFn('hs', cur=>[...items, ...(cur||[])]);
    notifyOthers(`🏠 ${label}: ${f.credit?'Guthaben':'Nachzahlung'} €${fmt(amt)}`, users.map(u=>`${u.name} €${fmt(shares[u.id])}`).join(' · '), TT("wg-nk"), TT("exp"));
    undo(TT("🏠 {0} verteilt", label), ()=>{ const ids=items.map(i=>i.id); setFn('hs', cur=>cur.filter(i=>!ids.includes(i.id))); });
    setF(null);
  };
  // Anteile je Person: zwei Personen per Schieber (Anteil der ersten), ab drei gleich; gerundet, Rest an die letzte
  function nkShares(amt) {
    const p = Math.min(100, Math.max(0, Number(f.share)))/100;
    const raw = users.length===2 ? [amt*p, amt*(1-p)] : users.map(()=>amt/users.length);
    const r = raw.map(x=>Math.round(x*100)/100);
    r[r.length-1] = Math.round((amt - r.slice(0,-1).reduce((x,y)=>x+y,0))*100)/100;
    return Object.fromEntries(users.map((u,i)=>[u.id, r[i]]));
  }
  const preview = f && parseNum(f.amount)>0 ? (sh=>users.map(u=>`${u.name} €${fmt(sh[u.id])}`).join(' · '))(nkShares(parseNum(f.amount))) : '';
  return (
    <div className="rise" data-testid="costs-card" style={{animationDelay:'114ms'}}>
      <div className="section-hdr" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span>{TT("🧾 Nebenkosten-Abrechnung")}</span>
        <button className="hit" onClick={()=>setF({ kind:'nk', year:String(new Date().getFullYear()-1), amount:'', credit:false, who:me||a.id, share:50 })} style={{...hdrBtn,color:'var(--sky)'}}>{TT("+ Abrechnung")}</button>
      </div>
      <div className="group">
        {!done.length && <div className="cell"><div className="cell-content"><span className="cell-sub">{TT("Jahresabrechnung eintragen – Nachzahlung oder Guthaben wird nach euren Anteilen verteilt.")}</span></div></div>}
        {done.slice(0,4).map(i=><div key={i.id} className="cell"><div className="cell-content"><span className="cell-title">{i.name}</span><span className="cell-sub">€{fmt(i.price)} · {fmtDate(i.date)}{i.settled?' · abgerechnet':''}</span></div></div>)}
      </div>
      <MiniSheet open={!!f} onClose={()=>setF(null)} title={TT("Nebenkosten verteilen")} color="var(--sky)">
        {f && <>
          <div style={{display:'flex',flexWrap:'wrap',gap:6}}>{NK_KINDS.map(([k,l])=><button key={k} type="button" style={chipSt(f.kind===k)} onClick={()=>setF({...f,kind:k})}>{l}</button>)}</div>
          <input className="field" inputMode="numeric" maxLength={4} aria-label={TT("Abrechnungsjahr")} value={f.year} onChange={e=>setF({...f,year:e.target.value})}/>
          <div style={{display:'flex',gap:6}}>
            <button type="button" style={{...chipSt(!f.credit),flex:1}} onClick={()=>setF({...f,credit:false})}>{TT("Nachzahlung")}</button>
            <button type="button" style={{...chipSt(f.credit),flex:1}} onClick={()=>setF({...f,credit:true})}>{TT("Guthaben")}</button>
          </div>
          <div className="f-euro"><input className="field" inputMode="decimal" placeholder={TT("Betrag")} aria-label={TT("Betrag der Abrechnung")} value={f.amount} onChange={e=>setF({...f,amount:e.target.value})}/></div>
          <div className="sheet-sublbl">{f.credit ? 'Wer hat das Guthaben bekommen?' : 'Wer hat die Nachzahlung bezahlt?'}</div>
          <div className="pick">{users.map(u=><button key={u.id} type="button" className={`pick-btn${f.who===u.id?' on':''}`} style={{background:u.color}} onClick={()=>setF({...f,who:u.id})}>{u.name}</button>)}</div>
          {users.length===2 && <>
          <label className="sheet-sublbl" htmlFor="nk-share">{TT("Anteil")} {a.name}: {f.share} % · {b.name}: {100-f.share} %</label>
          <input id="nk-share" type="range" min="0" max="100" step="5" value={f.share} onChange={e=>setF({...f,share:Number(e.target.value)})}/>
          </>}
          {preview && <div data-testid="nk-preview" style={{fontSize:13,color:'var(--label2)'}}>{preview}</div>}
          <button className="btn" style={{background:'var(--sky)'}} onClick={save}>{TT("Verteilen")}</button>
        </>}
      </MiniSheet>
    </div>
  );
}

/* ── Essensplan (Key `ep`): {date, dish, cook, ings} — wer kocht, fair wie im Putzplan (seltener in 30 Tagen) ── */
const cookCount = (D, users) => { const cut = shiftISO(todayISO(), -30); return users.map(u=>({ ...u, n:(D.ep||[]).filter(e=>e && e.cook===u.id && e.date>=cut && e.date<=todayISO()).length })); };
function MealCard() {
  const { D, setFn, me, notifyOthers, undo } = useD();
  const users = D.users || [];
  const [f,setF] = useState(null);
  const today = todayISO(), end = shiftISO(today, 6);
  const week = (D.ep||[]).filter(e=>e && e.date>=today && e.date<=end).sort((a,b)=>a.date.localeCompare(b.date));
  const counts = cookCount(D, users);
  const fairCook = () => counts.length>1 ? [...counts].sort((a,b)=>a.n-b.n || (a.id===me?-1:1))[0].id : me;
  const open = () => setF({ date: [0,1,2,3,4,5,6].map(i=>shiftISO(today,i)).find(d=>!week.some(e=>e.date===d)) || today, dish:'', cook:fairCook(), ings:'' });
  const save = () => {
    if (!f.dish.trim()) return;
    const it = { id:uid(), date:f.date, dish:f.dish.trim().slice(0,60), cook:f.cook, ings:f.ings.trim().slice(0,300) };
    setFn('ep', cur=>[it, ...(cur||[]).filter(e=>e && e.date>=shiftISO(today,-60))]);
    notifyOthers(`🍝 ${boardWhen(it.date)}: ${it.dish}`, TT("{0} kocht", nameOfU(users, it.cook)), TT("wg-ep"), TT("board"));
    setF(null);
  };
  const shop = e => {
    const list = D.sl || [];
    const miss = String(e.ings||'').split(',').map(s=>s.trim()).filter(Boolean).filter(n=>!list.some(i=>i && !i.done && i.name.toLowerCase()===n.toLowerCase()));
    if (!miss.length) return;
    const add = miss.map(n=>({ id:uid(), name:n, addedBy:me||null, date:todayISO(), done:false }));
    setFn('sl', cur=>[...add, ...(cur||[])]);
    notifyOthers(TT("🛒 Zutaten für {0}", e.dish), miss.join(', '), TT("wg-shop"), TT("shop"));
    undo(TT("🛒 {0} Zutat{1} auf die Liste", miss.length, miss.length===1?'':'en'), ()=>{ const ids=add.map(i=>i.id); setFn('sl', cur=>cur.filter(i=>!ids.includes(i.id))); });
  };
  const del = e => { setFn('ep', cur=>cur.filter(x=>x.id!==e.id)); undo(TT("Gericht entfernt"), ()=>setFn('ep', cur=>[e, ...cur])); };
  return (
    <div className="rise" data-testid="meal-card">
      <div className="section-hdr" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span>{TT("🍝 Essensplan · 7 Tage")}</span>
        <button className="hit" onClick={open} style={{...hdrBtn,color:'var(--amber)'}}>{TT("+ Gericht")}</button>
      </div>
      <div className="group">
        {!week.length && <div className="cell"><div className="cell-content"><span className="cell-sub">{TT("Gemeinsam kochen planen – wer kocht, wird fair vorgeschlagen, Zutaten mit einem Tipp auf die Liste.")}</span></div></div>}
        {week.map(e=>{ const u = users.find(x=>x.id===e.cook); return (
          <div key={e.id} className="cell" data-testid="meal-row">
            <div className="cell-content">
              <span className="cell-title">{(w=>w.charAt(0).toUpperCase()+w.slice(1))(boardWhen(e.date))} · {e.dish}</span>
              <span className="cell-sub"><b style={{color:u?.color}}>{u?.id===me?'Du kochst':`${u?.name||'?'} kocht`}</b>{e.ings?` · ${e.ings}`:''}</span>
            </div>
            {e.ings && <button className="btn btn-sec" aria-label={TT("Zutaten für {0} auf die Liste", e.dish)} style={{width:'auto',padding:'8px 11px',fontSize:13,flexShrink:0}} onClick={()=>shop(e)}>{TT("🛒 Zutaten")}</button>}
            <button className="del-btn" aria-label={TT("{0} entfernen", e.dish)} onClick={()=>del(e)}>×</button>
          </div>); })}
        {counts.length>1 && <div className="cell" style={{minHeight:40}}><span className="cell-sub" data-testid="meal-fair">{TT("Gekocht (30 Tage):")} {counts.map(c=>`${c.name} ${c.n}×`).join(' · ')}</span></div>}
      </div>
      <MiniSheet open={!!f} onClose={()=>setF(null)} title={TT("Gericht planen")} color="var(--amber)">
        {f && <>
          <input type="date" className="field" aria-label={TT("Tag")} value={f.date} min={today} onChange={e=>setF({...f,date:e.target.value})}/>
          <input className="field" autoFocus maxLength={60} placeholder={TT("Was gibt es? z. B. Lasagne")} aria-label={TT("Gericht")} value={f.dish} onChange={e=>setF({...f,dish:e.target.value})}/>
          <div className="sheet-sublbl">{TT("Wer kocht? (Vorschlag: wer seltener gekocht hat)")}</div>
          <div className="pick">{users.map(u=><button key={u.id} type="button" className={`pick-btn${f.cook===u.id?' on':''}`} style={{background:u.color}} onClick={()=>setF({...f,cook:u.id})}>{u.name}</button>)}</div>
          <input className="field" maxLength={300} placeholder={TT("Zutaten, mit Komma getrennt")} aria-label={TT("Zutaten")} value={f.ings} onChange={e=>setF({...f,ings:e.target.value})}/>
          <button className="btn" style={{background:'var(--amber)'}} onClick={save}>{TT("Speichern")}</button>
        </>}
      </MiniSheet>
    </div>
  );
}

    setF(null);

  const del = it => { setFn('inv', cur=>cur.filter(x=>x.id!==it.id)); undo(TT("„{0}\" entfernt", it.name), ()=>setFn('inv', cur=>[it, ...cur])); };
  return (

/* ── Auszugs-Assistent: alles für die Übergabe auf einer Druckseite (Zähler, Reparaturen, Inventar, offene Beträge) ── */
function MoveOutCard() {
  const { D } = useD();
  const [open,setOpen] = useState(false);
  const users = D.users || [];
  const reads = (D.zs||[]).filter(z=>z && !z.cfg);
  const lastRead = k => reads.filter(z=>z.kind===k).sort((a,b)=>b.date.localeCompare(a.date))[0];
  const openRep = (D.rp||[]).filter(r=>r && r.status!=='erledigt');
  const inv = (D.inv||[]).filter(Boolean);
  const kt = (D.kt||[]).find(x=>x && x.id==='k');
  const gc = growCalc(D);
  const balLine = () => { const [a] = users; if (!a) return '';
    if (users.length > 2) { const p = settlePlan(users.map(u=>({ ...u, net: hsNetOf(D, u.id) + (gc.tCost ? gc.net(u.id) : 0) })));
      return p.length ? p.map(t=>`${t.fromName} zahlt ${t.toName} €${fmt(t.amount)}`).join(' · ') : 'Alles ausgeglichen'; }
    const n = hsNetOf(D, a.id) + (gc.tCost ? gc.net(a.id) : 0); const o = otherOf(users, a.id);
    return Math.abs(n) < 0.01 ? 'Alles ausgeglichen' : n < 0 ? `${a.name} schuldet ${o?.name} €${fmt(-n)}` : `${o?.name} schuldet ${a.name} €${fmt(n)}`; };
  return (
    <div data-testid="moveout-card">
      <div className="section-hdr">{TT("📦 Auszug")}</div>
      <button className="group" onClick={()=>setOpen(true)} style={{width:'100%',padding:'14px 16px',textAlign:'left',fontFamily:'inherit',cursor:'pointer',color:'var(--label)'}}>
        <span style={{display:'block',fontSize:15,fontWeight:700}}>{TT("Übergabe-Seite öffnen")}</span>
        <span style={{display:'block',fontSize:12.5,color:'var(--label2)'}}>{TT("Zählerstände, offene Mängel, Inventar und offene Beträge – zum Drucken oder als PDF")}</span>
      </button>
      {open && ReactDOM.createPortal(
        <div className="print-sheet" data-testid="moveout-sheet" role="dialog" aria-label={TT("Übergabe-Seite")}>
          <div className="no-print" style={{display:'flex',gap:8,marginBottom:16}}>
            <button className="btn" style={{background:'#0f766e',color:'#fff'}} onClick={()=>window.print()}>{TT("Drucken / als PDF speichern")}</button>
            <button className="btn" style={{width:'auto',padding:'0 18px',background:'#e5e7eb',color:'#111'}} onClick={()=>setOpen(false)}>{TT("Schließen")}</button>
          </div>
          <h2>{TT("Übergabe WG ·")} {fmtDate(todayISO())}</h2>
          <p>{users.map(u=>u.name).join(' & ')}</p>
          <h3>{TT("Zählerstände")}</h3>
          <table><tbody>{Object.entries(METER_KINDS).map(([k,[em,l,unit]])=>{ const r = lastRead(k); return <tr key={k}><td>{em} {l}</td><td>{r?`${fmtN(r.value,2)} ${unit}`:'– bitte ablesen –'}</td><td>{r?fmtDate(r.date):''}</td></tr>; })}</tbody></table>
          <h3>{TT("Offene Mängel (")}{openRep.length})</h3>
          {openRep.length ? <ul>{openRep.map(r=><li key={r.id}>{r.text} – {r.status==='gemeldet'?`gemeldet am ${fmtDate(r.md)}`:'noch nicht gemeldet'}</li>)}</ul> : <p>{TT("Keine.")}</p>}
          <h3>{TT("Inventar")}</h3>
          {inv.length ? <table><tbody>{inv.map(i=><tr key={i.id}><td>{i.name}</td><td>{i.owner==='wg'?'Gemeinsam':nameOfU(users, i.owner)}</td><td>{i.price?`€${fmt(i.price)}`:''}</td></tr>)}</tbody></table> : <p>{TT("Nichts eingetragen.")}</p>}
          <h3>{TT("Offene Beträge")}</h3>
          <p data-testid="moveout-bal">{balLine()}</p>
          {kt && <><h3>{TT("Kaution")}</h3><p data-testid="moveout-kt">€{fmt(kt.total)} · {users.map(u=>`${u.name} €${fmt(Number(kt['c_'+u.id])||0)}`).join(' · ')}{kt.back?` · zurück €${fmt(kt.refund)}`:''}</p></>}
          <p style={{marginTop:32}}>{TT("Unterschriften: ______________________ &nbsp; ______________________")}</p>
        </div>, document.body)}
    </div>
  );
}

/* ── WG-Regeln (Key `rg`): {text, by, ok_<uid}> — gilt erst, wenn alle zugestimmt haben ── */
function RulesCard() {
  const { D, setFn, me, notifyOthers, undo } = useD();
  const users = D.users || [];
  const [txt,setTxt] = useState('');
  const [showAll,setShowAll] = useState(false);
  const rules = (D.rg||[]).filter(Boolean).sort((a,b)=>(b.ts||0)-(a.ts||0));
  const agreed = r => users.every(u=>r['ok_'+u.id]===true);
  const pending = rules.filter(r=>!agreed(r)), valid = rules.filter(agreed);
  const add = () => {
    const t = txt.trim().slice(0,160); if (!t || !me) return;
    setFn('rg', cur=>[{ id:uid(), text:t, by:me, ts:Date.now(), ['ok_'+me]:true }, ...(cur||[])]);
    notifyOthers(TT("📜 Neue WG-Regel: {0}", t), TT("{0} schlägt vor – einverstanden?", nameOfU(users, me)), TT("wg-rg"), TT("board"));
    setTxt('');
  };
  const agree = r => { setFn('rg', cur=>cur.map(x=>x.id===r.id?{...x,['ok_'+me]:true}:x)); notifyOthers(TT("📜 Regel gilt jetzt: {0}", r.text), TT("{0} ist einverstanden", nameOfU(users, me)), TT("wg-rg"), TT("board")); };
  const reject = r => { setFn('rg', cur=>cur.filter(x=>x.id!==r.id)); undo(TT("📜 Regel abgelehnt"), ()=>setFn('rg', cur=>[r, ...cur])); if (agreed(r)) notifyOthers(TT("📜 Regel aufgehoben: {0}", r.text), TT("von {0} – lieber besprechen", nameOfU(users, me)), TT("wg-rg"), TT("board"));
    else if (r.by!==me) notifyOthers(TT("📜 Regel abgelehnt: {0}", r.text), TT("{0} ist nicht einverstanden – lieber besprechen", nameOfU(users, me)), TT("wg-rg"), TT("board")); };
  return (
    <div className="rise" data-testid="rules-card">
      <div className="section-hdr">{TT("📜 WG-Regeln")}</div>
      <div className="group">
        {pending.map(r=>{ const mine = r['ok_'+me]===true, waiting = users.filter(u=>r['ok_'+u.id]!==true).map(u=>u.name).join(', '); return (
          <div key={r.id} className="cell" data-testid="rule-pending" style={{flexWrap:'wrap',gap:8}}>
            <div className="cell-content"><span className="cell-title">{r.text}</span><span className="cell-sub" style={{color:'var(--amber)'}}>{TT("wartet auf")} {waiting}</span></div>
            {!mine && me && <button className="btn" style={{width:'auto',padding:'8px 12px',fontSize:13,background:'var(--green)'}} onClick={()=>agree(r)}>{TT("Einverstanden")}</button>}
            <button className="btn btn-sec" style={{width:'auto',padding:'8px 12px',fontSize:13}} onClick={()=>reject(r)}>{mine?'Zurückziehen':'Ablehnen'}</button>
          </div>); })}
        {(showAll ? valid : valid.slice(0,3)).map(r=>(
          <div key={r.id} className="cell" data-testid="rule-valid">
            <div className="cell-content"><span className="cell-title">✅ {r.text}</span></div>
            <button className="del-btn" aria-label={TT("Regel „{0}\" aufheben", r.text)} onClick={()=>reject(r)}>×</button>
          </div>
        ))}
        {valid.length>3 && <button className="cell hit" onClick={()=>setShowAll(s=>!s)} style={{background:'none',width:'100%',fontFamily:'inherit',color:'var(--label2)',fontSize:13,cursor:'pointer'}}>{showAll?'Weniger':'Alle '+valid.length+' Regeln'}</button>}
        {me && <form className="cell" onSubmit={e=>{e.preventDefault();add();}} style={{gap:8}}>
          <input className="field" maxLength={160} placeholder={TT("Regel vorschlagen, z. B. Ruhe ab 22 Uhr")} aria-label={TT("Regel vorschlagen")} value={txt} onChange={e=>setTxt(e.target.value)} style={{flex:1}}/>
          <button type="submit" className="btn" style={{width:54,flexShrink:0,background:'var(--mint)'}}>+</button>
        </form>}
      </div>
    </div>
  );
}

/* ── Monats-Check-in (Key `ci`, id = <Monat>-<userId>): Note 1–5 + Wunsch. Antworten sieht man erst, wenn alle
   geantwortet haben (Ausnahme: die eigene). Sichtbar vom 1. bis zum 10., danach nur solange eine begonnene Runde unvollständig ist. ── */
function CheckinCard() {
  const { D, setFn, me, notifyOthers } = useD();
  const users = D.users || [];
  const [score,setScore] = useState(0);
  const [wish,setWish] = useState('');
  const ym = todayISO().slice(0,7), day = Number(todayISO().slice(8,10));
  const answers = (D.ci||[]).filter(c=>c && c.ym===ym);
  const mine = answers.find(c=>c.userId===me);
  const all = users.length>1 && users.every(u=>answers.some(c=>c.userId===u.id));
  // nach dem 10.: nur eine begonnene Runde zeigen — unvollständig, oder fertig und höchstens 3 Tage alt (Ergebnis lesen)
  const lastTs = Math.max(0, ...answers.map(c=>Number(c.ts)||0));
  if (!me || users.length<2 || (day>10 && (!answers.length || (all && Date.now()-lastTs > 3*864e5)))) return null;
  const send = () => {
    if (!score) return;
    setFn('ci', cur=>[{ id:`${ym}-${me}`, ym, userId:me, score, wish:wish.trim().slice(0,200), ts:Date.now() }, ...(cur||[]).filter(c=>c && c.id!==`${ym}-${me}`)]);
    const last = users.every(u=>u.id===me || answers.some(c=>c.userId===u.id));
    notifyOthers(TT("💬 Monats-Check-in"), last ? 'Alle haben geantwortet – Ergebnis in der App' : `${nameOfU(users, me)} hat geantwortet – du auch?`, TT("wg-ci"), TT("board"));
  };
  const faces = ['😣','😕','😐','🙂','😄'];
  return (
    <div className="rise" data-testid="checkin-card">
      <div className="section-hdr">{TT("💬 Monats-Check-in ·")} {ymLabel(ym)}</div>
      <div className="group" style={{padding:'12px 14px',display:'flex',flexDirection:'column',gap:10}}>
        {!mine ? <>
          <span style={{fontSize:14,fontWeight:700}}>{TT("Wie läuft's in der WG?")}</span>
          <div style={{display:'flex',gap:6}}>{faces.map((f,i)=><button key={i} type="button" aria-label={TT("Note {0}", i+1)} aria-pressed={score===i+1} onClick={()=>setScore(i+1)} style={{...chipSt(score===i+1),flex:1,fontSize:22}}>{f}</button>)}</div>
          <input className="field" maxLength={200} placeholder={TT("Ein Wunsch oder Danke (optional)")} aria-label={TT("Wunsch")} value={wish} onChange={e=>setWish(e.target.value)}/>
          <button className="btn" style={{background:score?'var(--mint)':'var(--bg3)'}} onClick={send}>{TT("Absenden")}</button>
          <span style={{fontSize:12,color:'var(--label2)'}}>{TT("Die Antworten sieht man erst, wenn beide geantwortet haben.")}</span>
        </> : !all ? (
          <span data-testid="checkin-wait" style={{fontSize:13.5,color:'var(--label2)'}}>{TT("Danke! Deine Antwort (")}{faces[mine.score-1]}{TT(") ist gespeichert – wir warten auf")} {users.filter(u=>!answers.some(c=>c.userId===u.id)).map(u=>u.name).join(', ')}.</span>
        ) : (
          <div data-testid="checkin-result" style={{display:'flex',flexDirection:'column',gap:8}}>
            {users.map(u=>{ const c = answers.find(x=>x.userId===u.id); return <div key={u.id} style={{fontSize:14}}><b style={{color:u.color}}>{u.name}</b> {faces[c.score-1]}{c.wish?` – „${c.wish}“`:''}</div>; })}
          </div>
        )}
      </div>
    </div>
  );
}

  const openK = k => { setKind(k); setText(''); setDate(k==='wecker' ? shiftISO(todayISO(),1) : todayISO()); };

    if (!kind) return;

  const del = b => { setFn('bo', cur=>cur.filter(x=>x.id!==b.id)); undo(TT("Ankündigung entfernt"), ()=>setFn('bo', cur=>cur.some(x=>x.id===b.id)?cur:[b, ...cur])); };

              <button className="del-btn" aria-label={TT("Ankündigung entfernen")} onClick={()=>del(b)}>×</button>
