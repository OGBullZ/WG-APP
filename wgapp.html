          }
          </>
          )}
        </div>
      </div>
      <Wiz open={wiz} onClose={()=>setWiz(false)} title="Ausgabe" color="var(--mint)" steps={steps} onFinish={add}/>
      <Wiz open={!!editItem} onClose={()=>setEditItem(null)} title="Bearbeiten" color="var(--mint)" steps={steps} onFinish={save} initial={editItem?{name:editItem.name,price:String(editItem.price),paidBy:editItem.paidBy}:null}/>
      <Wiz open={!!convItem} onClose={()=>setConvItem(null)} title="Als Ausgabe übernehmen" color="var(--mint)" steps={steps} onFinish={convert} initial={convItem?{name:convItem.name,paidBy:me||undefined}:null}/>
    </div>
  );
}

/* ══════════════════════════
   GROW
══════════════════════════ */
function Grow() {
  const { D, set, status } = useD();
  const users=D.users, plants=D.gp||{}, items=D.gi||[];
  const [wiz,setWiz] = useState(false);

  const total  = Object.values(plants).reduce((s,v)=>s+(parseInt(v)||0),0);
  const share  = id => total>0?(parseInt(plants[id]||0)/total):1/users.length;
  const pctStr = id => (share(id)*100).toFixed(1)+'%';
  const setP   = (uid2,v) => set('gp',{...plants,[uid2]:Math.max(0,parseInt(v)||0)});

  const add    = d => set('gi',[{id:uid(),name:d.name||'Grow',price:parseFloat(d.price)||0,paidBy:d.paidBy||users[0].id,date:tod(),settled:false},...items]);
  const toggle = id => set('gi',items.map(i=>i.id===id?{...i,settled:!i.settled}:i));
  const del    = id => set('gi',items.filter(i=>i.id!==id));

  const open=items.filter(i=>!i.settled), tCost=open.reduce((s,i)=>s+i.price,0);
  const bals=users.map(u=>({ ...u, paid:open.filter(i=>i.paidBy===u.id).reduce((s,i)=>s+i.price,0), net:open.filter(i=>i.paidBy===u.id).reduce((s,i)=>s+i.price,0) - tCost*share(u.id) }));

  /* Pflanzen-Slots: jede Pflanze als Icon in Besitzer-Farbe */
  const slots=[];
  users.forEach(u=>{ for(let i=0;i<(parseInt(plants[u.id])||0);i++) slots.push(u.color); });

  const steps=[
    {label:'Was wurde gekauft?',ok:d=>d.name?.trim(),render:({data:d,setData:sd})=><input autoFocus className="field" placeholder="Dünger, Erde, Lampe …" value={d.name||''} onChange={e=>sd({...d,name:e.target.value})}/>},
    {label:'Preis',ok:d=>parseFloat(d.price)>0,render:({data:d,setData:sd})=><div className="f-euro"><input autoFocus type="number" step="0.01" min="0" className="field" placeholder="0.00" value={d.price||''} onChange={e=>sd({...d,price:e.target.value})}/></div>},
    {label:'Wer hat bezahlt?',ok:d=>!!d.paidBy,render:({data:d,setData:sd})=>(
      <div className="pick">
        {users.map(u=>(
          <button key={u.id} className={`pick-btn${d.paidBy===u.id?' on':''}`} style={{background:u.color}} onClick={()=>sd({...d,paidBy:u.id})}>
            {u.name}<br/><span style={{fontSize:11,fontWeight:600,opacity:.75}}>zahlt {pctStr(u.id)}</span>
          </button>
        ))}
      </div>
    )},
  ];

  return (
    <div className="screen">
      <NBar title="Growbox" color="var(--lime)" status={status}/>
      <div className="scroll"><div className="content">

        {/* Split-Hero: Donut + Pflanzen */}
        <div className="hero rise" style={{'--glow':'rgba(163,230,53,.17)'}}>
          <div className="hero-lbl" style={{marginBottom:16}}>Kosten-Split nach Pflanzen</div>
          <div style={{display:'flex',alignItems:'center',gap:20}}>
            <Donut segs={users.map(u=>({frac:share(u.id),color:u.color}))}>
              <span className="num" style={{fontSize:30,fontWeight:700,color:'var(--lime)'}}>{total}</span>
              <span style={{fontSize:10,color:'var(--label3)',letterSpacing:'.14em',textTransform:'uppercase',fontFamily:'var(--mono)'}}>Pflanzen</span>
            </Donut>
            <div style={{flex:1,display:'flex',flexDirection:'column',gap:14}}>
              {users.map(u=>(
                <div key={u.id} style={{display:'flex',flexDirection:'column',gap:5}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
                    <span style={{fontSize:14,fontWeight:800,color:u.color}}>{u.name}</span>
                    <span className="num" style={{fontSize:13,fontWeight:700,color:'var(--label2)'}}>{pctStr(u.id)}</span>
                  </div>
                  <div className="stepper" style={{alignSelf:'stretch',justifyContent:'space-between'}}>
                    <button onClick={()=>setP(u.id,(parseInt(plants[u.id])||0)-1)}>−</button>
                    <span className="st-val" style={{color:u.color}}>{parseInt(plants[u.id])||0}</span>
                    <button onClick={()=>setP(u.id,(parseInt(plants[u.id])||0)+1)}>+</button>
                  </div>
                </div>
              ))}
            </div>
          </div>
          {slots.length>0&&(
            <div className="plant-row" style={{marginTop:20}}>
              {slots.map((c,i)=>(
                <div key={i} className="plant-slot" style={{animationDelay:`${i*45}ms`}}>
                  <Ic d={ICONS.leaf} color={c} size={24} sw={1.9}/>
                </div>
              ))}
            </div>
          )}
        </div>

        {/* Offene Bilanz */}
        {open.length>0&&(
          <div className="rise" style={{animationDelay:'60ms'}}>
            <div className="section-hdr">Offene Bilanz · €{fmt(tCost)} gesamt</div>
            <div className="group">
              {bals.map(b=>(
                <div key={b.id} className="cell">
                  <div style={{width:10,height:10,borderRadius:'50%',background:b.color,boxShadow:`0 0 8px ${b.color}`,flexShrink:0}}/>
                  <div className="cell-content">
                    <span className="cell-title">{b.name}</span>
                    <span className="cell-sub">bezahlt €{fmt(b.paid)} · Anteil €{fmt(tCost*share(b.id))}</span>
                  </div>
                  <span className="num" style={{fontWeight:700,fontSize:15,color:b.net>.01?'var(--green)':b.net<-.01?'var(--red)':'var(--label3)'}}>{b.net>.01?'+':''}<CountUp value={b.net}/></span>
                </div>
              ))}
            </div>
            <div style={{height:8}}/>
            <Bal bals={bals}/>
          </div>
        )}

        <button className="btn rise" style={{background:'var(--lime)',animationDelay:'100ms'}} onClick={()=>setWiz(true)}>+ Grow-Ausgabe</button>

        {items.length===0
          ?<div className="empty"><div className="empty-ico">🌱</div><span style={{fontSize:14,color:'var(--label2)'}}>Noch keine Ausgaben</span></div>
          :(
            <div className="rise" style={{animationDelay:'140ms'}}>
              <div className="section-hdr">Ausgaben</div>
              <div className="group">
                {items.map(item=>{
                  const payer=users.find(u=>u.id===item.paidBy);
                  return(
                    <div key={item.id} className={`cell${item.settled?' dim':''}`}>
                      <button className="chk-btn" style={{border:`1.5px solid ${item.settled?'var(--lime)':'var(--sep)'}`,background:item.settled?'var(--lime)':'none'}} onClick={()=>toggle(item.id)}>
                        {item.settled&&<ChkIco/>}
                      </button>
                      <div className="cell-content">
                        <span className="cell-title" style={{textDecoration:item.settled?'line-through':'none'}}>{item.name}</span>
                        <span className="cell-sub">{item.date} · <span style={{color:payer?.color}}>{payer?.name}</span></span>
                      </div>
                      <div style={{textAlign:'right',flexShrink:0}}>
                        <div className="num" style={{fontSize:15,fontWeight:700}}>€{fmt(item.price)}</div>
                        <div className="num" style={{fontSize:10.5}}>
                          {users.map(u=><span key={u.id} style={{color:u.color,marginLeft:5}}>{u.name} €{fmt(item.price*share(u.id))}</span>)}
                        </div>
                      </div>
                      <button className="del-btn" aria-label="Eintrag löschen" title="Eintrag löschen" onClick={()=>{if(confirm(`"${item.name}" löschen?`))del(item.id);}}>×</button>
                    </div>
                  );
                })}
              </div>
            </div>
          )
        }
      </div></div>
      <Wiz open={wiz} onClose={()=>setWiz(false)} title="Grow-Ausgabe" color="var(--lime)" steps={steps} onFinish={add}/>
    </div>
  );
}

/* ══════════════════════════
   PUTZPLAN
══════════════════════════ */
function Putzplan() {
  const { D, set, status } = useD();
  const users=D.users, tasks=D.pt||[], log=D.pl||[];
  const [wiz,setWiz] = useState(false);

  const todayMid = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
  const parseIso = s => { const [y,m,dd]=s.split('-').map(Number); return new Date(y,m-1,dd); };
  const dueIn = t => {
    if(!t.lastDone) return 0; // noch nie gemacht → sofort fällig
    const due=parseIso(t.lastDone); due.setDate(due.getDate()+(t.interval||7));
    return Math.round((due-todayMid())/86400000);
  };
  const other = id => users.find(u=>u.id!==id)?.id || id;

  const done = t => {
    const iso=new Date().toISOString().slice(0,10);
    set('pt', tasks.map(x=>x.id===t.id?{...x,lastDone:iso,assignee:other(x.assignee)}:x));
    set('pl', [{id:uid(),taskId:t.id,name:t.name,em:t.em,userId:t.assignee,date:iso},...log].slice(0,200));
  };
  const del = id => set('pt',tasks.filter(t=>t.id!==id));
  const add = d => set('pt',[...tasks,{id:uid(),name:d.name||'Aufgabe',em:d.em||'🧽',interval:parseInt(d.interval)||7,assignee:d.assignee||users[0].id,lastDone:null}]);

  const loadDefaults = () => set('pt',[
    {name:'Küche putzen',em:'🍳',interval:7},
    {name:'Bad putzen',em:'🚿',interval:7},
    {name:'Staubsaugen',em:'🧹',interval:7},
    {name:'Müll rausbringen',em:'🗑️',interval:3},
  ].map((t,i)=>({id:uid(),...t,assignee:users[i%users.length]?.id||users[0].id,lastDone:null})));

  /* Fairness: erledigte Aufgaben der letzten 30 Tage */
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-30); cutoff.setHours(0,0,0,0);
  const counts=users.map(u=>({...u, n:log.filter(l=>l.userId===u.id&&parseIso(l.date)>=cutoff).length}));
  const totN=counts.reduce((s,c)=>s+c.n,0);

  const sorted=[...tasks].sort((a,b)=>dueIn(a)-dueIn(b));
  const dueNow=sorted.filter(t=>dueIn(t)<=0);

  const chip = t => {
    const d=dueIn(t);
    if(d<0)  return <span className="due-chip" style={{background:'rgba(251,113,133,.15)',color:'var(--red)'}}>{-d}d ÜBERFÄLLIG</span>;
    if(d===0)return <span className="due-chip" style={{background:'rgba(251,191,36,.16)',color:'var(--amber)'}}>HEUTE</span>;
    return <span className="due-chip" style={{background:'rgba(255,255,255,.06)',color:'var(--label3)'}}>IN {d}d</span>;
  };

  const EMS=['🧽','🍳','🚿','🧹','🗑️','🧺','🪟','🌿','🛒','🧴'];
  const IVS=[['3','Alle 3 Tage'],['7','Wöchentlich'],['14','Alle 2 Wochen'],['30','Monatlich']];
  const steps=[
    {label:'Was ist zu tun?',ok:d=>d.name?.trim(),render:({data:d,setData:sd})=><input autoFocus className="field" placeholder="Küche putzen, Müll rausbringen …" value={d.name||''} onChange={e=>sd({...d,name:e.target.value})}/>},
    {label:'Symbol',render:({data:d,setData:sd})=><div className="emoji-grid">{EMS.map(e=><button key={e} className={`emoji-btn${d.em===e?' on':''}`} onClick={()=>sd({...d,em:e})}>{e}</button>)}</div>},
    {label:'Wie oft?',ok:d=>!!d.interval,render:({data:d,setData:sd})=>(
      <div className="cat-grid">
        {IVS.map(([v,l])=><button key={v} className={`cat-btn${d.interval===v?' on':''}`} onClick={()=>sd({...d,interval:v})}>{l}</button>)}
      </div>
    )},
    {label:'Wer startet?',ok:d=>!!d.assignee,render:({data:d,setData:sd})=>(
      <div className="pick">
        {users.map(u=><button key={u.id} className={`pick-btn${d.assignee===u.id?' on':''}`} style={{background:u.color}} onClick={()=>sd({...d,assignee:u.id})}>{u.name}</button>)}
      </div>
    )},
  ];

  return (
    <div className="screen">
      <NBar title="Putzplan" color="var(--amber)" status={status}/>
      <div className="scroll"><div className="content">

        <div className="hero rise" style={{'--glow':'rgba(251,191,36,.15)'}}>
          <div className="hero-lbl">Heute dran</div>
          {tasks.length===0
            ?<div style={{fontSize:15,fontWeight:600,color:'var(--label2)',margin:'8px 0 16px'}}>Noch kein Plan — lad den Standard-Plan oder leg eigene Aufgaben an.</div>
            :dueNow.length===0
              ?<div style={{fontSize:16,fontWeight:700,color:'var(--green)',margin:'8px 0 16px'}}>Alles sauber ✨ nichts fällig</div>
              :(
                <div style={{display:'flex',flexDirection:'column',gap:9,margin:'10px 0 16px'}}>
                  {dueNow.map(t=>{const u=users.find(x=>x.id===t.assignee);return(
                    <div key={t.id} style={{display:'flex',alignItems:'center',gap:10}}>
                      <span style={{fontSize:20,lineHeight:1}}>{t.em}</span>
                      <span style={{flex:1,fontSize:15,fontWeight:700}}>{t.name}</span>
                      <span style={{fontSize:14,fontWeight:800,color:u?.color}}>{u?.name}</span>
                    </div>
                  );})}
                </div>
              )
          }
          <div className="hero-lbl" style={{marginBottom:8}}>Putz-Score · letzte 30 Tage</div>
          <div className="fair-bar">
            {counts.map(c=>(<div key={c.id} className="fair-seg" style={{width:totN>0?`${c.n/totN*100}%`:'50%',background:c.color,opacity:totN>0?1:.25}}/>))}
          </div>
          <div style={{display:'flex',justifyContent:'space-between',marginTop:8}}>
            {counts.map(c=>(<span key={c.id} style={{fontSize:13,fontWeight:700,color:c.color}}>{c.name} <span className="num">{c.n}×</span></span>))}
          </div>
        </div>

        <button className="btn rise" style={{background:'var(--amber)',animationDelay:'50ms'}} onClick={()=>setWiz(true)}>+ Aufgabe anlegen</button>
        {tasks.length===0&&(
          <button className="btn btn-sec rise" style={{animationDelay:'80ms'}} onClick={loadDefaults}>Standard-Plan laden (Küche, Bad, Saugen, Müll)</button>
        )}

        {tasks.length>0&&(
          <div className="rise" style={{animationDelay:'100ms'}}>
            <div className="section-hdr">Aufgaben · Haken = erledigt, dann ist der andere dran</div>
            <div className="group">
              {sorted.map(t=>{
                const u=users.find(x=>x.id===t.assignee);
                return(
                  <div key={t.id} className="cell">
                    <button className="done-btn" style={{borderColor:(u?.color||'#888')+'66'}} title={`${t.name} erledigt`} onClick={()=>done(t)}>
                      <svg width={16} height={16} viewBox="0 0 24 24" fill="none" stroke={u?.color||'#888'} strokeWidth={2.6} strokeLinecap="round" strokeLinejoin="round"><path d={ICONS.check}/></svg>
                    </button>
                    <div className="cell-content">
                      <span className="cell-title">{t.em} {t.name}</span>
                      <span className="cell-sub"><span style={{color:u?.color,fontWeight:700}}>{u?.name}</span> ist dran · alle {t.interval} Tage</span>
                    </div>
                    {chip(t)}
                    <button className="del-btn" aria-label="Aufgabe löschen" title="Aufgabe löschen" onClick={()=>{if(confirm(`"${t.name}" löschen?`))del(t.id);}}>×</button>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {log.length>0&&(
          <div className="rise" style={{animationDelay:'140ms'}}>
            <div className="section-hdr">Zuletzt erledigt</div>
            <div className="group">
              {log.slice(0,6).map(l=>{
                const u=users.find(x=>x.id===l.userId);
                return(
                  <div key={l.id} className="cell" style={{minHeight:46,padding:'10px 16px'}}>
                    <span style={{fontSize:16,lineHeight:1}}>{l.em||'🧽'}</span>
                    <div className="cell-content"><span className="cell-title" style={{fontSize:14.5}}>{l.name}</span></div>
                    <span style={{fontSize:12.5,fontWeight:700,color:u?.color}}>{u?.name}</span>
                    <span className="num" style={{fontSize:11,color:'var(--label3)'}}>{parseIso(l.date).toLocaleDateString('de-DE')}</span>
                  </div>
                );
              })}
            </div>
          </div>
        )}

      </div></div>
      <Wiz open={wiz} onClose={()=>setWiz(false)} title="Putz-Aufgabe" color="var(--amber)" steps={steps} onFinish={add}/>
    </div>
  );
}

/* ══════════════════════════
   FINANZEN
══════════════════════════ */
function Finanzen() {
  const { D, set, status } = useD();
  const users=D.users, txs=D.ft||[], fixed=D.ff||[];
  const [seg,setSeg]   = useState('txs');
  const [wiz,setWiz]   = useState(null);
  const [uid_,setUid_] = useState(users[0]?.id);

  const CATS=['Lebensmittel','Wohnen','Transport','Freizeit','Gesundheit','Grow','Sonstiges'];
  const myTxs=txs.filter(t=>t.userId===uid_);
  const inc=myTxs.filter(t=>t.type==='inc').reduce((s,t)=>s+t.amount,0);
  const exp=myTxs.filter(t=>t.type==='exp').reduce((s,t)=>s+t.amount,0);
  const fixMo=fixed.reduce((s,f)=>s+(f.freq==='m'?f.amount:f.amount/12),0);
  const avail=inc-exp-fixMo;

  const addTx  = d => set('ft',[{id:uid(),type:d.type||'exp',amount:parseFloat(d.amount)||0,category:d.cat||'Sonstiges',date:tod(),userId:d.userId||uid_},...txs]);
  const addFix = d => set('ff',[{id:uid(),name:d.name||'',amount:parseFloat(d.amount)||0,freq:d.freq||'m'},...fixed]);

  const txSteps=[
    {label:'Art',ok:d=>!!d.type,render:({data:d,setData:sd})=>(
      <div className="pick">
        {[['inc','📈 Einnahme','var(--green)'],['exp','📉 Ausgabe','var(--red)']].map(([v,l,c])=>(
          <button key={v} className={`pick-btn${d.type===v?' on':''}`} style={{background:c}} onClick={()=>sd({...d,type:v})}>{l}</button>
        ))}
      </div>
    )},
    {label:'Betrag',ok:d=>parseFloat(d.amount)>0,render:({data:d,setData:sd})=><div className="f-euro"><input autoFocus type="number" step="0.01" min="0" className="field" placeholder="0.00" value={d.amount||''} onChange={e=>sd({...d,amount:e.target.value})}/></div>},
    {label:'Kategorie',ok:d=>!!d.cat,render:({data:d,setData:sd})=>(
      <div className="cat-grid">
        {CATS.map(c=><button key={c} className={`cat-btn${d.cat===c?' on':''}`} onClick={()=>sd({...d,cat:c})}>{c}</button>)}
      </div>
    )},
    {label:'Für wen?',ok:d=>!!d.userId,render:({data:d,setData:sd})=>(
      <div className="pick">
        {users.map(u=><button key={u.id} className={`pick-btn${d.userId===u.id?' on':''}`} style={{background:u.color}} onClick={()=>sd({...d,userId:u.id})}>{u.name}</button>)}
      </div>
    )},
  ];
  const fixSteps=[
    {label:'Bezeichnung',ok:d=>d.name?.trim(),render:({data:d,setData:sd})=><input autoFocus className="field" placeholder="Miete, Strom, Internet …" value={d.name||''} onChange={e=>sd({...d,name:e.target.value})}/>},
    {label:'Betrag',ok:d=>parseFloat(d.amount)>0,render:({data:d,setData:sd})=><div className="f-euro"><input autoFocus type="number" step="0.01" min="0" className="field" placeholder="0.00" value={d.amount||''} onChange={e=>sd({...d,amount:e.target.value})}/></div>},
    {label:'Häufigkeit',ok:d=>!!d.freq,render:({data:d,setData:sd})=>(
      <div className="pick">
        {[['m','Monatlich'],['y','Jährlich']].map(([v,l])=>(
          <button key={v} className={`pick-btn${d.freq===v?' on':''}`} style={{background:'var(--violet)'}} onClick={()=>sd({...d,freq:v})}>{l}</button>
        ))}
      </div>
    )},
  ];

  return (
    <div className="screen">
      <NBar title="Finanzen" color="var(--violet)" status={status}/>
      <div className="scroll">
        <div className="content">
          <div className="seg rise">
            {users.map(u=><button key={u.id} className={`seg-btn${uid_===u.id?' on':''}`} style={uid_===u.id?{color:u.color}:{}} onClick={()=>setUid_(u.id)}>{u.name}</button>)}
          </div>
          <div className="summary rise" style={{animationDelay:'40ms'}}>
            <div className="sum-row">
              {[['Einnahmen',inc,'var(--green)'],['Ausgaben',exp,'var(--red)'],['Bilanz',inc-exp,inc-exp>=0?'var(--label)':'var(--red)']].map(([l,v,c])=>(
                <div key={l} className="sum-col">
                  <span className="sum-lbl">{l}</span>
                  <span className="sum-val" style={{color:c,fontSize:16}}>{v<0?'-':''}€{fmtK(Math.abs(v))}</span>
                </div>
              ))}
            </div>
            {fixMo>0&&(
              <div style={{borderTop:'1px solid var(--sep)',padding:'10px 0',textAlign:'center',fontSize:13,color:'var(--label2)'}}>
                Fixkosten/Mo. <span className="num" style={{color:'var(--violet)',fontWeight:700}}>€{fmt(fixMo)}</span>
                {'  ·  '}verfügbar <span className="num" style={{color:avail>=0?'var(--green)':'var(--red)',fontWeight:700}}>€{fmt(avail)}</span>
              </div>
            )}
          </div>
          <div className="seg rise" style={{animationDelay:'80ms'}}>
            {[['txs','💳 Buchungen'],['fix','📌 Fixkosten']].map(([v,l])=>(
              <button key={v} className={`seg-btn${seg===v?' on':''}`} onClick={()=>setSeg(v)}>{l}</button>
            ))}
          </div>
          {seg==='txs'?(
            <>
              <button className="btn" style={{background:'var(--violet)'}} onClick={()=>setWiz('tx')}>+ Buchung</button>
              {myTxs.length===0
                ?<div className="empty"><div className="empty-ico">💳</div><span style={{fontSize:14,color:'var(--label2)'}}>Noch keine Buchungen</span></div>
                :(
                  <div className="group">
                    {myTxs.map(t=>(
                      <div key={t.id} className="cell">
                        <div className="cell-icon" style={{background:t.type==='inc'?'rgba(74,222,128,.13)':'rgba(251,113,133,.13)',fontSize:15}}>
                          {t.type==='inc'?'📈':'📉'}
                        </div>
                        <div className="cell-content">
                          <span className="cell-title">{t.category}</span>
                          <span className="cell-sub">{t.date}</span>
                        </div>
                        <span className="num" style={{fontWeight:700,fontSize:16,color:t.type==='inc'?'var(--green)':'var(--red)'}}>
                          {t.type==='inc'?'+':'-'}€{fmt(t.amount)}
                        </span>
                        <button className="del-btn" aria-label="Buchung löschen" title="Buchung löschen" onClick={()=>set('ft',txs.filter(x=>x.id!==t.id))}>×</button>
                      </div>
                    ))}
                  </div>
                )
              }
            </>
          ):(
            <>
              <button className="btn" style={{background:'var(--violet)'}} onClick={()=>setWiz('fix')}>+ Fixkosten</button>
              {fixed.length===0
                ?<div className="empty"><div className="empty-ico">📌</div><span style={{fontSize:14,color:'var(--label2)'}}>Noch keine Fixkosten</span></div>
                :(
                  <div className="group">
                    {fixed.map(f=>(
                      <div key={f.id} className="cell">
                        <div className="cell-icon" style={{background:'rgba(196,181,253,.13)',fontSize:15}}>📌</div>
                        <div className="cell-content">
                          <span className="cell-title">{f.name}</span>
                          <span className="cell-sub">{f.freq==='m'?'Monatlich':'Jährlich'}</span>
                        </div>
                        <div style={{textAlign:'right',flexShrink:0}}>
                          <div className="num" style={{fontSize:15,fontWeight:700}}>€{fmt(f.amount)}</div>
                          {f.freq==='y'&&<div className="num" style={{fontSize:11,color:'var(--label3)'}}>€{fmt(f.amount/12)}/Mo.</div>}
                        </div>
                        <button className="del-btn" aria-label="Fixkosten löschen" title="Fixkosten löschen" onClick={()=>set('ff',fixed.filter(x=>x.id!==f.id))}>×</button>
                      </div>
                    ))}
                  </div>
                )
              }
            </>
          )}
        </div>
      </div>
      <Wiz open={wiz==='tx'}  onClose={()=>setWiz(null)} title="Buchung"   color="var(--violet)" steps={txSteps}  onFinish={addTx}/>
      <Wiz open={wiz==='fix'} onClose={()=>setWiz(null)} title="Fixkosten" color="var(--violet)" steps={fixSteps} onFinish={addFix}/>
    </div>
  );
}

/* ══════════════════════════
   ABOS
══════════════════════════ */
function Abos() {
  const { D, set, status } = useD();
  const subs=D.ab||[];
  const [wiz,setWiz] = useState(false);

  const EMS=['📱','🎵','🎬','🎮','💻','📰','🛒','☁️','🏋️','📚','🧠','🔒'];
  const CLS=['#38bdf8','#4ade80','#818cf8','#fbbf24','#fb7185','#ec4899','#c4b5fd','#5eead4','#facc15','#a3e635'];

  const pct = s=>{ const d=Math.floor((Date.now()-new Date(s.sd))/86400000),p=s.iv==='m'?30:365; return (d%p)/p*100; };
  const dlf = s=>{ const d=Math.floor((Date.now()-new Date(s.sd))/86400000),p=s.iv==='m'?30:365; return p-(d%p); };
  const moTotal=subs.reduce((s,sub)=>s+(sub.iv==='m'?sub.price:sub.price/12),0);

  const add = d => set('ab',[{id:uid(),name:d.name||'Abo',price:parseFloat(d.price)||0,iv:d.iv||'m',em:d.em||'📱',cl:d.cl||'#818cf8',sd:new Date().toISOString().split('T')[0]},...subs]);

  const steps=[
    {label:'Name des Abos?',ok:d=>d.name?.trim(),render:({data:d,setData:sd})=><input autoFocus className="field" placeholder="Netflix, Spotify, iCloud …" value={d.name||''} onChange={e=>sd({...d,name:e.target.value})}/>},
    {label:'Preis & Intervall',ok:d=>parseFloat(d.price)>0,render:({data:d,setData:sd})=>(
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        <div className="f-euro"><input autoFocus type="number" step="0.01" min="0" className="field" placeholder="0.00" value={d.price||''} onChange={e=>sd({...d,price:e.target.value})}/></div>
        <div className="seg">
          {[['m','Monatlich'],['y','Jährlich']].map(([v,l])=>(
            <button key={v} className={`seg-btn${d.iv===v?' on':''}`} onClick={()=>sd({...d,iv:v})}>{l}</button>
          ))}
        </div>
      </div>
    )},
    {label:'Symbol & Farbe',render:({data:d,setData:sd})=>(
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        <div className="emoji-grid">{EMS.map(e=><button key={e} className={`emoji-btn${d.em===e?' on':''}`} onClick={()=>sd({...d,em:e})}>{e}</button>)}</div>
        <div className="color-row">{CLS.map(c=><button key={c} className={`color-btn${d.cl===c?' on':''}`} style={{background:c,color:c}} onClick={()=>sd({...d,cl:c})}/>)}</div>
      </div>
    )},
  ];

  return (
    <div className="screen">
      <NBar title="Abos" color="var(--indigo)" status={status}/>
      <div className="scroll">
        <div className="content">
          {subs.length>0&&(
            <div className="hero rise" style={{'--glow':'rgba(129,140,248,.15)'}}>
              <div className="hero-lbl">Pro Monat</div>
              <div className="hero-big" style={{color:'var(--indigo)',margin:'6px 0 4px'}}>€<CountUp value={moTotal}/></div>
              <div style={{fontSize:12.5,color:'var(--label3)',fontWeight:500}}>€{fmt(moTotal*12)} pro Jahr · {subs.length} {subs.length===1?'Abo':'Abos'}</div>
            </div>
          )}
          <button className="btn rise" style={{background:'var(--indigo)',color:'#0a120c',animationDelay:'50ms'}} onClick={()=>setWiz(true)}>+ Abo hinzufügen</button>
          {subs.length===0
            ?<div className="empty"><div className="empty-ico">🔄</div><span style={{fontSize:14,color:'var(--label2)'}}>Noch keine Abos</span></div>
            :(
              <>
                <div className="sub-grid rise" style={{animationDelay:'100ms'}}>
                  {subs.map(s=>{
                    const p=pct(s),dl=dlf(s);
                    return(
                      <div key={s.id} className="sub-card" onContextMenu={e=>{e.preventDefault();confirm(`"${s.name}" löschen?`)&&set('ab',subs.filter(x=>x.id!==s.id))}}>
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:2}}>
                          <span style={{fontSize:24,lineHeight:1}}>{s.em}</span>
                          <span className="num" style={{fontSize:9,color:'var(--label3)',letterSpacing:'.2em'}}>{s.iv==='m'?'MTL':'JÄHR'}</span>
                        </div>
                        <div style={{fontSize:14,fontWeight:700,color:'var(--label)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',marginBottom:2}}>{s.name}</div>
                        <div className="num" style={{fontSize:19,fontWeight:700,color:s.cl,marginBottom:10}}>€{fmt(s.price)}</div>
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                          <div>
                            <div className="num" style={{fontSize:11,fontWeight:700,color:s.cl}}>{dl}d</div>
                            <div style={{fontSize:10,color:'var(--label3)'}}>übrig</div>
                          </div>
                          <Ring pct={p} size={52} sw={4} color={s.cl}>
                            <span className="num" style={{fontSize:10,fontWeight:700,color:'var(--label)'}}>{Math.round(p)}%</span>
                          </Ring>
                        </div>
                        <div className="sub-bar-bg"><div className="sub-bar" style={{width:`${p}%`,background:s.cl}}/></div>
                      </div>
                    );
                  })}
                </div>
                <div style={{textAlign:'center',fontSize:11,color:'var(--label4)'}}>Lang drücken zum Löschen</div>
              </>
            )
          }
        </div>
      </div>
      <Wiz open={wiz} onClose={()=>setWiz(false)} title="Neues Abo" color="var(--indigo)" steps={steps} onFinish={add}/>
    </div>
  );
}

/* ══════════════════════════
   EINSTELLUNGEN
══════════════════════════ */
function Einstellungen() {
  const { D, set, status, online, fbCfg, setFbCfg, wgCode, setWgCode, mods, setMods, replaceData, me, setMe } = useD();
  const users=D.users;
  const [cfgText,  setCfgText]  = useState(fbCfg ? JSON.stringify(fbCfg, null, 2) : '');
  const [codeInput,setCodeInput]= useState('');
  const [copied,   setCopied]   = useState(false);
  const [cfgErr,   setCfgErr]   = useState('');
  const [showSetup,setShowSetup]= useState(!fbCfg);
  const [importErr,setImportErr]= useState('');
  const fileInputRef = useRef(null);

  const hasLocalData = (D.hs?.length||0)+(D.gi?.length||0)+(D.ft?.length||0)+(D.ff?.length||0)+(D.ab?.length||0)+(D.pt?.length||0)+(D.sl?.length||0) > 0;

  const saveCfg = () => {
    setCfgErr('');
    try {
      const parsed = JSON.parse(cfgText.trim());
      if (!parsed.databaseURL) { setCfgErr('databaseURL fehlt im Config-Objekt.'); return; }
      if (!parsed.apiKey)      { setCfgErr('apiKey fehlt im Config-Objekt.'); return; }
      setFbCfg(parsed);
      setShowSetup(false);
    } catch {
      setCfgErr('Kein gültiges JSON. Bitte das gesamte Config-Objekt einfügen.');
    }
  };

  const joinCode = () => {
    const c = codeInput.trim().toUpperCase();
    if (!c) return;
    if (hasLocalData) {
      const choice = window.prompt(
        `Du hast bereits Daten auf diesem Gerät.\n\nWas soll passieren?\n  "m" = Mergen (beides behalten)\n  "r" = Remote nimmt alles (lokale Daten ÜBERSCHRIEBEN)\n  Leer/Abbruch = nichts tun`,
        'm'
      );
      if (!choice) return;
      if (choice.toLowerCase().startsWith('m')) {
        sessionStorage.setItem('wg_join_mode','merge');
      } else if (choice.toLowerCase().startsWith('r')) {
        sessionStorage.setItem('wg_join_mode','remote');
      } else { return; }
    } else {
      sessionStorage.setItem('wg_join_mode','remote');
    }
    setWgCode(c);
    setCodeInput('');
  };

  /* Export */
  const exportData = () => {
    const payload = { _v:1, exportedAt:new Date().toISOString(), data:D };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `wg-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  };

  /* Import */
  const importFile = (file) => {
    setImportErr('');
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const parsed = JSON.parse(e.target.result);
        const payload = parsed?.data ? parsed.data : parsed;
        if (typeof payload !== 'object' || !payload) throw new Error('invalid');
        if (!confirm('Import überschreibt alle aktuellen Daten. Fortfahren?')) return;
        replaceData(payload);
      } catch {
        setImportErr('Datei ist kein gültiges Backup-JSON.');
      }
    };
    reader.readAsText(file);
  };

  const copyCode = () => {
    navigator.clipboard?.writeText(wgCode).catch(()=>{});
    setCopied(true);
    setTimeout(()=>setCopied(false), 2000);
  };

  const statusColor  = !online?'var(--amber)':status==='synced'?'var(--lime)':status==='connecting'?'var(--amber)':status==='error'?'var(--red)':'var(--label3)';
  const statusLabel  = !online ? 'Offline (lokal speichern, sync wenn online)' : {local:'Nur lokal',connecting:'Verbinde …',synced:'Live synchronisiert ✓',error:'Verbindungsfehler'}[status];

  return (
    <div className="screen">
      <NBar title="Mehr" color="var(--label)" status={status}/>
      <div className="scroll"><div className="content">

        {/* Sync Status */}
        <div className="rise">
          <div className="section-hdr">Sync-Status</div>
          <div className="group">
            <div className="cell">
              <div style={{width:10,height:10,borderRadius:'50%',background:statusColor,boxShadow:`0 0 10px ${statusColor}`,flexShrink:0}}/>
              <div className="cell-content">
                <span className="cell-title" style={{color:statusColor,fontSize:15}}>{statusLabel}</span>
                {status!=='local'&&<span className="cell-sub">WG-Code: {wgCode}</span>}
              </div>
            </div>
          </div>
        </div>

        {/* WG Code sharing */}
        {fbCfg&&(
          <div className="rise" style={{animationDelay:'40ms'}}>
            <div className="section-hdr">WG-Code teilen</div>
            <div className="group">
              <div className="cell">
                <div className="cell-content">
                  <span className="cell-title num" style={{letterSpacing:'.05em',fontSize:19,fontWeight:700,color:'var(--lime)'}}>{wgCode}</span>
                  <span className="cell-sub">Diesen Code auf dem anderen Gerät eingeben</span>
                </div>
                <button onClick={copyCode} style={{background:'none',border:'none',color:copied?'var(--green)':'var(--mint)',fontSize:13,fontWeight:700,flexShrink:0}}>
                  {copied?'Kopiert ✓':'Kopieren'}
                </button>
              </div>
              <div className="cell" style={{gap:8}}>
                <input className="field" style={{flex:1,padding:'10px 12px',fontSize:15}} placeholder="Anderen Code eingeben …"
                  value={codeInput} onChange={e=>setCodeInput(e.target.value.toUpperCase())}/>
                <button onClick={joinCode} style={{background:'var(--mint)',border:'none',borderRadius:11,padding:'11px 14px',color:'#0a120c',fontSize:14,fontWeight:800,flexShrink:0}}>
                  Beitreten
                </button>
              </div>
            </div>
            <div className="section-ftr">⚠️ Beim Beitreten kannst du wählen: mergen oder überschreiben.</div>
          </div>
        )}

        {/* Firebase Setup */}
        <div className="rise" style={{animationDelay:'80ms'}}>
          <div className="section-hdr" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <span>Firebase {fbCfg?'(konfiguriert)':'einrichten'}</span>
            {fbCfg&&<button style={{background:'none',border:'none',color:'var(--mint)',fontSize:13,fontWeight:600,fontFamily:'Hanken Grotesk'}} onClick={()=>setShowSetup(!showSetup)}>{showSetup?'Schließen':'Ändern'}</button>}
          </div>

          {(!fbCfg||showSetup)&&(
            <div className="setup-card" style={{display:'flex',flexDirection:'column',gap:14}}>
              <div>
                <div style={{fontSize:13,fontWeight:700,color:'var(--label)',marginBottom:10}}>Firebase-Projekt erstellen (kostenlos, 2 Min.)</div>
                {[
                  ['console.firebase.google.com öffnen','Neues Projekt anlegen → beliebiger Name → Weiter'],
                  ['Realtime Database aktivieren','Build → Realtime Database → Datenbank erstellen → „Im Testmodus starten"'],
                  ['Web-App hinzufügen','Projekteinstellungen (⚙️) → App hinzufügen → Web → Config-Objekt kopieren'],
                  ['Hier einfügen','Das gesamte JSON-Objekt unten einfügen'],
                ].map(([title,desc],i)=>(
                  <div key={i} className="setup-step">
                    <div className="step-num">{i+1}</div>
                    <div>
                      <div style={{fontSize:13,fontWeight:700,color:'var(--label)'}}>{title}</div>
                      <div style={{fontSize:12,color:'var(--label3)',marginTop:2,lineHeight:1.5}}>{desc}</div>
                    </div>
                  </div>
                ))}
              </div>
              <textarea
                style={{width:'100%',background:'var(--bg3)',border:'none',borderRadius:11,padding:'12px',fontSize:12,color:'var(--label)',fontFamily:'var(--mono)',lineHeight:1.6,minHeight:140,resize:'vertical'}}
                placeholder={'{\n  "apiKey": "AIza…",\n  "databaseURL": "https://…",\n  "projectId": "…"\n}'}
                value={cfgText} onChange={e=>setCfgText(e.target.value)}
              />
              {cfgErr&&<div style={{fontSize:12,color:'var(--red)'}}>{cfgErr}</div>}
              <button className="btn" style={{background:cfgText.trim()?'var(--lime)':'var(--bg3)',color:cfgText.trim()?'#0a120c':'var(--label3)'}} onClick={saveCfg}>
                Verbinden
              </button>
              {fbCfg&&(
                <button style={{background:'none',border:'none',color:'var(--red)',fontSize:14,fontWeight:600}} onClick={()=>{setFbCfg(null);setCfgText('');setShowSetup(false);}}>
                  Firebase trennen
                </button>
              )}
            </div>
          )}
          {fbCfg&&!showSetup&&(
            <div className="group">
              <div className="cell">
                <div className="cell-icon" style={{background:'rgba(163,230,53,.12)',fontSize:16}}>🔥</div>
                <div className="cell-content">
                  <span className="cell-title">Verbunden</span>
                  <span className="cell-sub">{fbCfg.projectId}</span>
                </div>
                <span style={{fontSize:12,color:'var(--green)',fontWeight:700}}>Aktiv</span>
              </div>
            </div>
          )}
        </div>

        {/* Module sichtbar */}
        <div className="rise" style={{animationDelay:'120ms'}}>
          <div className="section-hdr">Module anzeigen</div>
          <div className="group">
            {[['haus','Haushalt','var(--mint)'],['grow','Growbox','var(--lime)'],['putz','Putzplan','var(--amber)'],['fin','Finanzen','var(--violet)'],['abos','Abos','var(--indigo)']].map(([k,label,c])=>(
              <div key={k} className="cell">
                <div style={{width:10,height:10,borderRadius:'50%',background:c,boxShadow:mods[k]?`0 0 8px ${c}`:'none',opacity:mods[k]?1:.35,flexShrink:0}}/>
                <div className="cell-content">
                  <span className="cell-title">{label}</span>
                </div>
                <button onClick={()=>setMods({...mods,[k]:!mods[k]})}
                  style={{background:mods[k]?c:'var(--bg3)',color:mods[k]?'#0a120c':'var(--label2)',border:'none',borderRadius:14,padding:'7px 16px',fontSize:13,fontWeight:800}}>
                  {mods[k]?'An':'Aus'}
                </button>
              </div>
            ))}
          </div>
          <div className="section-ftr">Mindestens ein Modul muss aktiv sein.</div>
        </div>

        {/* Backup / Restore */}
        <div className="rise" style={{animationDelay:'160ms'}}>
          <div className="section-hdr">Backup</div>
          <div className="group">
            <div className="cell" style={{cursor:'pointer'}} onClick={exportData}>
              <div className="cell-icon" style={{background:'rgba(74,222,128,.12)',fontSize:15}}>⬇️</div>
              <div className="cell-content">
                <span className="cell-title">Als JSON exportieren</span>
                <span className="cell-sub">Lädt eine Backup-Datei herunter</span>
              </div>
            </div>
            <div className="cell" style={{cursor:'pointer'}} onClick={()=>fileInputRef.current?.click()}>
              <div className="cell-icon" style={{background:'rgba(94,234,212,.12)',fontSize:15}}>⬆️</div>
              <div className="cell-content">
                <span className="cell-title">Backup importieren</span>
                <span className="cell-sub">Überschreibt aktuelle Daten</span>
              </div>
            </div>
          </div>
          <input ref={fileInputRef} type="file" accept="application/json,.json" style={{display:'none'}}
            onChange={e=>{importFile(e.target.files?.[0]); e.target.value='';}}/>
          {importErr&&<div className="section-ftr" style={{color:'var(--red)'}}>{importErr}</div>}
        </div>

        {/* Persons */}
        <div className="rise" style={{animationDelay:'200ms'}}>
          <div className="section-hdr">Personen</div>
          <div className="group">
            {users.map(u=>(
              <div key={u.id} className="cell">
                <div style={{width:10,height:10,borderRadius:'50%',background:u.color,boxShadow:`0 0 8px ${u.color}`,flexShrink:0}}/>
                <input className="field" style={{background:'transparent',border:'none',padding:0,fontSize:16,fontWeight:600,flex:1}}
                  value={u.name} onChange={e=>set('users',users.map(x=>x.id===u.id?{...x,name:e.target.value}:x))}/>
                <button onClick={()=>setMe(u.id)}
                  style={{background:me===u.id?u.color:'var(--bg3)',color:me===u.id?'#0a120c':'var(--label3)',border:'none',borderRadius:12,padding:'7px 12px',fontSize:12,fontWeight:800,flexShrink:0}}>
                  {me===u.id?'Das bin ich ✓':'Das bin ich'}
                </button>
              </div>
            ))}
          </div>
          <div className="section-ftr">„Das bin ich" gilt nur für dieses Gerät — Einträge auf der Einkaufsliste werden damit automatisch dir zugeordnet.</div>
        </div>

        {/* iPhone install */}
        <div className="rise" style={{animationDelay:'240ms'}}>
          <div className="section-hdr">Zum Homescreen</div>
          <div className="group">
            {[['1','Safari öffnen'],['2','Teilen □↑'],['3','"Zum Home-Bildschirm"'],['4','Startet wie eine native App']].map(([n,t])=>(
              <div key={n} className="cell" style={{minHeight:44,padding:'10px 16px'}}>
                <span className="num" style={{fontSize:12,color:'var(--label3)',width:16,flexShrink:0}}>{n}</span>
                <span className="cell-title" style={{fontSize:14.5}}>{t}</span>
              </div>
            ))}
          </div>
        </div>

        <button style={{width:'100%',height:50,border:'1px solid rgba(251,113,133,.25)',borderRadius:16,background:'rgba(251,113,133,.06)',color:'var(--red)',fontSize:15,fontWeight:700}}
            onClick={()=>{if(confirm('Alle lokalen Daten löschen?')){['wg_data','fb_cfg','wg_code','wg_modules','wg_me'].forEach(k=>localStorage.removeItem(k));window.location.reload();}}}>
          Alle lokalen Daten löschen
        </button>

      </div></div>
    </div>
  );
}

/* ══════════════════════════
   APP ROOT
══════════════════════════ */
const TABS=[
  {id:'haus',label:'Haushalt',color:'var(--mint)',  icon:ICONS.house   },
  {id:'grow',label:'Growbox', color:'var(--lime)',  icon:ICONS.leaf    },
  {id:'putz',label:'Putzplan',color:'var(--amber)', icon:ICONS.sparkle },
  {id:'fin', label:'Finanzen',color:'var(--violet)',icon:ICONS.wallet  },
  {id:'abos',label:'Abos',    color:'var(--indigo)',icon:ICONS.repeat  },
  {id:'set', label:'Mehr',    color:'rgba(242,246,243,.35)', icon:ICONS.settings},
];

function AppInner() {
  const { mods, remotePulse } = useD();
  const visibleTabs = TABS.filter(t => t.id==='set' || mods[t.id] !== false);
  const [tab,setTab] = useState(() => visibleTabs[0]?.id || 'set');
  const [toast,setToast] = useState(false);
  // Wenn der aktive Tab versteckt wird, auf ersten sichtbaren springen
  useEffect(() => {
    if (!visibleTabs.find(t=>t.id===tab)) setTab(visibleTabs[0]?.id || 'set');
  }, [mods]);
  // Live-Toast wenn Änderung vom anderen Gerät reinkommt
  useEffect(() => {
    if (remotePulse === 0) return;
    setToast(true);
    const t = setTimeout(()=>setToast(false), 2800);
    return () => clearTimeout(t);
  }, [remotePulse]);
  return (
    <>
      {tab==='haus'&&<Haushalt/>}
      {tab==='grow'&&<Grow/>}
      {tab==='putz'&&<Putzplan/>}
      {tab==='fin' &&<Finanzen/>}
      {tab==='abos'&&<Abos/>}
      {tab==='set' &&<Einstellungen/>}
      {toast&&(
        <div className="toast">
          <Ic d={ICONS.bolt} color="var(--lime)" size={14} sw={2.2}/>
          Live aktualisiert — neuer Eintrag vom anderen Gerät
        </div>
      )}
      <div className="tabbar">
        {visibleTabs.map(t=>(
          <button key={t.id} className="tabitem" onClick={()=>setTab(t.id)} style={{color:tab===t.id?t.color:'rgba(242,246,243,.32)'}}>
            {tab===t.id&&<div className="tab-glow"/>}
            <Ic d={t.icon} color={tab===t.id?t.color:'rgba(242,246,243,.32)'} size={23} sw={tab===t.id?2.1:1.6}/>
            <span>{t.label}</span>
          </button>
        ))}
      </div>
    </>
  );
}

function App() {
  return (
    <DataProvider>
      <AppInner/>
    </DataProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
