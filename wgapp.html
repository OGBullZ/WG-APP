function AppInner() {
  const { mods, remotePulse, D, me } = useD();
  const visibleTabs = TABS.filter(t => t.id==='set' || mods[t.id] !== false);
  const [tab,setTab_] = useState(() => {
    const saved = ls('wg_tab', null); // letzten Tab merken
    return (saved && (saved==='set' || mods[saved] !== false)) ? saved : (visibleTabs[0]?.id || 'set');
  });
  const [dir,setDir] = useState(1); // Slide-Richtung: +1 neuer Tab rechts, -1 links
  const idxOf = (id) => TABS.findIndex(t => t.id===id);
  const setTab = (id) => { setDir(idxOf(id) >= idxOf(tab) ? 1 : -1); setTab_(id); ss('wg_tab', id); };
  const [toast,setToast] = useState(false);
  // Start-Flow (max. 1× pro Woche, nicht bei jedem Öffnen): erst PayPal einrichten (falls kein Handle),
  // danach der offene Schuldbetrag groß (idiotensicher) — beide mit „Später"-Option.
  const [debtInfo,setDebtInfo] = useState(null);
  const [startStep,setStartStep] = useState(null); // 'pp' | 'debt' | null
  const startShownRef = useRef(false);
  useEffect(() => {
    if (startShownRef.current) return;
    if (!me || !(D.users||[]).length) return;
    // kurz warten, bis der initiale RTDB-Sync durch ist → Flow nutzt den frischesten Stand
    const t = setTimeout(() => {
      if (startShownRef.current) return;
      startShownRef.current = true;
      const last = ls('wg_start_shown', null);
      if (last && daysSince(last) < 7) return;            // diese Woche schon dran → nichts
      const meUser = (D.users||[]).find(u=>u.id===me);
      const needsPP = meUser && !ppHandle(meUser.pp);
      const bal = myBalance(D, me, mods);
      const hasDebt = bal.total < -0.01;
      if (!needsPP && !hasDebt) return;                    // nichts zu zeigen → Marker NICHT setzen
      ss('wg_start_shown', todayISO());                    // Wochen-Sperre erst ab dem Moment, wo etwas gezeigt wurde
      if (hasDebt) setDebtInfo(bal);
      setStartStep(needsPP ? 'pp' : 'debt');
    }, 700);
    return () => clearTimeout(t);
  }, [me, D, mods]);
  // Wenn der aktive Tab versteckt wird, auf ersten sichtbaren springen
  useEffect(() => {
    if (!visibleTabs.find(t=>t.id===tab)) setTab(visibleTabs[0]?.id || 'set');
  }, [mods]);
  // Lokale Erinnerungen: einmal pro Tag beim Öffnen — überfällige Putzaufgaben & bald fällige Abos
  useEffect(() => {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    if (ls('wg_notify','off') !== 'on') return;
    const today = todayISO();
    if (ls('wg_notify_last', null) === today) return;
    const timer = setTimeout(() => {
      const tasks = D.pt || [], subs = D.ab || [];
      const parseIso = s => { const [y,m,dd]=String(s).split('-').map(Number); return new Date(y,m-1,dd); };
      const todayMid = new Date(); todayMid.setHours(0,0,0,0);
      const dueIn = t => { if(!t.lastDone) return 0; const due=parseIso(t.lastDone); due.setDate(due.getDate()+(t.interval||7)); return Math.round((due-todayMid)/86400000); };
      const due  = (mods.putz!==false) ? tasks.filter(t=>dueIn(t)<=0) : [];
      const soon = (mods.abos!==false) ? subs.filter(s=>{ const d=daysSince(s.sd),p=s.iv==='m'?30:365; return (p-(d%p))<=3; }) : [];
      const msgs = [];
      if (due.length)  msgs.push(`🧹 ${due.length} Putzaufgabe${due.length>1?'n':''} fällig: ${due.slice(0,3).map(t=>t.name).join(', ')}`);
      if (soon.length) msgs.push(`🔄 ${soon.length} Abo${soon.length>1?'s':''} bald fällig: ${soon.slice(0,3).map(s=>s.name).join(', ')}`);
      if (msgs.length) { ss('wg_notify_last', today); showLocalNote('WG — Erinnerung', msgs.join('\n')); }
    }, 4000);
    return () => clearTimeout(timer);
  }, [D, mods]);
  // Live-Toast wenn Änderung vom anderen Gerät reinkommt
  useEffect(() => {
    if (remotePulse === 0) return;
    setToast(true);
    const t = setTimeout(()=>setToast(false), 2800);
    return () => clearTimeout(t);
  }, [remotePulse]);
  return (
    <>
      <div key={tab} className={`tab-view ${dir>=0?'tab-in-r':'tab-in-l'}`}>
        {/* Seitenüberschrift: das Dokument hatte bisher gar keine Überschrift —
            Screenreader konnten nicht sagen, welcher Bereich offen ist. */}
        <h1 className="sr-only">{(TABS.find(t=>t.id===tab)||{}).label || 'WG'}</h1>
        {tab==='haus'&&<Haushalt goGrow={()=>setTab('grow')}/>}
        {tab==='grow'&&<Grow/>}
        {tab==='putz'&&<Putzplan/>}
        {tab==='fin' &&<Finanzen/>}
        {tab==='abos'&&<Abos/>}
        {tab==='stats'&&<Statistik/>}
        {tab==='set' &&<Einstellungen/>}
      </div>
      {toast&&(
        <div className="toast">
          <Ic d={ICONS.bolt} color="var(--lime)" size={14} sw={2.2}/>
          Live aktualisiert — neuer Eintrag vom anderen Gerät
        </div>
      )}
      <GlobalUI/>
      {startStep==='pp' && <PayPalSetup onClose={()=>setStartStep(debtInfo ? 'debt' : null)}/>}
      {startStep==='debt' && debtInfo && <DebtAlert info={debtInfo} onClose={()=>setStartStep(null)}/>}
      <div className="tabbar">
        {visibleTabs.map(t=>(
          <button key={t.id} className={`tabitem${tab===t.id?' on':''}`} aria-current={tab===t.id?'page':undefined}
            onClick={()=>setTab(t.id)} style={{color:tab===t.id?t.color:'var(--label3)'}}>
            {tab===t.id&&<div className="tab-glow"/>}
            <Ic d={t.icon} color={tab===t.id?t.color:'var(--label3)'} size={23} sw={tab===t.id?2.1:1.6}/>
            <span>{t.label}</span>
          </button>
        ))}
      </div>
    </>
  );
}

function App() {
  return (
    <DataProvider>
      <AppInner/>
    </DataProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
/* ── JSX-Compile-Cache ───────────────────────────────────────────────────────
   Der App-Code oben ist JSX und musste bisher bei JEDEM Start von
   @babel/standalone (2,8 MB) im Browser übersetzt werden. Gemessen mit 4× CPU-
   Drosselung (≈ Mittelklasse-Handy): 11,6 s bis die App bedienbar war, davon
   9,6 s ein einziger Long-Task (Babel-Parse + Transform).

   Jetzt: einmal übersetzen, Ergebnis unter einem Hash des Quelltexts in
   localStorage legen und beim nächsten Start direkt ausführen — Babel wird dann
   gar nicht erst geladen. Ändert sich der Quelltext (Deploy), ändert sich der
   Hash → automatisch neu übersetzt, kein Bump von Hand nötig.
   Kein Build-Schritt, die Datei bleibt weiterhin allein lauffähig. */
(function () {
  var src = document.getElementById('jsx-src').textContent;
  // FNV-1a über den Quelltext (~10 ms) — Cache-Schlüssel, damit alter Code nie überlebt
  var h = 2166136261;
  for (var i = 0; i < src.length; i++) { h ^= src.charCodeAt(i); h = Math.imul(h, 16777619); }
  var KEY = 'wg_jsx_' + (h >>> 0).toString(36) + '_' + src.length;

  function run(code) {
    var s = document.createElement('script');
    s.text = code + '\n//# sourceURL=wgapp-jsx.js';
    document.head.appendChild(s);
  }

  var cached = null;
  try { cached = localStorage.getItem(KEY); } catch (e) {}
  if (cached) {
    run(cached);
    // Selbstheilung: sollte das Kompilat im Speicher je beschädigt sein, rendert nichts.
    // Dann Cache wegwerfen und EINMAL pro Sitzung neu laden (kein Reload-Kreisel).
    setTimeout(function () {
      if (document.getElementById('root').firstChild) return;
      try {
        if (sessionStorage.getItem('wg_jsx_healed')) return;
        sessionStorage.setItem('wg_jsx_healed', '1');
        localStorage.removeItem(KEY);
      } catch (e) { return; }
      location.reload();
    }, 5000);
    return;
  }

  // Quelltext hat sich geändert → alte Kompilate wegräumen (sonst wächst der Speicher)
  try {
    Object.keys(localStorage).forEach(function (k) { if (k.indexOf('wg_jsx_') === 0) localStorage.removeItem(k); });
  } catch (e) {}

  var b = document.createElement('script');
  b.src = 'https://unpkg.com/@babel/standalone@7.25.6/babel.min.js';
  b.onload = function () {
    var code;
    try {
      // exakt die Optionen, die babel-standalone für <script type="text/babel"> nutzt
      // (nur ohne inline-sourcemap — die verdoppelt das Kompilat im Cache)
      code = Babel.transform(src, {
        filename: 'wgapp.jsx',
        presets: ['react', 'env'],
        plugins: ['transform-class-properties', 'transform-object-rest-spread', 'transform-flow-strip-types'],
        sourceMaps: false
      }).code;
    } catch (err) { console.error('JSX-Transform fehlgeschlagen', err); return; }
    try { localStorage.setItem(KEY, code); } catch (e) {}   // voller Speicher: läuft trotzdem, nur ohne Cache
    run(code);
  };
  b.onerror = function () {
    document.getElementById('root').innerHTML =
      '<div style="padding:48px 24px;text-align:center;font-family:system-ui;color:#f2f6f3">' +
      '<div style="font-size:34px">📡</div><p style="opacity:.7;line-height:1.6">' +
      'App konnte nicht geladen werden.<br>Einmal mit Internet öffnen, danach läuft sie wieder offline.</p></div>';
  };
  document.head.appendChild(b);
})();
</script>
<script>
/* Service Worker: App offline-fähig nach erstem Laden (Shell + CDN-Libs gecacht) */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
