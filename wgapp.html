/* Aufklappbare Gruppe (Mehr): Zustand je Gerät; `alert` = roter Punkt + automatisch offen (Backup-/Fehler-Warnung).
   Inhalt bleibt gerendert (nur versteckt), damit Zustände darin (z. B. Push-Abfrage) nicht bei jedem Aufklappen neu starten. */
function Fold({ id, title, sub, alert, children }) {
  const [open,setOpen] = useState(()=>!!ls('wg_fold_'+id, false));
  const [dismissed,setDismissed] = useState(false);   // Warnung gesehen und bewusst zugeklappt
  const shown = open || (!!alert && !dismissed);
  const toggle = () => { const v = !shown; if (!v && alert) setDismissed(true); if (v) setDismissed(false); setOpen(v); ss('wg_fold_'+id, v); };
  return (
    <div className="rise" data-fold={id}>
      <button className="group fold-hdr" aria-expanded={shown} onClick={toggle}
        style={{width:'100%',display:'flex',alignItems:'center',gap:10,padding:'14px 16px',textAlign:'left',fontFamily:'inherit',cursor:'pointer',color:'var(--label)'}}>
        <span style={{flex:1,minWidth:0}}>
          <span style={{display:'block',fontSize:15,fontWeight:800}}>{title}{alert && <span className="fold-dot" aria-label={TT("Hinweis")} style={{display:'inline-block',width:8,height:8,borderRadius:4,background:'var(--red)',marginLeft:8,verticalAlign:'middle'}}/>}</span>
          {sub && <span style={{display:'block',fontSize:12.5,color:'var(--label2)',marginTop:2}}>{sub}</span>}
        </span>
        <span aria-hidden="true" style={{color:'var(--label2)',fontSize:18,transform:shown?'rotate(90deg)':'none',transition:'transform .2s'}}>›</span>
      </button>
      <div hidden={!shown} style={{display:shown?'flex':'none',flexDirection:'column',gap:'var(--gap, 18px)',marginTop:12}}>{children}</div>
    </div>
  );
}

/* Einkaufsliste nach Laden-Bereichen — Reihenfolge wie ein üblicher Rundgang. Erkennung über Stichwörter im Namen. */
// Ganzes Wort: \b kennt keine Umlaute („Weißwein“ hatte sonst eine Grenze nach „Wei“)
const wordRe = words => new RegExp('(?:^|[^a-zäöüß])(?:' + words.join('|') + ')(?![a-zäöüß])', 'i');
const SHOP_AREAS_RAW = [
  ['obst',  '🍎', 'Obst & Gemüse',  /apfel|äpfel|banane|birne|tomate|gurke|salat|zwiebel|kartoffel|karotte|möhre|paprika|zitrone|obst|gemüse|avocado|beere|traube|pilz|knoblauch|kräuter|orange|spinat|zucchini|brokkoli|lauch|aubergine|mais/i],
  ['brot',  '🥖', 'Brot & Backwaren', /brot|brötchen|toast|baguette|croissant|kuchen|brezel/i],
  ['kuehl', '🥛', 'Kühlregal',       /milch|käse|joghurt|butter|sahne|quark|wurst|schinken|aufschnitt|hähnchen|fleisch|hack|tofu|margarine|mozzarella/i],
  ['tk',    '❄️', 'Tiefkühl',         /tiefkühl|pizza|pommes|fischstäbchen/i],
  ['vorrat','🍝', 'Vorrat',           /nudel|pasta|reis(?!e)|zucker|essig|müsli|haferflocken|konserve|dose|soße|sauce|ketchup|senf|gewürz|kaffee|honig|marmelade|nutella|brühe|linsen|bohnen|chips|schokolade|kekse|tomatenmark|passierte|cracker|popcorn/i],
  ['drinks','🥤', 'Getränke',         /wasser|saft|cola|bier|wein|limo|sprudel|mate\b|energy|sirup|eistee/i],
  ['droge', '🧴', 'Drogerie & Haushalt', /klopapier|toilettenpapier|küchenrolle|müllbeutel|spülmittel|waschmittel|spültabs|tabs|seife|shampoo|duschgel|zahnpasta|deo|schwamm|putzmittel|reiniger|weichspüler|taschentücher|batterie|glühbirne|folie/i],
];
// Prüf-Reihenfolge (spezifisch vor allgemein): Getränke („Apfelsaft“), Vorrat („Butterkekse“, „Reis“, „Tomatenmark“),
// Drogerie, Tiefkühl („TK Spinat“), dann Obst, Brot, Kühlregal. Kurze Stichwörter nur als ganzes Wort.
const SHOP_AREAS = SHOP_AREAS_RAW;
const SHOP_ORDER = ['drinks','vorrat','droge','tk','obst','brot','kuehl'];
const SHOP_WORDS = {
  kuehl: wordRe(['ei','eier']), tk: wordRe(['tk','eis','eiswürfel']), vorrat: wordRe(['reis','tee','öl','mehl','salz']),
};
const SHOP_OTHER = ['sonst', '📦', 'Sonstiges'];
// Bereich zu einem Namen: in Prüf-Reihenfolge, Stichwort-Regex ODER Ganzwort-Liste
const shopAreaOf = name => {
  const n = String(name||'');
  for (const k of SHOP_ORDER) { const a = SHOP_AREAS.find(x=>x[0]===k); if (a[3].test(n) || (SHOP_WORDS[k] && SHOP_WORDS[k].test(n))) return a; }
  return SHOP_OTHER;
};
const shopArea = name => shopAreaOf(name);
// Sortierung nach Laden-Rundgang (Reihenfolge in SHOP_AREAS), Sonstiges ans Ende
const shopAreaIdx = name => { const a = shopAreaOf(name); const i = SHOP_AREAS.indexOf(a); return i < 0 ? SHOP_AREAS.length : i; };

/* ══════════════════════════
   EXTRA (seit wg-v64): Preis-Gedächtnis, Gesamtbudget, Einkaufs-Reihenfolge, Schnell-Eingabe,
   Kalender-Abo, Zählerstände (+ Besuch je Monat), Heute-Seite, Darstellung (Hell/Dunkel, Schriftgröße)
══════════════════════════ */

// Haushalt-Posten inkl. Archiv (für Preis-Gedächtnis, Budget, Einkaufs-Reihenfolge)
const hsAll = D => [...(D.hs||[]), ...(D.arc||[]).filter(a=>a && a.src==='hs')].filter(Boolean);

/* ── Preis-Gedächtnis: letzter Preis gleichen Namens + Hinweis bei ≥ 15 % Abweichung ── */
const priceLast = (D, name) => {
  const n = String(name||'').trim().toLowerCase(); if (!n) return null;
  return hsAll(D).filter(i=>String(i.name||'').trim().toLowerCase()===n && i.price>0)
    .sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')))[0] || null;
};
function PriceHint({ name, price, onPick }) {
  const { D } = useD();
  const last = priceLast(D, name);
  const best = priceByShop(D, name)[0] || null;   // günstigster bekannter Laden für diesen Artikel
  if (!last) return null;
  const p = parseNum(price), jump = p>0 ? (p - last.price)/last.price : 0;
  return (
    <div data-testid="price-hint" style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',fontSize:12.5,color:'var(--label2)'}}>
      <button type="button" style={chipSt(false)} onClick={()=>onPick(String(last.price.toFixed(2)).replace('.',','))}>{TT("↺ Wie zuletzt: €")}{fmt(last.price)}</button>
      <span>{TT("am")} {fmtDate(last.date)}{last.shop?` · ${last.shop}`:''}</span>
      {best && (!last.shop || best.shop!==last.shop || best.price < last.price - 0.001) &&
        <b data-testid="price-best" style={{color:'var(--green)'}}>{TT("💰 Günstigster:")} {best.shop} €{fmt(best.price)} ({fmtDate(best.date)})</b>}
      {Math.abs(jump)>=0.15 && <b data-testid="price-jump" style={{color:jump>0?'var(--red)':'var(--green)'}}>{jump>0?'▲':'▼'} {Math.round(Math.abs(jump)*100)} % {jump>0?'teurer':'günstiger'} {TT("als zuletzt")}</b>}
    </div>
  );
}

/* ── Gesamtbudget je Monat (Key `bud`, id 'total') — Cron warnt bei 80/100 % wie bei den Kategorien ── */
function TotalBudget() {
  const { D, setFn } = useD();
  const [open,setOpen] = useState(false);
  const [val,setVal] = useState('');
  const lim = Number((D.bud||[]).find(x=>x && x.id==='total')?.limit) || 0;
  const ym = todayISO().slice(0,7);
  const spent = hsAll(D).filter(i=>ymOf(i.date)===ym).reduce((s,i)=>s+(Number(i.price)||0),0);
  const save = () => { const l = parseNum(val)||0; setFn('bud', cur=>{ const x=(cur||[]).filter(y=>y && y.id!=='total'); return l>0 ? [...x,{ id:'total', limit:l }] : x; }); setOpen(false); };
  const pct = lim ? spent/lim : 0;
  const now = new Date(), daysLeft = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate() - now.getDate();
  const col = pct>=1 ? 'var(--red)' : pct>=0.8 ? 'var(--amber)' : 'var(--mint)';
  const dayNo = now.getDate(), daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const forecast = lim && dayNo >= 5 ? Math.round(spent / dayNo * daysInMonth * 100) / 100 : null;
  return (
    <>
      {lim ? (
        <button className="group rise" data-testid="total-budget" onClick={()=>{ setVal(String(lim).replace('.',',')); setOpen(true); }}
          style={{padding:'12px 14px',textAlign:'left',width:'100%',cursor:'pointer',fontFamily:'inherit',color:'var(--label)',display:'flex',flexDirection:'column',gap:8}}>
          <span style={{display:'flex',justifyContent:'space-between',gap:8,fontSize:13.5,fontWeight:700}}>
            <span>{TT("🎯 Monatsbudget Haushalt")}</span><span className="num" style={{color:col}}>€{fmt(spent)} / €{fmt(lim)}</span>
          </span>
          <span style={{height:6,borderRadius:3,background:'var(--bg3)',overflow:'hidden'}}><span style={{display:'block',height:'100%',width:`${Math.min(100,pct*100)}%`,background:col}}/></span>
          <span style={{fontSize:12,color:'var(--label2)'}}>{pct>=1 ? `€${fmt(spent-lim)} drüber` : `noch €${fmt(lim-spent)} für ${daysLeft} Tag${daysLeft===1?'':'e'}`}</span>
          {/* Hochrechnung (wg-v75): bisheriges Tempo auf den ganzen Monat — ab dem 5. aussagekräftig */}
          {forecast!==null && <span data-testid="budget-forecast" style={{fontSize:12,color:forecast>lim?'var(--amber)':'var(--label2)'}}>
            {TT("📈 Bei dem Tempo landet ihr bei ~€")}{fmt(forecast)}{forecast>lim?` – €${fmt(forecast-lim)} über dem Budget`:' – passt'}
          </span>}
        </button>
      ) : (
        <button className="hit rise" data-testid="total-budget-set" onClick={()=>{ setVal(''); setOpen(true); }}
          style={{display:'flex',alignItems:'center',justifyContent:'center',gap:7,padding:'9px 14px',borderRadius:12,border:'none',background:'var(--bg3)',color:'var(--label2)',fontWeight:600,fontSize:13,fontFamily:'inherit',cursor:'pointer'}}>
          {TT("🎯 Monatsbudget festlegen")}
        </button>
      )}
      <MiniSheet open={open} onClose={()=>setOpen(false)} title={TT("Monatsbudget")} color="var(--mint)">
        <div className="sheet-sublbl">{TT("Wie viel darf der Haushalt im Monat kosten (beide zusammen)?")}</div>
        <div className="f-euro"><input autoFocus type="text" inputMode="decimal" className="field" placeholder="0,00" aria-label={TT("Monatsbudget")} value={val} onChange={e=>setVal(e.target.value)}/></div>
        <button className="btn" style={{background:'var(--mint)'}} onClick={save}>{parseNum(val)>0 ? 'Speichern' : 'Budget entfernen'}</button>
      </MiniSheet>
    </>
  );
}

/* ── Einkaufs-Reihenfolge: wer war zuletzt einkaufen (Lebensmittel-Posten, 30 Tage) ── */
function ShopTurn() {
  const { D, me } = useD();
  const users = D.users || [];
  if (users.length < 2) return null;
  const cut = shiftISO(todayISO(), -30);
  const buys = hsAll(D).filter(i=>i.cat==='food' && String(i.date||'')>=cut);
  if (!buys.length) return null;
  const cnt = users.map(u=>({ ...u, n:buys.filter(i=>i.paidBy===u.id).length }));
  const last = [...buys].sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0];
  const lu = users.find(u=>u.id===last.paidBy);
  const next = cnt[0].n===cnt[1].n ? users.find(u=>u.id!==last.paidBy) : [...cnt].sort((a,b)=>a.n-b.n)[0];
  const ago = daysSince(last.date);
  return (
    <div className="rise" data-testid="shop-turn" style={{fontSize:12.5,color:'var(--label2)',lineHeight:1.5,padding:'0 4px'}}>
      {TT("🛒 Zuletzt eingekauft:")} <b style={{color:lu?.color}}>{lu?.id===me?'du':lu?.name}</b> ({ago===0?'heute':ago===1?'gestern':`vor ${ago} Tagen`}{TT(") · 30 Tage")} {cnt.map((c,i)=><React.Fragment key={c.id}>{i>0?' : ':''}<b style={{color:c.color}}>{c.n}</b></React.Fragment>)}
      {next && <> → <b style={{color:next.color}}>{next.id===me?'du bist':`${next.name} ist`} {TT("dran")}</b></>}
    </div>
  );
}

/* ── Schnell-Eingabe: „12,50 Pizza", „Döner 8 Euro allein" → Ausgabe (ich zahle, 50/50 bzw. allein) ── */
const parseQuick = txt => {
  let s = ' ' + String(txt||'').replace(/€/g,' ').trim() + ' ';
  const alone = /\s(allein|nur ich|für mich)\s/i.test(s);
  s = s.replace(/\s(allein|nur ich|für mich)(?=\s)/ig, ' ');
  const m = s.match(/\s(\d+(?:[.,]\d{1,2})?)(?=\s)/);
  if (!m) return null;
  const price = parseNum(m[1]);
  const name = (s.slice(0, m.index) + ' ' + s.slice(m.index + m[0].length)).replace(/\s(euros?|eur)(?=\s)/ig, ' ').replace(/\s+/g,' ').trim();
  return price > 0 ? { price, name: name || 'Einkauf', alone } : null;
};
const SHOP_RE = /einkauf|lidl|aldi|rewe|edeka|netto|penny|kaufland|supermarkt|lebensmittel/i;
function QuickExpense({ onFull }) {
  const { D, setFn, me, notifyOthers, undo } = useD();
  // Sprach-Kurzbefehl: Text einmal übernehmen (nur die Schnell-Zeile im Haushalt hat onFull)
  const [voice] = useState(() => !!(onFull && SHORTCUT_TEXT && me));
  const [txt,setTxt] = useState(() => { if (!onFull || !SHORTCUT_TEXT || !me) return '';   /* ohne „me“ übernimmt das Formular */ const t = SHORTCUT_TEXT; SHORTCUT_TEXT = null; return t; });
  const q = parseQuick(txt), users = D.users || [];
  // Ohne gewählte Person kein Schnell-Eintrag (wer zahlt?) — das volle Formular muss trotzdem erreichbar bleiben
  if (!me) return onFull ? <button className="btn rise" style={{background:'var(--mint)'}} onClick={()=>onFull('')}>{TT("+ Ausgabe hinzufügen")}</button> : null;
  const save = () => {
    if (!q) { if (onFull) { onFull(txt.trim()); setTxt(''); } return; }
    const cat = priceLast(D, q.name)?.cat || (SHOP_RE.test(q.name) ? 'food' : null);
    const it = { id:uid(), name:q.name, price:q.price, paidBy:me, date:todayISO(), owedBy:q.alone?me:null, cat, settled:false };
    setFn('hs', cur=>[it, ...(cur||[])]);
    notifyOthers(TT("💸 {0} hat {1} € eingetragen", nameOfU(users, me), fmt(q.price)), q.name, TT("wg-exp"), TT("exp"));
    undo(TT("💸 „{0}\" €{1} eingetragen", q.name, fmt(q.price)), ()=>setFn('hs', cur=>cur.filter(i=>i.id!==it.id)));
    setTxt('');
  };
  return (
    <form className="rise" data-testid="quick-expense" onSubmit={e=>{e.preventDefault();save();}} style={{display:'flex',flexDirection:'column',gap:6}}>
      <div style={{display:'flex',gap:8}}>
        <input className="field" maxLength={80} placeholder={TT("⚡ Schnell: „12,50 Pizza“")} aria-label={TT("Ausgabe in einem Satz")} value={txt} onChange={e=>setTxt(e.target.value)} style={{flex:1}}/>
        <button type="submit" className="btn" style={{width:'auto',padding:'0 14px',flexShrink:0,background:(q||onFull)?'var(--mint)':'var(--bg3)',color:(q||onFull)?'var(--ink)':'var(--label2)'}}>{q || !onFull ? 'Eintragen' : '+ Ausgabe hinzufügen'}</button>
      </div>
      {voice && txt.trim() && <div data-testid="quick-voice" style={{fontSize:12.5,color:'var(--amber)',fontWeight:700,padding:'0 4px'}}>{TT("🎙️ Per Sprache übernommen – prüfen und „Eintragen“ tippen")}</div>}
      {txt.trim() && (
        <div data-testid="quick-preview" style={{fontSize:12,color:q?'var(--label2)':'var(--red)',padding:'0 4px'}}>
          {q ? `→ ${q.name} · €${fmt(q.price)} · du zahlst · ${q.alone?'nur für dich':'50/50'}` : onFull ? 'Ohne Betrag öffnet sich das ganze Formular (Datum, Aufteilung)' : 'Betrag fehlt – z. B. „12,50 Pizza“ (Mikrofon der Tastatur geht auch)'}
        </div>
      )}
    </form>
  );
}

/* ── Kalender-Abo: /api/ics liefert Müllabfuhr, Abwesenheiten, Ankündigungen und nächste Aufgaben als .ics.
   Der Link enthält einen vom WG-Code abgeleiteten Schlüssel (nicht den Code) — nach „WG-Code wechseln" neu erzeugen. ── */
function CalendarCard() {
  const { wgCode } = useD();
  const saved = ls('wg_ics', null);
  const [tok,setTok] = useState(saved && saved.code===wgCode ? saved.token : null);
  const [busy,setBusy] = useState(false);
  const [msg,setMsg] = useState('');
  const url = tok ? `${PUSH_API}/api/ics?t=${tok}` : '';
  const make = async () => {
    setBusy(true); setMsg('');
    try {
      const r = await fetch(PUSH_API + '/api/ics', { method:'POST', headers:{ 'content-type':'application/json' }, body:JSON.stringify({ code:wgCode }) });
      const j = await r.json().catch(()=>({}));
      if (!r.ok || !j.token) throw new Error(j.error || `Fehler ${r.status}`);
      ss('wg_ics', { code:wgCode, token:j.token }); setTok(j.token);
    } catch (e) { setMsg(TT("Link konnte nicht erzeugt werden ({0}).", e.message)); }
    setBusy(false);
  };
  const copy = async () => { setMsg(await copyTxt(url) ? 'Link kopiert ✓ – in Google Kalender unter „Per URL hinzufügen" einfügen.' : 'Kopieren ging nicht – Link bitte markieren.'); };
  return (
    <div className="rise" data-testid="calendar-card" style={{animationDelay:'128ms'}}>
      <div className="section-hdr">{TT("📅 Kalender-Abo")}</div>
      <div className="group" style={{padding:'12px 14px',display:'flex',flexDirection:'column',gap:10}}>
        <span style={{fontSize:13,color:'var(--label2)',lineHeight:1.45}}>{TT("Müllabfuhr (mit Erinnerung am Vorabend), Abwesenheiten, Ankündigungen und die nächsten Putz-Aufgaben im Handy-Kalender – klappt auch, wenn die App zu ist.")}</span>
        {!tok ? (
          <button className="btn" data-testid="ics-make" style={{background:'var(--sky)'}} disabled={busy||!wgCode} onClick={make}>{busy?'…':'Kalender-Link erzeugen'}</button>
        ) : (
          <>
            <a className="btn" data-testid="ics-open" href={url.replace(/^https:/,'webcal:')} style={{background:'var(--sky)',color:'var(--ink)',display:'flex',alignItems:'center',justifyContent:'center',textDecoration:'none'}}>{TT("Im Kalender abonnieren")}</a>
            <button className="btn btn-sec" onClick={copy}>{TT("Link kopieren (Google Kalender)")}</button>
            <code data-testid="ics-url" style={{fontSize:11,color:'var(--label2)',wordBreak:'break-all',userSelect:'all'}}>{url}</code>
          </>
        )}
        {msg && <span style={{fontSize:12.5,color:'var(--label2)'}}>{msg}</span>}
        <span style={{fontSize:11.5,color:'var(--label2)'}}>{TT("Wer den Link hat, sieht diese Termine. Nach „WG-Code wechseln“ gilt er nicht mehr.")}</span>
      </div>
    </div>
  );
}

/* ── Zählerstände (Key `zs`): Ablesungen {kind,date,value}; Einstellung je Zähler {id:'cfg-<kind>', cfg:true, price, abschlag}.
   Hochrechnung: Ø Verbrauch/Tag zwischen erster und letzter Ablesung × 365 × Preis − 12 × Abschlag. ── */
const METER_KINDS = { strom:['⚡','Strom','kWh'], wasser:['💧','Wasser','m³'], gas:['🔥','Gas','m³'] };
const meterStats = list => {
  const r = [...list].sort((a,b)=>a.date.localeCompare(b.date));
  if (r.length < 2) return null;
  const days = Math.max(1, Math.round((isoMid(r[r.length-1].date) - isoMid(r[0].date))/864e5));
  const perDay = (r[r.length-1].value - r[0].value) / days;
  return perDay >= 0 ? { perDay, year: perDay*365 } : null;
};
const fmtN = (n, d=1) => Number(n||0).toLocaleString(LOC(), { maximumFractionDigits:d, minimumFractionDigits:0 });
function MeterCard() {
  const { D, setFn, undo, me } = useD();
  const [add,setAdd] = useState(null);     // { kind, value, date }
  const [cfgK,setCfgK] = useState(null);   // { kind, price, abschlag }
  const all = (D.zs||[]).filter(Boolean);
  const reads = all.filter(z=>!z.cfg), cfgOf = k => all.find(z=>z.cfg && z.kind===k);
  const kinds = Object.keys(METER_KINDS).filter(k=>reads.some(z=>z.kind===k) || cfgOf(k));
  const users = D.users || [], ym = todayISO().slice(0,7);
  const visits = users.map(u=>({ ...u, n:(D.bo||[]).filter(b=>b && b.kind==='besuch' && b.by===u.id && String(b.date||'').startsWith(ym)).length }));
  const saveRead = () => {
    const v = parseNum(add.value); if (!(v>0)) return;
    const it = { id:uid(), kind:add.kind, date:add.date||todayISO(), value:v, by:me||null };
    setFn('zs', cur=>[it, ...(cur||[])]);
    undo(TT("{0} Stand {1} gespeichert", METER_KINDS[add.kind][0], fmtN(v,2)), ()=>setFn('zs', cur=>cur.filter(z=>z.id!==it.id)));
    setAdd(null);
  };
  const saveCfg = () => {
    const it = { id:'cfg-'+cfgK.kind, kind:cfgK.kind, cfg:true, price:parseNum(cfgK.price)||0, abschlag:parseNum(cfgK.abschlag)||0 };
    setFn('zs', cur=>[...(cur||[]).filter(z=>z.id!==it.id), it]); setCfgK(null);
  };
  return (
    <div className="rise" data-testid="meter-card" style={{animationDelay:'113ms'}}>
      <div className="section-hdr" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span>{TT("📟 Zählerstände")}</span>
        <button className="hit" onClick={()=>setAdd({ kind:kinds[0]||'strom', value:'', date:todayISO() })} style={{...hdrBtn,color:'var(--sky)'}}>{TT("+ Ablesen")}</button>
      </div>
      <div className="group">
        {!kinds.length && <div className="cell"><div className="cell-content"><span className="cell-sub">{TT("Strom, Wasser oder Gas ablesen → Verbrauch pro Tag und Hochrechnung der Nachzahlung. Am 1. kommt eine Erinnerung.")}</span></div></div>}
        {kinds.map(k=>{
          const [em,label,unit] = METER_KINDS[k];
          const list = reads.filter(z=>z.kind===k), last = [...list].sort((a,b)=>b.date.localeCompare(a.date))[0];
          const st = meterStats(list), c = cfgOf(k);
          const diff = st && c && c.price>0 && c.abschlag>0 ? st.year*c.price - 12*c.abschlag : null;
          return (
            <button key={k} className="cell" data-testid="meter-row" onClick={()=>setCfgK({ kind:k, price:c?String(c.price).replace('.',','):'', abschlag:c?String(c.abschlag).replace('.',','):'' })}
              style={{width:'100%',textAlign:'left',background:'none',fontFamily:'inherit',cursor:'pointer'}}>
              <span style={{fontSize:20,lineHeight:1}}>{em}</span>
              <div className="cell-content">
                <span className="cell-title">{label}{last?` · ${fmtN(last.value,2)} ${unit}`:''} <span style={{fontSize:12,color:'var(--label2)',fontWeight:500}}>{last?`(${fmtDM(last.date)})`:''}</span></span>
                <span className="cell-sub">
                  {st ? `Ø ${fmtN(st.perDay,2)} ${unit}/Tag · ~${fmtN(st.year,0)} ${unit}/Jahr` : 'ab der 2. Ablesung gibt es eine Hochrechnung'}
                  {diff!==null && <b data-testid="meter-diff" style={{color:diff>0?'var(--red)':'var(--green)'}}> · {diff>0?`~€${fmt(diff)} Nachzahlung`:`~€${fmt(-diff)} Guthaben`}</b>}
                  {st && !(c && c.price>0 && c.abschlag>0) && ' · Preis + Abschlag antippen'}
                </span>
              </div>
            </button>
          );
        })}
        {visits.some(v=>v.n>0) && (
          <div className="cell" data-testid="visits"><span style={{fontSize:18}}>🛋️</span><div className="cell-content">
            <span className="cell-sub">{TT("Besuch diesen Monat (Ankündigungen):")} {visits.map(v=>`${v.name} ${v.n}×`).join(' · ')} {TT("– falls ihr Nebenkosten danach aufteilt.")}</span>
          </div></div>
        )}
      </div>
      <MiniSheet open={!!add} onClose={()=>setAdd(null)} title={TT("Zähler ablesen")} color="var(--sky)">
        {add && <>
          <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
            {Object.entries(METER_KINDS).map(([k,[em,l]])=><button key={k} type="button" style={chipSt(add.kind===k)} onClick={()=>setAdd({...add,kind:k})}>{em} {l}</button>)}
          </div>
          <input autoFocus type="text" inputMode="decimal" className="field" placeholder={TT("Stand in {0}", METER_KINDS[add.kind][2])} aria-label={TT("Zählerstand")} value={add.value} onChange={e=>setAdd({...add,value:e.target.value})}/>
          <input type="date" className="field" aria-label={TT("Ablesedatum")} value={add.date} onChange={e=>setAdd({...add,date:e.target.value})}/>
          <button className="btn" style={{background:parseNum(add.value)>0?'var(--sky)':'var(--bg3)'}} onClick={saveRead}>{TT("Speichern")}</button>
        </>}
      </MiniSheet>
      <MiniSheet open={!!cfgK} onClose={()=>setCfgK(null)} title={cfgK?`${METER_KINDS[cfgK.kind][1]} · Tarif`:''} color="var(--sky)">
        {cfgK && <>
          <label className="sheet-sublbl" htmlFor="m-price">{TT("Preis pro")} {METER_KINDS[cfgK.kind][2]} (€)</label>
          <input id="m-price" type="text" inputMode="decimal" className="field" placeholder="z. B. 0,35" value={cfgK.price} onChange={e=>setCfgK({...cfgK,price:e.target.value})}/>
          <label className="sheet-sublbl" htmlFor="m-ab">{TT("Abschlag pro Monat (€)")}</label>
          <input id="m-ab" type="text" inputMode="decimal" className="field" placeholder="z. B. 45" value={cfgK.abschlag} onChange={e=>setCfgK({...cfgK,abschlag:e.target.value})}/>
          <button className="btn" style={{background:'var(--sky)'}} onClick={saveCfg}>{TT("Speichern")}</button>
        </>}
      </MiniSheet>
    </div>
  );
}

/* ── Mein Haushalt-Saldo (offene Posten; owedBy trägt allein, sonst 50/50) — für die Heute-Seite ── */
const hsNetOf = (D, id) => {
  const users = D.users || [];
  return (D.hs||[]).filter(i=>i && !i.settled).reduce((s,i)=>s + (i.paidBy===id ? i.price : 0) - (i.owedBy ? (i.owedBy===id ? i.price : 0) : i.price/Math.max(1,users.length)), 0);
};

/* ── Heute-Seite (optionaler Tab, Mehr → Module): alles, was heute ansteht, an einem Ort ── */
function Heute({ goTab }) {
  const { D, me, status, mods } = useD();
  const users = D.users || [], today = todayISO(), tomorrow = shiftISO(today, 1);
  const h = new Date().getHours();
  const hello = h < 11 ? 'Guten Morgen' : h < 18 ? 'Hallo' : 'Guten Abend';
  const meU = users.find(u=>u.id===me);
  const wgInfo = (D.cf||[]).find(x=>x && x.id==='wg' && x.name);   // WG-Name aus der Einrichtung
  const picks = (D.mk||[]).filter(Boolean).map(p=>({ p, d:pickupNext(p, today) })).filter(x=>x.d===today || x.d===tomorrow);
  const pays = (D.pr||[]).filter(p=>p && p.status==='open' && (p.to===me || p.from===me));
  const openSl = (D.sl||[]).filter(i=>i && !i.done).length;
  const soon = (D.vr||[]).filter(v=>v && !v.hidden && (stockLeft(v) ?? 99) <= 2);
  // EINE Quelle für „Du schuldest": myBalance (Haushalt + Growbox, wie Start-Pop-up und Haushalt-Ring).
  // Vorher nur Haushalt → Heute 58,25 €, Pop-up 66,25 € (Differenz = Growbox-Anteil), torbe 19.09.
  const bal = me ? myBalance(D, me, mods) : { total:0, hs:0, g:0 }, net = bal.total, other = users.find(u=>u.id!==me);
  const balParts = Math.abs(bal.g) > 0.01 && Math.abs(bal.hs) > 0.01 ? ` (Haushalt €${fmt(Math.abs(bal.hs))}${(bal.hs<0)===(bal.g<0)?' + ':' − '}Growbox €${fmt(Math.abs(bal.g))})` : Math.abs(bal.g) > 0.01 ? ' (Growbox)' : '';
  const row = (em, text, onClick, tid) => (
    <button key={tid} className="cell" data-testid={tid} onClick={onClick} style={{width:'100%',textAlign:'left',background:'none',fontFamily:'inherit',cursor:'pointer',color:'var(--label)'}}>
      <span style={{fontSize:19,lineHeight:1}}>{em}</span><div className="cell-content"><span className="cell-title" style={{fontSize:14.5}}>{text}</span></div>
      <span style={{color:'var(--label2)',fontSize:20}}>›</span>
    </button>
  );
  const goList = () => { SHORTCUT = 'liste'; goTab('haus'); };
  const mine = me ? choreMine(D.pt, me) : [];
  // Ab 3 Personen: je Überweisung eine eigene Zeile (wer wem wie viel)
  const myTransfers = users.length > 2 && me ? settlePlan(users.map(u=>({ ...u, net: myBalance(D, u.id, mods).total })))
    .filter(t=>t.from===me || t.to===me)
    .map(t=>row(t.from===me?'💸':'💰', t.from===me ? `Du schuldest ${t.toName} €${fmt(t.amount)}` : `${t.fromName} schuldet dir €${fmt(t.amount)}`, ()=>goTab('haus'), 'today-bal-'+t.from+t.to)) : [];
  // Miete (wg-v73): eigene Zahlung offen und Fälligkeit ≤ 3 Tage entfernt oder schon vorbei
  const rentCfg = (D.mi||[]).find(x=>x && x.id==='cfg');
  const rentRow = (() => {
    if (!rentCfg || !me) return null;
    const ym = today.slice(0,7), dueIso = rentDue(rentCfg, ym), d = -daysSince(dueIso);
    if ((D.mi||[]).some(x=>x && x.id===`${ym}-${me}`) || d > 3) return null;
    const amount = rentShares(rentCfg, users)[me] || 0;
    return row('🏠', d < 0 ? `Miete €${fmt(amount)} war am ${fmtDM(dueIso)} fällig` : d === 0 ? `Miete €${fmt(amount)} ist heute fällig` : `Miete €${fmt(amount)} bis ${fmtDM(dueIso)}`, ()=>goTab('haus'), 'today-rent');
  })();
  const rows = [
    ...picks.map(x=>{ const k = PICK_KINDS[x.p.kind] || ['🗑️', x.p.kind]; return row('🚛', `${k[0]} ${k[1]} ${x.d===today?'heute':'morgen früh'} – ${x.d===today?'Tonne draußen?':'heute Abend rausstellen'}`, ()=>goTab('putz'), 'today-pick-'+x.p.kind); }),
    ...pays.map(p=>row('💶', p.to===me ? `${nameOfU(users, p.from)} hat €${fmt(p.amount)} bezahlt – bitte bestätigen` : `Zahlung €${fmt(p.amount)} wartet auf ${nameOfU(users, p.to)}`, ()=>goTab('haus'), 'today-pay-'+p.id)),
    (openSl || soon.length) ? row('🛒', `${openSl} auf der Einkaufsliste${soon.length?` · bald leer: ${soon.map(s=>s.name).join(', ')}`:''}`, goList, 'today-shop') : null,
    rentRow,
    ...(me && users.length>2 ? myTransfers : []),
    (me && other && users.length<=2 && Math.abs(net) > 0.01) ? row(net<0?'💸':'💰', net<0 ? `Du schuldest ${other.name} €${fmt(-net)}${balParts}` : `${other.name} schuldet dir €${fmt(net)}${balParts}`, ()=>goTab('haus'), 'today-bal') : null,
  ].filter(Boolean);
  return (
    <div className="screen">
      <NBar title={TT("Heute")} color="var(--mint)" status={status}/>
      <div className="scroll"><div className="content">
        <div className="rise" data-testid="today-hello" style={{padding:'4px 4px 0'}}>
          <div style={{fontSize:22,fontWeight:800}}>{hello}{meU?`, ${meU.name}`:''}</div>
          <div style={{fontSize:13,color:'var(--label2)'}}>{wgInfo ? `${wgInfo.em||'🏠'} ${wgInfo.name} · ` : ''}{new Date().toLocaleDateString(LOC(),{ weekday:'long', day:'numeric', month:'long' })}</div>
        </div>
        <WhoAmI/>
        <PushNudge goTab={goTab}/>
        <ChoreQuick goPutz={()=>goTab('putz')}/>
        {me && mods.putz!==false && !mine.length && <div className="rise" data-testid="today-free" style={{fontSize:14,fontWeight:700,color:'var(--green)',padding:'0 4px'}}>{TT("✨ Heute ist nichts im Putzplan für dich fällig")}</div>}
        <AwayCard compact/>
        <StatusCard/>
        {rows.length>0 && <div className="group rise" data-testid="today-rows">{rows}</div>}
        <HomeDueCard/>
        <QuickExpense/>
        <CheckinCard/>
        <WashCard/>
        <FridgeCard/>
        <MealCard/>
        <RecipeCard/>
        <BoardCard/>
        <QuickMsgs/>
        <ChoreHandover/>
        <BookCard/>
        <RulesCard/>
        <PollCard/>
        <RepairCard/>
        <LoginShare/>
      </div></div>
    </div>
  );
}

/* ── Darstellung (je Gerät): Hell/Dunkel/Automatisch + Schriftgröße. Das Früh-Skript im <head> setzt beides vor dem
   ersten Bild (kein Aufblitzen); applyLook() wiederholt das nach einer Änderung. ── */
const LOOK_ZOOM = { n:1, g:1.12, xg:1.25 };
const applyLook = () => {
  try {
    const t = ls('wg_theme', 'dark'), z = LOOK_ZOOM[ls('wg_zoom', 'n')] || 1;
    const light = t==='light' || (t==='auto' && window.matchMedia('(prefers-color-scheme: light)').matches);
    document.documentElement.dataset.theme = light ? 'light' : 'dark';
    document.documentElement.style.zoom = z === 1 ? '' : String(z);
    const mc = document.querySelector('meta[name="theme-color"]'); if (mc) mc.setAttribute('content', light ? '#f4f7f5' : '#060a08');
  } catch {}
};
function LookCard() {
  const [theme,setTheme] = useState(()=>ls('wg_theme','dark'));
  const [zoom,setZoom] = useState(()=>ls('wg_zoom','n'));
  const pick = (k, v) => { ss(k, v); if (k==='wg_theme') setTheme(v); else setZoom(v); applyLook(); };
  return (
    <div className="rise" data-testid="look-card" style={{animationDelay:'126ms'}}>
      <div className="section-hdr">{TT("🎨 Darstellung")}</div>
      <div className="group" style={{padding:'12px 14px',display:'flex',flexDirection:'column',gap:10}}>
        <div style={{display:'flex',gap:6}}>
          {[['dark','🌙 Dunkel'],['light','☀️ Hell'],['auto','🌓 Wie System']].map(([v,l])=><button key={v} type="button" data-testid={`theme-${v}`} aria-pressed={theme===v} style={{...chipSt(theme===v),flex:1}} onClick={()=>pick('wg_theme', v)}>{l}</button>)}
        </div>
        <div style={{display:'flex',gap:6}}>
          {[['n','Aa Normal'],['g','Aa Groß'],['xg','Aa Sehr groß']].map(([v,l])=><button key={v} type="button" data-testid={`zoom-${v}`} aria-pressed={zoom===v} style={{...chipSt(zoom===v),flex:1,fontSize:v==='n'?13:v==='g'?14:15}} onClick={()=>pick('wg_zoom', v)}>{l}</button>)}
        </div>
        <span style={{fontSize:11.5,color:'var(--label2)'}}>{TT("Gilt nur für dieses Gerät.")}</span>
      </div>
    </div>
  );
}

/* ══════════════════════════
   ALLTAG (seit wg-v62): Vorrat, Müllabfuhr, Abwesenheit, Waschtimer, Schnell-Nachrichten, Reparaturen, Jahresrückblick
   Neue Listen-Keys: vr, mk, aw, wt, pr, qm, rp — Items nur mit einfachen Feldern (DB-Regel: Text ≤ 500, Zahl, Bool).
══════════════════════════ */

/* Kleines Bottom-Sheet für die Alltags-Karten (gleiche Klassen wie Wiz, ohne Schritte) */
function MiniSheet({ open, onClose, title, color, children }) {
  if (!open) return null;
  return ReactDOM.createPortal(
    <div className="overlay" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="sheet-handle"/>
        <div className="sheet-hdr">
          <span className="sheet-title" style={{color}}>{title}</span>
          <button className="cancel-btn" onClick={onClose}>{TT("Abbrechen")}</button>
        </div>
        <div className="sheet-body" style={{display:'flex',flexDirection:'column',gap:14}}>{children}</div>
      </div>
    </div>,
    document.body
  );
}
const hdrBtn = { background:'none', border:'none', fontWeight:700, fontSize:12, fontFamily:'inherit', cursor:'pointer', padding:0, textTransform:'none', letterSpacing:0 };
const chipSt = on => ({ fontSize:13, borderRadius:12, padding:'9px 12px', minHeight:40, border:'none', fontWeight:on?800:600, fontFamily:'inherit', cursor:'pointer',
  background:on?'var(--mint)':'var(--bg3)', color:on?'var(--ink)':'var(--label2)' });
const nameOfU = (users, id) => (users||[]).find(u=>u.id===id)?.name || 'Jemand';
const fmtDM = iso => { const [,m,d]=String(iso||'').split('-').map(Number); return d ? (LANG === 'en' ? `${d}/${m}` : `${d}.${m}.`) : ''; };

/* ── Vorrat (Key `vr`): ein Tipp = „fast leer" → Einkaufsliste + Push. outs = letzte 6 Meldungen „iso,iso,…" (alt → neu) ── */
const STOCK_PRESETS = [['Klopapier','🧻'],['Müllbeutel','🗑️'],['Spülmittel','🧴'],['Waschmittel','🧺'],['Küchenrolle','🧽'],['Spültabs','🍽️'],['Handseife','🧼'],['Kaffee','☕']];
const stockOuts = it => String(it?.outs||'').split(',').filter(Boolean);
// Ø Tage zwischen zwei Meldungen (ab 2 Meldungen), sonst null
const stockEvery = it => {
  const o = stockOuts(it); if (o.length < 2) return null;
  const gaps = o.slice(1).map((d,i)=>Math.round((isoMid(d)-isoMid(o[i]))/864e5)).filter(g=>g>0);
  return gaps.length ? Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length) : null;
};
// Tage bis voraussichtlich leer (≤ 0 = jetzt), null ohne Erfahrung
const stockLeft = it => { const e = stockEvery(it); return e===null ? null : e - daysSince(stockOuts(it).slice(-1)[0]); };
const stockSlug = n => 'v-' + String(n).toLowerCase().replace(/[^a-z0-9äöüß]+/g,'-').slice(0,40);

function StockCard() {
  const { D, setFn, me, notifyOthers, undo } = useD();
  const [edit,setEdit] = useState(false);
  const [nn,setNn] = useState('');
  const items = (D.vr||[]).filter(Boolean), list = D.sl || [];
  const meName = nameOfU(D.users, me);
  // Vorlagen erscheinen ohne Einrichtung; erst die erste Meldung legt den Eintrag an
  // Gelernte Käufe (≥ 2×, aus dem Abhaken) erscheinen als Kacheln — ersetzt die früheren Vorschlags-Chips
  const learned = [...(D.slh||[])].filter(x=>x && (x.n||0)>=2).sort((a,b)=>(b.n||0)-(a.n||0)).map(x=>x.name).filter(Boolean);
  const known = new Set([...items.map(i=>i.id), ...STOCK_PRESETS.map(([n])=>stockSlug(n))]);
  const all = [...items,
    ...STOCK_PRESETS.filter(([n])=>!items.some(i=>i.id===stockSlug(n))).map(([name,em])=>({ id:stockSlug(name), name, em, preset:true })),
    ...learned.filter(n=>!known.has(stockSlug(n))).slice(0,8).map(name=>({ id:stockSlug(name), name, em:shopArea(name)[1], preset:true, learned:true })),
  ].filter(it=>!it.hidden);
  const onList = n => list.some(i=>i && !i.done && String(i.name).toLowerCase()===String(n).toLowerCase());
  const out = it => {
    if (onList(it.name)) return;
    const iso = todayISO();
    const outs = [...stockOuts(it).filter(d=>d!==iso), iso].slice(-6).join(',');
    const { preset, learned, ...base } = it;
    const slIt = { id:uid(), name:it.name, addedBy:me||null, date:iso, done:false };
    if (!learned) setFn('vr', cur=>{ const l=cur||[]; return l.some(x=>x.id===it.id) ? l.map(x=>x.id===it.id?{...x,outs}:x) : [...l,{...base,outs}]; });
    setFn('sl', cur=>[slIt, ...(cur||[])]);
    // Gelernte Käufe sind kein Vorrat, der ausgeht — nur „braucht“
    notifyOthers(learned ? `🛒 ${meName} braucht ${it.name}` : `🛒 ${it.em} ${it.name} ist fast leer`, learned ? '' : `${meName} hat es auf die Einkaufsliste gesetzt`, TT("wg-shop"), TT("shop"));
    undo(TT("{0} {1} auf die Liste", it.em, it.name), ()=>{
      setFn('sl', cur=>cur.filter(x=>x.id!==slIt.id));
      if (!learned) setFn('vr', cur=>preset ? cur.filter(x=>x.id!==it.id) : cur.map(x=>x.id===it.id?{...x,outs:it.outs||''}:x));
    });
  };
  // Ausblenden statt löschen: Vorlagen kämen sonst sofort wieder
  const hide = it => { const { preset, learned, ...base } = it; setFn('vr', cur=>{ const l=cur||[]; return l.some(x=>x.id===it.id) ? l.map(x=>x.id===it.id?{...x,hidden:true}:x) : [...l,{...base,outs:'',hidden:true}]; }); };
  const addCustom = () => { const n=nn.trim(); if(!n) return; const id=stockSlug(n); setFn('vr', cur=>[...(cur||[]).filter(x=>x.id!==id), { id, name:n, em:'📦', outs:'' }]); setNn(''); };
  const hiddenN = items.filter(i=>i.hidden).length;
  const soon = all.filter(it=>!onList(it.name) && (stockLeft(it) ?? 99) <= 2);
  return (
    <div className="rise" data-testid="stock-card" style={{animationDelay:'30ms'}}>
      <div className="section-hdr" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span>{TT("🛒 Antippen = auf die Liste")}</span>
        <button className="hit" onClick={()=>setEdit(e=>!e)} style={{...hdrBtn,color:'var(--mint)'}}>{edit?'Fertig':'Bearbeiten'}</button>
      </div>
      <div className="group" style={{padding:12}}>
        {soon.length>0 && !edit && <div data-testid="stock-soon" style={{fontSize:12.5,color:'var(--amber)',fontWeight:700,marginBottom:10}}>{TT("⏳ Bald leer:")} {soon.map(s=>s.name).join(', ')}</div>}
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(96px,1fr))',gap:8}}>
          {all.map(it=>{
            const on = onList(it.name), left = stockLeft(it), warn = !on && left!==null && left<=2;
            return (
              <button key={it.id} data-testid="stock-btn" onClick={()=>edit?hide(it):out(it)} aria-label={edit?`${it.name} ausblenden`:`${it.name} ist fast leer`}
                style={{display:'flex',flexDirection:'column',alignItems:'center',gap:3,padding:'10px 4px',borderRadius:12,border:`1px solid ${warn?'var(--amber)':'transparent'}`,
                  background:on&&!edit?'rgba(94,234,212,.10)':'var(--bg3)',color:on&&!edit?'var(--mint)':'var(--label)',fontWeight:700,fontSize:12,fontFamily:'inherit',cursor:'pointer',lineHeight:1.2}}>
                <span style={{fontSize:20}}>{it.em}</span>{it.name}
                <span style={{fontSize:10.5,fontWeight:600,color:on&&!edit?'var(--mint)':warn?'var(--amber)':'var(--label2)'}}>
                  {edit ? '× ausblenden' : on ? '✓ auf der Liste' : it.learned ? '+ auf die Liste' : left===null ? 'fast leer?' : left<=0 ? 'jetzt leer?' : `~${left} Tag${left===1?'':'e'}`}
                </span>
              </button>
            );
          })}
        </div>
        {edit && (
          <>
            <form onSubmit={e=>{e.preventDefault();addCustom();}} style={{display:'flex',gap:8,marginTop:10}}>
              <input className="field" maxLength={40} placeholder={TT("Eigenes, z. B. Zahnpasta")} aria-label={TT("Eigenen Vorrat hinzufügen")} value={nn} onChange={e=>setNn(e.target.value)} style={{flex:1}}/>
              <button type="submit" className="btn" style={{width:54,flexShrink:0,background:'var(--mint)'}}>+</button>
            </form>
            {hiddenN>0 && <button className="hit" onClick={()=>setFn('vr', cur=>cur.map(x=>x.hidden?{...x,hidden:false}:x))} style={{...hdrBtn,color:'var(--label2)',marginTop:10}}>{hiddenN} {TT("ausgeblendete zurückholen")}</button>}
          </>
        )}
      </div>
    </div>
  );
}

/* ── Müllabfuhr (Key `mk`): je Tonne ein Rhythmus {kind, start, every (Wochen)} ──
   Putzplan-Aufgaben mit `pk` werden am Vorabend der nächsten Abholung fällig (choreDueIn → pickupDueIn).
   api/_wg.js rechnet genauso — beide zusammen ändern. */
const PICK_KINDS = { rest:['⚫','Restmüll'], bio:['🟤','Biomüll'], papier:['🔵','Papier'], gelb:['🟡','Gelber Sack'], glas:['🟢','Glas'] };
// nächste Abholung am oder nach fromIso
const pickupNext = (p, fromIso) => {
  if (!p || !p.start) return null;
  const step = 7 * (Number(p.every) || 1);
  const diff = Math.round((isoMid(fromIso) - isoMid(p.start)) / 864e5);
  return diff > 0 ? shiftISO(p.start, Math.ceil(diff/step)*step) : p.start;
};
// fällig am Vorabend der ersten Abholung, deren Vorabend nach dem letzten Erledigen liegt (P−1 > lastDone ⇔ P ≥ lastDone+2)
const pickupDueIn = (p, lastDone, today = todayISO()) => {
  const P = lastDone ? pickupNext(p, shiftISO(lastDone, 2)) : pickupNext(p, today);
  return Math.round((isoMid(shiftISO(P, -1)) - isoMid(today)) / 864e5);
};
const pickText = kind => { const k = PICK_KINDS[kind]; return k ? `vor jeder ${k[0]} ${k[1]}-Abholung` : 'vor der Abholung'; };

function PickupCard() {
  const { D, setFn, undo } = useD();
  const [open,setOpen] = useState(false);
  const [f,setF] = useState({ kind:'rest', start:todayISO(), every:2 });
  const today = todayISO();
  const next = (D.mk||[]).filter(Boolean).map(p=>({ ...p, d:pickupNext(p, today) })).filter(p=>p.d).sort((a,b)=>a.d.localeCompare(b.d));
  const linked = kind => (D.pt||[]).filter(t=>t && t.pk===kind).length;
  const save = () => { setFn('mk', cur=>[...(cur||[]).filter(x=>x.kind!==f.kind), { id:'mk-'+f.kind, kind:f.kind, start:f.start||today, every:+f.every||1 }]); setOpen(false); };
  const del = p => { const { d, ...orig } = p; setFn('mk', cur=>cur.filter(x=>x.id!==p.id)); undo(TT("{0} entfernt", PICK_KINDS[p.kind]?.[1]||'Abholung'), ()=>setFn('mk', cur=>[...cur.filter(x=>x.id!==p.id), orig])); };
  return (
    <div className="rise" data-testid="pickup-card" style={{animationDelay:'60ms'}}>
      <div className="section-hdr" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span>{TT("🚛 Müllabfuhr")}</span>
        <button className="hit" onClick={()=>{ setF({ kind:Object.keys(PICK_KINDS).find(k=>!next.some(p=>p.kind===k))||'rest', start:today, every:2 }); setOpen(true); }} style={{...hdrBtn,color:'var(--amber)'}}>{TT("+ Tonne")}</button>
      </div>
      <div className="group">
        {!next.length && <div className="cell"><div className="cell-content"><span className="cell-sub">{TT("Abholtage eintragen → Erinnerung am Vorabend, Müll-Aufgaben werden dann passend fällig.")}</span></div></div>}
        {next.map(p=>{
          const k = PICK_KINDS[p.kind] || ['🗑️', p.kind], n = linked(p.kind);
          return (
            <div key={p.id} className="cell" data-testid="pickup-row">
              <span style={{fontSize:20,lineHeight:1}}>{k[0]}</span>
              <div className="cell-content">
                <span className="cell-title">{k[1]} · <b style={{color:p.d===shiftISO(today,1)?'var(--amber)':'inherit'}}>{boardWhen(p.d)}</b></span>
                <span className="cell-sub">{TT("alle")} {p.every} {TT("Woche")}{+p.every===1?'':'n'}{n?` · ${n} Aufgabe${n===1?'':'n'} gekoppelt`:''}</span>
              </div>
              <button className="del-btn" aria-label={TT("{0} entfernen", k[1])} onClick={()=>del(p)}>×</button>
            </div>
          );
        })}
      </div>
      <MiniSheet open={open} onClose={()=>setOpen(false)} title={TT("Abholtermin")} color="var(--amber)">
        <div className="sheet-sublbl">{TT("Welche Tonne?")}</div>
        <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
          {Object.entries(PICK_KINDS).map(([k,[em,l]])=><button key={k} type="button" style={chipSt(f.kind===k)} onClick={()=>setF({...f,kind:k})}>{em} {l}</button>)}
        </div>
        <label className="sheet-sublbl" htmlFor="pk-start">{TT("Nächste Abholung")}</label>
        <input id="pk-start" type="date" className="field" value={f.start} onChange={e=>setF({...f,start:e.target.value})}/>
        <div className="sheet-sublbl">{TT("Wie oft?")}</div>
        <div style={{display:'flex',gap:6}}>
          {[1,2,4].map(w=><button key={w} type="button" style={{...chipSt(+f.every===w),flex:1}} onClick={()=>setF({...f,every:w})}>{w===1?'Jede Woche':`Alle ${w} Wochen`}</button>)}
        </div>
        <button className="btn" style={{background:'var(--amber)'}} onClick={save}>{TT("Speichern")}</button>
      </MiniSheet>
    </div>
  );
}

/* ── Abwesenheit (Key `aw`): {userId, from, to, note} — Putzplan teilt Abwesende nicht ein,
   Einträge aus der Zeit zählen nicht für die Reihenfolge (choreTally). ── */
const isAway = (userId, iso = todayISO()) => (ABSENCES||[]).some(a=>a && a.userId===userId && a.from<=iso && iso<=a.to);

function AwayCard({ compact }) {
  const { D, setFn, me, notifyOthers, undo } = useD();
  const [open,setOpen] = useState(false);
  const [f,setF] = useState({ from:todayISO(), to:shiftISO(todayISO(),3), note:'' });
  const today = todayISO(), users = D.users || [];
  const list = (D.aw||[]).filter(a=>a && a.to>=today).sort((a,b)=>a.from.localeCompare(b.from));
  const shown = compact ? list.filter(a=>a.from<=today) : list;
  if (compact && !shown.length) return null;
  const save = () => {
    if (!me || !f.from || !f.to || f.to < f.from) return;
    const it = { id:uid(), userId:me, from:f.from, to:f.to, note:f.note.trim().slice(0,80) };
    setFn('aw', cur=>[it, ...(cur||[]).filter(a=>a && a.to>=shiftISO(today,-CHORE_WINDOW))]);   // Vergangene bleiben fürs Zeitfenster der Fairness
    notifyOthers(TT("✈️ {0} ist weg", nameOfU(users, me)), TT("{0}–{1}{2} · Putzplan übernimmt das", fmtDM(it.from), fmtDM(it.to), it.note?` · ${it.note}`:''), TT("wg-away"), TT("away"));
    undo(TT("✈️ Abwesenheit eingetragen"), ()=>setFn('aw', cur=>cur.filter(a=>a.id!==it.id)));
    setOpen(false);
  };
  const del = a => { setFn('aw', cur=>cur.filter(x=>x.id!==a.id)); undo(TT("Abwesenheit entfernt"), ()=>setFn('aw', cur=>[a, ...cur])); };
  const rows = shown.map(a=>{
    const u = users.find(x=>x.id===a.userId), now = a.from<=today;
    return (
      <div key={a.id} className="cell" data-testid="away-row">
        <span style={{fontSize:19,lineHeight:1}}>✈️</span>
        <div className="cell-content">
          <span className="cell-title"><b style={{color:u?.color}}>{a.userId===me?'Du bist':`${u?.name||'Jemand'} ist`}</b> {now?'weg':'bald weg'}</span>
          <span className="cell-sub">{fmtDM(a.from)}–{fmtDM(a.to)}{a.note?` · ${a.note}`:''}{now?' · wird im Putzplan nicht eingeteilt':''}</span>
        </div>
        {!compact && <button className="del-btn" aria-label={TT("Abwesenheit entfernen")} onClick={()=>del(a)}>×</button>}
      </div>
    );
  });
  if (compact) return <div className="group rise" data-testid="away-banner">{rows}</div>;
  return (
    <div className="rise" data-testid="away-card" style={{animationDelay:'70ms'}}>
      <div className="section-hdr" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span>{TT("✈️ Abwesend")}</span>
        {me && <button className="hit" onClick={()=>{ setF({ from:today, to:shiftISO(today,3), note:'' }); setOpen(true); }} style={{...hdrBtn,color:'var(--amber)'}}>{TT("Ich bin weg")}</button>}
      </div>
      {rows.length ? <div className="group">{rows}</div> : <div className="section-ftr" style={{marginTop:0}}>{TT("Urlaub oder krank? Dann teilt dich der Putzplan in der Zeit nicht ein.")}</div>}
      <MiniSheet open={open} onClose={()=>setOpen(false)} title={TT("Ich bin weg")} color="var(--amber)">
        <label className="sheet-sublbl" htmlFor="aw-from">{TT("Von")}</label>
        <input id="aw-from" type="date" className="field" value={f.from} onChange={e=>setF({...f,from:e.target.value})}/>
        <label className="sheet-sublbl" htmlFor="aw-to">{TT("Bis einschließlich")}</label>
        <input id="aw-to" type="date" className="field" value={f.to} min={f.from} onChange={e=>setF({...f,to:e.target.value})}/>
        <input className="field" maxLength={80} placeholder={TT("Notiz (optional), z. B. Urlaub")} aria-label={TT("Notiz")} value={f.note} onChange={e=>setF({...f,note:e.target.value})}/>
        <button className="btn" style={{background:f.to>=f.from?'var(--amber)':'var(--bg3)'}} onClick={save}>{TT("Eintragen")}</button>
      </MiniSheet>
    </div>
  );
}

/* ── Waschtimer (Key `wt`): {kind, by, start, mins, end}. Beide Geräte sehen den Countdown.
   Grenze: der kostenlose Server kann nicht in 90 Min. etwas auslösen → Meldung kommt, sobald ein Gerät die App
   offen hat (lokal) — das startende Gerät schickt dann zusätzlich eine Push an die anderen. ── */
const WASH_KINDS = { wasch:['🧺','Waschmaschine'], trock:['🌀','Trockner'], spuel:['🍽️','Spülmaschine'] };
function WashCard() {
  const { D, setFn, me, notifyOthers } = useD();
  const [open,setOpen] = useState(false);
  const [kind,setKind] = useState('wasch');
  const lastMins = ls('wg_wt_last', {}) || {};
  const [mins,setMins_] = useState(lastMins.wasch || 90);
  const setMins = m => { setMins_(m); ss('wg_wt_last', { ...(ls('wg_wt_last', {}) || {}), [kind]: m }); };   // je Maschine merken
  const [now,setNow] = useState(Date.now());
  const runs = (D.wt||[]).filter(r=>r && r.end > now - 12*3600e3);
  const ids = runs.map(r=>r.id).join();
  useEffect(()=>{ if (SHORTCUT==='waesche') { SHORTCUT=null; setOpen(true); } }, []);
  useEffect(()=>{ if (!runs.length) return; const iv=setInterval(()=>setNow(Date.now()), 10000); return ()=>clearInterval(iv); }, [ids]);
  // Ende erreicht → je Gerät genau einmal melden
  useEffect(()=>{
    runs.forEach(r=>{
      if (r.end > now) return;
      const noted = ls('wg_wt_noted', []) || [];
      if (noted.includes(r.id)) return;
      ss('wg_wt_noted', [...noted, r.id].slice(-30));
      if (now - r.end > 2*3600e3) return;   // Stunden später öffnen → nur die Anzeige, keine veraltete Meldung
      const [em,label] = WASH_KINDS[r.kind] || ['🧺','Maschine'];
      showLocalNote(`${em} ${label} ist fertig`, 'Bitte ausräumen');
      if (r.by === me) notifyOthers(TT("{0} {1} ist fertig", em, label), TT("Bitte ausräumen"), 'wt-'+r.id, TT("wash"));
    });
  }, [now, ids]);
  const start = () => {
    const t = Date.now(), [em,label] = WASH_KINDS[kind];
    const r = { id:uid(), kind, by:me||null, start:t, mins, end:t + mins*60000 };
    setFn('wt', cur=>[r, ...(cur||[]).filter(x=>x && x.kind!==kind && x.end > t - 12*3600e3)]);
    notifyOthers(TT("{0} {1} hat die {2} gestartet", em, nameOfU(D.users, me), label), TT("fertig um {0}", fmtHM(r.end)), 'wt-'+r.id, TT("wash"));
    setNow(t); setOpen(false);
  };
  const clear = r => setFn('wt', cur=>cur.filter(x=>x.id!==r.id));
  return (
    <div className="rise" data-testid="wash-card" style={{animationDelay:'25ms'}}>
      {runs.length>0 && (
        <div className="group" style={{marginBottom:8}}>
          {runs.map(r=>{
            const [em,label] = WASH_KINDS[r.kind] || ['🧺','Maschine'];
            const left = Math.ceil((r.end - now)/60000), pct = Math.min(100, Math.max(0, (now - r.start)/(r.end - r.start)*100));
            const done = left <= 0;
            return (
              <div key={r.id} className="cell" data-testid="wash-run" style={{flexWrap:'wrap'}}>
                <span style={{fontSize:20,lineHeight:1}}>{em}</span>
                <div className="cell-content">
                  <span className="cell-title">{label} {done ? <b style={{color:'var(--green)'}}>{TT("ist fertig")}</b> : `· noch ${left} Min.`}</span>
                  <span className="cell-sub">{nameOfU(D.users, r.by)} · {done ? `seit ${fmtHM(r.end)}` : `fertig um ${fmtHM(r.end)}`}</span>
                </div>
                <button className="btn btn-sec" style={{width:'auto',padding:'8px 12px',fontSize:13}} onClick={()=>clear(r)}>{done?'Ausgeräumt ✓':'Abbrechen'}</button>
                <div style={{flexBasis:'100%',height:4,borderRadius:2,background:'var(--bg3)',overflow:'hidden'}}>
                  <div style={{width:`${pct}%`,height:'100%',background:done?'var(--green)':'var(--mint)',transition:'width .6s'}}/>
                </div>
              </div>
            );
          })}
        </div>
      )}
      <button className="hit" data-testid="wash-open" onClick={()=>setOpen(true)}
        style={{display:'flex',alignItems:'center',justifyContent:'center',gap:7,width:'100%',padding:'9px 14px',borderRadius:12,border:'none',background:'var(--bg3)',color:'var(--label2)',fontWeight:600,fontSize:13,fontFamily:'inherit',cursor:'pointer'}}>
        {TT("🧺 Maschine läuft · Timer starten")}
      </button>
      <MiniSheet open={open} onClose={()=>setOpen(false)} title={TT("Timer starten")} color="var(--mint)">
        <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
          {Object.entries(WASH_KINDS).map(([k,[em,l]])=><button key={k} type="button" style={chipSt(kind===k)} onClick={()=>{ setKind(k); setMins_((ls('wg_wt_last', {}) || {})[k] || (k==='spuel'?150:k==='trock'?120:90)); }}>{em} {l}</button>)}
        </div>
        <div className="sheet-sublbl">{TT("Wie lange?")}</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:6}}>
          {[30,60,90,120,150,180].map(m=><button key={m} type="button" style={chipSt(mins===m)} onClick={()=>setMins(m)}>{m<60?`${m} Min.`:`${Math.floor(m/60)}${m%60?',5':''} Std.`}</button>)}
        </div>
        <button className="btn" style={{background:'var(--mint)'}} onClick={start}>{TT("Starten · fertig um")} {fmtHM(Date.now()+mins*60000)}</button>
        <div style={{fontSize:11.5,color:'var(--label2)',lineHeight:1.45}}>{TT("Die Meldung „fertig\" kommt, sobald eines eurer Handys die App offen hat oder sie wieder öffnet.")}</div>
      </MiniSheet>
    </div>
  );
}

/* ── Schnell-Nachrichten (Key `qm`): ein Tipp = Push an den anderen, 12 Std. im Haushalt-Tab sichtbar ── */
const QUICK_MSGS = ['🏃 Bin in 10 Min. da','📦 Paket für dich angenommen','🤫 Bitte leise, ich schlafe','🍕 Essen ist da','🔑 Tür ist nicht abgeschlossen','🧺 Deine Wäsche ist fertig'];

    const t = String(text).trim().slice(0,80); if (!t || !me) return;
    const it = { id:uid(), by:me, text:t, ts:Date.now() };

    notifyOthers(`💬 ${nameOfU(users, me)}`, t, TT("wg-qm"), TT("msg"));
    undo(TT("💬 Gesendet"), ()=>setFn('qm', cur=>cur.filter(m=>m.id!==it.id)));
