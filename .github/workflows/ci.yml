name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Aufteilung (Roadmap „Testlauf beschleunigen"): vorher EIN Job mit 65 Dateien hintereinander (~59 min, und eine feste Liste, die der
# Gate-Liste hinterherhinkte). Jetzt: dieselbe Liste wie das lokale Gate (scripts/gate-liste.mjs), verteilt auf 4 Jobs nach gemessener
# Dauer (test/zeiten.json, Neumessen: node scripts/zeiten.mjs --json test/zeiten.json), je Job 2 Arbeiter. test/gate_shard.mjs sichert, dass
# jede Datei in genau einem Job läuft. Der Visual-Lauf ist ein eigener Job (er schreibt die Screenshots).
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # alle Shards zu Ende laufen lassen — ein roter verdeckt sonst die Ergebnisse der anderen
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Tests (Shard ${{ matrix.shard }}/4)
        # leise.mjs: eine Zeile je Datei, Auszug nur bei Rot, Exit 1 sobald eine rot ist. Server: python3 auf 8099 (leise.mjs nutzt ihn).
        # Rot im Pool wird allein wiederholt (⚠ nur parallel rot zählt als rot).
        run: |
          python3 -m http.server 8099 &
          SRV=$!
          for i in $(seq 1 30); do curl -sf http://localhost:8099/wgapp.html >/dev/null && break || sleep 0.5; done
          RC=0
          node scripts/leise.mjs --gate --shard ${{ matrix.shard }}/4 --arbeiter 2 || RC=$?
          kill $SRV 2>/dev/null || true
          exit $RC

  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Visual-Render-Check
        run: |
          python3 -m http.server 8099 &
          SRV=$!
          for i in $(seq 1 30); do curl -sf http://localhost:8099/wgapp.html >/dev/null && break || sleep 0.5; done
          RC=0
          node scripts/leise.mjs test/visual.mjs || RC=$?
          kill $SRV 2>/dev/null || true
          exit $RC
      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-shots
          path: test/shots/
          if-no-files-found: ignore
