name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # v7: laufen auf Node 24 — die v4-Actions liefen auf Node 20 und erzeugten bei jedem Lauf eine Deprecation-Warnung
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve + Tests + Visual-Render-Check
        run: |
          python3 -m http.server 8099 &
          SRV=$!
          for i in $(seq 1 30); do curl -sf http://localhost:8099/wgapp.html >/dev/null && break || sleep 0.5; done
          set -e
          node test/split.mjs
          node test/persist.mjs
          node test/paybtn.mjs
          node test/archive.mjs
          node test/privat.mjs
          node test/sync.mjs
          node test/logins.mjs
          node test/selfhost.mjs
          node test/startflow.mjs
          node test/backup_api.mjs
          node test/rotate.mjs
          node test/errlog.mjs
          node test/notify_api.mjs
          node test/bkwatch.mjs
          node test/update.mjs
          node test/putz.mjs
          node test/cron_duel.mjs
          node test/csp_hash.mjs
          node test/visual.mjs
          kill $SRV 2>/dev/null || true
      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-shots
          path: test/shots/
          if-no-files-found: ignore
